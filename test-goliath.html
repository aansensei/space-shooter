        // PHA SUMMON: Alpha vẫn đứng đó phát sáng dồn dập, thiên thạch từ mọi
        // hướng bay tới, mỗi lần va chạm khối nóng chảy quanh nó phồng to hơn.
        // 2 CHI cũng được xây từ thiên thạch riêng, tụ thành 2 khối nóng chảy
        // NHỎ HƠN ở đúng vị trí khớp nối, đến muộn hơn khối thân (xem
        // triggerTransform: arriveAt thân 0.1-0.65, chi 0.6-1.0).
        drawFacetedCrystal(ALPHA_OUTLINE, ALPHA_CORE, lightAngle, '#0a0a0a', '#3a3a42', 'rgba(0,0,0,0.7)');
        drawVeins(ALPHA_VEINS, 0.35 + fusedRatio * 0.5);
        drawSlots();
        drawMoltenBlob(60 + fusedRatio * 170, 0.35 + fusedRatio * 0.65);
        ['left', 'right'].forEach(side => {
            const ratio = armRatio[side];
            if (ratio <= 0) return;
            const j = LIMB_JOINT[side];
            ctx.save();
            ctx.translate(j.x, j.y);
            drawMoltenBlob(14 + ratio * 34, 0.4 + ratio * 0.6);
            ctx.restore();
        });
        ctx.restore(); // thoát translate(state.x,state.y) để vẽ thiên thạch ở toạ độ màn hình thật
        drawMeteors(t, SUMMON_DUR);
        return;
    }

    if (t < FUSION_END) {
        // PHA FUSION: toàn bộ thiên thạch đã dồn hết vào — khối nóng chảy đạt
        // kích thước gần bằng True Form, sủi bọt dữ dội, rung mạnh dần
        const p = (t - SUMMON_DUR) / (FUSION_END - SUMMON_DUR);
        const shakeAmt = p * 8;
        ctx.translate((Math.random() - 0.5) * shakeAmt, (Math.random() - 0.5) * shakeAmt);
        drawMoltenBlob(230 + p * 40, 0.9 + Math.sin(time * 8) * 0.1);
        drawVeins(ALPHA_VEINS.map(v => v.map(pt => ({ x: pt.x * 1.6, y: pt.y * 1.6 }))), 1.0);
    } else if (t < CRYSTALLIZE_END) {
        // PHA CRYSTALLIZE: khối nóng chảy nguội đi và kết tinh sắc nét thành
        // True Form thật — crossfade blob -> pha lê, 3 bảo thạch bật sáng lần lượt
        const p = (t - FUSION_END) / (CRYSTALLIZE_END - FUSION_END);
        const ease = 1 - Math.pow(1 - p, 2);
        drawMoltenBlob(270 * (1 - ease), 1 - ease);
        if (ease > 0.15) {
            ctx.save(); ctx.globalAlpha = (ease - 0.15) / 0.85 * 0.6;
            drawGoliathHalo();
            ctx.restore();
        }
        ctx.save();
        ctx.globalAlpha = ease;
        const scale = 0.7 + ease * 0.3;
        ctx.scale(scale, scale);
        drawFacetedCrystal(TRUE_FORM_OUTLINE, TRUE_FORM_CORE, lightAngle, '#0a0a0a', '#40404a', 'rgba(0,0,0,0.75)');
        drawGolemBodyBoulders(lightAngle);
        drawVeins(TRUE_FORM_VEINS, 0.6 + Math.sin(time * 6) * 0.3);
        ctx.restore();
        state.slots.forEach((slot, i) => {
            const igniteAt = 0.4 + i * 0.16;
            if (p > igniteAt) drawGemDiamond(SLOT_ANCHORS[i].x * scale, SLOT_ANCHORS[i].y * scale, 15 * scale, slot.gem, 1.6);
        });
        if (p > 0.7) drawEye(EYE_POS.x * scale, EYE_POS.y * scale, 24 * scale, state.x, state.y);
    } else {
        // PHA SETTLE: 2 chi năng lượng vươn ra từ thân (giống "thân xong tới
        // tay" trong biến hình anime) rồi sóng xung kích cuối lan toả, ổn định
        const p = (t - CRYSTALLIZE_END) / (4 - CRYSTALLIZE_END);
        const limbPop = Math.min(1, p / 0.6); // chi mọc ra nhanh trong 60% đầu pha Settle
        drawGoliathHalo();
        drawFacetedCrystal(TRUE_FORM_OUTLINE, TRUE_FORM_CORE, lightAngle, '#0a0a0a', '#40404a', 'rgba(0,0,0,0.75)');
        drawGolemBodyBoulders(lightAngle);
        drawVeins(TRUE_FORM_VEINS, 0.7);
        drawLimbs(0.5, limbPop);
        drawSlots(state.x, state.y, true);
        // nổ 1 lần duy nhất đúng lúc chi vừa mọc xong (không lặp lại mỗi khung
        // hình — trước đây spawnExplosion bị gọi liên tục suốt pha mọc chi)
        if (limbPop >= 1 && !state.limbPopFired) {
            state.limbPopFired = true;
            spawnExplosion(state.x - 170, state.y + 30, '#a855f7', 16);
            spawnExplosion(state.x + 170, state.y + 30, '#9d00ff', 16);
        }
        ctx.beginPath(); ctx.arc(0, 0, p * 500, 0, Math.PI * 2);
        ctx.strokeStyle = `rgba(255,255,255,${1 - p})`; ctx.lineWidth = 6 * (1 - p); ctx.stroke();
    }
    ctx.restore();
}

// JOKER SKILLS HIỆU ỨNG — 7 bản sao kỹ năng, mỗi bản màu/hình đúng theo bảo
// thạch nguồn (xem GEM_COLORS) và đúng nhịp cơ chế thật (xem design doc):
// Veilshroud Alteration, Thaelis Tenacity, Aegis Core Lumen Nova, Marchosias
// Sword&Barrier, Egregor Null Slash, Dargruel Maou Haki, Leviathan Perseverance.
function drawJokerEffects() {
    const jid = state.joker.id, jt = state.joker.t;
    if (jid === null) return;

    if (jid === 1) {
        // Veilshroud - Alteration: toàn thân chuyển "Phantom" (99% DR)
        // Hiệu ứng Void Ribbons, Armillary rings, và Singularity core
        const exitP = Math.max(0, 1 - jt / 1.0);
        
        // 1. AURA HƯ KHÔNG
        const auraPulse = Math.sin(time * 3) * 12;
        const auraR = 140 + auraPulse;
        const auraG = ctx.createRadialGradient(0, 0, auraR * 0.5, 0, 0, auraR);
        auraG.addColorStop(0, `rgba(0, 230, 200, 0.25)`);
        auraG.addColorStop(1, 'transparent');
        ctx.fillStyle = auraG;
        ctx.beginPath(); ctx.arc(0, 0, auraR, 0, Math.PI * 2); ctx.fill();

        // 2. VOID RIBBONS — giảm từ 5 xuống 3 dải, cùng 1 chiều xoay (trước
        // xoay ngược chiều xen kẽ + uốn sóng riêng từng dải tạo cảm giác rối
        // mắt như "vụ nổ hình khối" hơn là 1 bóng ma, đúng phản ứng user thấy
        // khó hiểu). Mờ hơn để đọc như lớp phủ hư ảnh, không phải khối đặc.
        ctx.save(); ctx.globalAlpha = 0.75;
        for (let i = 0; i < 3; i++) {
            ctx.save();
            ctx.rotate((i / 3) * Math.PI * 2 + time * 0.25);
            const ribLen = 150 + Math.sin(time * 2 + i) * 15;
            const ribWidth = 20;
            const wave = Math.sin(time * 3 + i) * 20;
            const ribG = ctx.createLinearGradient(0, 0, 0, -ribLen);
            ribG.addColorStop(0, `rgba(0, 230, 200, 0.4)`);
            ribG.addColorStop(0.7, `rgba(0, 115, 100, 0.1)`);
            ribG.addColorStop(1, 'transparent');
            ctx.fillStyle = ribG;
            ctx.beginPath();
            ctx.moveTo(-ribWidth / 2, 0);
            ctx.quadraticCurveTo(wave - ribWidth, -ribLen * 0.5, 0, -ribLen);
            ctx.quadraticCurveTo(wave + ribWidth, -ribLen * 0.5, ribWidth / 2, 0);
            ctx.closePath();
            ctx.fill();
            ctx.strokeStyle = `rgba(255,255,255,0.12)`;
            ctx.lineWidth = 1; ctx.stroke();
            ctx.restore();
        }

        // 3. ARMILLARY RINGS
        ctx.lineWidth = 2.5;
        ctx.strokeStyle = `rgba(0, 230, 200, 0.55)`;
        ctx.beginPath(); ctx.ellipse(0, 0, 70, 25, time, 0, Math.PI * 2); ctx.stroke();
        ctx.strokeStyle = `rgba(255,255,255,0.4)`;
        ctx.setLineDash([9, 13]);
        ctx.beginPath(); ctx.ellipse(0, 0, 85, 30, -time * 1.2 + Math.PI / 4, 0, Math.PI * 2); ctx.stroke();
        ctx.setLineDash([]);
        ctx.restore();

        // 4. SINGULARITY CORE
        const coreR = 30;
        const accR = coreR * 1.5 + Math.sin(time * 10) * 2.5;
        const accGrad = ctx.createRadialGradient(0, 0, coreR * 0.7, 0, 0, accR);
        accGrad.addColorStop(0, '#ffffff');
        accGrad.addColorStop(0.4, '#00e6c8');
        accGrad.addColorStop(1, 'transparent');
        ctx.fillStyle = accGrad;
        ctx.beginPath(); ctx.arc(0, 0, accR, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#000000';
        ctx.beginPath(); ctx.arc(0, 0, coreR, 0, Math.PI * 2); ctx.fill();

        // 5. BÁO TRƯỚC SÉT — enemy-veilshroud.js: sét là 1 tia ZIGZAG RƠI TỪ
        // TRÊN TRỜI XUỐNG (_genBoltPoints(lt.x, 0, lt.x, lt.y,...) — gốc tại
        // y=0, tức mép trên màn hình), KHÔNG PHẢI toả ra từ vị trí Goliath
        // như bản trước (đường nối 0,0→target là hoàn toàn sai hướng).
        (state.joker.meta.targets || []).forEach(pt => {
            const lx = pt.x - state.x, ly = pt.y - state.y;
            const skyY = -state.y; // mép trên màn hình, quy về toạ độ cục bộ
            ctx.save();
            ctx.setLineDash([8, 5]);
            ctx.beginPath(); ctx.moveTo(lx, skyY); ctx.lineTo(lx, ly);
            ctx.strokeStyle = `rgba(255,34,51,${0.3 + exitP * 0.7})`; ctx.lineWidth = 2;
            ctx.stroke(); ctx.setLineDash([]);
            ctx.beginPath(); ctx.arc(lx, ly, 25 + Math.sin(time * 6) * 5, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(255,34,51,${0.1 + exitP * 0.2})`; ctx.fill();
            ctx.strokeStyle = `rgba(255,34,51,${0.4 + exitP * 0.6})`; ctx.lineWidth = 2; ctx.stroke();
            // đúng lúc giáng sét (jt vừa <=0, struck=true): tia chớp zigzag
            // thật rơi từ trời xuống, chớp nháy ngẫu nhiên mỗi khung hình
            if (state.joker.meta.struck && jt > -0.35) {
                const bolt = generateVein(lx, skyY, lx, ly, 7, 22);
                ctx.beginPath();
                bolt.forEach((b, i) => i === 0 ? ctx.moveTo(b.x, b.y) : ctx.lineTo(b.x, b.y));
                ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 3;
                ctx.shadowColor = '#ff2233'; ctx.shadowBlur = 22; ctx.stroke();
                ctx.strokeStyle = 'rgba(255,30,50,0.65)'; ctx.lineWidth = 7; ctx.stroke();
                ctx.shadowBlur = 0;
            }
            ctx.restore();
        });
    }

    if (jid === 2) {
        // Thaelis - Tenacity: trần sát thương vĩnh viễn, hiệu ứng Tenacity Barrier.
        // Đối chiếu enemy-boss-thaelis.js: vòng vàng r+16, pulse ±3px, 6 tia lửa
        // xoay quanh viền, VÀ 1 cung tối "đã tiêu hao" kiểu pac-man từ -PI/2 —
        // chi tiết cung tiêu hao này bị thiếu ở bản trước, giờ thêm lại (vì Joker
        // chỉ toggle bật/tắt, không có % thật để theo dõi nên cho dao động chậm
        // minh hoạ thay vì đứng yên 0%).
        const _bR = 220 + 4 * Math.sin(time * 10);
        const _bPulse = 0.70 + 0.30 * Math.sin(time * 12);
        const _depleted = 0.5 + 0.4 * Math.sin(time * 0.35); // 10%-90% minh hoạ
        ctx.save();
        ctx.shadowColor = '#ffee33'; ctx.shadowBlur = 20 + 8 * Math.sin(time * 7);
        ctx.strokeStyle = `rgba(255,230,40,${_bPulse * 0.9})`;
        ctx.lineWidth = 4;
        ctx.beginPath(); ctx.arc(0, 0, _bR, 0, Math.PI * 2); ctx.stroke();
        ctx.shadowBlur = 0;

        // cung tối = phần khiên đã tiêu hao (giống pac-man ăn dần trong file gốc)
        ctx.strokeStyle = 'rgba(80,40,0,0.65)'; ctx.lineWidth = 4;
        ctx.beginPath(); ctx.arc(0, 0, _bR, -Math.PI / 2 + _depleted * Math.PI * 2, -Math.PI / 2 + Math.PI * 2); ctx.stroke();

        ctx.strokeStyle = `rgba(255,255,160,${_bPulse * 0.45})`;
        ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.arc(0, 0, _bR - 6, 0, Math.PI * 2); ctx.stroke();

        ctx.fillStyle = `rgba(255,240,80,${_bPulse * 0.85})`;
        for (let _i = 0; _i < 6; _i++) {
            const _sA = (time * 1.5) + _i * Math.PI / 3;
            ctx.beginPath();
            ctx.arc(Math.cos(_sA) * _bR, Math.sin(_sA) * _bR, 4, 0, Math.PI * 2);
            ctx.fill();
        }
        ctx.restore();
    }

    if (jid === 3 && jt > 0) {
        // Aegis Core: Lumen Nova
        const auraRadius = 250;
        
        // 1. AURA ZONE BACKGROUND (Red tint)
        const zoneGrad = ctx.createRadialGradient(0, 0, 80, 0, 0, auraRadius);
        zoneGrad.addColorStop(0, 'rgba(255,0,0,0.02)');
        zoneGrad.addColorStop(0.7, 'rgba(200,0,0,0.04)');
        zoneGrad.addColorStop(1, 'rgba(220,0,0,0.16)');
        ctx.fillStyle = zoneGrad;
        ctx.beginPath(); ctx.arc(0, 0, auraRadius, 0, Math.PI * 2); ctx.fill();

        // 2. Rotating gold dashed inner ring
        ctx.save();
        ctx.rotate(time * 0.2);
        ctx.strokeStyle = 'rgba(255,215,0,0.6)';
        ctx.lineWidth = 2;
        ctx.setLineDash([15, 12, 4, 12]);
        ctx.beginPath(); ctx.arc(0, 0, auraRadius - 6, 0, Math.PI * 2); ctx.stroke();
        ctx.setLineDash([]);
        ctx.restore();

        // 3. Mechanical bracket locks on aura edge
        ctx.save();
        ctx.rotate(-time * 0.12);
        ctx.strokeStyle = 'rgba(255,255,255,0.9)'; ctx.lineWidth = 4;
        for (let i = 0; i < 4; i++) {
            ctx.beginPath();
            ctx.arc(0, 0, auraRadius, i * Math.PI / 2 - 0.08, i * Math.PI / 2 + 0.08);
            ctx.stroke();
            ctx.fillStyle = '#FFD700';
            ctx.beginPath();
            ctx.arc(Math.cos(i * Math.PI / 2) * (auraRadius - 14),
                Math.sin(i * Math.PI / 2) * (auraRadius - 14), 2.5, 0, Math.PI * 2);
            ctx.fill();
        }
        ctx.restore();

        // 4. Tia laser đánh chặn — đối chiếu fx.js drawAegisLasers(): tia bắn
        // thật là ĐỎ (rgba(255,30,30) ngoài / rgba(255,80,80) lõi / trắng
        // giữa), KHÔNG PHẢI VÀNG như bản trước — vàng chỉ là màu trang trí
        // trên thân (vòng dashed + bracket lock), không phải màu tia bắn.
        ctx.save(); ctx.rotate(time * 0.4);
        for (let i = 0; i < 4; i++) {
            ctx.rotate(Math.PI / 2);
            ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, 1500);
            if (jt > 0.5) {
                // báo trước: dải mờ đỏ + đường ngắm nét đứt đỏ
                ctx.setLineDash([]);
                ctx.strokeStyle = 'rgba(255,0,0,0.12)'; ctx.lineWidth = 22; ctx.stroke();
                ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, 1500);
                ctx.setLineDash([12, 12]); ctx.strokeStyle = 'rgba(255,100,100,0.9)'; ctx.lineWidth = 1.5;
                ctx.shadowColor = 'red'; ctx.shadowBlur = 8; ctx.stroke(); ctx.shadowBlur = 0;
                ctx.setLineDash([]);
                ctx.beginPath(); ctx.arc(0, 260, 5, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255,80,80,0.9)'; ctx.fill();
            } else {
                // bắn thật: 3 lớp outer glow / core / center trắng
                ctx.setLineDash([]);
                ctx.strokeStyle = 'rgba(255,30,30,0.6)'; ctx.lineWidth = 50; ctx.shadowColor = 'red'; ctx.shadowBlur = 40; ctx.stroke();
                ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, 1500);
                ctx.strokeStyle = 'rgba(255,80,80,1)'; ctx.lineWidth = 30; ctx.shadowBlur = 20; ctx.stroke();
                ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, 1500);
                ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 10; ctx.shadowBlur = 0; ctx.stroke();
            }
        }
        ctx.shadowBlur = 0; ctx.restore();
    }

    if (jid === 4 && jt > 0) {
        // Marchosias: Sword & Barrier
        const shieldR = 210;
        
        // 1. Rotating gear-teeth ring
        ctx.save();
        ctx.rotate(time * 0.4);
        ctx.strokeStyle = 'rgba(0,180,80,0.6)'; ctx.lineWidth = 2.5;
        for (let i = 0; i < 12; i++) {
            const a = (i / 12) * Math.PI * 2;
            ctx.beginPath();
            ctx.moveTo(Math.cos(a) * shieldR * 0.78, Math.sin(a) * shieldR * 0.78);
            ctx.lineTo(Math.cos(a) * shieldR * 0.88, Math.sin(a) * shieldR * 0.88);
            ctx.stroke();
        }
        ctx.restore();

        // 2. Arc Barrier (Vòng bảo vệ dạng cung 1/4 hình tròn)
        const sa = Math.PI / 2 - Math.PI / 4;
        const ea = Math.PI / 2 + Math.PI / 4;

        ctx.save();
        // Outer glow
        ctx.strokeStyle = `rgba(0,255,136,0.6)`;
        ctx.lineWidth = 14;
        ctx.shadowColor = '#00ff88'; ctx.shadowBlur = 20;
        ctx.beginPath(); ctx.arc(0, 0, shieldR, sa, ea); ctx.stroke();
        
        // Main arc bright
        ctx.strokeStyle = `rgba(160,255,200,0.95)`;
        ctx.lineWidth = 5;
        ctx.shadowColor = 'white'; ctx.shadowBlur = 10;
        ctx.beginPath(); ctx.arc(0, 0, shieldR, sa, ea); ctx.stroke();
        
        // Inner bright edge
        ctx.strokeStyle = 'rgba(255,255,255,0.55)';
        ctx.lineWidth = 1.5; ctx.shadowBlur = 0;
        ctx.beginPath(); ctx.arc(0, 0, shieldR - 4, sa, ea); ctx.stroke();
        
        // Sparkling particles at arc tips
        for (let tip = 0; tip < 2; tip++) {
            const tipA = tip === 0 ? sa : ea;
            const tx2 = Math.cos(tipA) * shieldR;
            const ty2 = Math.sin(tipA) * shieldR;
            for (let s = 0; s < 2; s++) {
                const sA = tipA + (s - 0.5) * 0.5 + Math.sin(time * 11 + s) * 0.2;
                const sLen = 5 + 3 * Math.abs(Math.sin(time * 12 + s));
                ctx.strokeStyle = `rgba(180,255,180,${0.6 + 0.4 * Math.sin(time * 14 + s)})`;
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.moveTo(tx2, ty2);
                ctx.lineTo(tx2 + Math.cos(sA) * sLen, ty2 + Math.sin(sA) * sLen);
                ctx.stroke();
            }
        }
        ctx.restore();
        
        const total = 5.0, p = 1 - jt / total;
        if (p > 0.85) {
            const bp = (p - 0.85) / 0.15;
            ctx.beginPath(); ctx.arc(0, 0, 260 * bp, 0, Math.PI * 2);
            ctx.strokeStyle = `rgba(0,255,150,${1 - bp})`; ctx.lineWidth = 6 * (1 - bp); ctx.stroke();
        }
    }

    if (jid === 5 && jt > 0) {
        // Egregor: Null Slash — đối chiếu enemy-egregor.js: telegraph là 1 BÁN
        // NGUYỆT (180°) chứ không phải quạt hẹp ~72° như bản trước, và cú quét
        // thật cũng là 1 vòng cung 180°, không phải 360° toàn màn hình.
        const p = 1 - (jt / 2.5); // 0 -> 1
        const targetAngle = Math.atan2(mouse.y - state.y, mouse.x - state.x);

        ctx.save();
        ctx.rotate(targetAngle);

        const radius = 600;
        const spread = Math.PI; // bán nguyệt đúng như file gốc (arcStart=ang-PI/2, arcEnd=ang+PI/2)
        
        // Quạt cảnh báo
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.arc(0, 0, radius, -spread/2, spread/2);
        ctx.closePath();
        
        const grad = ctx.createRadialGradient(0, 0, 0, 0, 0, radius);
        grad.addColorStop(0, `rgba(20,184,166,${0.05 * p})`);
        grad.addColorStop(1, `rgba(20,184,166,${0.35 * p})`);
        ctx.fillStyle = grad;
        ctx.fill();
        
        // Viền cảnh báo
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.arc(0, 0, radius, -spread/2, spread/2);
        ctx.closePath();
        ctx.strokeStyle = `rgba(20,184,166,${0.3 + p * 0.7})`;
        ctx.lineWidth = 3;
        ctx.stroke();

        // Hạt năng lượng bị hút vào tâm để tụ lực
        for (let i = 0; i < 8; i++) {
            const a = -spread/2 + (i/7) * spread;
            const dist = radius * (1 - ((time * 1.5 + i/8) % 1));
            ctx.beginPath(); ctx.arc(Math.cos(a)*dist, Math.sin(a)*dist, 2.5, 0, Math.PI*2);
            ctx.fillStyle = '#c9fff5'; ctx.fill();
        }
        
        // Lưu góc ngắm vào meta để bắn trúng hướng
        state.joker.meta.angle = targetAngle;
        
        ctx.restore();
    }

    if (jid === 6 && jt > 0) {
        // Dargruel: Maou Haki — 1s tụ lực máu đỏ thẫm rồi bung sóng xung kích
        // toàn màn hình (đã bắn qua spawnShockwave ở update()); vòng chậm 30%
        // trong bán kính 150px quanh thân hiện luôn để thấy vùng ảnh hưởng.
        const p = 1 - jt / 1.0;
        const pulse = 0.5 + Math.sin(time * 20) * 0.5;
        ctx.beginPath(); ctx.arc(0, 0, 150, 0, Math.PI * 2);
        ctx.strokeStyle = `rgba(153,27,27,${0.35 + pulse * 0.25})`; ctx.lineWidth = 3;
        ctx.setLineDash([10, 6]); ctx.stroke(); ctx.setLineDash([]);
        ctx.beginPath(); ctx.arc(0, 0, 40 + p * 220 * 0.3, 0, Math.PI * 2);
        const rg = ctx.createRadialGradient(0, 0, 0, 0, 0, 40 + p * 66);
        rg.addColorStop(0, `rgba(255,60,60,${0.5 * p})`); rg.addColorStop(1, 'rgba(153,27,27,0)');
        ctx.fillStyle = rg; ctx.fill();
    }

    if (jid === 7 && jt > 0) {
        // Leviathan: vòng cảnh báo đỏ nhấp nháy rồi tia quét 360 cyan-tím dày,
        // 2 lớp (viền tím ngoài + lõi cyan) đúng tông void của Leviathan thật
        if (jt > 1.5) {
            const warnPulse = 0.5 + Math.sin(time * 10) * 0.5;
            ctx.beginPath(); ctx.arc(0, 0, 320, 0, Math.PI * 2);
            ctx.strokeStyle = `rgba(255,0,0,${0.35 + warnPulse * 0.35})`; ctx.lineWidth = 2.5 + warnPulse * 2; ctx.stroke();
            // enemy-leviathan.js: 4 vòng "event-horizon" đếm ngược xoay ngược
            // chiều nhau ở các bán kính khác nhau — bản trước chỉ có 1 vòng
            // cảnh báo đơn, thiếu hẳn lớp collapse-nhiều-vòng đặc trưng của
            // Perseverance thật.
            const ringSpecs = [
                { r: 200, speed: 2.2, color: 'rgba(255,255,255,0.5)' },
                { r: 150, speed: -1.6, color: 'rgba(255,255,255,0.35)' },
                { r: 110, speed: 3.0, color: 'rgba(255,60,0,0.45)' },
                { r: 75, speed: -2.6, color: 'rgba(157,0,255,0.5)' },
            ];
            ringSpecs.forEach(rs => {
                ctx.save(); ctx.rotate(time * rs.speed);
                ctx.setLineDash([10, 8]);
                ctx.beginPath(); ctx.arc(0, 0, rs.r, 0, Math.PI * 2);
                ctx.strokeStyle = rs.color; ctx.lineWidth = 2; ctx.stroke();
                ctx.setLineDash([]);
                ctx.restore();
            });
        } else {
            // Tia quét phải BẮN RA TỪ MẮT, không phải từ tâm thân — dịch gốc
            // toạ độ sang EYE_POS trước khi vẽ tia.
            const angle = (1.5 - jt) * Math.PI * 2 * 2;
            ctx.save();
            ctx.translate(EYE_POS.x, EYE_POS.y);
            ctx.rotate(angle);
            ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, 1500);
            ctx.strokeStyle = 'rgba(157,0,255,0.5)'; ctx.lineWidth = 20; ctx.stroke();
            ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, 1500);
            ctx.strokeStyle = '#00e5ff'; ctx.lineWidth = 11; ctx.shadowColor = '#9d00ff'; ctx.shadowBlur = 22; ctx.stroke();
            ctx.shadowBlur = 0; ctx.restore();
        }
    }
}

// VẼ ENTITIES PHỤ (GEMS BAY, PROJECTILES, PARTICLES)
function drawGems(ctx) {
    state.gems.forEach(gem => {
        const slot = SLOT_ANCHORS[gem.targetSlot];
        const sx = gem.x, sy = gem.y;
        const ex = state.x + slot.x, ey = state.y + slot.y;
        const cx_cp = sx + (ex - sx) * 0.5 + 200, cy_cp = sy + (ey - sy) * 0.5;
        const tq = gem.t;
        const px = (1 - tq) * (1 - tq) * sx + 2 * (1 - tq) * tq * cx_cp + tq * tq * ex;
        const py = (1 - tq) * (1 - tq) * sy + 2 * (1 - tq) * tq * cy_cp + tq * tq * ey;
        ctx.save(); ctx.translate(px, py); ctx.rotate(time * 4);
        drawGemDiamond(0, 0, 11, gem.gem, 1);
        ctx.restore();
        spawnTrailParticle(px, py, gem.gem.mid);
    });
}

function drawProjectiles(ctx) {
    state.projectiles.forEach(p => {
        if (p.type === 'SHOCKWAVE') {
            ctx.beginPath(); ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
            ctx.strokeStyle = p.color; ctx.lineWidth = p.width * (p.life / 2.0); ctx.stroke();
        } else if (p.type === 'ORB') {
            // quả cầu Absolute Verdict phóng to hơn hẳn (trước 42 lõi/62 méo
            // không gian — quá nhỏ so với 1 đòn "bất khả ngăn cản")
            ctx.save();
            ctx.beginPath(); ctx.arc(p.x, p.y, 105, 0, Math.PI * 2);
            const rg = ctx.createRadialGradient(p.x, p.y, 70, p.x, p.y, 105);
            rg.addColorStop(0, 'rgba(157,0,255,0.18)'); rg.addColorStop(1, 'rgba(157,0,255,0)');
            ctx.fillStyle = rg; ctx.fill();
            ctx.restore();
            // mảnh vỡ đá xoay quanh quỹ đạo quả cầu
            for (let k = 0; k < 4; k++) {
                const ang = time * 4 + k * (Math.PI / 2);
                const sx = p.x + Math.cos(ang) * 88, sy = p.y + Math.sin(ang) * 88;
                ctx.save(); ctx.translate(sx, sy); ctx.rotate(ang * 2);
                ctx.beginPath(); ctx.moveTo(0, -10); ctx.lineTo(8, 5); ctx.lineTo(-8, 5); ctx.closePath();
                ctx.fillStyle = '#c084fc'; ctx.shadowColor = '#9d00ff'; ctx.shadowBlur = 8; ctx.fill(); ctx.shadowBlur = 0;
                ctx.restore();
            }
            const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, 70);
            g.addColorStop(0, '#4c1d95'); g.addColorStop(0.6, '#1a0a2e'); g.addColorStop(1, 'rgba(10,0,20,0)');
            ctx.beginPath(); ctx.arc(p.x, p.y, 70, 0, Math.PI * 2);
            ctx.fillStyle = g; ctx.shadowColor = '#f59e0b'; ctx.shadowBlur = 20; ctx.fill();
            ctx.strokeStyle = '#f59e0b'; ctx.lineWidth = 5; ctx.stroke(); ctx.shadowBlur = 0;
            // tia điện lóe quanh viền, giống lúc còn ở trên chi channel
            for (let k = 0; k < 2; k++) {
                if (Math.sin(time * 25 + k * 3) < 0.3) continue;
                const a1 = Math.random() * Math.PI * 2;
                ctx.beginPath();
                ctx.moveTo(p.x + Math.cos(a1) * 30, p.y + Math.sin(a1) * 30);
                ctx.lineTo(p.x + Math.cos(a1) * 48 + (Math.random() - 0.5) * 10, p.y + Math.sin(a1) * 48 + (Math.random() - 0.5) * 10);
                ctx.strokeStyle = 'rgba(245,158,11,0.7)'; ctx.lineWidth = 1.4; ctx.stroke();
            }
        } else if (p.type === 'SWORD') {
            // Đối chiếu enemy-marchosias.js _drawMarchoBlade(): lưỡi kiếm THẬT
            // là 1 CUNG 180° 3 lớp (glow ngoài/lõi cam/viền sáng), KHÔNG PHẢI
            // 1 lưỡi kim cương thẳng như bản trước — sửa lại đúng hình cung.
            const angle = Math.atan2(p.vy || 1, 0);
            const sa = angle - Math.PI / 2, ea = angle + Math.PI / 2, radius = 30;
            ctx.save();
            ctx.strokeStyle = 'rgba(255,80,0,0.35)'; ctx.lineWidth = 18;
            ctx.shadowColor = 'rgba(255,120,0,0.6)'; ctx.shadowBlur = 12;
            ctx.beginPath(); ctx.arc(p.x, p.y, radius, sa, ea); ctx.stroke();
            ctx.strokeStyle = 'rgba(255,140,30,0.95)'; ctx.lineWidth = 5;
            ctx.shadowColor = 'white'; ctx.shadowBlur = 14;
            ctx.beginPath(); ctx.arc(p.x, p.y, radius, sa, ea); ctx.stroke();
            ctx.strokeStyle = 'rgba(255,230,180,0.7)'; ctx.lineWidth = 2; ctx.shadowBlur = 0;
            ctx.beginPath(); ctx.arc(p.x, p.y, radius - 3, sa, ea); ctx.stroke();
            for (let k = 0; k < 3; k++) {
                const slashA = sa + (ea - sa) * ((k + 1) / 4);
                ctx.beginPath();
                ctx.moveTo(p.x + Math.cos(slashA) * (radius - 10), p.y + Math.sin(slashA) * (radius - 10));
                ctx.lineTo(p.x + Math.cos(slashA) * (radius + 10), p.y + Math.sin(slashA) * (radius + 10));
                ctx.strokeStyle = `rgba(255,200,100,${0.5 + 0.4 * Math.sin(time * 16)})`; ctx.lineWidth = 1; ctx.stroke();
            }
            ctx.restore();
        } else if (p.type === 'SLASH') {
            // Null Slash - Nhát chém hình cung văng ra cực nhanh
            const progress = 1 - (p.life / 0.3); // 0 -> 1
            ctx.save();
            ctx.translate(p.x, p.y);
            ctx.rotate(p.angle);
            
            const slashRadius = 150 + progress * 600; 
            const slashSpread = Math.PI / 2.5;
            
            // Lưỡi kiếm năng lượng
            ctx.beginPath();
            ctx.arc(0, 0, slashRadius, -slashSpread/2, slashSpread/2);
            ctx.strokeStyle = p.color;
            ctx.lineWidth = 60 * Math.max(0, 1 - progress); 
            ctx.shadowColor = p.color;
            ctx.shadowBlur = 30;
            ctx.stroke();
            
            // Lõi trắng sắc lẹm
            ctx.beginPath();
            ctx.arc(0, 0, slashRadius, -slashSpread/2, slashSpread/2);
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 15 * Math.max(0, 1 - progress);
            ctx.stroke();
            
            ctx.restore();
        }
    });
}

function drawParticles(ctx) {
    state.particles.forEach(p => {
        ctx.globalAlpha = p.life / p.maxLife;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fillStyle = p.color; ctx.fill();
    });
    ctx.globalAlpha = 1.0;
}

// KHỞI CHẠY GAME LOOP
function loop(timestamp) {
    let dt = (timestamp - lastTime) / 1000;
    lastTime = timestamp;
    if (dt > 0.1) dt = 0.1;
    update(dt);
    draw(ctx);
    requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
