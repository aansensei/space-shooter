            // Labels
            c.fillStyle = '#ff8844'; c.font = 'bold 8px Orbitron,sans-serif'; c.textAlign = 'left';
            c.fillText('CUSTOS AETERNUS', w * 0.5, h * 0.1);
            c.fillStyle = '#8899bb'; c.font = '7px Share Tech Mono,monospace';
            c.fillText('1st hit = Iron Body', w * 0.5, h * 0.1 + 12);
            c.fillStyle = '#ff8844'; c.font = 'bold 8px Orbitron,sans-serif';
            c.fillText('SUPPORT AURA', w * 0.5, h * 0.1 + 28);
            c.fillStyle = '#8899bb'; c.font = '7px Share Tech Mono,monospace';
            c.fillText('Heal 2.5%/s • Shield 40% HP', w * 0.5, h * 0.1 + 40);
            c.fillStyle = '#ff8844'; c.font = 'bold 8px Orbitron,sans-serif';
            c.fillText('LUMEN NOVA (5s)', w * 0.5, h * 0.1 + 56);
            c.fillStyle = '#8899bb'; c.font = '7px Share Tech Mono,monospace';
            c.fillText('Targets + fires lasers', w * 0.5, h * 0.1 + 68);
            activeAnimations.push(requestAnimationFrame(() => drawAeg(performance.now())));
          }
          drawAeg(performance.now());
        }

        // Marchosias
        const sm = setup('cvMarcho');
        if (sm) {
          const { c, w, h } = sm;
          function drawMar(t) {
            c.clearRect(0, 0, w, h);
            const cx2 = w * 0.22, cy2 = h * 0.45, r = 20;
            // Aura
            c.fillStyle = `rgba(0,255,120,${0.08 + 0.04 * Math.sin(t / 350)})`;
            c.beginPath(); c.arc(cx2, cy2, r + 10, 0, Math.PI * 2); c.fill();
            // Hexagon
            c.fillStyle = '#1a1a2e'; c.strokeStyle = '#00cc66'; c.lineWidth = 2;
            c.beginPath();
            for (let i = 0; i < 6; i++) { const a = (i / 6) * Math.PI * 2 - Math.PI / 6; const px = cx2 + Math.cos(a) * r, py = cy2 + Math.sin(a) * r; i === 0 ? c.moveTo(px, py) : c.lineTo(px, py); }
            c.closePath(); c.fill(); c.stroke();
            // Inner triangles
            c.strokeStyle = 'rgba(0,200,100,0.5)'; c.lineWidth = 1;
            for (let i = 0; i < 3; i++) { const a = (i / 3) * Math.PI * 2 - Math.PI / 6; c.beginPath(); c.moveTo(cx2, cy2); c.lineTo(cx2 + Math.cos(a) * r, cy2 + Math.sin(a) * r); c.stroke(); }
            // Gear teeth
            c.save(); c.translate(cx2, cy2); c.rotate(t / 2500);
            c.strokeStyle = 'rgba(0,180,80,0.6)'; c.lineWidth = 1.5;
            for (let i = 0; i < 9; i++) { const a = (i / 9) * Math.PI * 2; c.beginPath(); c.moveTo(Math.cos(a) * r * 0.88, Math.sin(a) * r * 0.88); c.lineTo(Math.cos(a) * r * 0.98, Math.sin(a) * r * 0.98); c.stroke(); }
            c.restore();
            // Core
            const cg = c.createRadialGradient(cx2, cy2, 0, cx2, cy2, r * 0.32);
            cg.addColorStop(0, '#fff'); cg.addColorStop(0.4, '#00ff88'); cg.addColorStop(1, '#006633');
            c.fillStyle = cg; c.beginPath(); c.arc(cx2, cy2, r * 0.32, 0, Math.PI * 2); c.fill();
            // Arc shield rotating
            const shA = Math.atan2(0, 1) + t / 2000;
            c.strokeStyle = 'rgba(0,255,136,0.3)'; c.lineWidth = 12;
            c.beginPath(); c.arc(cx2, cy2, r + 14, shA - Math.PI / 4, shA + Math.PI / 4); c.stroke();
            c.strokeStyle = 'rgba(160,255,200,0.7)'; c.lineWidth = 5;
            c.beginPath(); c.arc(cx2, cy2, r + 14, shA - Math.PI / 4, shA + Math.PI / 4); c.stroke();
            c.strokeStyle = 'rgba(255,255,255,0.4)'; c.lineWidth = 1.5;
            c.beginPath(); c.arc(cx2, cy2, r + 10, shA - Math.PI / 4, shA + Math.PI / 4); c.stroke();

            // ── SWORD ANIMATION: warning beam → orange arc blade fires ──
            const swordCycle = 3500;
            const sp = (t % swordCycle) / swordCycle;
            const swordOriginX = cx2, swordOriginY = cy2;
            const swordTargetAngle = Math.PI * 0.35; // aim toward bottom-right
            if (sp < 0.35) {
              // Warning beam phase: orange dashed line from Mar to target
              const warnAlpha = 0.4 + 0.5 * Math.sin(t / 80);
              const warnLen = w * 0.55;
              c.save(); c.translate(swordOriginX, swordOriginY); c.rotate(swordTargetAngle);
              // Wide warning fill
              c.fillStyle = `rgba(255,180,0,${warnAlpha * 0.15})`;
              c.fillRect(0, -20, warnLen, 40);
              // Edge lines
              c.strokeStyle = `rgba(255,150,0,${warnAlpha * 0.7})`; c.lineWidth = 1.2;
              c.beginPath(); c.moveTo(0, -20); c.lineTo(warnLen, -20); c.stroke();
              c.beginPath(); c.moveTo(0, 20); c.lineTo(warnLen, 20); c.stroke();
              // Center dashed
              c.setLineDash([10, 7]); c.strokeStyle = `rgba(255,220,80,${warnAlpha * 0.6})`; c.lineWidth = 1;
              c.beginPath(); c.moveTo(0, 0); c.lineTo(warnLen, 0); c.stroke(); c.setLineDash([]);
              c.restore();
            }
            if (sp >= 0.35 && sp < 0.75) {
              // Blade arc flying out from Marchosias
              const flyT = (sp - 0.35) / 0.4;
              const flyDist = flyT * w * 0.55;
              const bx2 = swordOriginX + Math.cos(swordTargetAngle) * flyDist;
              const by2 = swordOriginY + Math.sin(swordTargetAngle) * flyDist;
              const bAngle = swordTargetAngle;
              const bSa = bAngle - Math.PI / 2, bEa = bAngle + Math.PI / 2;
              const bR = 28;
              const bFade = flyT < 0.15 ? flyT / 0.15 : (flyT > 0.75 ? (1 - flyT) / 0.25 : 1);
              // Outer orange-red glow
              c.strokeStyle = `rgba(255,80,0,${bFade * 0.3})`; c.lineWidth = 16;
              c.beginPath(); c.arc(bx2, by2, bR, bSa, bEa); c.stroke();
              // Main orange arc
              c.strokeStyle = `rgba(255,140,30,${bFade * 0.9})`; c.lineWidth = 5;
              c.beginPath(); c.arc(bx2, by2, bR, bSa, bEa); c.stroke();
              // Bright inner
              c.strokeStyle = `rgba(255,230,180,${bFade * 0.6})`; c.lineWidth = 2;
              c.beginPath(); c.arc(bx2, by2, bR - 3, bSa, bEa); c.stroke();
              // Energy slashes
              c.strokeStyle = `rgba(255,200,100,${bFade * (0.4 + 0.4 * Math.sin(t / 60))})`; c.lineWidth = 1;
              for (let i = 0; i < 3; i++) {
                const slA = bSa + (bEa - bSa) * ((i + 1) / 4);
                c.beginPath();
                c.moveTo(bx2 + Math.cos(slA) * (bR - 10), by2 + Math.sin(slA) * (bR - 10));
                c.lineTo(bx2 + Math.cos(slA) * (bR + 10), by2 + Math.sin(slA) * (bR + 10));
                c.stroke();
              }
            }
            // Roman numeral counter
            const swordCount = Math.floor((t / 4000) % 4) + 1;
            const romans = ['I', 'II', 'III', 'IV'];
            c.fillStyle = '#00ff88'; c.font = 'bold 10px serif'; c.textAlign = 'center';
            c.fillText(romans[swordCount - 1], cx2, cy2 + r + 20);

            // Minion triangle
            const mx = w * 0.82, my = h * 0.75;
            c.fillStyle = '#0d1f17'; c.strokeStyle = `rgba(0,200,80,${0.6 + 0.4 * Math.sin(t / 200)})`;
            c.lineWidth = 1.2;
            c.beginPath(); c.moveTo(mx, my - 8); c.lineTo(mx + 7, my + 4); c.lineTo(mx - 7, my + 4); c.closePath(); c.fill(); c.stroke();
            const mg = c.createRadialGradient(mx, my, 0, mx, my, 3.5);
            mg.addColorStop(0, '#fff'); mg.addColorStop(0.5, '#00ff88'); mg.addColorStop(1, 'rgba(0,100,50,0.4)');
            c.fillStyle = mg; c.beginPath(); c.arc(mx, my, 3.5, 0, Math.PI * 2); c.fill();
            // Labels
            c.fillStyle = '#ff880088'; c.font = '7px Share Tech Mono, monospace'; c.textAlign = 'center';
            c.fillText('MINION', mx, my + 16);
            c.textAlign = 'left';
            c.fillStyle = '#8899bb'; c.font = '7px Share Tech Mono, monospace';
            c.fillText('Shield hit 20% → queue Sword', w * 0.5, h * 0.55);
            c.fillText('HP 1% → all Swords fire at once', w * 0.5, h * 0.55 + 13);
            c.fillText('Swords are INDESTRUCTIBLE', w * 0.5, h * 0.55 + 26);
            activeAnimations.push(requestAnimationFrame(() => drawMar(performance.now())));
          }
          drawMar(performance.now());
        }

        // ── EGREGOR — Elite ──
        const sEg = setup('cvEgregor');
        if (sEg) {
          const { c, w, h } = sEg;
          const egCx = w * 0.28, egCy = h * 0.5;
          const egSc = Math.min(w, h) * 0.28 / 110;
          const egBase = 110 * egSc;
          const NUM_TENT_G = 10, NUM_SEG_G = 12;
          const egTents = [];
          for (let i = 0; i < NUM_TENT_G; i++) {
            egTents.push({
              baseAngle: (i / NUM_TENT_G) * Math.PI * 2,
              length: (150 + (i % 5) * 16) * egSc,
              phase: (i * 2.39996) % (Math.PI * 2),
              speedMult: 0.8 + (i % 3) * 0.3,
            });
          }
          // Calm 0-4s → rage 4-9s cycle
          function drawEg(t) {
            c.clearRect(0, 0, w, h);
            c.fillStyle = 'rgba(2,2,10,0.92)'; c.fillRect(0, 0, w, h);
            const cp = (t % 9000) / 9000;
            const rageF = cp < 0.5 ? (cp > 0.44 ? (cp - 0.44) / 0.06 : 0) : (cp > 0.94 ? (1 - (cp - 0.94) / 0.06) : 1);
            const isR = rageF > 0.5;
            const tentC = isR ? '#880011' : '#004455';
            const strkC = isR ? '#ff3300' : '#00ffaa';
            const glwC  = isR ? '#ff3300' : '#00ffaa';

            c.save(); c.translate(egCx, egCy);

            // Aura
            const aRad = (110 * 1.8 + Math.sin(t / 300) * 20) * egSc;
            const aG = c.createRadialGradient(0, 0, 110 * 0.5 * egSc, 0, 0, aRad);
            aG.addColorStop(0, isR ? 'rgba(255,0,0,0.4)' : 'rgba(0,100,150,0.4)');
            aG.addColorStop(1, 'transparent');
            c.fillStyle = aG; c.beginPath(); c.arc(0, 0, aRad, 0, Math.PI * 2); c.fill();

            // Tentacles (chain sim)
            c.lineCap = 'round';
            for (const tent of egTents) {
              let cx2 = Math.cos(tent.baseAngle) * 110 * 0.4 * egSc;
              let cy2 = Math.sin(tent.baseAngle) * 110 * 0.4 * egSc;
              let cAngle = tent.baseAngle;
              const sLen = tent.length / NUM_SEG_G;
              const pts = [{ x: cx2, y: cy2, a: cAngle }];
              const ws = isR ? 150 : 350;
              for (let i = 0; i < NUM_SEG_G; i++) {
                const wave = Math.sin(t / ws * tent.speedMult + i * 0.25 + tent.phase);
                cAngle += wave * 0.2; cAngle = cAngle * 0.95 + tent.baseAngle * 0.05;
                cx2 += Math.cos(cAngle) * sLen; cy2 += Math.sin(cAngle) * sLen;
                pts.push({ x: cx2, y: cy2, a: cAngle });
              }
              for (let i = 0; i < pts.length - 1; i++) {
                const tap = 1 - i / pts.length;
                c.beginPath(); c.moveTo(pts[i].x, pts[i].y); c.lineTo(pts[i+1].x, pts[i+1].y);
                c.lineWidth = Math.max(0.5, 36 * egSc * tap);
                c.strokeStyle = tentC; c.stroke();
              }
              // Suckers
              for (let i = 2; i < pts.length - 2; i++) {
                const p = pts[i]; const tap = 1 - i / pts.length;
                const px2 = Math.cos(p.a - Math.PI / 2), py2 = Math.sin(p.a - Math.PI / 2);
                const sr = Math.max(0.4, 7 * egSc * tap);
                const sx = p.x + px2 * 16 * egSc * tap, sy = p.y + py2 * 16 * egSc * tap;
                c.fillStyle = isR ? '#440000' : '#002233'; c.beginPath(); c.arc(sx, sy, sr, 0, Math.PI * 2); c.fill();
                c.fillStyle = isR ? '#ff4444' : '#00ffaa'; c.beginPath(); c.arc(sx, sy, sr * 0.55, 0, Math.PI * 2); c.fill();
              }
            }

            // Body blob
            const noiseI = 8 * egSc, tdiv = isR ? 150 : 300;
            c.beginPath();
            for (let i = 0; i <= 60; i++) {
              const a = (i / 60) * Math.PI * 2;
              const r = egBase + (Math.sin(a * 4 + t / tdiv) * 0.8 + Math.cos(a * 6 - t / (tdiv * 1.2)) * 0.5 + Math.sin(a * 3 + t / (tdiv * 0.8)) * 0.4) * noiseI;
              i === 0 ? c.moveTo(Math.cos(a) * r, Math.sin(a) * r) : c.lineTo(Math.cos(a) * r, Math.sin(a) * r);
            }
            c.closePath();
            const bG = c.createRadialGradient(0, 0, 0, 0, 0, egBase * 1.2);
            if (isR) { bG.addColorStop(0, '#550000'); bG.addColorStop(0.7, '#2b0000'); bG.addColorStop(1, '#ff0022'); }
            else { bG.addColorStop(0, '#003344'); bG.addColorStop(0.7, '#001a2b'); bG.addColorStop(1, '#00ffcc'); }
            c.fillStyle = bG; c.fill();
            c.shadowColor = glwC; c.shadowBlur = isR ? 30 : 20;
            c.strokeStyle = strkC; c.lineWidth = (isR ? 5 : 3) * egSc; c.stroke(); c.shadowBlur = 0;

            // Gills (5 layers)
            const brP = (Math.sin(t / 500) + 1) / 2;
            for (const side of [-1, 1]) {
              for (let i = 0; i < 5; i++) {
                c.save();
                c.translate(side * 12 * egSc, (10 + i * 12) * egSc);
                c.rotate(side * (0.2 + brP * 0.3 + i * 0.1));
                c.beginPath(); c.moveTo(0, 0);
                c.quadraticCurveTo(side * 30 * egSc, -8 * egSc, side * 55 * egSc, 15 * egSc);
                c.quadraticCurveTo(side * 20 * egSc, 25 * egSc, 0, 0);
                c.fillStyle = isR ? '#660000' : '#004455'; c.fill();
                c.shadowColor = isR ? '#ff4444' : '#00ffff'; c.shadowBlur = 6;
                c.strokeStyle = isR ? '#ff4444' : '#00ffff'; c.lineWidth = 1.5; c.stroke();
                c.shadowBlur = 0; c.restore();
              }
            }

            // 4 eyes
            const eyeD = [
              { a: -Math.PI / 3,           d: 30, s: 20 },
              { a: -Math.PI * 2 / 3,       d: 30, s: 20 },
              { a: -Math.PI / 6 + 0.2,     d: 55, s: 12 },
              { a: -Math.PI * 5 / 6 - 0.2, d: 55, s: 12 },
            ];
            // Fake player orbits for guide animation
            const plxG = egCx + Math.cos(t * 0.0008) * 50, plyG = egCy + Math.sin(t * 0.0006) * 25 + 25;
            for (const eye of eyeD) {
              const ef = Math.sin(t / 500 + eye.a) * 4 * egSc;
              const ex = Math.cos(eye.a) * (eye.d * egSc + ef);
              const ey2 = Math.sin(eye.a) * (eye.d * egSc + ef);
              const er = eye.s * egSc;
              const ddx2 = plxG - egCx - ex, ddy2 = plyG - egCy - ey2;
              const aTP = Math.atan2(ddy2, ddx2);
              const maxPD = er * 0.4;
              const pX = Math.cos(aTP) * Math.min(Math.hypot(ddx2, ddy2) * 0.05, maxPD);
              const pY = Math.sin(aTP) * Math.min(Math.hypot(ddx2, ddy2) * 0.05, maxPD);
              c.save(); c.translate(ex, ey2);
              c.beginPath(); c.ellipse(0, 0, er, er, 0, 0, Math.PI * 2); c.clip();
              c.fillStyle = isR ? '#ffcccc' : '#f0f8ff'; c.fillRect(-er, -er, er * 2, er * 2);
              const iG2 = c.createRadialGradient(pX, pY, 0, pX, pY, er * (isR ? 0.7 : 0.6));
              iG2.addColorStop(0, isR ? '#ffaa00' : '#00ffaa'); iG2.addColorStop(1, isR ? '#ff0000' : '#00aaff');
              c.fillStyle = iG2; c.beginPath(); c.arc(pX, pY, er * (isR ? 0.7 : 0.6), 0, Math.PI * 2); c.fill();
              const pd = isR ? 0.15 : 0.26;
              c.fillStyle = '#000'; c.beginPath();
              c.ellipse(pX, pY, er * pd, er * (isR ? 0.5 : pd * 1.5), aTP, 0, Math.PI * 2); c.fill();
              c.fillStyle = 'rgba(255,255,255,0.8)'; c.beginPath(); c.arc(pX - er * 0.15, pY - er * 0.15, er * 0.12, 0, Math.PI * 2); c.fill();
              c.restore();
              c.strokeStyle = isR ? '#660000' : '#003344'; c.lineWidth = 2;
              c.beginPath(); c.ellipse(ex, ey2, er, er, 0, 0, Math.PI * 2); c.stroke();
            }

            // State label
            c.fillStyle = isR ? '#ff9999' : '#88ffd4';
            c.font = `bold ${Math.ceil(7 + 6 * egSc)}px monospace`; c.textAlign = 'center'; c.textBaseline = 'alphabetic';
            c.fillText(isR ? '▲ MIND LINK ACTIVE ▲' : '— COLLECTIVE MIND —', 0, egBase * 1.6);
            c.restore();

            // Info labels (right side)
            c.textAlign = 'left'; c.textBaseline = 'alphabetic';
            c.fillStyle = '#ff8844'; c.font = 'bold 8px Orbitron, sans-serif';
            c.fillText('COLLECTIVE MIND', w * 0.52, h * 0.12);
            c.fillStyle = '#8899bb'; c.font = '6.5px Share Tech Mono, monospace';
            c.fillText('10 tentacles · 75% MaxHP each', w * 0.52, h * 0.12 + 12);
            c.fillText('Non-true: 60% deflect | 40%→tentacle (40% dmg)', w * 0.52, h * 0.12 + 23);
            c.fillText('True dmg cap: max(25%, 90−10n)% per hit', w * 0.52, h * 0.12 + 34);
            c.fillStyle = isR ? '#ff9999' : '#88ffd4'; c.font = 'bold 8px Orbitron, sans-serif';
            c.fillText('MIND LINK' + (isR ? ' ▲ RAGE' : ''), w * 0.52, h * 0.62);
            c.fillStyle = '#8899bb'; c.font = '6.5px Share Tech Mono, monospace';
            c.fillText('+12% atk spd  +10% move spd  (per stack)', w * 0.52, h * 0.62 + 12);
            c.fillText('+10% MaxHP  Heal 10% MaxHP  (per stack)', w * 0.52, h * 0.62 + 23);

            activeAnimations.push(requestAnimationFrame(() => drawEg(performance.now())));
          }
          drawEg(performance.now());
        }

        // Dargruel
        const sd = setup('cvDargruel');
        if (sd) {
          const { c, w, h } = sd;
          function drawDar(t) {
            c.clearRect(0, 0, w, h);
            const cx2 = w * 0.22, cy2 = h * 0.50, r = Math.min(h, w * 0.32) * 0.45;
            const pulse = 0.5 + 0.5 * Math.sin(t / 300);

            // ── MAOU HAKI SHOCKWAVE (every 6s) ──
            const hakiPhase = (t % 6000) / 6000;
            if (hakiPhase > 0.7 && hakiPhase < 0.95) {
              const hT = (hakiPhase - 0.7) / 0.25;
              const hR = hT * Math.max(w, h) * 0.85;
              const hFade = Math.max(0, 1 - hT);
              const hBlink = 0.7 + 0.3 * Math.sin(t / 40);
              c.globalAlpha = hFade * 0.15 * hBlink;
              c.fillStyle = 'rgba(100,0,200,1)'; c.beginPath(); c.arc(cx2, cy2, hR, 0, Math.PI * 2); c.fill();
              c.globalAlpha = 1;
              c.strokeStyle = `rgba(138,43,226,${hFade * (0.7 + 0.3 * hBlink)})`; c.lineWidth = 4;
              c.beginPath(); c.arc(cx2, cy2, hR, 0, Math.PI * 2); c.stroke();
              c.fillStyle = `rgba(200,100,255,${hFade})`; c.font = 'bold 9px Orbitron, sans-serif'; c.textAlign = 'center';
              c.fillText('MAOU HAKI', cx2, cy2 - hR - 4); c.textAlign = 'left';
            }

            // ── NEW DARGRUEL BODY ──
            // 1. Abyss aura
            c.fillStyle = `rgba(138,43,226,${0.12 + 0.08 * pulse})`;
            c.beginPath(); c.arc(cx2, cy2, r * 1.5, 0, Math.PI * 2); c.fill();

            // 2. Maître Suprême rotating dashed ring (simulated 5 sentinels)
            const simSents = 5, drLevel = Math.min(simSents, 18);
            c.save(); c.translate(cx2, cy2); c.rotate(t / 1200);
            c.strokeStyle = `rgba(180,0,255,${0.3 + 0.03 * drLevel})`; c.lineWidth = 2 + drLevel * 0.15;
            c.setLineDash([12, 8]); c.beginPath(); c.arc(0, 0, r * 1.25, 0, Math.PI * 2); c.stroke();
            c.setLineDash([]); c.restore();

            // 3. Main octagon
            c.save(); c.translate(cx2, cy2); c.rotate(t / 3500);
            const bodyG = c.createRadialGradient(0, 0, 0, 0, 0, r);
            bodyG.addColorStop(0, '#15002a'); bodyG.addColorStop(0.7, '#2d004d'); bodyG.addColorStop(1, '#0d001a');
            c.fillStyle = bodyG; c.strokeStyle = '#6a0dad'; c.lineWidth = 3;
            c.beginPath(); for (let i = 0; i < 8; i++) { const a = (i / 8) * Math.PI * 2; i === 0 ? c.moveTo(Math.cos(a) * r, Math.sin(a) * r) : c.lineTo(Math.cos(a) * r, Math.sin(a) * r); } c.closePath(); c.fill(); c.stroke();

            // 4. Counter-rotating inner octagon + veins
            c.rotate(-t / 3500 * 3.5); c.strokeStyle = '#8A2BE2'; c.lineWidth = 1.5;
            c.beginPath(); for (let i = 0; i < 8; i++) { const a = (i / 8) * Math.PI * 2 + Math.PI / 8; i === 0 ? c.moveTo(Math.cos(a) * r * 0.75, Math.sin(a) * r * 0.75) : c.lineTo(Math.cos(a) * r * 0.75, Math.sin(a) * r * 0.75); } c.closePath(); c.stroke();
            c.strokeStyle = 'rgba(138,43,226,0.4)';
            for (let i = 0; i < 4; i++) { const a = (i / 4) * Math.PI; c.beginPath(); c.moveTo(Math.cos(a) * r * 0.75, Math.sin(a) * r * 0.75); c.lineTo(Math.cos(a + Math.PI) * r * 0.75, Math.sin(a + Math.PI) * r * 0.75); c.stroke(); }
            c.restore();

            // 5. Abyss Eye core
            c.save(); c.translate(cx2, cy2);
            const coreR = r * 0.35, corePulse = 0.85 + 0.15 * Math.sin(t / 150);
            const cg2 = c.createRadialGradient(0, 0, 0, 0, 0, coreR * corePulse);
            cg2.addColorStop(0, '#fff'); cg2.addColorStop(0.3, '#df88ff'); cg2.addColorStop(0.7, '#4B0082'); cg2.addColorStop(1, 'transparent');
            c.fillStyle = cg2; c.beginPath(); c.arc(0, 0, coreR * corePulse, 0, Math.PI * 2); c.fill();

            // 5.5 Four triangles
            c.rotate(t / 2500);
            const triD = coreR + 8, triPulse = 0.6 + 0.4 * Math.sin(t / 100);
            c.fillStyle = `rgba(223,136,255,${triPulse})`;
            for (let i = 0; i < 4; i++) {
              c.save(); c.rotate((i * Math.PI) / 2); c.translate(triD, 0);
              c.beginPath(); c.moveTo(14, 0); c.lineTo(0, -6); c.lineTo(0, 6); c.closePath(); c.fill();
              c.restore();
            }
            c.restore();

            // 6. Chain nodes
            c.save(); c.translate(cx2, cy2);
            for (let i = 0; i < 4; i++) {
              const a = (i / 4) * Math.PI * 2;
              const px = Math.cos(a) * r * 0.88, py = Math.sin(a) * r * 0.88;
              c.fillStyle = '#07001a'; c.strokeStyle = '#9900ff'; c.lineWidth = 1.5;
              c.beginPath(); c.arc(px, py, 4, 0, Math.PI * 2); c.fill(); c.stroke();
              c.fillStyle = `rgba(223,136,255,${0.6 + 0.4 * pulse})`;
              c.beginPath(); c.arc(px, py, 1.5, 0, Math.PI * 2); c.fill();
            }
            c.restore();

            // ── ABYSSAL CHAIN FAN ──
            const chainPhase = (t % 3000) / 3000;
            if (chainPhase < 0.65) {
              const chainT = chainPhase / 0.65;
              const chainDist = chainT * w * 0.55;
              const fanAngles = [-0.4, -0.13, 0.13, 0.4];
              const baseFanAngle = Math.PI * 0.08;
              fanAngles.forEach((offset, idx) => {
                const angle = baseFanAngle + offset;
                const headX = cx2 + Math.cos(angle) * chainDist;
                const headY = cy2 + Math.sin(angle) * chainDist;
                const chainFade = chainT < 0.1 ? chainT / 0.1 : (chainT > 0.8 ? (1 - chainT) / 0.2 : 1);
                // Rope
                c.strokeStyle = `rgba(180,0,255,${0.5 * chainFade})`; c.lineWidth = 2;
                c.setLineDash([5, 5]); c.lineDashOffset = -(t / 30);
                c.beginPath(); c.moveTo(cx2, cy2);
                for (let s = 1; s <= 4; s++) {
                  const st = s / 4, j = s < 4 ? Math.sin(t / 100 + s * 2.1 + idx) * 4 : 0;
                  const dx = headX - cx2, dy = headY - cy2, dist = Math.hypot(dx, dy) || 1;
                  c.lineTo(cx2 + dx * st - (dy / dist) * j, cy2 + dy * st + (dx / dist) * j);
                }
                c.stroke(); c.setLineDash([]); c.lineDashOffset = 0;
                // Head
                c.save(); c.translate(headX, headY); c.rotate(angle);
                c.fillStyle = `rgba(110,0,210,${0.9 * chainFade})`; c.beginPath(); c.ellipse(0, 0, 9, 4, 0, 0, Math.PI * 2); c.fill();
                c.strokeStyle = `rgba(240,120,255,${0.85 * chainFade})`; c.lineWidth = 1.5; c.beginPath(); c.ellipse(0, 0, 9, 4, 0, 0, Math.PI * 2); c.stroke();
                c.restore();
              });
            }

            // Info labels
            c.fillStyle = '#cc55ff'; c.font = 'bold 8px Orbitron, sans-serif';
            c.fillText('DEMON GIFT @70/40/10/1%', w * 0.52, h * 0.15);
            c.fillStyle = '#8899bb'; c.font = '7px Share Tech Mono, monospace';
            c.fillText('25% base DR + 2%/sentinel (cap 36%)', w * 0.52, h * 0.15 + 13);
            c.fillText('Attack speed +5%/sentinel (cap 20%)', w * 0.52, h * 0.15 + 26);
            c.fillStyle = '#cc55ff88';
            c.fillText('4 PIERCING CHAINS / 1.5s', w * 0.52, h * 0.58);
            c.fillText('Hit player → Root & Silence 1s', w * 0.52, h * 0.58 + 13);
            activeAnimations.push(requestAnimationFrame(() => drawDar(performance.now())));
          }
          drawDar(performance.now());
        }


        // Leviathan — 2 phases in 1 canvas, sequential
        const sl = setup('cvLeviat');
        if (sl) {
          const { c, w, h } = sl;
          // Pre-compute Last Rites target positions (player + sentinels)
          const lrTargets = [
            [w * 0.65, h * 0.85], // player
            [w * 0.45, h * 0.15], [w * 0.80, h * 0.25], [w * 0.90, h * 0.55],
            [w * 0.15, h * 0.30], [w * 0.55, h * 0.35], [w * 0.75, h * 0.70],
            [w * 0.10, h * 0.65], [w * 0.35, h * 0.80],
          ];
          function drawLev(t) {
            c.clearRect(0, 0, w, h);
            const cx2 = w * 0.25, cy2 = h * 0.5, r = Math.min(h, w * 0.32) * 0.405;
            const NUM_W = 9;
            const laserLen = Math.max(w, h);

            // ── BIG CYCLE: 16s total ──
            // 0.00-0.25: AFO shield active (wings folded)
            // 0.25-0.32: shield shatters, wings open
            // 0.32-0.52: Perseverance (charge + 360° sweep)
            // 0.52-0.56: brief pause, body glows red (HP→1)
            // 0.56-0.76: Last Rites — wings rotate to aim targets
            // 0.76-0.90: All 9 lasers fire simultaneously
            // 0.90-1.00: lasers fade out, reset
            const bigCycle = 12308; // 16000 / 1.30 = ~30% faster
            const bp = (t % bigCycle) / bigCycle;

            const isAFO = bp < 0.25;
            const isShatter = bp >= 0.25 && bp < 0.32;
            const isPers = bp >= 0.32 && bp < 0.52;
            const isDying = bp >= 0.52 && bp < 0.56;
            const isLRAim = bp >= 0.56 && bp < 0.76;
            const isLRFire = bp >= 0.76 && bp < 0.90;
            const isLRFade = bp >= 0.90;

            // Wing open/close state
            let wingPhase = 0; // 0=folded, 1=open
            if (isAFO) wingPhase = 0;
            else if (isShatter) wingPhase = (bp - 0.25) / 0.07;
            else if (isPers || isDying) wingPhase = 1;
            else wingPhase = 1; // open during Last Rites
            wingPhase = Math.min(1, Math.max(0, wingPhase));

            // Phase label
            c.fillStyle = '#cc55ff88'; c.font = '7px Share Tech Mono, monospace'; c.textAlign = 'center';
            if (isAFO) c.fillText('▶ ALL FOR ONE — IRON BODY', cx2, 10);
            else if (isShatter) c.fillText('▶ SHIELD SHATTERS — WINGS OPEN', cx2, 10);
            else if (isPers) c.fillText('▶ PERSEVERANCE — 360° LASER SWEEP', cx2, 10);
            else if (isDying) c.fillText('▶ HP REACHES 1...', cx2, 10);
            else if (isLRAim) c.fillText('▶ LAST RITES — WINGS LOCKING TARGETS', cx2, 10);
            else if (isLRFire || isLRFade) c.fillText('▶ LAST RITES — ALL 9 LASERS FIRE', cx2, 10);
            c.textAlign = 'left';

            // ── Draw target markers during Last Rites phases ──
            if (isLRAim || isLRFire || isLRFade) {
              lrTargets.forEach(([tx, ty], ti) => {
                c.globalAlpha = 0.4;
                if (ti === 0) {
                  // Player ship
                  c.fillStyle = '#1a2a45';
                  c.beginPath(); c.moveTo(tx, ty - 6); c.lineTo(tx + 5, ty); c.lineTo(tx + 4, ty + 3); c.lineTo(tx - 4, ty + 3); c.lineTo(tx - 5, ty); c.closePath(); c.fill();
                  c.fillStyle = '#00e5ff'; c.beginPath(); c.arc(tx, ty, 1.5, 0, Math.PI * 2); c.fill();
                } else {
                  // Sentinel dot
                  c.fillStyle = '#888'; c.beginPath(); c.arc(tx, ty, 4, 0, Math.PI * 2); c.fill();
                  c.strokeStyle = '#00FFFF55'; c.lineWidth = 0.8; c.beginPath(); c.arc(tx, ty, 4, 0, Math.PI * 2); c.stroke();
                }
                c.globalAlpha = 1;
              });
            }

            // ── WINGS (always drawn, phase controls fold/open) ──
            // During Last Rites aiming: each wing rotates independently to its target
            c.save(); c.translate(cx2, cy2);
            const baseWingRot = -t / 9000; // slow counter-clockwise orbit
            for (let i = 0; i < NUM_W; i++) {
              const orbitAngle = (i / NUM_W) * Math.PI * 2 + baseWingRot;

              let drawAngle = orbitAngle;
              // During Last Rites aiming, wings rotate from orbit position to target
              if (isLRAim) {
                const aimP = (bp - 0.56) / 0.20;
                const ease = aimP < 0.5 ? 4 * aimP * aimP * aimP : 1 - Math.pow(-2 * aimP + 2, 3) / 2;
                const [tx, ty] = lrTargets[i];
                const targetA = Math.atan2(ty - cy2, tx - cx2);
                let diff = targetA - orbitAngle;
                while (diff > Math.PI) diff -= Math.PI * 2;
                while (diff < -Math.PI) diff += Math.PI * 2;
                drawAngle = orbitAngle + diff * ease;
              } else if (isLRFire || isLRFade) {
                // Locked on target
                const [tx, ty] = lrTargets[i];
                drawAngle = Math.atan2(ty - cy2, tx - cx2);
              }

              c.save(); c.rotate(drawAngle);
              const wl = r * 1.0, ww = r * 0.26, hw = ww / 2;
              const closedD = r * 0.45, openD = r * 0.90;
              const wd = closedD + (openD - closedD) * wingPhase + Math.sin(t / 700 + i) * r * 0.04;
              c.translate(wd, 0); // wing extends outward along its angle
              // Trapezoid wing plate (pointing outward)
              const wg = c.createLinearGradient(0, 0, wl, 0);
              wg.addColorStop(0, '#00e5ff'); wg.addColorStop(0.15, '#2d3748'); wg.addColorStop(0.8, '#1a1c29'); wg.addColorStop(1, '#0f172a');
              c.fillStyle = wg;
              c.beginPath();
              c.moveTo(0, -hw * 0.4); c.lineTo(0, hw * 0.4);
              c.lineTo(wl, hw * 0.7); c.lineTo(wl, -hw * 0.7);
              c.closePath(); c.fill();
              // Inner panel
              c.fillStyle = '#374151';
              c.beginPath();
              c.moveTo(wl * 0.15, -hw * 0.2); c.lineTo(wl * 0.15, hw * 0.2);
              c.lineTo(wl * 0.85, hw * 0.6); c.lineTo(wl * 0.85, -hw * 0.6);
              c.closePath(); c.fill();
              c.restore();
            }
            c.restore();

            // ── Last Rites: warning beams during aiming ──
            if (isLRAim) {
              const aimP = (bp - 0.56) / 0.20;
              for (let i = 0; i < NUM_W; i++) {
                const [tx, ty] = lrTargets[i];
                const orbitAngle = (i / NUM_W) * Math.PI * 2 + baseWingRot;
                const targetA = Math.atan2(ty - cy2, tx - cx2);
                let diff = targetA - orbitAngle;
                while (diff > Math.PI) diff -= Math.PI * 2;
                while (diff < -Math.PI) diff += Math.PI * 2;
                const ease = aimP < 0.5 ? 4 * aimP * aimP * aimP : 1 - Math.pow(-2 * aimP + 2, 3) / 2;
                const curA = orbitAngle + diff * ease;
                // Dashed orange warning line
                c.strokeStyle = `rgba(255,100,0,${aimP * 0.55 * (0.5 + 0.5 * Math.sin(t / 80 + i))})`;
                c.lineWidth = 2; c.setLineDash([10, 7]);
                const endX = cx2 + Math.cos(curA) * laserLen;
                const endY = cy2 + Math.sin(curA) * laserLen;
                c.beginPath(); c.moveTo(cx2, cy2); c.lineTo(endX, endY); c.stroke();
                c.setLineDash([]);
              }
            }

            // ── Last Rites: all 9 lasers fire ──
            if (isLRFire || isLRFade) {
              const fireP = isLRFire ? (bp - 0.76) / 0.14 : 1;
              const fadeMul = isLRFade ? Math.max(0, 1 - (bp - 0.90) / 0.10) : 1;
              const alpha = fadeMul;
              for (let i = 0; i < NUM_W; i++) {
                const [tx, ty] = lrTargets[i];
                const la = Math.atan2(ty - cy2, tx - cx2);
                const endX = cx2 + Math.cos(la) * laserLen;
                const endY = cy2 + Math.sin(la) * laserLen;
                c.globalAlpha = alpha;
                // Wide outer glow
                c.strokeStyle = 'rgba(255,80,0,0.25)'; c.lineWidth = 28;
                c.beginPath(); c.moveTo(cx2, cy2); c.lineTo(endX, endY); c.stroke();
                // Core
                c.strokeStyle = '#ff4444'; c.lineWidth = 5;
                c.beginPath(); c.moveTo(cx2, cy2); c.lineTo(endX, endY); c.stroke();
                // White center
                c.strokeStyle = '#ffffff'; c.lineWidth = 1.5;
                c.beginPath(); c.moveTo(cx2, cy2); c.lineTo(endX, endY); c.stroke();
              }
              c.globalAlpha = 1;
              // Flash text
              if (isLRFire && fireP < 0.3) {
                c.fillStyle = `rgba(255,100,0,${(0.3 - fireP) * 3})`; c.font = 'bold 11px Orbitron, sans-serif'; c.textAlign = 'center';
                c.fillText('LAST RITES', cx2, cy2 - r - 30); c.textAlign = 'left';
              }
            }

            // ── ENERGY VORTEX (only when shield broken, not during Last Rites fire) ──
            if (!isAFO && !isLRFire && !isLRFade) {
              c.save(); c.translate(cx2, cy2); c.rotate(t / 400);
              for (let i = 0; i < 8; i++) {
                const sa = (i / 8) * Math.PI * 2;
                c.strokeStyle = i % 2 === 0 ? 'rgba(0,229,255,0.7)' : 'rgba(157,0,255,0.7)';
                c.lineWidth = 5; c.beginPath(); c.arc(0, 0, r * 0.52, sa, sa + Math.PI / 8); c.stroke();
              }
              c.restore();
            }

            // ── CORE ──
            const beat = 0.9 + 0.15 * Math.sin(t / 500);
            const coreR = r * 0.30 * beat;
            const coreG = c.createRadialGradient(cx2, cy2, 0, cx2, cy2, coreR);
            if (isDying) {
              // Dying glow: red-orange
              coreG.addColorStop(0, '#ffaa00'); coreG.addColorStop(0.6, '#ff4400'); coreG.addColorStop(1, '#880000');
            } else {
              coreG.addColorStop(0, '#020205'); coreG.addColorStop(0.6, '#2a0066'); coreG.addColorStop(1, '#00e5ff');
            }
            c.fillStyle = coreG; c.beginPath(); c.arc(cx2, cy2, coreR, 0, Math.PI * 2); c.fill();
            // Eye
            const eyeTarget = isLRAim || isLRFire ? lrTargets[0] : [w * 0.7, h * 0.8];
            const eA = Math.atan2(eyeTarget[1] - cy2, eyeTarget[0] - cx2);
            const eOff = coreR * 0.3, eR = coreR * 0.35;
            const ex2 = cx2 + Math.cos(eA) * eOff, ey2 = cy2 + Math.sin(eA) * eOff;
            c.fillStyle = '#e8e8ff'; c.beginPath(); c.arc(ex2, ey2, eR, 0, Math.PI * 2); c.fill();
            c.fillStyle = '#00e5ff'; c.beginPath(); c.arc(ex2, ey2, eR * 0.6, 0, Math.PI * 2); c.fill();
            c.fillStyle = '#000'; c.beginPath(); c.arc(ex2, ey2, eR * 0.28, 0, Math.PI * 2); c.fill();

            // ── AFO SHIELD (phase 1 only) ──
            if (isAFO) {
              const sR = r * 1.5;
              const pulse = 0.85 + 0.15 * Math.sin(t / 1500);
              c.fillStyle = `rgba(0,229,255,${0.06 * pulse})`;
              c.beginPath(); c.arc(cx2, cy2, sR, 0, Math.PI * 2); c.fill();
              c.save(); c.translate(cx2, cy2); c.rotate(t / 15000);
              c.strokeStyle = `rgba(0,229,255,${0.65 * pulse})`; c.lineWidth = 2;
              c.beginPath(); c.arc(0, 0, sR, 0, Math.PI * 2); c.stroke(); c.restore();
              c.save(); c.translate(cx2, cy2); c.rotate(-t / 10000);
              c.setLineDash([8, 6]); c.strokeStyle = `rgba(255,255,255,${0.35 * pulse})`; c.lineWidth = 1;
              c.beginPath(); c.arc(0, 0, sR * 0.94, 0, Math.PI * 2); c.stroke(); c.setLineDash([]); c.restore();
              // Kill counter
              const fakeKills = Math.min(7, Math.floor((bp / 0.25) * 7));
              c.fillStyle = '#00e5ff'; c.font = 'bold 10px monospace'; c.textAlign = 'center';
              c.fillText(fakeKills + '/7 kills', cx2, cy2 + sR + 14);
              c.font = '8px monospace'; c.fillStyle = '#ffffff88';
              c.fillText('IRON BODY', cx2, cy2 + sR + 25); c.textAlign = 'left';
            }

            // ── PERSEVERANCE (after shield break) ──
            if (isPers) {
              const persT = (bp - 0.32) / 0.20;
              if (persT < 0.35) {
                // Charge warning
                const chgP = persT / 0.35;
                c.save(); c.translate(cx2, cy2);
                c.strokeStyle = `rgba(255,0,0,${chgP * 0.35})`; c.lineWidth = 3 + chgP * 6;
                c.beginPath(); c.arc(0, 0, r * (0.6 + chgP * 1.2), 0, Math.PI * 2); c.stroke();
                c.save(); c.rotate(t / 300); c.globalAlpha = chgP * 0.5; c.setLineDash([8, 6]);
                c.strokeStyle = '#ff0000'; c.lineWidth = 2; c.beginPath(); c.arc(0, 0, r * 0.8, 0, Math.PI * 2); c.stroke();
                c.restore(); c.setLineDash([]); c.globalAlpha = 1;
                c.restore();
              } else {
                // 360° sweep
                const sweepP = (persT - 0.35) / 0.65;
                const sweepA = sweepP * Math.PI * 2;
                c.save(); c.translate(cx2, cy2); c.rotate(sweepA - Math.PI / 2);
                c.strokeStyle = 'rgba(255,0,0,0.12)'; c.lineWidth = 35;
                c.beginPath(); c.moveTo(0, 0); c.lineTo(laserLen, 0); c.stroke();
                c.strokeStyle = 'rgba(255,30,0,0.85)'; c.lineWidth = 7;
                c.beginPath(); c.moveTo(0, 0); c.lineTo(laserLen, 0); c.stroke();
                c.strokeStyle = 'rgba(255,255,255,0.65)'; c.lineWidth = 1.5;
                c.beginPath(); c.moveTo(0, 0); c.lineTo(laserLen, 0); c.stroke();
                c.restore();
              }
            }

            // ── DYING GLOW (HP→1) ──
            if (isDying) {
              const dyeP = (bp - 0.52) / 0.04;
              const glow = c.createRadialGradient(cx2, cy2, 0, cx2, cy2, r * 1.8);
              glow.addColorStop(0, `rgba(255,100,0,${0.4 * dyeP})`); glow.addColorStop(1, 'transparent');
              c.fillStyle = glow; c.beginPath(); c.arc(cx2, cy2, r * 1.8, 0, Math.PI * 2); c.fill();
              c.fillStyle = `rgba(255,50,0,${dyeP * 0.6})`; c.font = 'bold 10px Orbitron, sans-serif'; c.textAlign = 'center';
              c.fillText('HP → 1', cx2, cy2 + r + 22); c.textAlign = 'left';
            }

            // ── Right side labels ──
            c.fillStyle = '#cc55ff'; c.font = 'bold 7px Orbitron, sans-serif';
            c.fillText('HERD LEADER', w * 0.58, h * 0.15);
            c.fillStyle = '#8899bb'; c.font = '6px Share Tech Mono, monospace';
            c.fillText('+25% DR, +25% heals (all enemies)', w * 0.58, h * 0.15 + 11);
            c.fillStyle = '#cc55ff'; c.font = 'bold 7px Orbitron, sans-serif';
            c.fillText('PERSEVERANCE', w * 0.58, h * 0.15 + 26);
            c.fillStyle = '#8899bb'; c.font = '6px Share Tech Mono, monospace';
            c.fillText('360° red laser sweep', w * 0.58, h * 0.15 + 37);
            c.fillStyle = '#cc55ff'; c.font = 'bold 7px Orbitron, sans-serif';
            c.fillText('LAST RITES @HP=1', w * 0.58, h * 0.15 + 52);
            c.fillStyle = '#8899bb'; c.font = '6px Share Tech Mono, monospace';
            c.fillText('9 wings lock targets (ease rotation)', w * 0.58, h * 0.15 + 63);
            c.fillText('All fire simultaneously', w * 0.58, h * 0.15 + 74);
            c.fillText('Lasers persist after death', w * 0.58, h * 0.15 + 85);

            activeAnimations.push(requestAnimationFrame(() => drawLev(performance.now())));
          }
          drawLev(performance.now());
        }

        // ── KANADE — Administrator ──
        const sk = setup('cvKanade');
        if (sk) {
          const { c, w, h } = sk;
          // Pre-generate cherry petals
          const petals = Array.from({ length: 60 }, (_, i) => ({
            x: Math.random() * w, y: Math.random() * h,
            vx: (Math.random() - 0.5) * 0.6,
            vy: 0.4 + Math.random() * 0.8,
            rot: Math.random() * Math.PI * 2,
            rotV: (Math.random() - 0.5) * 0.06,
            size: 3 + Math.random() * 5,
            alpha: 0.4 + Math.random() * 0.6,
            hue: 340 + Math.floor(Math.random() * 30),
          }));
          let lastT = 0;
          function drawKanade(t) {
            const dt = Math.min(t - lastT, 32); lastT = t;
            c.clearRect(0, 0, w, h);
            c.fillStyle = 'rgba(5,0,12,0.85)'; c.fillRect(0, 0, w, h);

            const cx2 = w / 2, cy2 = h / 2;

            // ── Update + draw cherry blossoms ──
            petals.forEach(p => {
              p.x += p.vx * dt * 0.06;
              p.y += p.vy * dt * 0.06;
              p.rot += p.rotV * dt * 0.06;
              if (p.y > h + 10) { p.y = -10; p.x = Math.random() * w; }
              if (p.x < -10) p.x = w + 5;
              if (p.x > w + 10) p.x = -5;
              // Petal shape: small ellipse rotated
              c.save();
              c.translate(p.x, p.y); c.rotate(p.rot);

              c.fillStyle = `hsl(${p.hue},80%,78%)`;

              c.ellipse(0, 0, p.size, p.size * 0.45, 0, 0, Math.PI * 2);

              c.beginPath(); c.moveTo(-p.size * 0.8, 0); c.lineTo(p.size * 0.8, 0); c.stroke();
              c.restore();
            });
            c.globalAlpha = 1;

            // ── Mystery circle ──
            const ringPulse = 0.5 + 0.5 * Math.sin(t / 600);
            c.strokeStyle = `rgba(255,34,68,${0.3 + 0.2 * ringPulse})`; c.lineWidth = 1;
            c.beginPath(); c.arc(cx2, cy2, 52, 0, Math.PI * 2); c.stroke();
            c.strokeStyle = `rgba(200,0,50,${0.15 * ringPulse})`; c.lineWidth = 3;
            c.beginPath(); c.arc(cx2, cy2, 52, 0, Math.PI * 2); c.stroke();

            // ── 8-pointed red star ──
            c.save(); c.translate(cx2, cy2); c.rotate(t / 8000);

            c.strokeStyle = `rgba(255,34,68,${0.8 + 0.2 * ringPulse})`; c.lineWidth = 1.2;
            for (let pass = 0; pass < 2; pass++) {
              c.save(); c.rotate(pass * Math.PI / 4);

              for (let i = 0; i < 4; i++) {
                const a = (i / 4) * Math.PI * 2 - Math.PI / 4;

              c.closePath();

            c.restore();

            // ── Center question mark ──
            c.save(); c.translate(cx2, cy2);

            c.font = 'bold 22px Cinzel, serif'; c.textAlign = 'center'; c.textBaseline = 'middle';

            // ── Label ──
            c.fillStyle = 'rgba(255,34,68,0.5)'; c.font = '7px Share Tech Mono, monospace'; c.textAlign = 'center';

            activeAnimations.push(requestAnimationFrame(() => drawKanade(performance.now())));
          }
          drawKanade(performance.now());
        }
      }

      // ── SKILL TAB CANVASES ── (abbreviated for key ones)
      if (tab === 'skills') {
        // Yog-Sothoth
        const ss = setup('cvShift');
        if (ss) {
          const { c, w, h } = ss;
          function drawShift(t) {
            c.clearRect(0, 0, w, h);
            c.fillStyle = 'rgba(2,0,10,0.8)'; c.fillRect(0, 0, w, h);
            const cx2 = w / 2, cy2 = h * 0.52;

            // Domain expand/hold cycle (4s expand, 4s full, 2s close)
            const cycle = 10000, cp = (t % cycle) / cycle;
            const domR = cp < 0.4 ? 80 * (cp / 0.4) : cp < 0.8 ? 80 : 80 * (1 - (cp - 0.8) / 0.2);

            // Space-time distortion: concentric ripple rings
            for (let i = 0; i < 4; i++) {
              const rp = ((t / 1800 + i * 0.25) % 1);
              const rR = 8 + rp * domR;
              if (rR > domR) continue;
              c.strokeStyle = `rgba(160,0,255,${0.4 * (1 - rp)})`;
              c.lineWidth = 1.5 * (1 - rp);
              c.beginPath(); c.arc(cx2, cy2, rR, 0, Math.PI * 2); c.stroke();
            }

            // Domain fill (dark purple sphere)
            if (domR > 5) {
              const dg = c.createRadialGradient(cx2, cy2, 0, cx2, cy2, domR);
              dg.addColorStop(0, 'rgba(25,0,55,0.85)'); dg.addColorStop(0.6, 'rgba(20,0,45,0.65)'); dg.addColorStop(1, 'rgba(0,0,0,0)');
              c.fillStyle = dg; c.beginPath(); c.arc(cx2, cy2, domR, 0, Math.PI * 2); c.fill();
            }

            // Hex grid inside domain — phase shifted
            if (domR > 30) {
              c.save();
              c.beginPath(); c.arc(cx2, cy2, domR * 0.95, 0, Math.PI * 2); c.clip();
              c.strokeStyle = '#6600cc'; c.lineWidth = 0.4; c.globalAlpha = 0.2;
              const hs = 12, offset = (t / 80) % (hs * 1.73);
              for (let row = -4; row < 5; row++) for (let col = -5; col < 6; col++) {
                const hx = cx2 + col * hs * 1.73 + (row % 2) * hs * 0.87 + offset, hy = cy2 + row * hs * 1.5;
                c.beginPath();
                for (let i = 0; i < 6; i++) { const a = (i / 6) * Math.PI * 2 - Math.PI / 6; i === 0 ? c.moveTo(hx + Math.cos(a) * hs * 0.55, hy + Math.sin(a) * hs * 0.55) : c.lineTo(hx + Math.cos(a) * hs * 0.55, hy + Math.sin(a) * hs * 0.55); }
                c.closePath(); c.stroke();
              }
              c.globalAlpha = 1; c.restore();
            }

            // Slow-time effect: floating "0.15×" numbers drifting upward
            for (let i = 0; i < 5; i++) {
              const drift = ((t / 2000 + i * 0.2) % 1);
              const nx = cx2 + (i - 2) * 18, ny = cy2 + 30 - drift * 80;
              if (Math.hypot(nx - cx2, ny - cy2) > domR * 0.85) continue;
              c.globalAlpha = (1 - drift) * 0.5;
              c.fillStyle = '#aa44ff'; c.font = '6px Share Tech Mono, monospace'; c.textAlign = 'center';
              c.fillText('×0.15', nx, ny);
            }
            c.globalAlpha = 1;

            // Outer domain edge — bright ring
            if (domR > 5) {
              c.strokeStyle = `rgba(180,0,255,${0.7 + 0.3 * Math.sin(t / 400)})`; c.lineWidth = 2;
              c.beginPath(); c.arc(cx2, cy2, domR, 0, Math.PI * 2); c.stroke();
              // Dashed outer
              c.save(); c.translate(cx2, cy2); c.rotate(t / 3000);
              c.setLineDash([8, 14]); c.strokeStyle = 'rgba(200,80,255,0.3)'; c.lineWidth = 1.2;
              c.beginPath(); c.arc(0, 0, domR + 6, 0, Math.PI * 2); c.stroke();
              c.setLineDash([]); c.restore();

            // Spiral energy arms
            c.save(); c.translate(cx2, cy2); c.rotate(t / 1200);

              c.beginPath();

                const st = s / 20, r2 = st * domR * 0.85, a2 = aBase + st * 1.8;

              }
              c.strokeStyle = `rgba(200,0,255,${0.15 + 0.1 * Math.sin(t / 500 + arm)})`;
              c.lineWidth = 0.8; c.stroke();
            }
            c.restore();

            // Player ship + Iron Body aura
            c.save(); c.translate(cx2, cy2);
            const ibPulse = 0.5 + 0.5 * Math.sin(t / 300);
            c.strokeStyle = `rgba(180,80,255,${0.6 * ibPulse})`; c.lineWidth = 2.5;
            c.beginPath(); c.arc(0, 0, 20, 0, Math.PI * 2); c.stroke();
            c.fillStyle = '#1a2a45'; c.beginPath(); c.moveTo(0, -12); c.lineTo(10, 2); c.lineTo(8, 6); c.lineTo(-8, 6); c.lineTo(-10, 2); c.closePath(); c.fill();
            c.strokeStyle = '#cc88ff'; c.lineWidth = 1; c.beginPath(); c.moveTo(0, -12); c.lineTo(10, 2); c.lineTo(8, 6); c.lineTo(-8, 6); c.lineTo(-10, 2); c.closePath(); c.stroke();
            c.restore();

            // Teleport portals (left + right)
            const portalDist = Math.min(domR * 0.75, 65);
            [[cx2 - portalDist, cy2, -1], [cx2 + portalDist, cy2, 1]].forEach(([px, py, dir]) => {
              const pp = 0.6 + 0.4 * Math.sin(t / 500 + dir);
              c.save(); c.translate(px, py); c.rotate(dir * t / 1500);
              c.strokeStyle = `rgba(200,80,255,${0.7 * pp})`; c.lineWidth = 2;
              c.beginPath(); c.arc(0, 0, 11, 0, Math.PI * 2); c.stroke();
              c.setLineDash([3, 5]); c.strokeStyle = `rgba(150,0,255,${0.4 * pp})`; c.lineWidth = 0.8;
              c.beginPath(); c.arc(0, 0, 16, 0, Math.PI * 2); c.stroke();
              c.setLineDash([]); c.restore();
              // Ghost ship
              c.globalAlpha = 0.28;
              c.fillStyle = '#1a2a45';
              c.beginPath(); c.moveTo(px, py - 9); c.lineTo(px + 7, py + 1); c.lineTo(px + 5, py + 4); c.lineTo(px - 5, py + 4); c.lineTo(px - 7, py + 1); c.closePath(); c.fill();
              c.strokeStyle = '#aa55ff'; c.lineWidth = 0.6;
              c.beginPath(); c.moveTo(px, py - 9); c.lineTo(px + 7, py + 1); c.lineTo(px + 5, py + 4); c.lineTo(px - 5, py + 4); c.lineTo(px - 7, py + 1); c.closePath(); c.stroke();
              c.globalAlpha = 1;
            });

            // Connector beam
            c.strokeStyle = 'rgba(180,0,255,0.25)'; c.lineWidth = 1; c.setLineDash([5, 9]); c.lineDashOffset = -(t / 50);
            c.beginPath(); c.moveTo(cx2 - portalDist, cy2); c.lineTo(cx2 + portalDist, cy2); c.stroke();
            c.setLineDash([]); c.lineDashOffset = 0;

            // Label
            c.fillStyle = '#bb88ff'; c.font = '8px Share Tech Mono, monospace'; c.textAlign = 'center';
            c.fillText('IRON BODY • BULLETS DESTROYED • 15% TIME • ←→ TELEPORT', cx2, h - 8);
            c.textAlign = 'left';
            activeAnimations.push(requestAnimationFrame(() => drawShift(performance.now())));
          }
          drawShift(performance.now());
        }

        // Skill A
        const ska = setup('cvSkillA');
        if (ska) {
          const { c, w, h } = ska;
          function drawSkA(t) {
            c.clearRect(0, 0, w, h);
            c.fillStyle = 'rgba(0,3,15,0.7)'; c.fillRect(0, 0, w, h);
            const cx2 = w * 0.32, cy2 = h * 0.52;

            // Binary sensor ring — rotating text characters
            const sensorR = 60;
            c.save(); c.translate(cx2, cy2); c.rotate(t / 5000);
            const charCnt = 28;
            c.font = '5px Share Tech Mono, monospace'; c.textAlign = 'center'; c.textBaseline = 'middle';
            for (let i = 0; i < charCnt; i++) {
              const a = (i / charCnt) * Math.PI * 2;
              const ch = ((Math.floor(t / 200) + i) % 2).toString();
              c.globalAlpha = 0.2 + 0.1 * Math.sin(t / 400 + i);
              c.fillStyle = '#00e5ff';
              c.save(); c.rotate(a); c.fillText(ch, 0, -sensorR); c.restore();
            }
            c.globalAlpha = 1; c.textBaseline = 'alphabetic'; c.restore();

            // Orbiting orbs — 3 layers
            const orbDef = [
              { count: 5, r: 38, speed: 2800, start: 0 },
              { count: 6, r: 54, speed: -4200, start: 0.15 },
              { count: 4, r: 70, speed: 6000, start: 0.3 },
            ];
            let orbIdx = 0;
            orbDef.forEach(({ count, r, speed, start }) => {
              for (let i = 0; i < count; i++) {
                const a = t / speed + (i / count) * Math.PI * 2 + start * Math.PI * 2;
                const ox = cx2 + Math.cos(a) * r, oy = cy2 + Math.sin(a) * r;
                const isYellow = orbIdx < 3;
                const pulse = 1 + 0.2 * Math.sin(t / 200 + orbIdx);
                const or = (isYellow ? 5.5 : 4.5) * pulse;
                // Glow halo
                c.fillStyle = isYellow ? 'rgba(255,200,0,0.18)' : 'rgba(0,200,255,0.14)';
                c.beginPath(); c.arc(ox, oy, or * 2, 0, Math.PI * 2); c.fill();
                // Orb body
                const og = c.createRadialGradient(ox, oy, 0, ox, oy, or);
                og.addColorStop(0, '#fff');
                og.addColorStop(0.35, isYellow ? '#ffee00' : '#00ffff');
                og.addColorStop(1, isYellow ? 'rgba(200,80,0,0.4)' : 'rgba(0,80,200,0.4)');
                c.fillStyle = og; c.beginPath(); c.arc(ox, oy, or, 0, Math.PI * 2); c.fill();
                // Trail line back to ship
                if (r < 55) {
                  c.globalAlpha = 0.06;
                  c.strokeStyle = isYellow ? '#ffee00' : '#00e5ff'; c.lineWidth = 0.5;
                  c.beginPath(); c.moveTo(cx2, cy2); c.lineTo(ox, oy); c.stroke();
                  c.globalAlpha = 1;
                }
                orbIdx++;
              }
            });

            // Homing orb firing + impact explosion
            const ft = (t / 2200) % 1;
            const enemy = { x: w * 0.82, y: h * 0.28 };
            if (ft < 0.55) {
              // Orb flying toward enemy
              const ox2 = cx2 + (enemy.x - cx2) * (ft / 0.55);
              const oy2 = cy2 + (enemy.y - cy2) * (ft / 0.55) - Math.sin(ft / 0.55 * Math.PI) * 15;
              // Tail
              for (let tr = 1; tr <= 4; tr++) {
                const tf2 = Math.max(0, ft - tr * 0.025);
                const tx2 = cx2 + (enemy.x - cx2) * (tf2 / 0.55);
                const ty2 = cy2 + (enemy.y - cy2) * (tf2 / 0.55) - Math.sin(tf2 / 0.55 * Math.PI) * 15;
                c.globalAlpha = (1 - tr / 4) * 0.4;
                c.fillStyle = '#00ffff'; c.beginPath(); c.arc(tx2, ty2, 3 - tr * 0.5, 0, Math.PI * 2); c.fill();
              }
              c.globalAlpha = 1;
              const fg = c.createRadialGradient(ox2, oy2, 0, ox2, oy2, 5);
              fg.addColorStop(0, '#fff'); fg.addColorStop(0.4, '#00ffff'); fg.addColorStop(1, 'rgba(0,80,200,0.3)');
              c.fillStyle = fg; c.beginPath(); c.arc(ox2, oy2, 5, 0, Math.PI * 2); c.fill();
            } else if (ft < 0.85) {

              const imp = (ft - 0.55) / 0.3;
              for (let i = 0; i < 16; i++) {
                const sa = (i / 16) * Math.PI * 2;
                const sd = imp * 28;
                c.globalAlpha = Math.max(0, 1 - imp * 1.1);
                const sc = i % 2 === 0 ? '#00ffff' : '#00aaff';
                c.fillStyle = sc; c.beginPath(); c.arc(enemy.x + Math.cos(sa) * sd, enemy.y + Math.sin(sa) * sd, 2.5 - imp * 1.5, 0, Math.PI * 2); c.fill();
              }
              // Central flash
              c.globalAlpha = Math.max(0, 0.8 - imp * 1.2);
              c.fillStyle = '#fff'; c.beginPath(); c.arc(enemy.x, enemy.y, 8 + imp * 4, 0, Math.PI * 2); c.fill();
              c.globalAlpha = 1;
            }

            // Enemy
            c.fillStyle = '#330808'; c.beginPath(); c.arc(enemy.x, enemy.y, 10, 0, Math.PI * 2); c.fill();
            c.strokeStyle = '#661111'; c.lineWidth = 0.8; c.stroke();

            // Ship
            c.save(); c.translate(cx2, cy2);
            c.fillStyle = '#1a2a45'; c.beginPath(); c.moveTo(0, -12); c.lineTo(10, 2); c.lineTo(8, 6); c.lineTo(-8, 6); c.lineTo(-10, 2); c.closePath(); c.fill();
            c.strokeStyle = '#38bdf8'; c.lineWidth = 0.8; c.beginPath(); c.moveTo(0, -12); c.lineTo(10, 2); c.lineTo(8, 6); c.lineTo(-8, 6); c.lineTo(-10, 2); c.closePath(); c.stroke();
            c.restore();

            // Labels
            c.fillStyle = '#FFD70088'; c.font = '7px Share Tech Mono, monospace'; c.textAlign = 'left';
            c.fillText('YELLOW = SACRIFICE SHIELD', w * 0.58, h * 0.65);
            c.fillText('20 orbs/cast (80 max)', w * 0.58, h * 0.65 + 12);
            c.fillText('Impact → 16 scattered shards', w * 0.58, h * 0.65 + 24);
            activeAnimations.push(requestAnimationFrame(() => drawSkA(performance.now())));
          }
          drawSkA(performance.now());
        }

        // Spirit
        const sks = setup('cvSkillS');
        if (sks) {
          const { c, w, h } = sks;
          // Store blade arcs that fly out from spirit
          let bladeArcs = [];
          let lastBladeTime = 0;
          function drawSkS(t) {
            c.clearRect(0, 0, w, h);
            const cx2 = w * 0.35, cy2 = h * 0.5;
            // Ship
            c.fillStyle = '#1a2a45'; c.beginPath(); c.moveTo(cx2, cy2 - 10); c.lineTo(cx2 + 8, cy2 + 2); c.lineTo(cx2 + 6, cy2 + 5); c.lineTo(cx2 - 6, cy2 + 5); c.lineTo(cx2 - 8, cy2 + 2); c.closePath(); c.fill();
            c.strokeStyle = '#38bdf8'; c.lineWidth = 0.6; c.beginPath(); c.moveTo(cx2, cy2 - 10); c.lineTo(cx2 + 8, cy2 + 2); c.lineTo(cx2 + 6, cy2 + 5); c.lineTo(cx2 - 6, cy2 + 5); c.lineTo(cx2 - 8, cy2 + 2); c.closePath(); c.stroke();
            // Spirit orbiting
            const sa = t / 3500;
            const spx = cx2 + Math.cos(sa) * 45, spy = cy2 + Math.sin(sa) * 30;
            // Corona
            c.strokeStyle = 'rgba(255,0,255,0.3)'; c.lineWidth = 1.5; c.beginPath(); c.arc(spx, spy, 14, 0, Math.PI * 2); c.stroke();
            // Petals orbiting
            for (let i = 0; i < 5; i++) {
              const pa = t / 800 + (i / 5) * Math.PI * 2;
              c.fillStyle = 'rgba(255,100,255,0.35)'; c.beginPath(); c.arc(spx + Math.cos(pa) * 11, spy + Math.sin(pa) * 11, 2.5, 0, Math.PI * 2); c.fill();
            }
            // Body gradient
            const sg = c.createRadialGradient(spx, spy, 0, spx, spy, 9);
            sg.addColorStop(0, '#fff'); sg.addColorStop(0.35, '#ff88ff'); sg.addColorStop(0.7, 'magenta'); sg.addColorStop(1, 'purple');
            c.fillStyle = sg; c.beginPath(); c.arc(spx, spy, 9, 0, Math.PI * 2); c.fill();
            c.fillStyle = 'rgba(255,255,255,0.45)'; c.beginPath(); c.ellipse(spx - 2, spy - 2, 2.5, 1.5, -Math.PI / 4, 0, Math.PI * 2); c.fill();
            // Spirit bullets firing upward
            for (let i = 0; i < 3; i++) {
              const bt = ((t / 4 + i * 170) % 600) / 600;
              c.fillStyle = '#ff44aa'; c.globalAlpha = 1 - bt;
              const bAngle = -Math.PI / 2 + (i - 1) * 0.3;
              c.beginPath(); c.arc(spx + Math.cos(bAngle) * bt * 55, spy + Math.sin(bAngle) * bt * 55, 2, 0, Math.PI * 2); c.fill();
            }
            c.globalAlpha = 1;

            // ── BLADE ARC: spirit charges up then slashes, arc flies out ──
            const bladeCycle = 2500; // ms per blade cycle
            const bladePhase = (t % bladeCycle) / bladeCycle; // 0→1

            // Phase 0.0-0.3: charge glow on spirit
            if (bladePhase < 0.3) {
              const chg = bladePhase / 0.3;
              c.strokeStyle = `rgba(136,255,0,${chg * 0.6})`; c.lineWidth = 2 + chg * 2;
              c.beginPath(); c.arc(spx, spy, 12 + chg * 6, 0, Math.PI * 2); c.stroke();
              // Charging particles swirl in
              for (let i = 0; i < 5; i++) {
                const pa = t / 200 + (i / 5) * Math.PI * 2;
                const pd = (1 - chg) * 25 + 5;
                c.fillStyle = `rgba(136,255,0,${chg * 0.7})`;
                c.beginPath(); c.arc(spx + Math.cos(pa) * pd, spy + Math.sin(pa) * pd, 1.5, 0, Math.PI * 2); c.fill();
              }
            }
            // Phase 0.3-0.35: slash flash on spirit
            if (bladePhase >= 0.3 && bladePhase < 0.35) {
              c.fillStyle = 'rgba(200,255,100,0.4)';
              c.beginPath(); c.arc(spx, spy, 20, 0, Math.PI * 2); c.fill();
            }
            // Phase 0.35-0.85: blade arc flies outward from spirit toward top-right
            if (bladePhase >= 0.3 && bladePhase < 0.85) {
              const flyT = (bladePhase - 0.3) / 0.55; // 0→1
              const flyAngle = -Math.PI * 0.35; // fly direction (upper-right)
              const flyDist = flyT * w * 0.45;
              const arcX = spx + Math.cos(flyAngle) * flyDist;
              const arcY = spy + Math.sin(flyAngle) * flyDist;
              const arcAngle = flyAngle; // arc faces direction of travel
              const arcSa = arcAngle - Math.PI / 2;
              const arcEa = arcAngle + Math.PI / 2;
              const arcR = 22 + flyT * 10;
              const arcFade = flyT < 0.2 ? flyT / 0.2 : (flyT > 0.7 ? (1 - flyT) / 0.3 : 1);

              // Outer wide glow
              c.strokeStyle = `rgba(120,255,0,${arcFade * 0.15})`; c.lineWidth = 22;
              c.beginPath(); c.arc(arcX, arcY, arcR, arcSa, arcEa); c.stroke();
              // Main green arc (matching drawBladeArcProjectile)
              c.strokeStyle = `rgba(136,255,0,${arcFade * 0.8})`; c.lineWidth = 4;
              c.beginPath(); c.arc(arcX, arcY, arcR, arcSa, arcEa); c.stroke();
              // Bright inner edge
              c.strokeStyle = `rgba(200,255,150,${arcFade * 0.6})`; c.lineWidth = 1.5;
              c.beginPath(); c.arc(arcX, arcY, arcR - 3, arcSa, arcEa); c.stroke();
              // Energy slash marks
              c.strokeStyle = `rgba(180,255,100,${arcFade * 0.5})`; c.lineWidth = 1;
              for (let i = 0; i < 3; i++) {
                const slA = arcSa + (arcEa - arcSa) * ((i + 1) / 4);
                c.beginPath();
                c.moveTo(arcX + Math.cos(slA) * (arcR - 8), arcY + Math.sin(slA) * (arcR - 8));
                c.lineTo(arcX + Math.cos(slA) * (arcR + 8), arcY + Math.sin(slA) * (arcR + 8));
                c.stroke();
              }
              // Trail particles
              for (let i = 0; i < 4; i++) {
                const tp = Math.max(0, flyT - i * 0.06);
                const tx = spx + Math.cos(flyAngle) * (tp * w * 0.45);
                const ty = spy + Math.sin(flyAngle) * (tp * w * 0.45);
                c.fillStyle = `rgba(136,255,0,${arcFade * (0.4 - i * 0.1)})`;
                c.beginPath(); c.arc(tx, ty, 2 - i * 0.3, 0, Math.PI * 2); c.fill();

              if (p > 0.2 && p < 0.8) {
                const tA = p < 0.5 ? (p - 0.2) * 3.33 : (0.8 - p) * 3.33;
                c.fillStyle = `rgba(255,255,255,${tA * 0.8})`; c.font = 'bold 12px Orbitron, sans-serif'; c.textAlign = 'center';
                c.fillText('ANNIHILATION', shipX + 30, h * 0.2);
                c.fillStyle = `rgba(170,255,255,${tA * 0.7})`; c.font = 'italic 8px monospace';
                c.fillText("— Heaven's Will —", shipX + 30, h * 0.2 + 14);
                c.textAlign = 'left';
              }
            }

            if (isSweeping) {
              const sp = (phase - 0.375) / 0.375; // 0→1
              const currentAngle = -Math.PI + Math.PI * sp;

              // Matrix rain in swept area
              c.save();
              c.beginPath(); c.moveTo(shipX, shipY);
              c.arc(shipX, shipY, radius, -Math.PI, currentAngle); c.closePath(); c.clip();
              // Matrix columns
              const colW = 14;
              const cols = Math.ceil(w / colW) + 1;
              c.font = '9px monospace'; c.textAlign = 'center';
              for (let col = 0; col < cols; col++) {
                const cx2 = col * colW;
                for (let d = 0; d < 3; d++) {
                  const charT = ((t / (110 + col * 5) + d * 0.3 + col * 0.1) % 1);
                  const cy2 = charT * h;
                  const ch = String.fromCharCode(0x30A0 + ((Math.floor(t / 90) + col * 3 + d * 7) % 96));
                  c.fillStyle = d === 0 ? `rgba(200,255,220,${0.7})` : `rgba(0,220,80,${0.35 + 0.2 * Math.sin(charT * Math.PI)})`;
                  c.fillText(ch, cx2, cy2);
                }
              }
              // Hex grid overlay
              c.strokeStyle = 'rgba(0,200,100,0.1)'; c.lineWidth = 0.6;
              const hR = 22;
              const hW = hR * Math.sqrt(3);
              for (let row = -1; row < Math.ceil(h / (hR * 1.5)) + 1; row++) {
                for (let col2 = -1; col2 < Math.ceil(w / hW) + 1; col2++) {
                  const hx = col2 * hW + (row % 2 === 0 ? 0 : hW * 0.5);
                  const hy = row * hR * 1.5;
                  c.beginPath();
                  for (let i = 0; i < 6; i++) {
                    const a = (i / 6) * Math.PI * 2 - Math.PI / 6;
                    i === 0 ? c.moveTo(hx + Math.cos(a) * hR, hy + Math.sin(a) * hR) : c.lineTo(hx + Math.cos(a) * hR, hy + Math.sin(a) * hR);
                  } c.closePath(); c.stroke();
                }
              }
              // Scan line
              c.fillStyle = 'rgba(0,255,120,0.06)'; c.fillRect(0, (t / 3) % h, w, 3);
              c.restore();

              // Sweep blade
              c.save(); c.translate(shipX, shipY); c.rotate(currentAngle);
              // Wide glow cone
              c.fillStyle = 'rgba(0,255,255,0.1)';
              c.beginPath(); c.moveTo(0, 0); c.lineTo(radius, -40); c.lineTo(radius, 40); c.closePath(); c.fill();
              // Cyan flanks
              c.fillStyle = 'rgba(0,255,255,0.5)';
              c.beginPath(); c.moveTo(0, 0); c.lineTo(radius, -25); c.lineTo(radius, 25); c.closePath(); c.fill();
              // White core blade
              c.fillStyle = 'white';
              c.beginPath(); c.moveTo(0, 0); c.lineTo(radius, -7); c.lineTo(radius, 7); c.closePath(); c.fill();
              // Jitter streak
              c.strokeStyle = 'rgba(255,255,255,0.7)'; c.lineWidth = 1;
              c.beginPath(); c.moveTo(0, 0); c.lineTo(radius, (Math.sin(t / 20)) * 10); c.stroke();
              // Sparks on blade edge
              for (let i = 0; i < 5; i++) {
                const dist = 30 + Math.random() * (w - 50);
                const off = (Math.random() - 0.5) * 18;
                c.fillStyle = `rgba(180,255,255,${0.4 + Math.random() * 0.5})`;
                c.beginPath(); c.arc(dist, off, 1 + Math.random() * 1.5, 0, Math.PI * 2); c.fill();
              }
              c.restore();

              // Enemies destroyed on contact
              const fakeEnemies2 = [[w * 0.4, h * 0.3], [w * 0.65, h * 0.25], [w * 0.8, h * 0.45]];
              fakeEnemies2.forEach(([ex, ey]) => {
                const enemyAngle = Math.atan2(ey - shipY, ex - shipX);
                if (enemyAngle < currentAngle) {
                  // Already swept — show explosion remnant
                  const fade = Math.max(0, 1 - (currentAngle - enemyAngle) * 2);
                  c.globalAlpha = fade;
                  c.fillStyle = '#00ffaa'; c.beginPath(); c.arc(ex, ey, 12 * (1 + (1 - fade) * 0.8), 0, Math.PI * 2); c.fill();
                  c.globalAlpha = 1;
                } else {
                  c.fillStyle = '#330808'; c.beginPath(); c.arc(ex, ey, 8, 0, Math.PI * 2); c.fill();
                }
              });
            }

            // Ship (always visible)
            c.save(); c.translate(shipX, shipY);
            c.fillStyle = '#1a2a45'; c.beginPath(); c.moveTo(0, -12); c.lineTo(9, 0); c.lineTo(7, 4); c.lineTo(-7, 4); c.lineTo(-9, 0); c.closePath(); c.fill();
            c.strokeStyle = '#38bdf8'; c.lineWidth = 0.7; c.beginPath(); c.moveTo(0, -12); c.lineTo(9, 0); c.lineTo(7, 4); c.lineTo(-7, 4); c.lineTo(-9, 0); c.closePath(); c.stroke();
            c.restore();

            activeAnimations.push(requestAnimationFrame(() => drawSkF(performance.now())));
          }
          drawSkF(performance.now());
        }
      }
    }
  </script>
  <script>
    // ── Spirit tab switcher ──
    function showSpiritTab(n) {
      document.getElementById('sSpiritPane1').style.display = n === 1 ? 'block' : 'none';
      document.getElementById('sSpiritPane2').style.display = n === 2 ? 'block' : 'none';
      document.getElementById('sTabBtn1').style.background = n === 1 ? 'rgba(255,68,170,0.4)' : 'rgba(255,68,170,0.1)';
      document.getElementById('sTabBtn2').style.background = n === 2 ? 'rgba(0,200,100,0.3)' : 'rgba(0,80,40,0.2)';
      if (n === 2) initPhotokrystosCanvas();
    }

    function initPhotokrystosCanvas() {
      const el = document.getElementById('cvPhotokrystos');
      if (!el || el._inited) return;
      el._inited = true;
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      const rect = el.getBoundingClientRect();
      el.width = rect.width * dpr; el.height = rect.height * dpr;
      const c = el.getContext('2d');
      c.scale(dpr, dpr);
      const w = rect.width, h = rect.height;

      function drawPC(t) {
        c.clearRect(0, 0, w, h);
        c.fillStyle = 'rgba(0,5,10,0.7)'; c.fillRect(0, 0, w, h);

        // 12s cycle: 0-2s summoning, 2-12s combat
        const cycle = 12000, cp = (t % cycle) / cycle;
        const isSummoning = cp < 0.17; // 0-2s
        const summonP = isSummoning ? cp / 0.17 : 1; // 0→1 during summon
        const combatP = isSummoning ? 0 : (cp - 0.17) / 0.83;

        const sx = w * 0.28, sy = h * 0.52, size = 17;
        const tw = t / 1000;
        const enemy = { x: w * 0.78, y: h * 0.3 };
        const enemy2 = { x: w * 0.85, y: h * 0.65 };

        // ── SUMMONING CIRCLE (first 2s) ──
        if (isSummoning) {
          const R = 36 + 6 * (1 - summonP);
          c.save(); c.translate(sx, sy); c.rotate(summonP * Math.PI * 0.5);
          // 8-pointed star (two overlapping squares rotated 45°)
          for (let star = 0; star < 2; star++) {
            c.save(); c.rotate(star * Math.PI / 4);
            c.strokeStyle = `rgba(0,255,136,${0.8 * summonP})`; c.lineWidth = 1.8;
            c.beginPath();
            for (let i = 0; i < 8; i++) {
              const a = (i / 8) * Math.PI * 2;
              const r2 = i % 2 === 0 ? R : R * 0.42;
              i === 0 ? c.moveTo(Math.cos(a) * r2, Math.sin(a) * r2) : c.lineTo(Math.cos(a) * r2, Math.sin(a) * r2);
            }
            c.closePath(); c.stroke();
            // Inner dashed ring
            c.strokeStyle = `rgba(167,255,197,${0.4 * summonP})`; c.lineWidth = 0.8; c.setLineDash([4, 4]);
            c.beginPath(); c.arc(0, 0, R * 0.68, 0, Math.PI * 2); c.stroke(); c.setLineDash([]);
            c.restore();
          }
          // Outer ring with 8 dots
          c.strokeStyle = `rgba(45,255,115,${0.6 * summonP})`; c.lineWidth = 1.2; c.setLineDash([6, 6]);
          c.beginPath(); c.arc(0, 0, R + 12, 0, Math.PI * 2); c.stroke(); c.setLineDash([]);
          for (let i = 0; i < 8; i++) {
            const a = (i / 8) * Math.PI * 2;
            c.fillStyle = `rgba(255,255,255,${0.9 * summonP})`;
            c.beginPath(); c.arc(Math.cos(a) * (R + 12), Math.sin(a) * (R + 12), 2.5, 0, Math.PI * 2); c.fill();
          }
          // Energy convergence lines
          for (let i = 0; i < 8; i++) {
            const a = (i / 8) * Math.PI * 2;
            const dist = (R + 40) * (1 - summonP * 0.8);
            c.strokeStyle = `rgba(45,255,115,${0.3 * summonP})`; c.lineWidth = 0.8;
            c.beginPath(); c.moveTo(Math.cos(a) * dist, Math.sin(a) * dist); c.lineTo(0, 0); c.stroke();
          }
          c.restore();
          // Kanji text
          c.textAlign = 'center'; c.globalAlpha = summonP * 0.9;
          c.font = `bold ${Math.floor(w * 0.06)}px serif`; c.fillStyle = '#ffffff';
          c.fillText('GENESIS RITE', sx, sy - R - 12);
          c.font = `bold ${Math.floor(w * 0.025)}px sans-serif`; c.fillStyle = '#a7ffc5';
          c.fillText('PRIMEVAL CREATION', sx, sy - R + 2);
          c.globalAlpha = 1; c.textAlign = 'left';
        }

        // ── BIRD (hidden during summon, fade in after) ──
        const birdAlpha = isSummoning ? summonP * 0.3 : 1;
        if (birdAlpha > 0.05) {
          c.globalAlpha = birdAlpha;
          const wingFlap = Math.cos(tw * (Math.PI * 2 / 4));
          const wingScale = 0.55 + 0.45 * Math.abs(wingFlap);
          const bodyF = Math.sin(tw * (Math.PI * 2 / 4)) * 2;

          // Tail
          c.save(); c.translate(sx, sy);
          const tg = c.createLinearGradient(0, 0, 0, size * 3);
          tg.addColorStop(0, 'rgba(112,255,170,0.8)'); tg.addColorStop(0.6, 'rgba(25,204,90,0.4)'); tg.addColorStop(1, 'rgba(0,0,0,0)');
          c.fillStyle = tg;
          c.beginPath(); c.moveTo(0, size * 0.8); c.bezierCurveTo(size * 0.3, size * 2, size * 0.4, size * 2.6, 0, size * 3); c.bezierCurveTo(-size * 0.4, size * 2.6, -size * 0.3, size * 2, 0, size * 0.8); c.closePath(); c.fill();
          c.restore();

          // Wings
          for (const side of [-1, 1]) {
            c.save(); c.translate(sx, sy); c.scale(side * wingScale, 1);
            const wg = c.createLinearGradient(-size * 1.8, 0, 0, 0);
            wg.addColorStop(0, `rgba(230,255,240,${0.85 * wingScale})`); wg.addColorStop(0.4, `rgba(77,255,145,${0.65 * wingScale})`); wg.addColorStop(1, 'rgba(0,102,42,0.1)');
            c.fillStyle = wg;
            c.beginPath(); c.moveTo(-size * 0.2, -size * 0.3); c.bezierCurveTo(-size * 1.3, -size * 0.8, -size * 2, -size * 0.3, -size * 2, size * 0.6); c.bezierCurveTo(-size * 1.1, size * 0.8, -size * 0.4, size * 0.5, -size * 0.1, size * 0.2); c.closePath(); c.fill();
            c.strokeStyle = `rgba(167,255,197,${0.6 * wingScale})`; c.lineWidth = 1.8;
            c.beginPath(); c.moveTo(-size * 0.2, -size * 0.3); c.bezierCurveTo(-size * 1, -size * 0.5, -size * 1.5, size * 0.1, -size * 1.8, size * 0.5); c.stroke();
            c.restore();
          }

          // Crystal body
          c.save(); c.translate(sx, sy + bodyF);
          const cg = c.createRadialGradient(0, 0, 0, 0, 0, size);
          cg.addColorStop(0, 'rgba(255,255,255,1)'); cg.addColorStop(0.3, 'rgba(167,255,197,0.9)'); cg.addColorStop(0.7, 'rgba(45,255,115,0.4)'); cg.addColorStop(1, 'rgba(0,0,0,0)');
          c.fillStyle = cg; c.beginPath(); c.arc(0, 0, size, 0, Math.PI * 2); c.fill();
          const bg = c.createRadialGradient(-size * 0.2, -size * 0.3, 0, 0, 0, size * 0.88);
          bg.addColorStop(0, '#ccffe0'); bg.addColorStop(0.5, '#4dff91'); bg.addColorStop(1, 'rgba(0,40,16,0.2)');
          c.fillStyle = bg;
          const pts = [[0, -size * 0.88], [size * 0.33, -size * 0.44], [size * 0.33, size * 0.44], [0, size * 0.88], [-size * 0.33, size * 0.44], [-size * 0.33, -size * 0.44]];
          pts.forEach((p, i) => i === 0 ? c.moveTo(p[0], p[1]) : c.lineTo(p[0], p[1])); c.closePath(); c.fill();
          c.fillStyle = '#ffffff';
          c.beginPath(); c.moveTo(0, -size * 1.08); c.lineTo(size * 0.2, -size * 0.88); c.lineTo(0, -size * 0.7); c.lineTo(-size * 0.2, -size * 0.88); c.closePath(); c.fill();
          c.restore();
          c.globalAlpha = 1;
        }

        // ── COMBAT DEMO (after summon) ──
        if (!isSummoning) {
          // Enemy targets
          [enemy, enemy2].forEach(e => {
            c.fillStyle = '#220808'; c.beginPath(); c.arc(e.x, e.y, 9, 0, Math.PI * 2); c.fill();
            c.strokeStyle = '#661111'; c.lineWidth = 1; c.stroke();
          });

          // Normal attack bullets (3 per volley)
          const shotCycle = 1200, shotP = (t % shotCycle) / shotCycle;
          if (shotP < 0.5) {
            const bf = shotP / 0.5;
            // Homing bullet (cyan, tracks enemy)
            const hx = sx + (enemy.x - sx) * bf, hy = sy + (enemy.y - sy) * bf;
            const hg = c.createRadialGradient(hx, hy, 0, hx, hy, 6);
            hg.addColorStop(0, '#fff'); hg.addColorStop(0.4, '#00ffff'); hg.addColorStop(1, 'rgba(0,80,200,0.3)');
            c.fillStyle = hg; c.beginPath(); c.arc(hx, hy, 6, 0, Math.PI * 2); c.fill();
            // 2 directional bullets (spread)
            for (const spr of [-0.22, 0.22]) {
              const a = Math.atan2(enemy.y - sy, enemy.x - sx) + spr;
              const dx2 = sx + Math.cos(a) * (enemy.x - sx) * bf * 1.1, dy2 = sy + Math.sin(a) * (enemy.y - sy) * bf * 1.1;
              c.fillStyle = 'rgba(100,255,180,0.85)'; c.beginPath(); c.arc(dx2, dy2, 4, 0, Math.PI * 2); c.fill();
            }
          }

          // 2 Boomerangs every 6 volleys — demo every 4s
          const brangCycle = 4000, brangP = (t % brangCycle) / brangCycle;
          if (brangP > 0.5 && brangP < 0.9) {
            const bp = (brangP - 0.5) / 0.4;
            // Boomerang 1: sx → enemy → enemy2
            const b1x = bp < 0.5 ? sx + (enemy.x - sx) * (bp * 2) : enemy.x + (enemy2.x - enemy.x) * ((bp - 0.5) * 2);
            const b1y = bp < 0.5 ? sy + (enemy.y - sy) * (bp * 2) : enemy.y + (enemy2.y - enemy.y) * ((bp - 0.5) * 2);
            // Boomerang 2: slightly offset start, different target order
            const b2x = bp < 0.5 ? sx + 5 + (enemy2.x - sx - 5) * (bp * 2) : enemy2.x + (enemy.x - enemy2.x) * ((bp - 0.5) * 2);
            const b2y = bp < 0.5 ? sy - 5 + (enemy2.y - sy + 5) * (bp * 2) : enemy2.y + (enemy.y - enemy2.y) * ((bp - 0.5) * 2);
            for (const [bx, by] of [[b1x, b1y], [b2x, b2y]]) {
              c.save(); c.translate(bx, by); c.rotate(t / 180);
              c.strokeStyle = 'rgba(167,255,197,0.9)'; c.lineWidth = 3;
              c.beginPath(); c.arc(0, 0, 14, -Math.PI / 2, Math.PI / 2); c.stroke();
              c.strokeStyle = 'rgba(255,255,230,0.5)'; c.lineWidth = 1;
              c.beginPath(); c.arc(0, 0, 12, -Math.PI / 2, Math.PI / 2); c.stroke();
              // Sparkles
              for (let i = 0; i < 4; i++) {
                const a = -Math.PI / 2 + (Math.PI / 3) * i;
                c.fillStyle = `rgba(167,255,197,${0.5 + 0.5 * Math.sin(t / 100 + i)})`;
                c.beginPath(); c.arc(Math.cos(a) * 14, Math.sin(a) * 14, 1.5, 0, Math.PI * 2); c.fill();
              }
              c.restore();
            }
          }
        }

        // Labels
        c.textAlign = 'left'; c.font = 'bold 7px Orbitron, sans-serif';
        c.fillStyle = isSummoning ? '#00ff88' : '#00cc66';
        c.fillText(isSummoning ? 'SUMMONING CIRCLE' : 'PHŌTOKRYSTOS', w * 0.5, h * 0.1);
        if (!isSummoning) {
          c.fillStyle = '#8899bb'; c.font = '6.5px Share Tech Mono, monospace';
          c.fillText('3 bullets/volley @ 52ms', w * 0.5, h * 0.1 + 12);
          c.fillStyle = '#00cc66'; c.font = 'bold 7px Orbitron, sans-serif';
          c.fillText('2 boomerangs / 6 volleys', w * 0.5, h * 0.1 + 26);
          c.fillStyle = '#8899bb'; c.font = '6.5px Share Tech Mono, monospace';
          c.fillText('Back to Motherland @37s', w * 0.5, h * 0.1 + 39);
          c.fillText('Danger? Not Today! (auto)', w * 0.5, h * 0.1 + 52);
        }

        activeAnimations.push(requestAnimationFrame(() => drawPC(performance.now())));
      }
      drawPC(performance.now());
    }
  </script>
