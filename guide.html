<!DOCTYPE html>
<!--
  guide.html

  Standalone reference page for game mechanics, skill info, and enemy data.
  Zero game engine code loads here. Nothing is shared with the js folder.

  Tab navigation is pure HTML, CSS, and JS with no framework. Each tab renders
  skill stats or enemy info next to a live canvas demo. Every demo runs its own
  requestAnimationFrame loop that is entirely local to this file.

  All mini animations are drawn with Canvas 2D from scratch. They show how
  skills and enemies behave visually without reusing any engine code. CSS vars
  at the top (--cyan, --purple, --gold etc) keep the neon color palette
  consistent across all sections.

  Visiting this page auto-pauses the main game bc input.js listens to the
  document visibilitychange event and sets gamePaused to true whenever the
  tab goes hidden.
-->
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pisces: Space Journey — General Guide</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;500;600;700&family=Share+Tech+Mono&family=Cinzel:wght@400;700;900&display=swap');

    :root {
      --bg: #03030f;
      --panel: rgba(8, 12, 28, 0.96);
      --card: rgba(12, 18, 40, 0.85);
      --glow: rgba(0, 200, 255, 0.25);
      --cyan: #00e5ff;
      --purple: #a855f7;
      --magenta: #ff00ff;
      --gold: #ffd700;
      --red: #ff4444;
      --green: #22c55e;
      --blue: #3b82f6;
      --txt: #e8edf5;
      --dim: #8899bb
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box
    }

    body {
      background: var(--bg);
      color: var(--txt);
      font-family: 'Rajdhani', sans-serif;
      overflow: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column
    }

    #guideBtn {
      display: none
    }

    #guideOverlay {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    #guideModal {
      width: 100%;
      height: 100%;
      background: var(--panel);
      border: none;
      border-radius: 0;
      overflow: hidden;
      display: flex;
      flex-direction: column
    }

    .guide-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 22px;
      border-bottom: 1px solid rgba(0, 200, 255, 0.12);
      background: linear-gradient(180deg, rgba(0, 40, 80, 0.3), transparent);
      flex-shrink: 0
    }

    .guide-header h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: 18px;
      font-weight: 900;
      letter-spacing: 3px;
      background: linear-gradient(135deg, #00e5ff, #a855f7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent
    }

    .guide-header .sub {
      font-family: 'Share Tech Mono', monospace;
      font-size: 10px;
      color: var(--dim);
      margin-top: 1px
    }

    #closeBtn {
      display: none
    }

    .tab-nav {
      display: flex;
      gap: 0;
      padding: 0 14px;
      border-bottom: 1px solid rgba(0, 200, 255, 0.08);
      overflow-x: auto;
      flex-shrink: 0;
      scrollbar-width: none
    }

    .tab-nav::-webkit-scrollbar {
      display: none
    }

    .tab-btn {
      padding: 9px 14px;
      font-family: 'Rajdhani', sans-serif;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--dim);
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      cursor: pointer;
      white-space: nowrap;
      transition: all .25s
    }

    .tab-btn:hover {
      color: var(--cyan)
    }

    .tab-btn.active {
      color: var(--cyan);
      border-bottom-color: var(--cyan);
      text-shadow: 0 0 12px rgba(0, 229, 255, 0.5)
    }

    .guide-body {
      flex: 1;
      overflow-y: auto;
      padding: 18px 22px 30px;
      scroll-behavior: smooth
    }

    .guide-body::-webkit-scrollbar {
      width: 5px
    }

    .guide-body::-webkit-scrollbar-track {
      background: transparent
    }

    .guide-body::-webkit-scrollbar-thumb {
      background: rgba(0, 200, 255, 0.2);
      border-radius: 4px
    }

    .tab-content {
      display: none
    }

    .tab-content.active {
      display: block;
      animation: fadeIn .3s ease
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px)
      }

      to {
        opacity: 1;
        transform: translateY(0)
      }
    }

    .card {
      background: var(--card);
      border: 1px solid rgba(0, 200, 255, 0.1);
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 14px;
      transition: border-color .3s
    }

    .card:hover {
      border-color: rgba(0, 200, 255, 0.25)
    }

    .card h2 {
      font-family: 'Orbitron', sans-serif;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 2px;
      margin-bottom: 3px
    }

    .card .sub {
      font-family: 'Share Tech Mono', monospace;
      font-size: 10px;
      color: var(--dim);
      margin-bottom: 10px
    }

    .card p,
    .card li {
      font-size: 13.5px;
      line-height: 1.6
    }

    .card ul {
      list-style: none;
      padding: 0
    }

    .card li::before {
      content: '▸';
      color: var(--cyan);
      margin-right: 7px;
      font-weight: bold
    }

    .card li {
      margin-bottom: 5px
    }

    .hi {
      color: var(--cyan);
      font-weight: 600
    }

    .hp {
      color: var(--purple);
      font-weight: 600
    }

    .hg {
      color: var(--gold);
      font-weight: 600
    }

    .hr {
      color: var(--red);
      font-weight: 600
    }

    .hgr {
      color: var(--green);
      font-weight: 600
    }

    .dmg {
      color: #ff8844;
      font-weight: 600
    }

    .key {
      display: inline-block;
      padding: 1px 7px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 4px;
      font-family: 'Share Tech Mono', monospace;
      font-size: 11px;
      color: #fff;
      vertical-align: middle
    }

    .cd {
      display: inline-block;
      padding: 1px 6px;
      background: rgba(255, 100, 0, 0.12);
      border: 1px solid rgba(255, 100, 0, 0.3);
      border-radius: 4px;
      font-family: 'Share Tech Mono', monospace;
      font-size: 10px;
      color: #ff8844;
      margin-left: 4px
    }

    .ab {
      width: 100%;
      height: 150px;
      background: rgba(0, 5, 15, 0.6);
      border: 1px solid rgba(0, 200, 255, 0.08);
      border-radius: 10px;
      margin: 10px 0;
      overflow: hidden
    }

    .ab svg {
      width: 100%;
      height: 100%
    }

    .controls-table {
      width: 100%;
      border-collapse: collapse;
      margin: 6px 0
    }

    .controls-table th,
    .controls-table td {
      padding: 6px 10px;
      text-align: left;
      font-size: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04)
    }

    .controls-table th {
      font-family: 'Orbitron', sans-serif;
      font-size: 9px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--dim)
    }

    @keyframes spin {
      to {
        transform: rotate(360deg)
      }
    }

    @keyframes spinR {
      to {
        transform: rotate(-360deg)
      }
    }

    .dsname {
      font-family: 'Cinzel', 'Palatino Linotype', serif;
      letter-spacing: 2px;
    }

    .dsclass {
      font-family: 'Cinzel', serif;
      font-size: 9px;
      letter-spacing: 3px;
      opacity: 0.75;
    }

    /* Scroll-reveal */
    .card {
      opacity: 0;
      transform: translateY(18px);
      transition: opacity .45s ease, transform .45s ease, border-color .3s
    }

    .card.visible {
      opacity: 1;
      transform: translateY(0)
    }

    .guide-body:not(.shortened) .det-short { display: none }
    .guide-body.shortened .det-full { display: none }

    .tog-btn {
      margin-left: auto;
      padding: 6px 12px;
      font-family: 'Rajdhani', sans-serif;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--dim);
      background: rgba(0,200,255,0.06);
      border: 1px solid rgba(0,200,255,0.15);
      border-radius: 4px;
      cursor: pointer;
      align-self: center;
      white-space: nowrap;
      transition: all .2s
    }
    .tog-btn:hover { color: var(--cyan); border-color: rgba(0,200,255,0.4) }
    .tog-btn.shortened { color: #ffcc44; border-color: rgba(255,200,0,0.4); background: rgba(255,180,0,0.06) }
  </style>
</head>

    function showTab(name) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === name));
      G.innerHTML = '<div class="tab-content active">' + TABS[name] + '</div>';
      requestAnimationFrame(() => { attachScrollReveal(); requestAnimationFrame(() => initCanvases(name)); });
    }

    // ── Scroll-reveal via IntersectionObserver ──
    function attachScrollReveal() {
      const obs = new IntersectionObserver((entries) => {
        entries.forEach(e => {
          if (e.isIntersecting) {
            e.target.classList.add('visible');
            obs.unobserve(e.target);
          }
        });
      }, { threshold: 0.08 });
      document.querySelectorAll('.card').forEach(c => { c.classList.remove('visible'); obs.observe(c); });
    }

    showTab('basics');
    document.querySelectorAll('.tab-btn').forEach(b => b.addEventListener('click', () => { showTab(b.dataset.tab); G.scrollTop = 0; }));

    const _togBtn = document.getElementById('togDetail');
    _togBtn.addEventListener('click', () => {
      const isShort = G.classList.toggle('shortened');
      _togBtn.textContent = isShort ? 'Shortened' : 'Detailed';
      _togBtn.classList.toggle('shortened', isShort);
    });

    // ── Open/Close ──
    const ov = document.getElementById('guideOverlay');
    // guide is always open in iframe mode
    function closeG() { if (window.parent && window.parent !== window) window.parent.closeGuide(); }
    // closeBtn hidden
    ov.addEventListener('click', e => { if (e.target === ov) closeG(); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape' && ov.classList.contains('open')) closeG(); });

    // ══════════ CANVAS ANIMATIONS (accurate to render.js) ══════════
    let activeAnimations = [];
    function initCanvases(tab) {
      activeAnimations.forEach(id => cancelAnimationFrame(id));
      activeAnimations = [];

      const dpr = Math.min(window.devicePixelRatio || 1, 2);

      function setup(id) {
        const el = document.getElementById(id);
        if (!el) return null;
        const r = el.getBoundingClientRect();
        el.width = r.width * dpr; el.height = r.height * dpr;
        const c = el.getContext('2d');
        c.scale(dpr, dpr);
        return { c, w: r.width, h: r.height };
      }

      // ── PLAYER SHIP ──
      if (tab === 'basics') {
        const s = setup('cvShip');
        if (s) {
          const { c, w, h } = s;
          function drawShipAnim(t) {
            c.clearRect(0, 0, w, h);
            // Stars
            for (let i = 0; i < 40; i++) {
              const sx = (i * 97.3 + t * 0.01 * (i % 3 + 1)) % w;
              const sy = (i * 53.7) % h;
              c.fillStyle = i % 4 === 0 ? '#00e5ff' : '#fff';
              c.globalAlpha = 0.1 + 0.1 * Math.sin(t / 500 + i);
              c.beginPath(); c.arc(sx, sy, 0.6, 0, Math.PI * 2); c.fill();
            }
            c.globalAlpha = 1;

            const cx = w * 0.33, cy = h * 0.52;
            c.save(); c.translate(cx, cy);
            // Exhaust
            const fh = 12 + Math.sin(t / 60) * 6;
            const eg = c.createRadialGradient(0, 30, 0, 0, 36, 14);
            eg.addColorStop(0, 'rgba(0,180,255,0.3)'); eg.addColorStop(1, 'transparent');
            c.fillStyle = eg; c.fillRect(-14, 24, 28, 24);
            // Flames
            c.fillStyle = '#00b4ff'; c.globalAlpha = 0.6;
            c.beginPath(); c.moveTo(-8, 27); c.lineTo(-4, 27); c.lineTo(-6, 27 + fh); c.closePath(); c.fill();
            c.beginPath(); c.moveTo(4, 27); c.lineTo(8, 27); c.lineTo(6, 27 + fh); c.closePath(); c.fill();
            c.globalAlpha = 1;
            // Hull
            c.fillStyle = '#0a1428';
            c.beginPath(); c.moveTo(0, 0); c.lineTo(24, 12); c.lineTo(24, 20); c.lineTo(10, 16); c.lineTo(-10, 16); c.lineTo(-24, 20); c.lineTo(-24, 12); c.closePath(); c.fill();
            // Wings
            const wg = c.createLinearGradient(0, -10, 0, 20);
            wg.addColorStop(0, '#1e3a5f'); wg.addColorStop(0.5, '#162d4a'); wg.addColorStop(1, '#0d1f33');
            c.fillStyle = wg;
            c.beginPath(); c.moveTo(0, -10); c.lineTo(28, 10); c.lineTo(26, 16); c.lineTo(8, 12); c.lineTo(-8, 12); c.lineTo(-26, 16); c.lineTo(-28, 10); c.closePath(); c.fill();
            c.strokeStyle = '#38bdf8'; c.lineWidth = 1;
            c.beginPath(); c.moveTo(0, -10); c.lineTo(28, 10); c.lineTo(26, 16); c.lineTo(8, 12); c.lineTo(-8, 12); c.lineTo(-26, 16); c.lineTo(-28, 10); c.closePath(); c.stroke();
            c.fillStyle = '#0ea5e9'; c.fillRect(22, 14, 5, 3); c.fillRect(-27, 14, 5, 3);
            // Fuselage
            const bg = c.createLinearGradient(-12, -26, 12, 22);
            bg.addColorStop(0, '#dde8f0'); bg.addColorStop(0.3, '#b0c8dc'); bg.addColorStop(0.7, '#7a9ab8'); bg.addColorStop(1, '#4a6a88');
            c.fillStyle = bg;
            c.beginPath(); c.moveTo(0, -26); c.lineTo(8, -8); c.lineTo(12, 18); c.lineTo(6, 22); c.lineTo(-6, 22); c.lineTo(-12, 18); c.lineTo(-8, -8); c.closePath(); c.fill();
            c.strokeStyle = '#0284c7'; c.lineWidth = 1;
            c.beginPath(); c.moveTo(0, -26); c.lineTo(8, -8); c.lineTo(12, 18); c.lineTo(6, 22); c.lineTo(-6, 22); c.lineTo(-12, 18); c.lineTo(-8, -8); c.closePath(); c.stroke();
            // Ribs
            c.strokeStyle = 'rgba(2,132,199,0.4)'; c.lineWidth = 0.7;
            [[-5, -12, 5, -12], [-7, -2, 7, -2], [-9, 8, 9, 8]].forEach(l => { c.beginPath(); c.moveTo(l[0], l[1]); c.lineTo(l[2], l[3]); c.stroke(); });
            // Cockpit
            c.fillStyle = '#0369a1';
            c.beginPath(); c.moveTo(0, -13); c.lineTo(8, 4); c.lineTo(8, 14); c.lineTo(-8, 14); c.lineTo(-8, 4); c.closePath(); c.fill();
            const gg = c.createLinearGradient(-7, -13, 7, 14);
            gg.addColorStop(0, '#67e8f9'); gg.addColorStop(0.4, '#0ea5e9'); gg.addColorStop(1, '#0c4a6e');
            c.fillStyle = gg;
            c.beginPath(); c.moveTo(0, -12); c.lineTo(7, 4); c.lineTo(7, 13); c.lineTo(-7, 13); c.lineTo(-7, 4); c.closePath(); c.fill();
            c.fillStyle = 'rgba(255,255,255,0.45)';
            c.beginPath(); c.moveTo(-5, -10); c.lineTo(-3, -10); c.lineTo(-5, 10); c.lineTo(-6, 10); c.closePath(); c.fill();
            // Nose
            c.fillStyle = '#e2e8f0';
            c.beginPath(); c.moveTo(0, -26); c.lineTo(3, -16); c.lineTo(-3, -16); c.closePath(); c.fill();
            // Thrusters
            c.fillStyle = '#1e293b'; c.fillRect(-9, 21, 6, 6); c.fillRect(3, 21, 6, 6);
            // Hitbox
            const hr = 3 + Math.sin(t / 300) * 0.8;
            c.fillStyle = '#00e5ff'; c.beginPath(); c.arc(0, 0, hr, 0, Math.PI * 2); c.fill();
            c.strokeStyle = 'rgba(0,229,255,0.25)'; c.lineWidth = 0.5;
            c.beginPath(); c.arc(0, 0, hr + 4 + Math.sin(t / 500) * 2, 0, Math.PI * 2); c.stroke();
            c.restore();
            // Auto-fire: 5 bullets SIMULTANEOUSLY in 45° fan spread
            // Wave repeats: all 5 appear at same distance, fly out together
            const spreadAngle = Math.PI / 4; // 45°
            const baseAngle = -Math.PI / 2;  // straight up
            const numB = 5;
            const wavePeriod = 800; // ms between volleys
            const bulletSpeed = 0.12; // distance per ms
            // Multiple volleys visible at once
            for (let v = 0; v < 3; v++) {
              const waveAge = ((t + v * wavePeriod / 3) % wavePeriod); // ms since this volley fired
              const dist = waveAge * bulletSpeed;
              const alpha = Math.max(0, 1 - dist / (h * 0.6));
              if (alpha <= 0) continue;
              c.globalAlpha = alpha;
              for (let i = 0; i < numB; i++) {
                const angle = baseAngle + (-spreadAngle / 2) + (i * spreadAngle / (numB - 1));
                const bx = cx + Math.cos(angle) * dist;
                const by = cy + Math.sin(angle) * dist;
                const br = 3;
                // Outer glow
                c.fillStyle = 'rgba(160,80,255,0.15)';
                c.beginPath(); c.arc(bx, by, br * 1.4, 0, Math.PI * 2); c.fill();
                // Main body gradient (matching drawBullet player_auto)
                const pg = c.createRadialGradient(bx - br * 0.2, by - br * 0.2, 0, bx, by, br);
                pg.addColorStop(0, '#ffffff'); pg.addColorStop(0.3, '#cc88ff');
                pg.addColorStop(0.7, '#7700cc'); pg.addColorStop(1, 'rgba(40,0,80,0.5)');
                c.fillStyle = pg;
                c.beginPath(); c.arc(bx, by, br, 0, Math.PI * 2); c.fill();
                // Glint
                c.fillStyle = 'rgba(240,200,255,0.45)';
                c.beginPath(); c.ellipse(bx - br * 0.2, by - br * 0.2, br * 0.22, br * 0.13, -0.8, 0, Math.PI * 2); c.fill();
              }
            }
            c.globalAlpha = 1;
            // Labels
            c.fillStyle = '#00e5ff'; c.font = '9px Share Tech Mono, monospace';
            c.fillText('← HITBOX (cyan dot)', cx + 28, cy + 2);
            c.fillStyle = 'rgba(0,229,255,0.5)'; c.font = '8px Share Tech Mono, monospace';
            c.fillText('Auto-fire: 5 bullets / 170ms', w * 0.55, h * 0.55);
            c.fillText('45° fan spread', w * 0.55, h * 0.55 + 14);
            c.fillText('Each: 55 base + 0.9% EP', w * 0.55, h * 0.55 + 28);
            c.fillText('28% chance Vulnerability', w * 0.55, h * 0.55 + 42);

            activeAnimations.push(requestAnimationFrame(() => drawShipAnim(performance.now())));
          }
          drawShipAnim(performance.now());
        }
      }

      // ── SENTINELS ──
      if (tab === 'passives') {
        const s = setup('cvSentinels');
        if (s) {
          const { c, w, h } = s;
          function drawSents(t) {
            c.clearRect(0, 0, w, h);
            const tiers = [
              { x: w * 0.18, color: '#00FFFF', label: 'CYAN 1-4', sub: '+30% HP, +10% spd', speed: 5000 },
              { x: w * 0.48, color: '#FF00FF', label: 'MAGENTA 5-11', sub: 'Vanguard Network', speed: 4000 },
              { x: w * 0.78, color: '#FFD700', label: 'GOLD ×12', sub: 'All = Special Shot', speed: 3000 }
            ];
            tiers.forEach(tier => {
              const cy2 = h * 0.45, r = 14;
              // Orbit ring
              c.save(); c.translate(tier.x, cy2); c.rotate(t / tier.speed);
              c.strokeStyle = tier.color + '88'; c.lineWidth = 0.8; c.setLineDash([5, 7]);
              c.beginPath(); c.arc(0, 0, r + 6, 0, Math.PI * 2); c.stroke(); c.setLineDash([]);
              c.restore();
              // Body
              const bg = c.createRadialGradient(tier.x, cy2, 0, tier.x, cy2, r);
              bg.addColorStop(0, '#fff'); bg.addColorStop(0.35, '#ccc'); bg.addColorStop(0.75, '#888'); bg.addColorStop(1, '#444');
              c.fillStyle = bg; c.beginPath(); c.arc(tier.x, cy2, r, 0, Math.PI * 2); c.fill();
              c.strokeStyle = tier.color; c.lineWidth = 1.5; c.beginPath(); c.arc(tier.x, cy2, r, 0, Math.PI * 2); c.stroke();
              // Core
              const cg = c.createRadialGradient(tier.x, cy2, 0, tier.x, cy2, 5);
              cg.addColorStop(0, '#fff'); cg.addColorStop(0.5, tier.color); cg.addColorStop(1, tier.color + '44');
              c.fillStyle = cg; c.beginPath(); c.arc(tier.x, cy2, 5, 0, Math.PI * 2); c.fill();
              // Panel lines
              c.strokeStyle = tier.color + '66'; c.lineWidth = 0.8;
              c.beginPath(); c.moveTo(tier.x - 6, cy2 - 3.5); c.lineTo(tier.x - 6, cy2 + 3.5); c.stroke();
              c.beginPath(); c.moveTo(tier.x + 6, cy2 - 3.5); c.lineTo(tier.x + 6, cy2 + 3.5); c.stroke();
              // Gun arm
              c.save(); c.translate(tier.x, cy2); c.rotate(t / (tier.speed * 0.8));
              c.fillStyle = '#3a3a3a'; c.fillRect(7, -3.5, 9, 7);
              c.fillStyle = '#666'; c.fillRect(7, -3.5, 2.7, 7);
              c.strokeStyle = '#888'; c.lineWidth = 0.5; c.strokeRect(7, -3.5, 9, 7);
              c.fillStyle = tier.color; c.fillRect(14, -1.5, 3, 3);
              c.restore();
              // Labels
              c.fillStyle = tier.color; c.font = 'bold 8px Share Tech Mono, monospace'; c.textAlign = 'center';
              c.fillText(tier.label, tier.x, cy2 + r + 16);
              c.fillStyle = tier.color + '88'; c.font = '7px Share Tech Mono, monospace';
              c.fillText(tier.sub, tier.x, cy2 + r + 26);
              c.textAlign = 'left';
            });
            // Vanguard thread
            c.strokeStyle = '#FF00FF44'; c.lineWidth = 0.6; c.setLineDash([3, 4]);
            c.globalAlpha = 0.3 + 0.3 * Math.sin(t / 800);
            c.beginPath(); c.moveTo(w * 0.18, h * 0.45); c.lineTo(w * 0.48, h * 0.45); c.lineTo(w * 0.78, h * 0.45); c.stroke();
            c.setLineDash([]); c.globalAlpha = 1;
            activeAnimations.push(requestAnimationFrame(() => drawSents(performance.now())));
          }
          drawSents(performance.now());
        }

        // ── VULNERABILITY ──
        const sv = setup('cvVuln');
        if (sv) {
          const { c, w, h } = sv;
          function drawVuln(t) {
            c.clearRect(0, 0, w, h);
            const ex = w * 0.3, ey = h * 0.45;
            // Enemy
            const eg = c.createRadialGradient(ex - 4, ey - 4, 0, ex, ey, 18);
            eg.addColorStop(0, '#fff'); eg.addColorStop(0.28, 'hsl(35,100%,58%)'); eg.addColorStop(0.72, 'hsl(35,90%,20%)'); eg.addColorStop(1, 'rgba(30,0,0,0.85)');
            c.fillStyle = eg; c.beginPath(); c.arc(ex, ey, 18, 0, Math.PI * 2); c.fill();
            c.strokeStyle = 'rgba(255,60,20,0.7)'; c.lineWidth = 0.8; c.beginPath(); c.arc(ex, ey, 18, 0, Math.PI * 2); c.stroke();
            // Broken heart icon above enemy (matches render.js exactly) + stack number bottom-right
            const stackCount = Math.min(4, Math.floor(((t % 4000) / 4000) * 5));
            if (stackCount > 0) {
              c.save();
              c.translate(ex, ey - 34);
              const R2 = 10;
              const pulse = 0.7 + 0.3 * Math.sin(t / 200);

              // Outer ring
              c.strokeStyle = `rgba(255,26,64,${pulse})`; c.lineWidth = 1.5;
              c.beginPath(); c.arc(0, 0, R2, 0, Math.PI * 2); c.stroke();
              // LED dots
              c.fillStyle = `rgba(255,26,64,${pulse})`;
              c.beginPath(); c.arc(0, -R2 + 2, 2, 0, Math.PI * 2); c.fill();
              c.beginPath(); c.arc(0, R2 - 2, 2, 0, Math.PI * 2); c.fill();

              // Broken heart — two halves offset
              function drawHalf(left) {
                c.save();
                c.beginPath();
                if (left) c.rect(-R2, -R2, R2 * 0.9, R2 * 2);
                else c.rect(-R2 * 0.1, -R2, R2 * 1.1, R2 * 2);
                c.clip();
                c.translate(left ? -1.5 : 1.5, left ? -1 : 1);
                const s = 0.45;
                c.beginPath();
                c.moveTo(0, 2 * s); c.bezierCurveTo(-8 * s, -2 * s, -10 * s, -8 * s, 0, -8 * s);
                c.bezierCurveTo(10 * s, -8 * s, 8 * s, -2 * s, 0, 2 * s);
                c.bezierCurveTo(-4 * s, 5 * s, -8 * s, 7 * s, 0, 11 * s);
                c.bezierCurveTo(8 * s, 7 * s, 4 * s, 5 * s, 0, 2 * s); c.closePath();
                const hg = c.createRadialGradient(-1, -2, 0, 0, 0, 9 * s);
                hg.addColorStop(0, '#3a2a2e'); hg.addColorStop(0.5, '#2a1c20'); hg.addColorStop(1, '#150a0c');
                c.fillStyle = hg; c.fill();
                // Crack line
                c.strokeStyle = left ? '#ff1a40' : 'rgba(255,100,80,0.6)';
                c.lineWidth = left ? 1.5 : 0.8;
                c.beginPath(); c.moveTo(0, -9 * s); c.lineTo(0, 11 * s); c.stroke();
                c.restore();
              }
              drawHalf(true); drawHalf(false);

              // X neon slash
              const xp = 0.7 + 0.3 * Math.sin(t / 120);
              c.save(); c.rotate(-Math.PI / 4); c.strokeStyle = '#ff1a40'; c.lineWidth = 2 * xp; c.lineCap = 'round';
              c.beginPath(); c.moveTo(-R2 * 0.8, 0); c.lineTo(R2 * 0.8, 0); c.stroke(); c.restore();
              c.save(); c.rotate(Math.PI / 4); c.strokeStyle = '#ff1a40'; c.lineWidth = 1.5 * xp;
              c.beginPath(); c.moveTo(-R2 * 0.6, 0); c.lineTo(R2 * 0.6, 0); c.stroke(); c.restore();

              // Stack number — bottom right of icon
              c.fillStyle = '#ff1a40';
              c.font = `bold 9px Orbitron, sans-serif`; c.textAlign = 'left';
              c.fillText(stackCount, R2 * 0.5, R2 + 2);

              c.restore();
            }
            // Shield bar
            const sw = 45, phase = (t / 4000) % 1;
            c.fillStyle = '#224488'; c.fillRect(ex - sw / 2, ey + 24, sw, 5);
            c.fillStyle = '#3366aa'; c.fillRect(ex - sw / 2, ey + 24, sw * (1 - phase * 0.7), 5);
            c.strokeStyle = '#4488cc'; c.lineWidth = 0.5; c.strokeRect(ex - sw / 2, ey + 24, sw, 5);
            c.fillStyle = '#4488cc88'; c.font = '7px Share Tech Mono, monospace';
            c.fillText('SHIELD SHRED', ex, ey + 42);
            // Info
            c.textAlign = 'left'; c.fillStyle = '#ff6666'; c.font = 'bold 13px Orbitron, sans-serif';
            c.globalAlpha = 0.6 + 0.4 * Math.sin(t / 700);
            c.fillText('+64% DMG', w * 0.58, h * 0.35);
            c.globalAlpha = 1;
            c.fillStyle = '#ff444488'; c.font = '8px Share Tech Mono, monospace';
            c.fillText('at 4 stacks', w * 0.58, h * 0.35 + 14);
            c.fillStyle = '#ff2200'; c.fillText('MAX → TRUE DMG 2s', w * 0.58, h * 0.35 + 30);
            c.fillStyle = '#ff884488'; c.fillText('Auto 28% | Others 15%', w * 0.58, h * 0.35 + 46);
            c.textAlign = 'left';
            activeAnimations.push(requestAnimationFrame(() => drawVuln(performance.now())));
          }
          drawVuln(performance.now());
        }

        // ── GLORY ──
        const sg = setup('cvGlory');
        if (sg) {
          const { c, w, h } = sg;
          function drawGlory(t) {
            c.clearRect(0, 0, w, h);
            // Dark bg
            c.fillStyle = 'rgba(0,5,15,0.6)'; c.fillRect(0, 0, w, h);

            const enemies = [{ x: w * 0.08, y: h * 0.38 }, { x: w * 0.25, y: h * 0.25 }, { x: w * 0.44, y: h * 0.42 }, { x: w * 0.63, y: h * 0.28 }, { x: w * 0.8, y: h * 0.45 }, { x: w * 0.95, y: h * 0.35 }];

            // Jagged chain lightning helper
            function jagged(ax, ay, bx, by, segs, jitter, col, alpha, lw) {
              const pts = [{ x: ax, y: ay }];
              for (let s = 1; s < segs; s++) { const frac = s / segs; const jx = (Math.random() - 0.5) * jitter; const jy = (Math.random() - 0.5) * jitter; pts.push({ x: ax + (bx - ax) * frac + jx, y: ay + (by - ay) * frac + jy }); }
              pts.push({ x: bx, y: by });
              // Outer glow pass
              c.globalAlpha = alpha * 0.3; c.strokeStyle = col; c.lineWidth = lw * 3;
              c.beginPath(); pts.forEach((p, i) => i === 0 ? c.moveTo(p.x, p.y) : c.lineTo(p.x, p.y)); c.stroke();
              // Core pass
              c.globalAlpha = alpha; c.lineWidth = lw;
              c.beginPath(); pts.forEach((p, i) => i === 0 ? c.moveTo(p.x, p.y) : c.lineTo(p.x, p.y)); c.stroke();
              c.globalAlpha = 1;
            }

            // Chain arc: flash every ~300ms per link
            const linkPhase = (t % 1800) / 1800;
            for (let i = 0; i < enemies.length - 1; i++) {
              const flash = ((t / 300 + i * 0.4) % 1) < 0.55;
              if (flash) {
                const a = enemies[i], b = enemies[i + 1];
                jagged(a.x, a.y, b.x, b.y, 8, 14, '#00e5ff', 0.9, 1.5);
              }
            }

            // Enemy circles
            enemies.forEach((e, i) => {
              const soulReaver = i === 2 || i === 4;
              const pulse = 0.7 + 0.3 * Math.sin(t / 300 + i);
              // Glow ring
              if (soulReaver) { c.strokeStyle = `rgba(255,69,0,${0.5 * pulse})`; c.lineWidth = 2; c.beginPath(); c.arc(e.x, e.y, 14, 0, Math.PI * 2); c.stroke(); }
              c.fillStyle = '#220808'; c.beginPath(); c.arc(e.x, e.y, 9, 0, Math.PI * 2); c.fill();
              c.strokeStyle = soulReaver ? '#ff4500' : '#555'; c.lineWidth = 1; c.stroke();
              // Soul Reaver X
              if (soulReaver) {
                c.save(); c.translate(e.x, e.y - 13); c.globalAlpha = pulse;
                c.strokeStyle = '#ff4500'; c.lineWidth = 1.5;
                c.beginPath(); c.moveTo(-4, -4); c.lineTo(4, 4); c.stroke();
                c.beginPath(); c.moveTo(4, -4); c.lineTo(-4, 4); c.stroke();
                c.restore();
              }
            });

            // Labels
            c.textAlign = 'center';
            c.fillStyle = '#22c55e'; c.font = 'bold 11px Orbitron, sans-serif';
            c.globalAlpha = 0.7 + 0.3 * Math.sin(t / 900);
            c.fillText('×1.55 ALL FRIENDLY DAMAGE', w / 2, h * 0.78);
            c.globalAlpha = 0.55; c.fillStyle = '#22c55e'; c.font = '8px Share Tech Mono, monospace';
            c.fillText('CHAIN LIGHTNING → SOUL REAVER → ×1.5 fire rate', w / 2, h * 0.78 + 14);
            c.globalAlpha = 1; c.textAlign = 'left';
            activeAnimations.push(requestAnimationFrame(() => drawGlory(performance.now())));
          }
          drawGlory(performance.now());
        }
      }


      // ── FINAL DEFENSE ──
      if (tab === 'passives') {
        const sfd = setup('cvFinal');
        if (sfd) {
          const { c, w, h } = sfd;
          function drawFinal(t) {
            c.clearRect(0, 0, w, h);
            c.fillStyle = 'rgba(0,5,15,0.5)'; c.fillRect(0, 0, w, h);

            // 10s cycle: phase 0-0.3 normal, 0.3-0.5 hit absorbed, 0.5-0.7 regen, 0.7-0.85 last stand, 0.85-1 absolute shield
            const cycle = 10000, phase = (t % cycle) / cycle;
            const shipX = w * 0.5, shipY = h * 0.65;

            // Boundary line
            const bY = h * 0.82;
            c.strokeStyle = 'rgba(0,255,255,0.3)'; c.lineWidth = 1.5; c.setLineDash([8, 8]);
            c.beginPath(); c.moveTo(0, bY); c.lineTo(w, bY); c.stroke(); c.setLineDash([]);
            c.fillStyle = 'rgba(0,255,255,0.4)'; c.font = '7px Share Tech Mono,monospace';
            c.fillText('BOUNDARY', 6, bY - 4);

            // Enemy approaching
            const eMarchX = phase < 0.5 ? w * 0.85 - phase * w * 1.0 : (phase < 0.55 ? w * 0.35 : -50);
            if (phase < 0.55) {
              c.fillStyle = '#330808'; c.beginPath(); c.arc(eMarchX, bY + 10, 8, 0, Math.PI * 2); c.fill();
              c.strokeStyle = '#ff4400'; c.lineWidth = 1; c.stroke();
            }

            // Boundary shield hit flash
            if (phase >= 0.3 && phase < 0.5) {
              const fl = (phase - 0.3) / 0.2;
              const flashA = fl < 0.5 ? fl * 2 : 2 - fl * 2;
              c.strokeStyle = `rgba(0,255,255,${flashA * 0.9})`; c.lineWidth = 3 + flashA * 4;
              c.beginPath(); c.moveTo(0, bY); c.lineTo(w, bY); c.stroke();
              c.fillStyle = `rgba(0,255,255,${flashA * 0.15})`; c.fillRect(0, bY - 20, w, 20);
              if (flashA > 0.3) { c.fillStyle = `rgba(0,255,255,${flashA})`; c.font = 'bold 9px Orbitron,sans-serif'; c.textAlign = 'center'; c.fillText('BOUNDARY SHIELD', w / 2, bY - 6); c.textAlign = 'left'; }
            }

            // Player shield - cyan ring
            const shieldActive = phase < 0.3 || phase > 0.6;
            if (shieldActive) {
              const pulse = 0.6 + 0.4 * Math.sin(t / 350);
              c.strokeStyle = `rgba(0,229,255,${0.6 * pulse})`; c.lineWidth = 2;
              c.beginPath(); c.arc(shipX, shipY, 26, 0, Math.PI * 2); c.stroke();
              // rotating dash
              c.save(); c.translate(shipX, shipY); c.rotate(t / 1200);
              c.setLineDash([8, 16]); c.strokeStyle = `rgba(0,229,255,${0.3 * pulse})`; c.lineWidth = 1;
              c.beginPath(); c.arc(0, 0, 30, 0, Math.PI * 2); c.stroke();
              c.setLineDash([]); c.restore();
            }

            // Last Stand activation
            if (phase >= 0.7 && phase < 0.85) {
              const lsP = (phase - 0.7) / 0.15;
              const lsPulse = 0.5 + 0.5 * Math.sin(t / 120);
              c.fillStyle = `rgba(255,215,0,${lsP * 0.12})`; c.fillRect(0, 0, w, h);
              c.strokeStyle = `rgba(255,215,0,${lsPulse * 0.9})`; c.lineWidth = 3 + lsPulse * 2;
              c.beginPath(); c.arc(shipX, shipY, 28 + lsPulse * 4, 0, Math.PI * 2); c.stroke();
              c.fillStyle = `rgba(255,215,0,${lsP})`; c.font = 'bold 10px Orbitron,sans-serif'; c.textAlign = 'center';
              c.fillText('LAST STAND', w / 2, shipY - 40); c.textAlign = 'left';
            }

            // Absolute shield - gold ring
            if (phase >= 0.85) {
              const asP = (phase - 0.85) / 0.15;
              const pulse = 0.7 + 0.3 * Math.sin(t / 200);
              c.strokeStyle = `rgba(255,215,0,${0.8 * pulse})`; c.lineWidth = 3;
              c.beginPath(); c.arc(shipX, shipY, 32, 0, Math.PI * 2); c.stroke();
              c.save(); c.translate(shipX, shipY); c.rotate(-t / 800);
              c.setLineDash([5, 5]); c.strokeStyle = `rgba(255,215,0,${0.4 * pulse})`; c.lineWidth = 1.5;
              c.beginPath(); c.arc(0, 0, 38, 0, Math.PI * 2); c.stroke();
              c.setLineDash([]); c.restore();
              c.fillStyle = `rgba(255,215,0,${asP * 0.8})`; c.font = 'bold 9px Orbitron,sans-serif'; c.textAlign = 'center';
              c.fillText('ABSOLUTE SHIELD', w / 2, shipY - 44); c.textAlign = 'left';
            }

            // Ship
            c.save(); c.translate(shipX, shipY);
            c.fillStyle = '#1a2a45'; c.beginPath(); c.moveTo(0, -16); c.lineTo(10, 0); c.lineTo(8, 6); c.lineTo(-8, 6); c.lineTo(-10, 0); c.closePath(); c.fill();
            c.strokeStyle = '#38bdf8'; c.lineWidth = 0.8; c.stroke();
            c.restore();

            // Label
            const lbl = phase < 0.3 ? 'SHIELDS ACTIVE' : phase < 0.5 ? 'BOUNDARY HIT' : phase < 0.7 ? 'REGEN...' : phase < 0.85 ? 'LAST STAND!' : 'ABSOLUTE SHIELD';
            const lblCol = phase >= 0.7 ? '#ffd700' : '#00e5ff';
            c.fillStyle = lblCol; c.font = '7px Share Tech Mono,monospace'; c.textAlign = 'right';
            c.fillText(lbl, w - 8, h - 6); c.textAlign = 'left';

            activeAnimations.push(requestAnimationFrame(() => drawFinal(performance.now())));
          }
          drawFinal(performance.now());
        }
      }

      // ── ENEMY TAB CANVASES ──
      if (tab === 'enemies') {
        // Apostles
        const sn = setup('cvNormal');
        if (sn) {
          const { c, w, h } = sn;
          const N_DUR=3000, C_DUR=2200, X_DUR=2500;
          const TOT=N_DUR+C_DUR+X_DUR;
          const XNAMES=['MARCHOSIAS','VEILSHROUD','THAELIS','DARGRUEL'];
          const XCOLS=['#00cc66','#8c14ff','#ffd700','#9900ff'];
          const XSUBS=['Elite · Arc Shield','Abnormal · Alteration','Abnormal · Tenacity','Boss · Maître Suprême'];
          let nc=-1, nxi=0;

          function normJagBolt(x1,y1,x2,y2,segs,jit){
            const pts=[[x1,y1]];
            for(let i=1;i<segs;i++){const f=i/segs;pts.push([x1+(x2-x1)*f+(Math.random()-.5)*jit,y1+(y2-y1)*f+(Math.random()-.5)*jit*0.35]);}
            pts.push([x2,y2]);
            c.beginPath();pts.forEach(([px,py],i)=>i?c.lineTo(px,py):c.moveTo(px,py));c.stroke();
          }

          function drawNorm(t) {
            c.clearRect(0, 0, w, h);
            const tm=t%TOT, cyc=Math.floor(t/TOT);
            if(cyc!==nc){nc=cyc;nxi=Math.floor(Math.random()*4);}
            let ph,pt;
            if(tm<N_DUR)             {ph=0;pt=tm/N_DUR;}
            else if(tm<N_DUR+C_DUR)  {ph=1;pt=(tm-N_DUR)/C_DUR;}
            else                     {ph=3;pt=(tm-N_DUR-C_DUR)/X_DUR;}

            const ex=w*0.28, ey=h*0.5, r=16;

            if(ph===0){
              // ── Normal apostle ──
              const hpR=0.7+0.3*Math.sin(t/3000), hue=10+hpR*40;
              const gc=`hsl(${hue},100%,55%)`, dc=`hsl(${hue},90%,25%)`;
              c.fillStyle=`hsla(${hue},100%,50%,0.15)`;
              c.beginPath();c.arc(ex,ey,r*1.4,0,Math.PI*2);c.fill();
              c.save();c.translate(ex,ey);c.rotate(t/1800);
              c.fillStyle='#181822';c.strokeStyle='#3a3a4a';c.lineWidth=2;
              c.beginPath();for(let i=0;i<6;i++){const a=(i/6)*Math.PI*2;i===0?c.moveTo(Math.cos(a)*r,Math.sin(a)*r):c.lineTo(Math.cos(a)*r,Math.sin(a)*r);}c.closePath();c.fill();c.stroke();
              for(let i=0;i<3;i++){
                c.save();c.rotate((i/3)*Math.PI*2+Math.PI/6);
                c.fillStyle='#22222e';c.beginPath();c.moveTo(r*.5,-r*.25);c.lineTo(r*1.1,-r*.15);c.lineTo(r*1.1,r*.15);c.lineTo(r*.5,r*.25);c.closePath();c.fill();
                c.strokeStyle=dc;c.lineWidth=1.5;c.stroke();
                c.fillStyle=gc;c.fillRect(r*.85,-r*.05,r*.2,r*.1);
                c.restore();
              }
              c.restore();
              const pl=0.8+0.2*Math.sin(t/150),er=r*0.5;
              c.fillStyle='#0a0a0f';c.beginPath();c.arc(ex,ey,er*1.1,0,Math.PI*2);c.fill();
              const eg=c.createRadialGradient(ex,ey,0,ex,ey,er*pl);
              eg.addColorStop(0,'#fff');eg.addColorStop(.3,gc);eg.addColorStop(1,'transparent');
              c.fillStyle=eg;c.beginPath();c.arc(ex,ey,er*pl,0,Math.PI*2);c.fill();
              c.fillStyle='#050508';c.beginPath();c.arc(ex,ey,er*.25,0,Math.PI*2);c.fill();
              c.strokeStyle=gc;c.lineWidth=1;c.stroke();
              const bp=(t/1000)%1;
              c.fillStyle=`rgba(210,110,50,${1-bp})`;
              c.beginPath();c.arc(ex+(w*.85-ex)*bp,ey-2+bp*4,3,0,Math.PI*2);c.fill();
              c.fillStyle='#8899bb';c.font='7px Share Tech Mono,monospace';c.textAlign='left';
              c.fillText('fires 1 bullet/sec',w*.5,ey-14);
              c.fillText('bullet HP = enemy HP',w*.5,ey-2);
              c.fillStyle='rgba(255,215,0,0.55)';
              c.fillText('CORONATION passive ▼',w*.5,ey+12);

            }else if(ph===1){
              // ── Coronation: freeze → energy suck inward → lightning from sky → dissipate ──
              // Apostle body frozen
              c.save();c.translate(ex,ey);
              c.fillStyle='#181822';c.strokeStyle='#aaaaaa';c.lineWidth=1.5;
              c.beginPath();for(let i=0;i<6;i++){const a=(i/6)*Math.PI*2;i===0?c.moveTo(Math.cos(a)*r,Math.sin(a)*r):c.lineTo(Math.cos(a)*r,Math.sin(a)*r);}c.closePath();c.fill();c.stroke();
              c.restore();

              if(pt<0.35){
                // Phase A: rings contracting inward + particles flying inward
                const sp=pt/0.35;
                // Charge buildup glow at center
                c.globalAlpha=sp*0.35;c.fillStyle='#ffd700';
                c.beginPath();c.arc(ex,ey,r*(0.9+sp*0.4),0,Math.PI*2);c.fill();
                c.globalAlpha=1;
                // 3 rings shrinking inward (large→small)
                for(let k=0;k<3;k++){
                  const kp=((1-sp+k/3))%1; // starts far, contracts
                  const rr=r*(0.6+kp*2.4);
                  c.globalAlpha=(1-kp)*0.85;
                  c.strokeStyle=`rgba(255,200,0,${(1-kp)*0.9})`;c.lineWidth=2*(1-kp*0.5);
                  c.beginPath();c.arc(ex,ey,rr,0,Math.PI*2);c.stroke();
                }
                c.globalAlpha=1;
                // Gold particles flying inward from edge toward center
                for(let k=0;k<8;k++){
                  const ang=(k/8)*Math.PI*2+(t/700);
                  const dist=r*(2.6-sp*2.1);
                  c.globalAlpha=sp*0.9*(0.5+0.5*Math.sin(t/90+k));
                  c.fillStyle='#ffd700';
                  c.beginPath();c.arc(ex+Math.cos(ang)*dist,ey+Math.sin(ang)*dist,1.5,0,Math.PI*2);c.fill();
                }
                c.globalAlpha=1;

              }else{
                // Phase B: lightning bolt from sky down to entity
                const sp=(pt-0.35)/0.65;
                // Impact glow at entity
                c.globalAlpha=0.55+0.35*Math.sin(t/35);c.fillStyle='#fff8b0';
                c.beginPath();c.arc(ex,ey,r*(0.85+sp*0.4),0,Math.PI*2);c.fill();
                c.globalAlpha=1;
                // Gold outer bolt
                c.strokeStyle=`rgba(255,200,0,0.65)`;c.lineWidth=5+sp*3;
                normJagBolt(ex,0,ex,ey,6,20);
                // White core bolt
                c.strokeStyle='#ffffff';c.lineWidth=2.5+sp*1.5;
                normJagBolt(ex,0,ex,ey,7,16);
                // Shockwave ring
                const sw=sp*r*3.2;
                c.globalAlpha=(1-sp)*0.8;
                c.strokeStyle='rgba(255,215,0,0.9)';c.lineWidth=2*(1-sp*0.7);
                c.beginPath();c.arc(ex,ey,sw,0,Math.PI*2);c.stroke();
                c.globalAlpha=1;
              }

              // CORONATION label: top-right, above the info text
              c.fillStyle='#fff176';c.font=`bold ${Math.ceil(8+pt*2)}px Orbitron,sans-serif`;
              c.textAlign='left';c.textBaseline='alphabetic';
              c.fillText('CORONATION',w*.5,ey-28);
              // Right info lines below label
              c.fillStyle='rgba(255,215,0,0.75)';c.font='7px Share Tech Mono,monospace';
              c.fillText('frozen • immortal',w*.5,ey-15);
              c.fillText('untargetable • ~2.2s',w*.5,ey-2);
              c.fillStyle='rgba(180,180,180,0.45)';
              c.fillText('→ transforms on finish',w*.5,ey+11);

            }else{
              // ── Transformed enemy ──
              const xcol=XCOLS[nxi],xsub=XSUBS[nxi];
              if(nxi===0){
                // Marchosias — GREEN hexagon, gear teeth, inner triangle, arc shield
                c.globalAlpha=0.18+.08*Math.sin(t/200);c.fillStyle='rgba(0,255,120,0.28)';
                c.beginPath();c.arc(ex,ey,r*2,0,Math.PI*2);c.fill();c.globalAlpha=1;
                c.save();c.translate(ex,ey);
                // 9 gear teeth
                c.globalAlpha=0.6;c.fillStyle='rgba(0,180,80,0.6)';
                for(let i=0;i<9;i++){const ta=(i/9)*Math.PI*2+t/2000;c.save();c.rotate(ta);c.beginPath();c.rect(r-2,-2,4,4);c.fill();c.restore();}
                c.globalAlpha=1;
                // Hexagon body (-PI/6 offset, rotating slowly)
                const hrot=t/2200;
                c.fillStyle='#1a1a2e';c.strokeStyle='#00cc66';c.lineWidth=2;
                c.beginPath();for(let i=0;i<6;i++){const a=(i/6)*Math.PI*2-Math.PI/6+hrot;i===0?c.moveTo(Math.cos(a)*r,Math.sin(a)*r):c.lineTo(Math.cos(a)*r,Math.sin(a)*r);}c.closePath();c.fill();c.stroke();
                // Inner triangle frame (lines from center to alternating vertices)
                c.strokeStyle='rgba(0,200,100,0.5)';c.lineWidth=1;
                for(let i=0;i<3;i++){const a=(i/3)*Math.PI*2-Math.PI/6+hrot;c.beginPath();c.moveTo(0,0);c.lineTo(Math.cos(a)*r,Math.sin(a)*r);c.stroke();}
                // Green core
                const cg=c.createRadialGradient(0,0,0,0,0,r*.38);
                cg.addColorStop(0,'#fff');cg.addColorStop(.4,'#00ff88');cg.addColorStop(1,'#006633');
                c.fillStyle=cg;c.beginPath();c.arc(0,0,r*.38,0,Math.PI*2);c.fill();
                // Arc shield: quarter-circle rotating
                const sa=t/1200;
                c.strokeStyle='rgba(0,255,136,0.85)';c.lineWidth=2.5;
                c.shadowColor='rgba(0,255,136,0.5)';c.shadowBlur=4;
                c.beginPath();c.arc(0,0,r*1.35,sa,sa+Math.PI*0.5);c.stroke();
                c.shadowBlur=0;
                c.restore();

              }else if(nxi===1){
                // Veilshroud — violet ribbons + armillary + core
                c.globalAlpha=.12;c.fillStyle='#8c14ff';
                c.beginPath();c.arc(ex,ey,r*2.2,0,Math.PI*2);c.fill();c.globalAlpha=1;
                c.save();c.translate(ex,ey);
                for(let i=0;i<3;i++){
                  c.save();c.rotate((i/3)*Math.PI*2+t/3000);
                  const rg2=c.createLinearGradient(0,0,0,-r*2);
                  rg2.addColorStop(0,'rgba(140,20,255,0.55)');rg2.addColorStop(1,'transparent');
                  c.fillStyle=rg2;const wv=Math.sin(t/250+i)*16;
                  c.beginPath();c.moveTo(-r*.25,0);c.quadraticCurveTo(wv-r*.25,-r*1.1,0,-r*2);c.quadraticCurveTo(wv+r*.25,-r*1.1,r*.25,0);c.closePath();c.fill();c.restore();
                }
                c.strokeStyle='rgba(140,20,255,0.8)';c.lineWidth=1.5;
                c.beginPath();c.ellipse(0,0,r*1.05,r*.38,t/1000,0,Math.PI*2);c.stroke();
                c.fillStyle='#000';c.beginPath();c.arc(0,0,r*.38,0,Math.PI*2);c.fill();
                c.fillStyle='#8c14ff';c.save();c.rotate(t/1500);
                c.beginPath();c.ellipse(0,0,r*.1,r*.6,0,0,Math.PI*2);c.fill();c.restore();
                c.restore();

              }else if(nxi===2){
                // Thaelis — gold octagon + orbiting dots
                c.globalAlpha=.15+.08*Math.sin(t/400);c.fillStyle='#ffd700';
                c.beginPath();c.arc(ex,ey,r*1.8,0,Math.PI*2);c.fill();c.globalAlpha=1;
                c.save();c.translate(ex,ey);c.rotate(t/3000);
                c.fillStyle='#1a1a2e';c.strokeStyle='#FFD700';c.lineWidth=1.5;
                c.beginPath();for(let i=0;i<8;i++){const a=(i/8)*Math.PI*2;i===0?c.moveTo(Math.cos(a)*r,Math.sin(a)*r):c.lineTo(Math.cos(a)*r,Math.sin(a)*r);}c.closePath();c.fill();c.stroke();
                c.restore();
                const cg2=c.createRadialGradient(ex,ey,0,ex,ey,r*.3);
                cg2.addColorStop(0,'#fff');cg2.addColorStop(.5,'#FFD700');cg2.addColorStop(1,'#FFA500');
                c.fillStyle=cg2;c.beginPath();c.arc(ex,ey,r*.3,0,Math.PI*2);c.fill();
                c.fillStyle='#FFD700';
                for(let i=0;i<6;i++){const a=t/2000+(i/6)*Math.PI*2;c.beginPath();c.arc(ex+Math.cos(a)*(r+9),ey+Math.sin(a)*(r+9),2,0,Math.PI*2);c.fill();}

              }else{
                // Dargruel — PURPLE/indigo octagon boss
                const rb=r*1.15, rot=t/3500;
                // Purple aura
                c.globalAlpha=.15+.08*Math.sin(t/200);c.fillStyle='rgba(138,43,226,0.4)';
                c.shadowColor='#9900ff';c.shadowBlur=10;
                c.beginPath();c.arc(ex,ey,rb*2,0,Math.PI*2);c.fill();
                c.shadowBlur=0;c.globalAlpha=1;
                c.save();c.translate(ex,ey);c.rotate(rot);
                // Main octagon — gradient fill, purple stroke
                const og=c.createRadialGradient(0,0,0,0,0,rb);
                og.addColorStop(0,'#15002a');og.addColorStop(.55,'#2d004d');og.addColorStop(1,'#0d001a');
                c.fillStyle=og;c.strokeStyle='#6a0dad';c.lineWidth=2.5;
                c.beginPath();for(let i=0;i<8;i++){const a=(i/8)*Math.PI*2+Math.PI/8;i===0?c.moveTo(Math.cos(a)*rb,Math.sin(a)*rb):c.lineTo(Math.cos(a)*rb,Math.sin(a)*rb);}c.closePath();c.fill();c.stroke();
                // 4 diagonal veins
                c.strokeStyle='rgba(138,43,226,0.4)';c.lineWidth=1;
                for(let i=0;i<4;i++){const va=(i/4)*Math.PI*2;c.beginPath();c.moveTo(0,0);c.lineTo(Math.cos(va)*rb,Math.sin(va)*rb);c.stroke();}
                c.restore();
                // Inner counter-rotating octagon
                c.save();c.translate(ex,ey);c.rotate(-rot*2.5);
                c.strokeStyle='#8A2BE2';c.lineWidth=1.5;c.globalAlpha=0.8;
                c.beginPath();for(let i=0;i<8;i++){const a=(i/8)*Math.PI*2+Math.PI/8;i===0?c.moveTo(Math.cos(a)*rb*.75,Math.sin(a)*rb*.75):c.lineTo(Math.cos(a)*rb*.75,Math.sin(a)*rb*.75);}c.closePath();c.stroke();
                c.globalAlpha=1;c.restore();
                // Abyss Eye core
                const eg2=c.createRadialGradient(ex,ey,0,ex,ey,rb*.35);
                eg2.addColorStop(0,'#fff');eg2.addColorStop(.35,'#df88ff');eg2.addColorStop(1,'#4B0082');
                c.fillStyle=eg2;c.beginPath();c.arc(ex,ey,rb*.35,0,Math.PI*2);c.fill();
                // 4 directional triangles (rotating)
                c.save();c.translate(ex,ey);c.rotate(t/2000);
                c.fillStyle='rgba(223,136,255,0.7)';
                for(let i=0;i<4;i++){c.save();c.rotate((i/4)*Math.PI*2);c.beginPath();c.moveTo(0,rb*.55);c.lineTo(-rb*.12,rb*.38);c.lineTo(rb*.12,rb*.38);c.closePath();c.fill();c.restore();}
                c.restore();
                // 4 chain nodes at cardinal positions
                c.save();c.translate(ex,ey);
                for(let i=0;i<4;i++){
                  const ca=(i/4)*Math.PI*2,cnx=Math.cos(ca)*rb*1.15,cny=Math.sin(ca)*rb*1.15;
                  c.fillStyle='#0d001a';c.strokeStyle='#9900ff';c.lineWidth=1;
                  c.beginPath();c.arc(cnx,cny,3,0,Math.PI*2);c.fill();c.stroke();
                  c.fillStyle='#9900ff';c.beginPath();c.arc(cnx,cny,1.2,0,Math.PI*2);c.fill();
                }
                c.restore();
              }
              // Entity name above entity
              c.fillStyle=xcol;c.font='bold 8px Orbitron,sans-serif';c.textAlign='center';c.textBaseline='bottom';
              c.fillText(XNAMES[nxi],ex,ey-r*1.6-6);c.textBaseline='alphabetic';
              // Right-side info
              c.fillStyle=xcol;c.font='bold 7px Orbitron,sans-serif';c.textAlign='left';
              c.fillText(xsub,w*.5,ey-10);
              c.fillStyle='rgba(255,215,0,0.6)';c.font='7px Share Tech Mono,monospace';
              c.fillText('spawned at apostle pos',w*.5,ey+4);
              c.fillText('full HP • no kill score',w*.5,ey+17);
            }

            activeAnimations.push(requestAnimationFrame(() => drawNorm(performance.now())));
          }
          drawNorm(performance.now());
        }

        // Thaelis
        const st = setup('cvThaelis');
        if (st) {
          const { c, w, h } = st;
          function drawThal(t) {
            c.clearRect(0, 0, w, h);
            const cx2 = w * 0.2, cy2 = h * 0.45, r = 18;
            // Halo
            c.fillStyle = `rgba(255,200,0,${0.12 + 0.08 * Math.sin(t / 400)})`;
            c.beginPath(); c.arc(cx2, cy2, r + 10, 0, Math.PI * 2); c.fill();
            // Octagon
            c.save(); c.translate(cx2, cy2); c.rotate(t / 3000);
            c.fillStyle = '#1a1a2e'; c.strokeStyle = '#FFD700'; c.lineWidth = 1.5;
            c.beginPath(); for (let i = 0; i < 8; i++) { const a = (i / 8) * Math.PI * 2; const px = Math.cos(a) * r, py = Math.sin(a) * r; i === 0 ? c.moveTo(px, py) : c.lineTo(px, py); } c.closePath(); c.fill(); c.stroke();
            c.restore();
            // Inner octagon
            c.save(); c.translate(cx2, cy2); c.rotate(-t / 3900);
            c.strokeStyle = '#FFA500'; c.lineWidth = 1; c.globalAlpha = 0.55;
            c.beginPath(); for (let i = 0; i < 8; i++) { const a = (i / 8) * Math.PI * 2; const px = Math.cos(a) * r * 0.55, py = Math.sin(a) * r * 0.55; i === 0 ? c.moveTo(px, py) : c.lineTo(px, py); } c.closePath(); c.stroke();
            c.globalAlpha = 1; c.restore();
            // Core
            const cg = c.createRadialGradient(cx2, cy2, 0, cx2, cy2, r * 0.28);
            cg.addColorStop(0, '#fff'); cg.addColorStop(0.5, '#FFD700'); cg.addColorStop(1, '#FFA500');
            c.fillStyle = cg; c.beginPath(); c.arc(cx2, cy2, r * 0.28, 0, Math.PI * 2); c.fill();
            // Orbiting dots
            c.fillStyle = '#FFD700';
            for (let i = 0; i < 6; i++) { const a = t / 2000 + (i / 6) * Math.PI * 2; c.beginPath(); c.arc(cx2 + Math.cos(a) * (r + 12), cy2 + Math.sin(a) * (r + 12), 2, 0, Math.PI * 2); c.fill(); }
            // Split projectile animation
            const sp = (t / 2000) % 1;
            if (sp < 0.4) { c.fillStyle = '#FFD700'; c.globalAlpha = 0.7; c.beginPath(); c.arc(cx2 + r + 20 + sp * 150, cy2 - 5, 5, 0, Math.PI * 2); c.fill(); c.globalAlpha = 1; }
            if (sp > 0.4 && sp < 0.9) {
              const sp2 = (sp - 0.4) / 0.5;
              c.fillStyle = '#ffaa00';[[-10, -15], [0, 0], [10, 15]].forEach(([dx, dy]) => { c.beginPath(); c.arc(cx2 + r + 80 + sp2 * 80 + dx, cy2 + dy * sp2, 3, 0, Math.PI * 2); c.fill(); });
            }
            // Embryo
            const emx = w * 0.7, emy = h * 0.5;
            const ep = Math.abs(Math.sin(t / 150)) * 3;
            c.fillStyle = 'rgba(138,43,226,0.15)'; c.beginPath(); c.ellipse(emx, emy, 8 + ep, 11 + ep, 0, 0, Math.PI * 2); c.fill();
            const emg = c.createRadialGradient(emx - 2, emy - 2, 0, emx, emy, 8 + ep);
            emg.addColorStop(0, '#df88ff'); emg.addColorStop(0.4, '#8A2BE2'); emg.addColorStop(1, '#4a0080');
            c.fillStyle = emg; c.beginPath(); c.ellipse(emx, emy, 6 + ep, 9 + ep, 0, 0, Math.PI * 2); c.fill();
            // Labels
            c.fillStyle = '#FFD70088'; c.font = '7px Share Tech Mono, monospace'; c.textAlign = 'center';
            c.fillText('splits into 3 homing', w * 0.42, h * 0.22);
            c.fillText('EMBRYO (90% DR)', emx, emy + 18);
            c.fillStyle = '#8A2BE255'; c.fillText('hatches @3s', emx, emy + 27);
            c.textAlign = 'left';
            activeAnimations.push(requestAnimationFrame(() => drawThal(performance.now())));
          }
          drawThal(performance.now());
        }

        // Veilshroud
        const sv2 = setup('cvVeil');
        if (sv2) {
          const { c, w, h } = sv2;
          // State cycle: 0=normal(2s) → 1=phantom(1.5s) → 2=lightning_warn(1.5s) → 3=strike(0.6s) → back
          const CYCLE = [2000, 1500, 1500, 600];
          const TOTAL = CYCLE.reduce((a, b) => a + b, 0);
          // Jagged bolt helper — matches game's _drawLightningBolt (random jitter every frame)
          function veilBolt(x1, y1, x2, y2, n, jit) {
            const pts = [[x1, y1]];
            for (let i = 1; i < n; i++) { const f = i / n; pts.push([x1 + (x2 - x1) * f + (Math.random() - 0.5) * jit, y1 + (y2 - y1) * f + (Math.random() - 0.5) * jit]); }
            pts.push([x2, y2]);
            c.beginPath(); pts.forEach(([px, py], i) => i ? c.lineTo(px, py) : c.moveTo(px, py)); c.stroke();
          }

          function drawVeil(t) {
            c.clearRect(0, 0, w, h);
            const cx2 = w * 0.22, cy2 = h * 0.5, r = 20;

            // Determine cycle phase
            const tMod = t % TOTAL;
            let phase = 0, phaseT = tMod;
            for (let pi = 0; pi < CYCLE.length; pi++) {
              if (phaseT < CYCLE[pi]) { phase = pi; phaseT = phaseT / CYCLE[pi]; break; }
              phaseT -= CYCLE[pi];
            }

            // phantom lerp (0=normal violet, 1=phantom cyan)
            let phantomLerp = 0;
            if (phase === 0) phantomLerp = 0;
            else if (phase === 1) phantomLerp = Math.min(1, phaseT / 0.25);
            else if (phase === 2) phantomLerp = Math.max(0, 1 - phaseT / 0.3);
            else phantomLerp = 0;

            const cR = Math.round(140 + (0 - 140) * phantomLerp);
            const cG = Math.round(20 + (230 - 20) * phantomLerp);
            const cB = Math.round(255 + (200 - 255) * phantomLerp);
            const mc = `rgb(${cR},${cG},${cB})`;
            const baseAlpha = 1 - phantomLerp * 0.5;

            c.save();
            c.translate(cx2, cy2);
            c.globalAlpha = baseAlpha;

            // Glitch jitter in phantom
            if (phase === 1 && Math.random() < 0.3) {
              c.translate((Math.random() - 0.5) * 10 * phantomLerp, (Math.random() - 0.5) * 7 * phantomLerp);
            }

            // 1. Aura
            const aG = c.createRadialGradient(0, 0, r * 0.4, 0, 0, r * 3.0);
            aG.addColorStop(0, `rgba(${cR},${cG},${cB},0.16)`);
            aG.addColorStop(1, 'transparent');
            c.fillStyle = aG; c.beginPath(); c.arc(0, 0, r * 3.0, 0, Math.PI * 2); c.fill();

            // 2. Void ribbons (5 petals)
            const numR = 5;
            for (let i = 0; i < numR; i++) {
              c.save();
              const rotSpd = t / (3000 - phantomLerp * 1400) * (i % 2 === 0 ? 1 : -1);
              c.rotate((i / numR) * Math.PI * 2 + rotSpd);
              const rLen = r * 2.5 + Math.sin(t / 400 + i) * 16;
              const rWid = r * 0.35;
              const wave = Math.sin(t / 250 + i) * 28;
              const rg = c.createLinearGradient(0, 0, 0, -rLen);
              rg.addColorStop(0, `rgba(${cR},${cG},${cB},${0.5 - phantomLerp * 0.22})`);
              rg.addColorStop(0.7, `rgba(${Math.round(cR / 2)},${Math.round(cG / 2)},${Math.round(cB / 2)},0.12)`);
              rg.addColorStop(1, 'transparent');
              c.fillStyle = rg;
              c.beginPath();
              c.moveTo(-rWid / 2, 0);
              c.quadraticCurveTo(wave - rWid, -rLen * 0.5, 0, -rLen);
              c.quadraticCurveTo(wave + rWid, -rLen * 0.5, rWid / 2, 0);
              c.closePath(); c.fill();
              c.restore();
            }

            // 3. Armillary rings
            c.strokeStyle = `rgba(${cR},${cG},${cB},0.8)`; c.lineWidth = 1.8;
            c.beginPath(); c.ellipse(0, 0, r * 1.05, r * 0.38, t / 1000, 0, Math.PI * 2); c.stroke();
            c.strokeStyle = `rgba(255,255,255,${0.3 + phantomLerp * 0.4})`; c.lineWidth = 1;
            c.setLineDash([8, 12]);
            c.beginPath(); c.ellipse(0, 0, r * 1.22, r * 0.46, -t / 800 + Math.PI / 4, 0, Math.PI * 2); c.stroke();
            c.setLineDash([]);

            // 4. Armor shards
            const shOff = phantomLerp * 32;
            const shAlpha = 1 - phantomLerp * 0.82;
            c.fillStyle = `rgba(10,5,20,${shAlpha})`;
            c.strokeStyle = `rgba(${cR},${cG},${cB},${0.8 + phantomLerp * 0.2})`; c.lineWidth = 1.4;
            const shards = [
              [[0, -r * 1.5 - shOff], [r * 0.46, -r * 0.55 - shOff * 0.5], [0, -r * 0.36], [-r * 0.46, -r * 0.55 - shOff * 0.5]],
              [[0, r * 1.3 + shOff], [r * 0.36, r * 0.46 + shOff * 0.5], [0, r * 0.26], [-r * 0.36, r * 0.46 + shOff * 0.5]],
              [[-r * 1.2 - shOff, 0], [-r * 0.46, -r * 0.26], [-r * 0.26, 0], [-r * 0.46, r * 0.26]],
              [[r * 1.2 + shOff, 0], [r * 0.46, -r * 0.26], [r * 0.26, 0], [r * 0.46, r * 0.26]],
            ];
            shards.forEach(pts => {
              c.beginPath(); c.moveTo(pts[0][0], pts[0][1]);
              for (let p = 1; p < pts.length; p++) c.lineTo(pts[p][0], pts[p][1]);
              c.closePath();
              if (phantomLerp < 0.88) c.fill();
              c.stroke();
            });

            // 5. Singularity core
            const coreR = r * 0.36 + phantomLerp * r * 0.18;
            const accR2 = coreR * 1.5 + Math.sin(t / 100) * 2;
            const accGrad = c.createRadialGradient(0, 0, coreR * 0.7, 0, 0, accR2);
            accGrad.addColorStop(0, '#ffffff'); accGrad.addColorStop(0.4, mc); accGrad.addColorStop(1, 'transparent');
            c.fillStyle = accGrad; c.beginPath(); c.arc(0, 0, accR2, 0, Math.PI * 2); c.fill();
            c.fillStyle = '#000'; c.beginPath(); c.arc(0, 0, coreR, 0, Math.PI * 2); c.fill();
            // iris
            c.fillStyle = phantomLerp > 0.5 ? '#ffffff' : mc;
            c.save(); c.rotate(t / 1500);
            c.beginPath(); c.ellipse(0, 0, coreR * 0.12, coreR * 0.72, 0, 0, Math.PI * 2); c.fill();
            c.restore();

            c.restore(); // end entity

            // ── PHASE LABELS (right side) ──
            c.fillStyle = '#22cc55'; c.font = 'bold 8px Orbitron,sans-serif'; c.textAlign = 'left';
            if (phase === 0) {
              c.fillText('NORMAL STANCE', w * 0.48, h * 0.12);
              c.fillStyle = '#8899bb'; c.font = '7px Share Tech Mono,monospace';
              c.fillText('15% DR • firing 2-bullet volley', w * 0.48, h * 0.12 + 12);
              // bullets flying
              const bprog = (t / 600) % 1;
              const bAngle = -0.25 + Math.sin(t / 800) * 0.15;
              for (let bi = 0; bi < 2; bi++) {
                const ba = bAngle + (bi - 0.5) * 0.2;
                const bx = cx2 + Math.cos(ba) * (r + 10 + bprog * 80);
                const by = cy2 + Math.sin(ba) * (r + 10 + bprog * 80);
                c.fillStyle = `rgba(170,0,255,${1 - bprog})`;
                c.beginPath(); c.arc(bx, by, 3, 0, Math.PI * 2); c.fill();
              }
              // State hint
              c.fillStyle = 'rgba(0,229,204,0.55)'; c.font = '7px Share Tech Mono,monospace';
              c.textAlign = 'center';
              c.fillText('PHANTOM check every 0.45s (40%)', w * 0.5, h * 0.9);
            } else if (phase === 1) {
              c.fillStyle = '#00e5cc'; c.font = 'bold 8px Orbitron,sans-serif'; c.textAlign = 'left';
              c.fillText('PHANTOM SHIFT', w * 0.48, h * 0.12);
              c.fillStyle = '#8899bb'; c.font = '7px Share Tech Mono,monospace';
              c.fillText('99% DR • frozen • 1.5s', w * 0.48, h * 0.12 + 12);
              // pulsing cyan ring
              const pR2 = r * 1.7 + Math.sin(t / 150) * 6;
              c.strokeStyle = `rgba(0,229,204,${0.3 + phantomLerp * 0.5})`; c.lineWidth = 2;
              c.setLineDash([6, 8]);
              c.beginPath(); c.arc(cx2, cy2, pR2, 0, Math.PI * 2); c.stroke();
              c.setLineDash([]);
              c.fillStyle = 'rgba(0,229,204,0.5)'; c.textAlign = 'center'; c.font = '7px Share Tech Mono,monospace';
              c.fillText('on hit: 40% instant dodge → Phantom', w * 0.5, h * 0.9);
            } else if (phase === 2) {
              // Lightning countdown animation
              const tx = w * 0.72, ty = h * 0.55;
              const circR = 32;
              c.fillStyle = '#ff2244'; c.font = 'bold 8px Orbitron,sans-serif'; c.textAlign = 'left';
              c.fillText('VOID STRIKE', w * 0.48, h * 0.12);
              c.fillStyle = '#8899bb'; c.font = '7px Share Tech Mono,monospace';
              c.fillText('targeting random sentinel/player', w * 0.48, h * 0.12 + 12);
              // Target circle
              c.strokeStyle = `rgba(255,30,30,0.75)`; c.lineWidth = 2;
              c.setLineDash([7, 5]);
              c.beginPath(); c.arc(tx, ty, circR, 0, Math.PI * 2); c.stroke(); c.setLineDash([]);
              // expanding fill from center
              if (phaseT > 0.04) {
                const fG = c.createRadialGradient(tx, ty, 0, tx, ty, circR * phaseT);
                fG.addColorStop(0, `rgba(255,30,30,${0.32 * phaseT})`); fG.addColorStop(1, 'rgba(255,0,0,0)');
                c.fillStyle = fG; c.beginPath(); c.arc(tx, ty, circR * phaseT, 0, Math.PI * 2); c.fill();
              }
              // crosshairs
              c.strokeStyle = 'rgba(255,80,80,0.65)'; c.lineWidth = 1;
              c.beginPath(); c.moveTo(tx - circR * 1.3, ty); c.lineTo(tx + circR * 1.3, ty);
              c.moveTo(tx, ty - circR * 1.3); c.lineTo(tx, ty + circR * 1.3); c.stroke();
              c.fillStyle = 'rgba(255,100,100,0.9)';
              c.beginPath(); c.arc(tx, ty, 4, 0, Math.PI * 2); c.fill();
              c.fillStyle = 'rgba(255,100,100,0.7)'; c.font = '7px Share Tech Mono,monospace'; c.textAlign = 'center';
              c.fillText('TARGET', tx, ty - circR - 5);
              c.fillText(`${((1 - phaseT) * 1.5).toFixed(1)}s`, tx, ty + circR + 12);
            } else {
              // Strike — matches game's _drawVeilshroudEffects lightning rendering
              const tx = w * 0.72, ty = h * 0.55;
              const prog = 1 - phaseT; // 1→0 as strike fades (matches game lt.life/maxLife)
              // Shockwave ring at target: expands from r*1.0 → r*1.3 as prog→0
              c.globalAlpha = prog * 0.5;
              c.strokeStyle = '#ff2233'; c.lineWidth = 3 + prog * 5;
              c.beginPath(); c.arc(tx, ty, 32 * (1.3 - prog * 0.3), 0, Math.PI * 2); c.stroke();
              // Inner white bolt (dynamic jagged, flickers each frame)
              c.globalAlpha = prog;
              c.strokeStyle = '#ffffff'; c.lineWidth = 3 * prog;
              veilBolt(tx, 0, tx, ty, 5, 28);
              // Outer red bolt
              c.strokeStyle = `rgba(255,30,50,${prog * 0.65})`; c.lineWidth = 6 * prog;
              veilBolt(tx, 0, tx, ty, 4, 35);
              c.globalAlpha = 1;
              c.fillStyle = '#ff2244'; c.font = 'bold 8px Orbitron,sans-serif'; c.textAlign = 'left';
              c.fillText('VOID STRIKE', w * 0.48, h * 0.12);
              c.fillStyle = '#8899bb'; c.font = '7px Share Tech Mono,monospace';
              c.fillText('1 life (player) • 15% EP (sentinels)', w * 0.48, h * 0.12 + 12);
            }

            activeAnimations.push(requestAnimationFrame(() => drawVeil(performance.now())));
          }
          drawVeil(performance.now());
        }

        // Aegis Core
        const sa = setup('cvAegis');
        if (sa) {
          const { c, w, h } = sa;
          // pulse state
          let aegPulses = [], aegLastPulse = 0;
          function drawAeg(t) {
            c.clearRect(0, 0, w, h);
            const cx2 = w * 0.22, cy2 = h * 0.5, r = 17;
            const auraR = Math.min(w * 0.48, h * 0.46);

            // 1. Zone background
            const zg = c.createRadialGradient(cx2, cy2, r, cx2, cy2, auraR);
            zg.addColorStop(0, 'rgba(255,0,0,0.02)'); zg.addColorStop(0.7, 'rgba(200,0,0,0.04)'); zg.addColorStop(1, 'rgba(220,0,0,0.16)');
            c.fillStyle = zg; c.beginPath(); c.arc(cx2, cy2, auraR, 0, Math.PI * 2); c.fill();

            // 2. Limit boundary ring (red)
            c.strokeStyle = 'rgba(255,40,40,0.85)'; c.lineWidth = 2.5;
            c.beginPath(); c.arc(cx2, cy2, auraR, 0, Math.PI * 2); c.stroke();
            // Gold dashed inner
            c.save(); c.translate(cx2, cy2); c.rotate(t / 5000);
            c.strokeStyle = 'rgba(255,215,0,0.6)'; c.lineWidth = 1.5; c.setLineDash([10, 8, 3, 8]);
            c.beginPath(); c.arc(0, 0, auraR - 5, 0, Math.PI * 2); c.stroke(); c.setLineDash([]); c.restore();
            // 4 bracket locks
            c.save(); c.translate(cx2, cy2); c.rotate(-t / 8000);
            c.strokeStyle = 'rgba(255,255,255,0.85)'; c.lineWidth = 3;
            for (let i = 0; i < 4; i++) { c.beginPath(); c.arc(0, 0, auraR, i * Math.PI / 2 - 0.08, i * Math.PI / 2 + 0.08); c.stroke(); }
            c.restore();

            // 3. Pulse waves (gold → red)
            if (t - aegLastPulse > 1500) { aegPulses.push({ st: t, dur: 1400, sr: r * 1.2, er: auraR }); aegLastPulse = t; }
            for (let pi = aegPulses.length - 1; pi >= 0; pi--) {
              const p = aegPulses[pi]; const tp = (t - p.st) / p.dur;
              if (tp >= 1) { aegPulses.splice(pi, 1); continue; }
              const et = 1 - Math.pow(1 - tp, 2.5); const cr = p.sr + et * (p.er - p.sr); const al = (1 - tp) * 0.75;
              const gCol = Math.floor(215 * (1 - tp));
              c.strokeStyle = `rgba(255,${gCol},0,${al})`; c.lineWidth = 4 * (1 - tp) + 1;
              c.beginPath(); c.arc(cx2, cy2, cr, 0, Math.PI * 2); c.stroke();
              c.save(); c.translate(cx2, cy2); c.rotate(tp * Math.PI * 0.5);
              c.strokeStyle = `rgba(255,255,255,${al * 0.7})`; c.lineWidth = 1; c.setLineDash([5 + tp * 10, 8]);
              c.beginPath(); c.arc(0, 0, cr * 0.94, 0, Math.PI * 2); c.stroke(); c.setLineDash([]); c.restore();
            }

            // 4. Custos shield (gold)
            const shieldR = r * 1.65;
            const sp = 0.8 + 0.2 * Math.sin(t / 150);
            c.strokeStyle = `rgba(255,215,0,${sp})`; c.lineWidth = 2.5;
            c.fillStyle = 'rgba(255,215,0,0.07)';
            c.beginPath(); c.arc(cx2, cy2, shieldR, 0, Math.PI * 2); c.fill(); c.stroke();
            c.save(); c.translate(cx2, cy2); c.rotate(t / 3000);
            c.strokeStyle = 'rgba(255,255,255,0.6)'; c.lineWidth = 0.8;
            c.beginPath();
            for (let i = 0; i < 12; i++) { const a = (i / 12) * Math.PI * 2, na = ((i + 3) / 12) * Math.PI * 2; c.moveTo(Math.cos(a) * shieldR, Math.sin(a) * shieldR); c.lineTo(Math.cos(na) * shieldR, Math.sin(na) * shieldR); }
            c.stroke(); c.restore();

            // 5. Armillary rings
            c.save(); c.translate(cx2, cy2);
            c.strokeStyle = 'rgba(200,200,220,0.8)'; c.lineWidth = 2;
            c.save(); c.rotate(t / 1500); c.scale(1, 0.3 + 0.1 * Math.sin(t / 1000));
            c.beginPath(); c.arc(0, 0, r * 1.35, 0, Math.PI * 2); c.stroke(); c.restore();
            c.save(); c.rotate(-t / 1800 + Math.PI / 4); c.scale(0.35 + 0.15 * Math.sin(t / 1200), 1);
            c.strokeStyle = 'rgba(255,100,100,0.7)';
            c.beginPath(); c.arc(0, 0, r * 1.45, 0, Math.PI * 2); c.stroke(); c.restore();
            c.restore();

            // 6. Shell body
            c.save(); c.translate(cx2, cy2);
            const sg = c.createRadialGradient(0, 0, r * 0.4, 0, 0, r);
            sg.addColorStop(0, '#e0e0e0'); sg.addColorStop(0.5, '#7a7a7a'); sg.addColorStop(0.85, '#2b2b2b'); sg.addColorStop(1, '#050505');
            c.fillStyle = sg; c.strokeStyle = '#444'; c.lineWidth = 1.5;
            c.beginPath(); c.arc(0, 0, r, 0, Math.PI * 2); c.fill(); c.stroke();
            c.rotate(-t / 4000); c.strokeStyle = 'rgba(0,0,0,0.7)'; c.lineWidth = 1;
            for (let i = 0; i < 8; i++) { const a = (i / 8) * Math.PI * 2; c.beginPath(); c.moveTo(Math.cos(a) * r * 0.3, Math.sin(a) * r * 0.3); c.lineTo(Math.cos(a) * r * 0.98, Math.sin(a) * r * 0.98); c.stroke(); }
            c.restore();

            // 7. Mechanical iris
            c.save(); c.translate(cx2, cy2);
            const iR = r * 0.45;
            c.fillStyle = '#050000'; c.beginPath(); c.arc(0, 0, iR, 0, Math.PI * 2); c.fill();
            const cb = 0.85 + 0.2 * Math.abs(Math.sin(t / 750));
            const cg2 = c.createRadialGradient(0, 0, 0, 0, 0, iR * cb);
            cg2.addColorStop(0, '#fff'); cg2.addColorStop(0.2, '#ffdd44'); cg2.addColorStop(0.5, '#ff2200'); cg2.addColorStop(1, 'transparent');
            c.fillStyle = cg2; c.beginPath(); c.arc(0, 0, iR * cb, 0, Math.PI * 2); c.fill();
            c.rotate(t / 2000); c.fillStyle = '#111'; c.strokeStyle = '#ff8888'; c.lineWidth = 0.8;
            for (let i = 0; i < 6; i++) { c.save(); c.rotate((i / 6) * Math.PI * 2); c.beginPath(); c.moveTo(iR * 0.4, 0); c.lineTo(iR, -iR * 0.4); c.lineTo(iR, iR * 0.4); c.closePath(); c.fill(); c.stroke(); c.restore(); }
            c.fillStyle = `rgba(255,255,255,${0.8 + 0.2 * Math.sin(t / 100)})`;
            c.beginPath(); c.arc(0, 0, r * 0.12, 0, Math.PI * 2); c.fill();
            c.restore();

            // ── LUMEN NOVA ──
            const novaPhase = (t % 5000) / 5000;
            const novaTargets = [[w * 0.6, h * 0.75], [w * 0.45, h * 0.25], [w * 0.75, h * 0.35], [w * 0.85, h * 0.7]];
            if (novaPhase < 0.3) {
              const wA = novaPhase / 0.3;
              novaTargets.forEach(([tx, ty], ti) => {
                c.strokeStyle = `rgba(255,0,0,${wA * 0.1})`; c.lineWidth = 16;
                c.beginPath(); c.moveTo(cx2, cy2); c.lineTo(tx, ty); c.stroke();
                c.strokeStyle = `rgba(255,100,100,${wA * 0.75})`; c.lineWidth = 1.2;
                c.setLineDash([8, 8]); c.beginPath(); c.moveTo(cx2, cy2); c.lineTo(tx, ty); c.stroke(); c.setLineDash([]);
                c.fillStyle = `rgba(255,80,80,${wA * 0.8})`; c.beginPath(); c.arc(tx, ty, 4, 0, Math.PI * 2); c.fill();
                c.fillStyle = `rgba(255,100,100,${wA * 0.6})`; c.font = '6px Share Tech Mono,monospace'; c.textAlign = 'center';
                c.fillText(ti === 0 ? 'PLAYER' : 'SENTINEL', tx, ty - 7); c.textAlign = 'left';
              });
            } else if (novaPhase < 0.45) {
              const fA = 1 - (novaPhase - 0.3) / 0.15;
              novaTargets.forEach(([tx, ty]) => {
                c.strokeStyle = `rgba(255,30,30,${fA * 0.5})`; c.lineWidth = 25 * fA;
                c.beginPath(); c.moveTo(cx2, cy2); c.lineTo(tx, ty); c.stroke();
                c.strokeStyle = `rgba(255,255,255,${fA * 0.9})`; c.lineWidth = 4 * fA;
                c.beginPath(); c.moveTo(cx2, cy2); c.lineTo(tx, ty); c.stroke();
