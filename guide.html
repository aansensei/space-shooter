<!--
  guide.html

  Standalone reference page for game mechanics, skill info, and enemy data.
  Zero game engine code loads here. Nothing is shared with the js folder.

  Tab navigation is pure HTML, CSS, and JS with no framework. Each tab renders
  skill stats or enemy info next to a live canvas demo. Every demo runs its own
  requestAnimationFrame loop that is entirely local to this file.

  All mini animations are drawn with Canvas 2D from scratch. They show how
  skills and enemies behave visually without reusing any engine code. CSS vars
  at the top (--cyan, --purple, --gold etc) keep the neon color palette
  consistent across all sections.

  Visiting this page auto-pauses the main game bc input.js listens to the
  document visibilitychange event and sets gamePaused to true whenever the
  tab goes hidden.
-->
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pisces: Space Journey — General Guide</title>
  <script>
    // Loading all 5 font families (12 separate font files across weights)
    // regardless of language doubles this page's network weight for no
    // benefit — VI mode overrides every element to Sora anyway (see the
    // body.lang-vi rule below), so Orbitron/Rajdhani/Cinzel/Share Tech Mono
    // are dead weight for VI users, and Sora is dead weight for EN users.
    // Only request the family set the current language actually uses.
    (function () {
      var lang;
      try { lang = (window.parent && window.parent._lang) || 'en'; } catch (e) { lang = 'en'; }
      var href = lang === 'vi'
        ? 'https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&display=swap'
        : 'https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;500;600;700&family=Share+Tech+Mono&family=Cinzel:wght@400;700;900&display=swap';
      var link = document.createElement('link');
      link.rel = 'stylesheet';
      link.href = href;
      document.head.appendChild(link);
    })();
  </script>
  <style>

    /* Rajdhani/Orbitron/Cinzel/Share Tech Mono render Vietnamese combining
       diacritics with visible glyph-shaping artifacts (not a missing-glyph
       case, so a plain font-family fallback never kicks in) — force every
       element to a font known to shape Vietnamese correctly while VI is active.
       Sora: a sleek geometric sans with full Vietnamese coverage, closer in
       spirit to Orbitron/Rajdhani than a heavier grotesk like Be Vietnam Pro. */
    body.lang-vi, body.lang-vi * {
      font-family: 'Sora', sans-serif !important;
    }
    /* Vietnamese sigil buff/theme text runs noticeably longer than the
       English original — the flip-cards are aspect-ratio-locked (not
       content-sized), so without this the extra text bleeds past the card
       into whatever sits below it. Give VI cards more room and trim the
       type scale slightly instead of reflowing the whole grid. */
    /* aspect-ratio locks card height to its (grid-derived) width regardless
       of content, so longer VI text either clips or bleeds into the card
       below — no amount of shrinking text reliably wins that fight. Instead,
       let the front face size itself in normal flow (only it stays static;
       the back face still overlays it absolutely for the flip animation),
       so the card is exactly as tall as its own translated text needs. */
    body.lang-vi .sfc { aspect-ratio: unset; }
    body.lang-vi .sfc-inner { height: auto; }
    body.lang-vi .sfc-front { position: relative; height: auto; min-height: 280px; }
    body.lang-vi .sfc-back { position: absolute; inset: 0; height: 100%; }
    body.lang-vi .sfc-row { font-size: 10px; line-height: 1.36; }
    body.lang-vi .sbd { font-size: 9.5px; }
    body.lang-vi .sfc-theme { font-size: 8px; letter-spacing: 1.2px; }
    body.lang-vi .sfc-name { font-size: 11px; letter-spacing: 2px; }

<body>
  <button id="guideBtn">⬡ Guide</button>
  <div id="guideOverlay">
    <div id="guideModal">
      <div class="guide-header">
        <div>
          <h1>GENERAL GUIDE</h1>
          <div class="sub">PISCES: SPACE JOURNEY — COMBAT MANUAL</div>
        </div><button id="closeBtn">✕</button>
      </div>
      <div class="tab-nav">
        <button class="tab-btn active" data-tab="basics">Basics</button>
        <button class="tab-btn" data-tab="passives">Passives</button>
        <button class="tab-btn" data-tab="skills">Skills</button>
        <button class="tab-btn" data-tab="sigils">Sigils</button>
        <button class="tab-btn" data-tab="enemies">Enemies</button>
        <button class="tab-btn" data-tab="rules">Combat</button>
        <button class="tab-btn" data-tab="updatelog">Update Log</button>

      <div class="guide-body" id="guideBody"></div>
    </div>
  </div>

  <script>
    // ═══════════════════════════════════════════════════════════════
    // PREVIEW HARNESS — mock game state so the REAL js/render/*.js draw
    // functions (loaded below via <script src>) can run against small
    // per-widget canvases, instead of guide.html hand-drawing its own
    // approximations. Mirrors js/config.js's globals as `let` (not
    // `const`) so canvas/ctx/etc. can be swapped per widget — config.js
    // itself is NOT included: it does `const canvas =
    // document.getElementById("gameCanvas")` at top level, which needs
    // a real #gameCanvas and can't be reassigned.
    //
    // NOTE: _gfxLevel and _mobPerf are NOT declared here — core.js (see
    // script includes below) already declares them (`let _gfxLevel = 0`,
    // `let _mobPerf = false`), and every classic <script> on this page
    // shares one global lexical scope, so redeclaring either here would
    // be a fatal SyntaxError (see js/render/README.md's debugging
    // checklist, point 3). Their core.js defaults (HIGH quality, not
    // mobile) are exactly what these widgets want anyway.
    // ═══════════════════════════════════════════════════════════════
    let canvas = null, ctx = null;
    let gameElapsedTime = 0;
    let player = { x: 0, y: 0, width: 40, height: 40, speed: 8.6, hitRadius: 5.75 };
    let playerClones = [];
    let bullets = [], enemies = [], explosions = [], particles = [], chainLightningEffects = [];
    let demonGiftEffect = { active: false, endTime: 0 };
    let gloryForJusticeActive = false;
    let finalDefense = { playerShield: true, boundaryShield: true, playerCooldownEnd: 0, boundaryCooldownEnd: 0 };
    let hasTriggeredLastStand = false;
    let playerAbsoluteShield = false;
    let bossShockwaves = [];
    let aegisLasers = [];
    let marchosiasBlades = [];
    let accurateParryActive = false;
    let sentinels = [];

    function _egregorGenBolt(x1, y1, x2, y2, detail, jitter) {
      const pts = [{ x: x1, y: y1 }];
      const dx = x2 - x1, dy = y2 - y1;
      for (let i = 1; i < detail; i++) {
        const t = i / detail;
        const s = Math.sin(t * Math.PI);
        pts.push({ x: x1 + dx * t + (Math.random() - 0.5) * jitter * 2 * s, y: y1 + dy * t + (Math.random() - 0.5) * jitter * 2 * s });
      }
      pts.push({ x: x2, y: y2 });
      return pts;
    }

    function _triggerAccurateParry() {

    const _particlePool = [];
    function _acquireParticle() {
      const p = _particlePool.length > 0 ? _particlePool.pop() : {};
      p.isSummonRing = false; p.isLaserLine = false; p.isSkillGAura = false; p._isTriangle = false;
      p.isBarrierBreakRing = false;
      p.vx = 0; p.vy = 0;
      return p;
    }
    function _releaseParticle(p) {
      if (_particlePool.length < 600) _particlePool.push(p);
    }
    function createParticles(x, y, count, color, minSpeed, maxSpeed) {
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * (maxSpeed - minSpeed) + minSpeed;
        const lt = 300 + Math.random() * 200;
        const p = _acquireParticle();
        p.x = x; p.y = y;
        p.vx = Math.cos(angle) * speed; p.vy = Math.sin(angle) * speed;
        p.lifetime = lt; p.maxLifetime = lt;
        p.size = 1 + Math.random() * 2; p.color = color;
        particles.push(p);
      }
    }
    function addExplosion(x, y, size, color = 'orange') {
      let finalColor = color === 'electric_blue' ? '#00FFFF' : color;
      explosions.push({ x, y, size, lifetime: 500, maxLifetime: 500, color: finalColor });
      createParticles(x, y, 8, finalColor, 1, 5);
    }
    // Minimal physics tick for particles/explosions — the real game's
    // main.js update loop does this; these widgets only need the basic
    // motion+lifetime decay, not the full particle-type-specific logic.
    function _tickParticlesAndExplosions(dt) {
      const dtN = dt / 16.67;
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        if (!p.isSummonRing && !p.isLaserLine && !p.isSkillGAura && !p.isBarrierBreakRing) {
          p.x += (p.vx || 0) * dtN; p.y += (p.vy || 0) * dtN;
        }
        p.lifetime -= dt;
        if (p.lifetime <= 0) { _releaseParticle(p); particles.splice(i, 1); }
      }
      for (let i = explosions.length - 1; i >= 0; i--) {
        explosions[i].lifetime -= dt;
        if (explosions[i].lifetime <= 0) explosions.splice(i, 1);
      }
    }

<div class="ul-entry" style="--ul-accent:#a855f7">
<div class="ul-head"><span class="ul-ver">v5.6 — DEATH STAR REWORK</span><span class="ul-badge">CURRENT</span><span class="ul-badge b-major">MAJOR</span></div>
<div class="ul-date">2026-08-21 · Skill D fully reworked into Death Star: Draconic Annihilation — updated 2026-08-22 with a new endgame-scaling mechanic (Walpurgis), 5 new sound effects, and a Remembrance Spirit visual upgrade</div>
<p class="det-short ul-summary">Skill D keeps its core pull-and-instakill (speed 5.25, contact = instant kill / 30% MaxHP true damage for CC-Immune enemies) but is now a full rework in name, visuals, and kit. Two new mechanics layer on top: Mark & Annihilate, a repeating cycle that marks 3 targets (CC-Immune first) and fires a piercing true-damage beam through each, and Galactic Spaceships, allied drones spawned by any enemy death near the Death Star (not just its own kills) that home in on the current highest-HP enemy, fire true-damage bolts in flight, crash for bonus damage plus a Vulnerability stack, benefit from the same ally-wide buffs Sentinels get, and can fuse with a same-tier ship nearby into a stronger one — spaceships can be shot down by enemy fire before they arrive. Cooldown 12s → 10s, refunded a further 0.25s per Death Star kill. Full visual rework: new charge sequence, mechanical-ring/debris-field body, and quality-tier scaling (FULL/MED/LOW/MIN) matching every other effect in the game. This patch also adds Walpurgis (Huyết Dạ) — a new permanent, stacking buff that hits every enemy on the field once every 10 waves, scaling Max HP, Evade, a new flat damage-reduction stat, and heal/shield effectiveness up forever — real sound for several abilities that were previously silent, a brighter, cheaper-to-render Remembrance Spirit, a new post-game Match Statistics screen, and an Elden Ring-inspired "Demigod of Genesis" boss bar for Goliath True Form.</p>
<ul class="det-full">
<li><span class="ul-tag tag-buff">BUFF</span> Cooldown <span class="hg">12s → 10s</span>. Float-away speed 10% slower than before (unrelated to the cooldown change — visual pacing only).</li>
<li><span class="ul-tag tag-nerf">NERF</span> Pull speed <span class="hg">6 → 4.2</span> (-30%), then <span class="hg">4.2 → 5.25</span> (+25%) in a follow-up pass — net -12.5% vs the original 6.</li>
<li><span class="ul-tag tag-nerf">NERF</span> <b>Glory for Justice:</b> fire rate bonus <span class="hg">×1.5 → ×1.2</span> for every source it applies to (player, Sentinels, Remembrance Spirit, Photokrystos). Damage ×1.55 is unchanged.</li>
<li><span class="ul-tag tag-buff">BUFF</span> Galactic Spaceships now count as real allied units, not just their own standalone stat block — they benefit from Blessing of the Primordial (DR/dmg/regen/shield ticks), Gaia Protection's wave-based Max HP scaling, Gaia Barrier's periodic shield pulse, Lunar Aegis's 20% evade, and now Glory for Justice too (damage ×1.55, fire rate ×1.2), the same as Sentinels.</li>
<li><span class="ul-tag tag-feat">FEAT</span> <b>Mark & Annihilate:</b> every ~2s while the Death Star is alive, marks 3 targets (CC-Immune enemies first — those can't be pulled to center at all; otherwise the 3 highest-current-HP valid targets) and, after a 1.5s telegraph, fires a piercing true-damage beam through each — <span class="dmg">100+15% EP</span>, hitting every enemy the beam crosses, not just the marked one.</li>
<li><span class="ul-tag tag-feat">FEAT</span> <b>Galactic Spaceships:</b> a Death Star kill (center instakill, a Mark & Annihilate beam, or a CC-Immune enemy finally dying from accumulated ticks) refunds <span class="hg">-0.25s</span> off Skill D's cooldown. Separately, ANY enemy death — from any source — within the Death Star's radius + 180px spawns a Tier 1 (cyan) allied spaceship. Homes toward the current highest-HP enemy, re-targeting automatically if it dies first, firing <span class="dmg">100 true dmg/250ms</span> in flight, then on contact deals <span class="dmg">100+8% EP true dmg</span> and applies 1 Vulnerability stack. 560 HP — can be shot down by enemy fire before reaching its target.</li>
<li><span class="ul-tag tag-feat">FEAT</span> <b>Spaceship Fusion:</b> 2 same-tier spaceships within 50px of each other merge into 1 higher-tier ship at their midpoint. 2 Tier 1 → 1 Tier 2 (purple), all stats x1.5 (840 HP, 150 true dmg bolt, 150+12% EP on contact). 2 Tier 2 → 1 Tier 3 (red), all Tier 2 stats x2 (1,680 HP, 300 true dmg bolt, 300+24% EP on contact) — the maximum tier.</li>
<li><span class="ul-tag tag-feat">FEAT</span> Full visual rework: new charge-phase sequence, mechanical-ring + asteroid-debris body replacing the old event-horizon/accretion-disk look, and full FULL/MED/LOW/MIN quality-tier scaling.</li>
<li><span class="ul-tag tag-feat">FEAT</span> <b>Walpurgis (Huyết Dạ):</b> every 10 waves, all enemies — including ones already on screen — permanently gain 1 stack. Each stack: <span class="hg">+10% Max HP</span>, <span class="hg">+5% Evade</span>, <span class="hg">+100 flat damage reduction</span> (a separate stat from percentage DR, applied after it, floored at 0), and <span class="hg">+5%</span> effectiveness on all healing/shields the enemy receives. A red aura marks every buffed enemy, growing more intense per stack.</li>
<li><span class="ul-tag tag-feat">FEAT</span> <b>New sound effects:</b> Aegis Core's Lumen Nova / Goliath's Joker-copy of it / Leviathan's death lasers / Skill D's Mark &amp; Annihilate beam now share a laser-fire cue; Goliath's Absolute Verdict launch, Dargruel's chain launch, and the chain-root hit on the player each got their own new cue; the player's autoshot got a replacement cue. A new generic metal-hit sound now plays for several previously-silent moments: Goliath's Iron Body absorbs, Fracture Step, Warding Palm, Joker Marchosias's Arc Barrier, and an Absolute Shield breaking.</li>
<li><span class="ul-tag tag-feat">FEAT</span> <b>Remembrance Spirit visual upgrade:</b> the idle spirit's halo rings, trailing petals, orbiting crystal fragments, and core now render from pre-baked sprites instead of recomputing gradients/shadow blur every frame — brighter, richer glow at effectively zero extra render cost.</li>
<li><span class="ul-tag tag-feat">FEAT</span> <b>Match Statistics (NEW):</b> a screen opened from Game Over, three tabs — Ally Damage, Enemy Damage, and Lives Lost — each listing every source that contributed, its cumulative total, and its % share of that tab, sorted highest first. Sigil-exclusive mechanics (Chain Lightning, Soul Devourer, etc.) count as their own distinct source. Bilingual, styled to match the rest of the game's UI.</li>
<li><span class="ul-tag tag-feat">FEAT</span> <b>"Demigod of Genesis" boss bar (NEW):</b> Goliath True Form gets a proper top-of-screen boss bar in an Elden Ring-inspired style (italic name plate, flat dark-red bar) instead of the small in-world HP number/strip. Shows current Vulnerability stacks and Soul Reaver on the left, current Shield + Barrier on the right. Healing plays a lighter "ghost" bar that the solid bar catches up to instead of snapping instantly. During Unbroken Will's 3.5s invulnerability window the bar locks full-width with a frosted/icy look — real HP genuinely can't change during that window (same absolute Iron Body rule as the post-transform window), so the bar doesn't pretend otherwise.</li>
<li><span class="ul-tag tag-fix">FIX</span> The sigil-pick overlay (a full-screen click-catcher) could get stuck covering everything — including the title screen's Hyperjump button — if the player backed out to Main Menu mid-pick via Esc instead of confirming a sigil.</li>
<li><span class="ul-tag tag-fix">FIX</span> The low-HP heartbeat/ringing loop kept playing under the Game Over music instead of stopping on death, clashing badly with it — it only ever stops once the frame after death, and by then the game had already stopped running that check.</li>
<li><span class="ul-tag tag-fix">FIX</span> <b>Goliath vs. Vulnerability:</b> a fight that runs long enough gets hit by so many independent Vulnerability sources that its stacks cycle back to 4 almost as soon as they lapse, keeping the true-damage window active for nearly the whole fight instead of the intended short burst. Goliath specifically now has a 5s cooldown between windows that only starts counting once the window itself ends; every other enemy is unaffected.</li>
<li><span class="ul-tag tag-balance">BALANCE</span> <b>Vulnerability's 4-stack window</b> reworked: <b>2s → 2.5s</b> duration, and it no longer converts the whole hit to true damage (which made Shield worthless during the window) — the hit still eats Shield/barriers normally, and gets a bonus true damage kicker instead, decaying <span class="hg">+40% → +20%</span> of the hit's damage linearly across the window. When the window expires it now deals <span class="hg">500 base true damage</span> and fully resets the enemy's stacks, instead of just quietly ending.</li>
<li><span class="ul-tag tag-fix">FIX</span> <b>Soul Reaver</b> never actually expired — once applied it stuck on the enemy for the rest of the fight. It now correctly lasts <b>2s</b> per application, same as its intended design.</li>
<li><span class="ul-tag tag-fix">FIX</span> <b>Mute button didn't stop sounds already in progress</b> — pressing it only silenced sounds started afterward; anything mid-playback (a long cue like Game Over, an explosion) kept playing out to the end. Muting now cuts every sound immediately, in flight or not.</li>
<li><span class="ul-tag tag-fix">FIX</span> Background music now also ducks quieter during Goliath's transform cue, matching every other sound instead of being the one exception.</li>
</ul>
</div>

<div class="ul-entry" style="--ul-accent:#22c55e">
<div class="ul-head"><span class="ul-ver">v5.5 — VIETNAMESE LANGUAGE SUPPORT</span><span class="ul-badge b-major">MAJOR</span></div>
<div class="ul-date">2026-08-04 · Full English/Vietnamese language switcher for the Settings panel, the Guide, and the in-game sigil picker</div>
<p class="det-short ul-summary">Added a Language dropdown in Settings (English / Tiếng Việt), persisted per-device via localStorage and defaulting to English. Switching language re-translates the Settings panel, the in-game sigil picker (card names, elements, buff text, and the picker's own title/Confirm/Reroll UI), and every Guide tab except Enemies-heavy edge cases and the dev changelog. Vietnamese resources ship inside the existing offline Basic package — no separate download needed. Also fixed a real-device rendering bug where Vietnamese diacritics broke on the Guide's stylized display fonts, and redesigned the Settings Language/Offline dropdowns to match the existing In-Game Music dropdown's styling.</p>
<ul class="det-full">
<li><span class="ul-tag tag-feat">FEAT</span> <b>Language switcher:</b> new Settings dropdown (English / Tiếng Việt), saved to <code>localStorage</code> and applied on load. English remains the canonical/default language.</li>
<li><span class="ul-tag tag-feat">FEAT</span> <b>Sigil localization:</b> sigil names, elements, and buff name/description text render in Vietnamese in both the in-game picker and the Guide's Sigils tab, without touching the underlying English data used by game logic (element-based effect checks, buff IDs, etc. are untouched).</li>
<li><span class="ul-tag tag-feat">FEAT</span> <b>Guide translation:</b> Basics, Passives, Skills, Sigils, and Rules tabs fully translated; Music Archive translated; Enemies tab translated. Update Log stays English (dev changelog).</li>
<li><span class="ul-tag tag-feat">FEAT</span> <b>Settings dropdown redesign:</b> Language and Offline Package selectors now use the same custom button + dropdown-list styling as the existing In-Game Music selector, instead of a plain native <code>&lt;select&gt;</code>.</li>
<li><span class="ul-tag tag-fix">FIX</span> <b>Vietnamese font rendering:</b> Orbitron/Rajdhani/Cinzel/Share Tech Mono render several Vietnamese combining diacritics with visible glyph artifacts. The Guide now forces a Vietnamese-safe font (Sora) whenever the language is set to Vietnamese.</li>
<li><span class="ul-tag tag-fix">FIX</span> <b>Sigil card overflow:</b> Vietnamese sigil card text is longer than the English original; cards were aspect-ratio-locked and either clipped or bled into the row below. Cards now size to their own translated content instead.</li>
<li><span class="ul-tag tag-fix">FIX</span> <b>Offline update wiping cache while offline:</b> installing a new Service Worker version while offline silently failed to re-fetch every app-shell file, and the old (working) cache was then deleted unconditionally on activate — leaving offline play broken until back online. The old cache is now kept as a fallback until the new one is confirmed populated.</li>
</ul>
</div>

<div class="ul-entry" style="--ul-accent:#f59e0b">
<div class="ul-head"><span class="ul-ver">v5.4 — GOLIATH &amp; LEVIATHAN BUFF</span><span class="ul-badge b-major">MAJOR</span></div>
<div class="ul-date">2026-07-30 · New Digiform-tier boss testbed for the future Administrator class, plus Leviathan's Inevitable/Bulwark Barrier buffs and a Perseverance/Last Rites visual overhaul</div>
<p class="det-short ul-summary">Goliath is a new boss built around absorbing power from the rest of the wave. It spawns as an untargetable, invulnerable Alpha orb that links to every other enemy on screen and pulls a share of the damage they take; when three colored gem sockets fill from the deaths of linked Abnormal-tier+ enemies, it fuses into its True Form — a golem-like body wielding whichever three abilities it absorbed, on top of its own kit (Inevitable, Fracture Step, Absolute Verdict, Warding Palm, Threshold Ward). Also in this patch: Leviathan's Inevitable protection triggers more easily and lasts longer, a new Bulwark Barrier passive grants a stacking shield, and Perseverance/Last Rites both got a full visual rework.</p>
<ul class="det-full">
<li><span class="ul-tag tag-buff">BUFF</span> <b>Leviathan — Inevitable:</b> protection trigger threshold 30% → 20% of Max HP per hit, window duration 2.5s → 3s (still a 2s cooldown after it ends).</li>
<li><span class="ul-tag tag-feat">FEAT</span> <b>Alpha phase:</b> spawns near the top of the screen, 1 HP, absolute invulnerability, fully untargetable. Circuit Link connects it to every current enemy — up to 80% of an enemy's own Max HP per hit is redirected into Goliath's Damage Pull ledger instead of killing them outright.</li>
<li><span class="ul-tag tag-feat">FEAT</span> <b>Corrupted Genesis:</b> when a linked Abnormal-tier-or-higher enemy dies, a colored gem drops and flies into one of Alpha's 3 sockets (a slight shockwave shake plays on impact). Filling all 3 with distinct gems triggers Transition.</li>
<li><span class="ul-tag tag-feat">FEAT</span> <b>Alpha passive — Feeding Ground:</b> the instant Goliath spawns, ceil(1/3) of the current wave's enemies are consumed outright, and every survivor gains +15% Max HP.</li>
<li><span class="ul-tag tag-feat">FEAT</span> <b>Transition:</b> a 4-stage transform sequence — meteors converge and fuse into a molten mass, then crystallize into the True Form body, then both arms pop out and settle.</li>
<li><span class="ul-tag tag-feat">FEAT</span> <b>True Form — Inevitable:</b> a 1.5s absolute Iron Body immediately upon transforming into True Form, 70% base damage reduction, permanent CC immunity, 2%/s regen, plus a 2s 5%-max-hit cap window whenever a single hit exceeds 10% Max HP. Only piercing, true damage, and DoT hits land at full value — every other hit (regular %HP/%EP damage, including basic auto-fire) is hard-capped at 1.6% Max HP per hit, +0.5% per stack of any debuff currently on Goliath, capped at 3% Max HP total.</li>
<li><span class="ul-tag tag-feat">FEAT</span> <b>True Form — Fracture Step:</b> teleports when a threat closes within 100px (or every 2s regardless), gaining a 3-hit damage-absorbing Iron Body layer each time. The teleport itself is a slow two-stage magic-circle portal (close at the old spot, reopen at the new one) rather than an instant blink.</li>
<li><span class="ul-tag tag-feat">FEAT</span> <b>True Form — Absolute Verdict:</b> a 3s channel (both arms clasp at the eye) fires a piercing orb that tracks the player's position only up until 0.5s before launch, then locks — dealing 35% Max HP true damage to a Sentinel or costing the player 5 lives.</li>
<li><span class="ul-tag tag-feat">FEAT</span> <b>True Form — Warding Palm:</b> incoming hits from Skill F, Skill D, or the Photokrystos finale laser have a 30% chance to be deflected down to just 15% of Goliath's Max HP; the origin power behind these hits is simply too strong to fully block, so the other 70% of the time it lands for a full 40% of Max HP — every hit, no lifetime cap. This rule (like every other Goliath rule) overrides any sigil that would otherwise pierce it.</li>
<li><span class="ul-tag tag-feat">FEAT</span> <b>True Form — Threshold Ward:</b> crossing the 75/50/25% HP milestones each grants a +15% Max HP shield pool; the pool healing back across a milestone restores HP up to that threshold.</li>
<li><span class="ul-tag tag-feat">FEAT</span> <b>True Form — Corrupted Meteor (NEW, CD 5s):</b> Goliath raises a hand and pulls a random living Apostle into a compressed meteor core over 0.8s, then hurls it at the player. Hitting the player costs 1 life; hitting a Sentinel explodes for 25% of that Sentinel's own Max HP as splash damage to nearby Sentinels.</li>
<li><span class="ul-tag tag-feat">FEAT</span> <b>Joker system:</b> True Form gains working copies of exactly the 3 abilities tied to its absorbed gems (out of 7 possible: Veilshroud's Phantom + lightning, Thaelis's Tenacity, Aegis Core's Lumen Nova, Marchosias's Sword &amp; Barrier, Egregor's Null Slash, Dargruel's Maou Haki, Leviathan's Perseverance) — each rebalanced and re-telegraphed against the real source skill's own timing, size, and warning zones rather than a rough approximation. (Corrected after initial ship: Egregor's copy was originally the wrong skill — Psychic Tempest instead of Null Slash — and Marchosias's copy was a flat DR bonus instead of the real Arc Barrier; both now match the source skill properly, and Thaelis/Leviathan's copies gained missing mechanics.)</li>
<li><span class="ul-tag tag-feat">FEAT</span> <b>Casting restriction (NEW):</b> while channeling any skill (its own or a Joker copy's), Goliath slows 35%, cannot Fracture Step, gains +10% DR for the duration, and heals 15% Max HP once at the moment the cast begins.</li>
<li><span class="ul-tag tag-feat">FEAT</span> <b>Movement:</b> True Form drifts slowly across most of the screen (biased toward the upper area, away from the bottom) instead of holding a fixed spot, and always renders above the Sigil HUD so it's never obscured while flying near the top edge.</li>
<li><span class="ul-tag tag-feat">FEAT</span> <b>Leviathan — Inevitable (NEW):</b> Leviathan's own bullets destroy player auto bullets, sentinel bullets, and both spirits' bullets on contact — including ones that would normally pierce straight through.</li>
<li><span class="ul-tag tag-feat">FEAT</span> <b>Leviathan — Bulwark Barrier (NEW passive):</b> every 1s, gains a shield layer worth 0.5% Max HP × enemies currently on screen (each layer capped at 15% Max HP), up to 2 layers stacked (~30% Max HP total). Resets once the shield fully depletes.</li>
<li><span class="ul-tag tag-feat">FEAT</span> <b>Leviathan — All for One (NEW grace):</b> the instant the Iron Body shield breaks, Leviathan gets a one-time 50% Max HP barrier plus 90% DR for 1s.</li>
<li><span class="ul-tag tag-feat">FEAT</span> <b>Leviathan — Inevitable (NEW emergency trigger):</b> the instant Leviathan's HP first crosses 50%, the protection window activates immediately regardless of hit size or cooldown.</li>
<li><span class="ul-tag tag-feat">FEAT</span> <b>Leviathan — Perseverance visual overhaul:</b> the charge telegraph is now a collapsing black-hole well — counter-rotating event-horizon rings, particles spiraling into the core, and a layered void/red/white core glow. The sweeping beam itself gained a void-purple outer haze, a breathing red danger layer, crackling energy branches, and a rotating energy collar at the origin.</li>
<li><span class="ul-tag tag-feat">FEAT</span> <b>Leviathan — Last Rites visual overhaul:</b> each wing now shows a power-surge band traveling toward the tip as it charges plus tip sparks once nearly ready, and the warning line layers void-purple under red-orange. The active beams match Perseverance's new layered look and add a one-time shockwave ring at the origin the instant all 9 fire.</li>
<li><span class="ul-tag tag-fix">FIX</span> A rendering scale bug had every True Form overlay effect (Joker telegraphs, Inevitable aura, Fracture Step flash, Threshold Ward, Warding Palm) drawn inside the body's cosmetic scale transform, silently shrinking them and misplacing anything anchored to a far-off point (laser lines, falling lightning). All overlay effects now draw in true 1:1 world coordinates.</li>
<li><span class="ul-tag tag-fix">FIX</span> Several Joker copies (Aegis Core's laser, Veilshroud's lightning) applied damage unconditionally to their locked targets instead of re-checking the target's actual position at the moment of impact — dodging out of the telegraphed zone did nothing. Both now match their real source skill's own hit-check exactly.</li>
<li><span class="ul-tag tag-fix">FIX</span> Skill F's sweep never routed its actual kill through the shared damage function for non-special-cased enemies (it just zeroed HP directly), so it silently bypassed Goliath's invulnerability, Fracture Step's absorb layer, and the Warding Palm cap. It now goes through the shared damage path like every other enemy's special case already did.</li>
<li><span class="ul-tag tag-fix">FIX</span> Two sigil effects (Death Mark's ≤5%-HP instakill, Compound Interest's shield/DR-bypassing flat damage) ignored Goliath's own defensive rules entirely. Both now exclude Goliath, matching Alpha's invulnerability check.</li>
</ul>
</div>

<div class="ul-entry" style="--ul-accent:#a78bfa">
<div class="ul-head"><span class="ul-ver">v5.3 — SIGIL REWORK, BALANCE PASS &amp; ZODIAC REWORKS</span><span class="ul-badge">PATCH</span></div>
<div class="ul-date">2026-07-22 to 2026-07-24 · Libra/Gemini sigil reworks, full 12-sigil balance pass + reroll system, Leo/Virgo rework, Aries rework</div>
<p class="det-short ul-summary">A four-part sigil overhaul, newest first in the list below but chronologically: Libra and Gemini first got new signature abilities (Blood Arrow, Astral Pierce, Shadow Twin) plus a fix for a severe Skill A targeting bug. Then a full 12-sigil balance pass added a reroll system (2 shared rerolls across a run's 3 picks) and a flat +15% HP buff to every enemy. Leo and Virgo followed — Virgo's Golden Arrow became Forest Guardian with a new vine-log sweep, Leo's Lion's Roar gained missing-HP scaling. Finally, Aries's Blood Frenzy was folded into Vanguard itself, freeing a slot for the new Onslaught fireball-relay ability.</p>
<ul class="det-full">
<li><span class="ul-tag tag-buff">BUFF</span> <b>Libra — Blood Arrow (NEW, replaces Riposte):</b> every Skill A cast fires 3 plasma arrows after a 0.5s windup — 1 big arrow marking the highest-EP enemy, plus 2 smaller arrows marking random enemies biased toward denser clusters. Each pierces every enemy it passes for 300 dmg, then explodes on its own marked target for 400 + 20% PE (up to +100% more based on the target's DR), applying 2 Vulnerability stacks to everything it touches. The 2 small arrows deal 40% less damage but fly 20% faster; the big one is 15% bigger. Bigger, brighter purple-red/magenta flame visual with flickering flame licks (was a small orange sprite). Banks the shot if no enemy is on screen yet, firing the instant one appears. Immune to Maou Haki and the Perseverance sweep, same as photoBrangs and blade arcs.</li>
<li><span class="ul-tag tag-buff">BUFF</span> <b>Libra — Astral Pierce (NEW):</b> replaces Law of Scales. Skill A orbs now punch straight through their target on impact instead of disappearing, continuing to the screen edge and damaging every other enemy they cross.</li>
<li><span class="ul-tag tag-buff">BUFF</span> <b>Gemini — Shadow Twin reworked:</b> the trigger is now every 10th hit landed by any allied source (Sentinels excluded), not just auto-fire. It charges for 0.5s, then a phantom twin ship flickers into existence at a random screen edge — inset so it's actually visible — and fires 3 volleys 200ms apart at random enemies clear across the screen, each volley 1 large orb flanked by 2 small orbs, in a red-purple plasma color, sized +25% up from the first pass. Small orb: 75 + 3% EP. Large orb: 175 + 8% EP. Every hit applies 2 Vulnerability stacks and Soul Reaver. 1s cooldown before it can trigger again. Immune to Maou Haki and the Perseverance sweep, same as Sol Arrow.</li>
<li><span class="ul-tag tag-buff">BUFF</span> <b>Sigil Reroll (NEW):</b> the sigil picker now has a reroll button next to Confirm. Every run gets exactly 2 reroll uses shared across all 3 picks (waves 1, 5, 10) — spend both on the first pick and the later ones get none.</li>
<li><span class="ul-tag tag-buff">BUFF</span> <b>Aries — Vanguard:</b> pierce chance 30% → 40%, auto-fire damage bonus +20% → +50%.</li>
<li><span class="ul-tag tag-buff">BUFF</span> <b>Taurus — Iron Fortress:</b> max stacks 2 → 3.</li>
<li><span class="ul-tag tag-buff">BUFF</span> <b>Taurus — Guardian reworked:</b> +65% HP / +30% dmg (was +60%/+25%), sentinel normal shots no longer cost 1 HP recoil at all. On death, the reward is no longer a shield reserved for the next spawned sentinel — instead every surviving sentinel immediately heals 10% of the dead one's EP and gains a shield worth 20% of its EP (3.5s CD).</li>
<li><span class="ul-tag tag-buff">BUFF</span> <b>Gemini — Mirror Laser:</b> gained a second effect — every skill cast or auto-fire shot has a 5% chance (+0.3% pity per miss, resets on trigger) to fire an independent piercing green-purple laser column (350 + 18% EP every 125ms for 3s, no enemy pull, 4s CD). Stacks with Overload Laser.</li>
<li><span class="ul-tag tag-buff">BUFF</span> <b>Cancer — Lunar Aegis:</b> Gaia Barrier absorption +35% → +40%, sentinel evade +10% → +20%.</li>
<li><span class="ul-tag tag-buff">BUFF</span> <b>Libra — Astral Pierce:</b> Skill A orb size +30%.</li>

<div class="ul-entry" style="--ul-accent:#f87171">
<div class="ul-head"><span class="ul-ver">v5.2 — MOBILE STABILITY &amp; FX/AUDIO OVERHAUL</span><span class="ul-badge">PATCH</span></div>
<div class="ul-date">2026 · Sigil picker crash + mobile layout fixes, mobile perf Tier 3, Skill F/Overload Laser FX pass, Maou Haki/Low-HP visuals, Egregor signature audio pass, full audio engine rewrite (iOS Safari 1fps fix), mobile WebGL restored</div>
<p class="det-short ul-summary">Fixed a crash on Mobile mode that blocked the sigil Confirm button, plus mobile perf (Smart Quality Tier 3, background sprite density, a pixi-canvas resize desync causing misaligned bullets) and Settings panel fixes. Skill F and Overload Laser both got a full visual pass; Maou Haki and low-HP states got new visuals. Egregor — the game's signature monster — now has a dedicated, elaborate audio treatment: windup, slash, hit, a continuous crawl texture, and a death roar, alongside new Charged Shot, Dimensional Rift, Dimension Break, and Wave Cleared cues. Root-cause fix for severe iOS Safari lag (1 fps mid-game): all audio — every BGM loop, ambient/engine drone, and every one-shot SFX pool — was rewritten from <code>&lt;audio&gt;</code> elements to <code>AudioBufferSourceNode</code>, eliminating the main-thread stall that <code>&lt;audio&gt;</code> scheduling caused between rAF callbacks on real devices. Mobile WebGL parallax background restored (previously disabled as a workaround). Yog-Sothoth Domain audio fixed on mobile, heartbeat + muffled mix no longer persist after returning to the main menu.</p>
<ul class="det-full">
<li><span class="ul-tag tag-fix">FIX</span> <b>Mobile Sigil Picker crash:</b> selecting a sigil in Mobile mode threw a script error every frame, which silently prevented the Confirm button from ever being drawn — stalling progress at every sigil pick. This was the likely cause of the repeated "System Terminated" freezes reported on phones.</li>
<li><span class="ul-tag tag-fix">FIX</span> <b>Mobile Sigil Picker layout:</b> card sizing now scales responsively so the Confirm button always has room on short landscape viewports.</li>
<li><span class="ul-tag tag-fix">FIX</span> <b>Mobile Sigil Picker stacking:</b> no longer renders behind the in-game mobile skill buttons.</li>
<li><span class="ul-tag tag-fix">FIX</span> <b>Settings panel on mobile:</b> now scrolls instead of overflowing off-screen on short viewports.</li>
<li><span class="ul-tag tag-fix">FIX</span> <b>Settings panel close button:</b> the X was being clipped invisible/unclickable on some layouts (parent's <code>overflow-y:auto</code> forced the other axis to clip too) — repositioned inside the panel bounds.</li>
<li><span class="ul-tag tag-feat">FEAT</span> <b>Settings sliders redesigned:</b> custom cyan fill + glow thumb matching the panel theme, replacing plain browser default styling.</li>
<li><span class="ul-tag tag-perf">PERF</span> <b>Smart Quality Tier 3 (MIN) now reachable:</b> the auto-tier watchdog was hard-capped at Tier 2, leaving the render pipeline's lowest particle-cap tier unused even under severe lag.</li>
<li><span class="ul-tag tag-perf">PERF</span> <b>Mobile shadowBlur/bloom suppression:</b> now activates immediately on entering Mobile mode instead of waiting for the reactive FPS watchdog to notice sustained lag first. Trade-off: mobile loses the glow/bloom look PC keeps.</li>
<li><span class="ul-tag tag-perf">PERF</span> <b>Background parallax density:</b> dedicated Mobile sprite-count profile (~90% fewer galaxies/nebulas/stars/asteroids than PC) plus half-rate frame throttling, instead of always rendering full PC density regardless of platform.</li>
<li><span class="ul-tag tag-fix">FIX</span> <b>Bullets/particles misaligned on mobile:</b> the WebGL canvas's internal render buffer wasn't resynced after the mobile "inflate" scale-up, so it silently drifted out of sync with the visible canvas — now explicitly resized on entering Mobile mode.</li>
<li><span class="ul-tag tag-feat">FEAT</span> <b>Skill F (Annihilation Sweep) charge:</b> inward-pulling spiral/vortex particles and a growing player-ship aura culminating in a whiteout flash at charge completion.</li>
<li><span class="ul-tag tag-feat">FEAT</span> <b>Skill F sweep:</b> thicker multi-layer gradient blade (white/cyan core, violet flank, animated energy ridge lines), shockwave ring burst on release, and scorch afterglow marks matching the blade's palette.</li>
<li><span class="ul-tag tag-perf">PERF</span> <b>Skill F hex-grid/ghost-trail:</b> now properly scale down by graphics tier instead of running at full cost on every tier.</li>
<li><span class="ul-tag tag-feat">FEAT</span> <b>Overload Laser charge effect rebuilt:</b> sparkle-star particles gathering inward, one rainbow "Tinh Vương" star tied to the Star Sovereign title text, constellation lines between nearby stars, trailing streaks, lightning arcs to the player, and an energy-column preview past 50% charge — all rendered via a pre-baked glow sprite instead of live shadowBlur, so it's cheaper than the old effect despite doing more.</li>
<li><span class="ul-tag tag-fix">FIX</span> <b>Overload Laser beam "plastic" look:</b> added per-frame gradient flicker, a jittering core streak, and crackle line overlays so the beam no longer reads as a static solid rod.</li>
<li><span class="ul-tag tag-buff">BUFF</span> <b>Maou Haki visual intensity:</b> dense void-core gradient, a slower heavy pulse layered on the existing sparkle blink, thicker halo/ring, and a full-screen darkening overlay while the wave is active.</li>
<li><span class="ul-tag tag-feat">FEAT</span> <b>Low-HP visuals:</b> hard-edged red border hugging all 4 screen edges plus slow-rotating faint arcs at MED+ graphics tier, alongside a new heartbeat loop that ducks the rest of the mix while lives &lt; 5.</li>
<li><span class="ul-tag tag-feat">FEAT</span> <b>Audio duck system generalized:</b> multiple sources (Yog-Sothoth Domain, low-HP) can now duck the mix simultaneously — whichever is most intense wins.</li>
<li><span class="ul-tag tag-feat">FEAT</span> <b>Yog-Sothoth Accurate Parry cue:</b> new sound, +11dB boosted for impact; always fires on a successful parry regardless of shield state.</li>
<li><span class="ul-tag tag-balance">BALANCE</span> <b>Gain adjustments:</b> Black Hole +6dB, Spirit Autofire −20%, Spirit Arc Slash −10%, Coronation +20%; Spirit Autofire now also plays for Phōtokrystos's own normal-attack volley.</li>
<li><span class="ul-tag tag-feat">FEAT</span> <b>Egregor signature audio pass:</b> the game's cover-art monster gets a dedicated, elaborate treatment — Null Slash windup drone cut short exactly when the strike begins (tracking the real rage-shortened duration rather than a fixed length), a slash whoosh at the strike, an impact cue only when the sweep actually connects, a continuous crawl texture (two clips cross-started so the loop never gaps), and a dedicated death roar layered over the generic death sfx.</li>
<li><span class="ul-tag tag-feat">FEAT</span> <b>New one-shot cues:</b> Charged Shot release, Dimensional Rift (Skill A) spawn, Dimension Break (Null Slash) zone spawn, and Wave Cleared (distinct from the New Wave announcement).</li>
<li><span class="ul-tag tag-balance">BALANCE</span> <b>Wave Cleared cue:</b> gain boosted +4dB.</li>
<li><span class="ul-tag tag-fix">FIX</span> <b>iOS Safari severe lag (1 fps root cause):</b> continuous <code>&lt;audio&gt;</code> element playback — especially high-frequency pools firing every 42–135 ms — triggers a main-thread scheduling stall between <code>requestAnimationFrame</code> callbacks on real iOS devices. Diagnosed via on-device <code>rawGap</code> metrics showing 678–1194 ms gaps between frames while <code>thisCallback</code> itself was only 0–22 ms. Muting audio completely restored 60 fps, confirming the cause. Every audio path — BGM, ambient, engine drone, and all ~40 one-shot SFX pools — was fully rewritten to <code>AudioBufferSourceNode</code>, moving all playback off the main thread onto the Web Audio rendering thread.</li>
<li><span class="ul-tag tag-fix">FIX</span> <b>BGM startup delay eliminated:</b> if the player taps "anywhere to start" before the audio buffer finishes decoding, a streaming <code>&lt;audio&gt;</code> bridge starts the BGM instantly, then seamlessly swaps to the decoded <code>AudioBufferSourceNode</code> at the exact playback position — zero audible gap and zero startup delay regardless of network speed.</li>
<li><span class="ul-tag tag-fix">FIX</span> <b>Mobile WebGL parallax background restored:</b> the WebGL/Pixi background was previously disabled on mobile as a performance workaround. With the real 1 fps cause resolved, it is now fully re-enabled — mobile gets the same animated space background as PC.</li>
<li><span class="ul-tag tag-fix">FIX</span> <b>Yog-Sothoth Domain audio missing on mobile:</b> tapping the YOG button on mobile did not trigger <code>enterTimeDomain()</code> or the shift-hold SFX. Now in sync with the PC keyboard handler.</li>
<li><span class="ul-tag tag-fix">FIX</span> <b>Heartbeat + muffled audio persisting after Game Over:</b> returning to the main menu no longer leaves the low-HP heartbeat loop running or the mix permanently ducked — <code>stopLowHp()</code> and <code>exitTimeDomain()</code> are now called during the return-to-menu cleanup.</li>
<li><span class="ul-tag tag-fix">FIX</span> <b>FPS debug chip simplified:</b> the overlay chip now shows a plain "FPS: N" readout only, without counts, tier badges, or the tap-to-expand panel on mobile (which conflicted with touch gameplay).</li>
</ul>
</div>

<div class="sfc-row"><span class="sbt atk">ATK</span><b>Khát Chiến</b> <span class="sbd">Mỗi đòn đánh trúng từ bất kỳ nguồn phe ta nào (trừ Skill D và Skill F) có thể bắn 1 quả cầu lửa vào kẻ địch bị đòn trước đó đánh trúng, gây 100 + 15% sát thương của đòn đó + 0.75% HP đã mất của mục tiêu (hồi chiêu 300ms).</span></div>
</div><div class="sfc-hint">click để đọc truyền thuyết</div>
</div><div class="sfc-back">
<canvas class="sfc-glyph-sm-cv" data-sigil="aries"></canvas>
<div class="sfc-story">Trước khi vì sao đầu tiên được thắp lên, chỉ có Hư Không, vô biên và vô danh. Rồi Dương Cưu mở mắt giữa bóng tối ấy, và cơn thịnh nộ của nó hóa thành ngọn lửa đầu tiên. Nó lao tới, và nơi cặp sừng đâm vào hư vô, những tia lửa bắn ra khắp mọi hướng — mỗi tia là một mặt trời. Nó không chọn để sáng tạo. Nó chỉ lao tới. Và từ cú lao ấy, vạn vật bắt đầu.</div>
<div class="sfc-hint">click để quay lại</div>
</div></div></div>

<div class="sfc" onclick="this.classList.toggle('flipped')" style="--sc:#4D9B2A;--scl:rgba(77,155,42,0.12)">
<div class="sfc-inner"><div class="sfc-front">
<canvas class="sfc-glyph-cv" data-sigil="taurus"></canvas><div class="sfc-name">KIM NGƯU</div><div class="sfc-el">Thổ</div><div class="sfc-theme">THÀNH LŨY PHÒNG THỦ</div>
<div class="sfc-buffs">
<div class="sfc-row"><span class="sbt def">DEF</span><b>Vương Cung Thành Trì</b> <span class="sbd">Mỗi 5s nhận 1 lớp Iron Body (tối đa 3 lớp): hấp thụ 1 đòn đánh vào người chơi hoặc 1 lần trói/câm lặng thường. Hiển thị dưới dạng vòng lục giác xanh lá quanh tàu.</span></div>
<div class="sfc-row"><span class="sbt def">DEF</span><b>Hộ Vệ</b> <span class="sbd">Vệ Binh +65% HP & +30% sát thương. Đạn thường của Vệ Binh không còn tốn 1 HP giật lùi. Khi 1 Vệ Binh bị kết liễu, các Vệ Binh còn lại hồi 10% EP của nó và nhận khiên trị giá 20% EP của nó (hồi chiêu 3.5s).</span></div>
</div><div class="sfc-hint">click để đọc truyền thuyết</div>
</div><div class="sfc-back">
<canvas class="sfc-glyph-sm-cv" data-sigil="taurus"></canvas>
<div class="sfc-story">Những tia lửa mà Dương Cưu ném vào bóng tối tản ra và nguội lạnh trước khi kịp hóa thành sao. Rồi Kim Ngưu tới, chậm rãi và chắc chắn. Nó gom từng tàn lửa bằng đôi tay rộng lớn và ép chúng lại với nhau, kiên nhẫn như đá, thổi hơi ấm lên chúng suốt khoảng lặng dài giữa các thời đại. Dưới móng guốc nó, mặt đất đầu tiên cứng lại. Nó không vội vàng. Nó chưa bao giờ vội vàng. Đất đai trường tồn vì nó trường tồn.</div>
<div class="sfc-hint">click để quay lại</div>
</div></div></div>

<div class="sfc" onclick="this.classList.toggle('flipped')" style="--sc:#378ADD;--scl:rgba(55,138,221,0.12)">
<div class="sfc-inner"><div class="sfc-front">
<canvas class="sfc-glyph-cv" data-sigil="gemini"></canvas><div class="sfc-name">SONG TỬ</div><div class="sfc-el">Phong</div><div class="sfc-theme">CHIẾN THUẬT GƯƠNG</div>
<div class="sfc-buffs">
<div class="sfc-row"><span class="sbt atk">ATK</span><b>Ảnh Song</b> <span class="sbd">Mỗi đòn đánh trúng thứ 10 từ bất kỳ nguồn phe ta nào (trừ Vệ Binh) tích 0.5s, sau đó 1 tàu bóng ma xuất hiện giữa cạnh màn hình ngẫu nhiên (trái/phải) và bắn 3 đợt cầu plasma xuyên phá vào kẻ địch ngẫu nhiên, bay xuyên suốt màn hình. Mỗi đợt gồm 1 cầu lớn kèm 2 cầu nhỏ. Cầu nhỏ: 75 + 3% EP sát thương. Cầu lớn: 175 + 8% EP sát thương. Mỗi lần trúng gây 2 lớp Trọng Thương và Đoạt Hồn. Hồi chiêu 1s trước khi kích hoạt lại.</span></div>
<div class="sfc-row"><span class="sbt spec">SPEC</span><b>Gương Quang Tuyến</b> <span class="sbd">Overload Laser sinh ra 2 thực thể gương (trên-trái & dưới-phải) di chuyển dọc theo hướng ngược nhau (+25% tốc độ), mỗi cái bắn 1 tia laser ngang bằng 75% sát thương tia gốc. Tia gốc được buff +30%. Ngoài ra, mỗi lần dùng skill hoặc bắn tự động có 5% cơ hội (+0.3% mỗi lần trượt, reset khi kích hoạt) bắn ra 1 cột laser xanh-tím xuyên phá gây 350 + 18% EP mỗi 125ms trong 3s — không hút địch, cộng dồn với Overload Laser (hồi chiêu 4s).</span></div>
</div><div class="sfc-hint">click để đọc truyền thuyết</div>
</div><div class="sfc-back">
<canvas class="sfc-glyph-sm-cv" data-sigil="gemini"></canvas>
<div class="sfc-story">Khi chỉ có một mặt đất và một bầu trời, cặp Song Tử nhìn vào đó và bối rối. Một thế giới không phân chia, họ nói, là một thế giới không thể suy nghĩ. Họ vươn bốn bàn tay vào và tách nó ra — ánh sáng khỏi bóng tối, vật chất khỏi giấc mơ, bản thân khỏi kẻ khác. Vết nứt giữa những điều đối lập trở thành không gian nơi vạn vật sẽ cư ngụ. Cặp Song Tử vẫn tranh cãi về chuyện đó cho tới tận bây giờ.</div>
<div class="sfc-hint">click để quay lại</div>
</div></div></div>

<div class="sfc" onclick="this.classList.toggle('flipped')" style="--sc:#7F77DD;--scl:rgba(127,119,221,0.12)">
<div class="sfc-inner"><div class="sfc-front">
<canvas class="sfc-glyph-cv" data-sigil="cancer"></canvas><div class="sfc-name">CỰ GIẢI</div><div class="sfc-el">Thủy</div><div class="sfc-theme">THỦY TRIỀU NGUYỆT</div>
<div class="sfc-buffs">
<div class="sfc-row"><span class="sbt def">DEF</span><b>Nguyệt Giáp</b> <span class="sbd">Gaia Protection kích hoạt mà không cần Glory for Justice; khả năng hấp thụ của Gaia Barrier +40%; Vệ Binh nhận +20% né tránh.</span></div>
<div class="sfc-row"><span class="sbt heal">HEAL</span><b>Triều Lưu</b> <span class="sbd">Vệ Binh hồi 3% Max HP/s (tăng theo cấp bậc); hiệu quả hồi máu +30%. Mỗi Vệ Binh nhận 1 lớp Iron Body; hồi chiêu 8s chỉ bắt đầu sau khi lớp đó bị tiêu hao.</span></div>
</div><div class="sfc-hint">click để đọc truyền thuyết</div>
</div><div class="sfc-back">
<canvas class="sfc-glyph-sm-cv" data-sigil="cancer"></canvas>
<div class="sfc-story">Cự Giải nhìn thấy vết nứt lớn mà cặp Song Tử tạo ra và khóc thương cho mọi thứ giờ đây đã tách biệt khỏi nhau. Nước mắt nàng rơi vào vết nứt, lấp đầy nó, và trở thành đại dương đầu tiên. Nàng không có ý định tạo ra biển cả. Nàng chỉ đau buồn. Nhưng nàng khum đôi càng mềm mại đỡ lấy làn nước và thở lên nó, và có gì đó khẽ động trong hơi ấm tối sâu thẳm. Nàng đã bảo vệ nó kể từ đó.</div>
<div class="sfc-hint">click để quay lại</div>
</div></div></div>

<div class="sfc" onclick="this.classList.toggle('flipped')" style="--sc:#EF9F27;--scl:rgba(239,159,39,0.12)">
<div class="sfc-inner"><div class="sfc-front">
<canvas class="sfc-glyph-cv" data-sigil="leo"></canvas><div class="sfc-name">SƯ TỬ</div><div class="sfc-el">Hỏa</div><div class="sfc-theme">HỎA DƯƠNG</div>
<div class="sfc-buffs">
<div class="sfc-row"><span class="sbt atk">ATK</span><b>Sư Tử Hống</b> <span class="sbd">Trong lúc Glory for Justice kích hoạt: đòn đánh gây Bỏng: 200 + 5% EP sát thương theo thời gian mỗi 500ms trong 3s (reset khi trúng đòn mới, cộng dồn x3). Bỏng xuyên 50% giáp kẻ địch. Đòn đánh phát ra lửa. Mỗi đòn còn gây thêm sát thương bằng 2% HP đã mất của mục tiêu.</span></div>
<div class="sfc-row"><span class="sbt spec">SPEC</span><b>Thần Mệnh</b> <span class="sbd">Đầu mỗi wave: đóng băng 5s — mọi kẻ địch ngừng di chuyển (kể cả địch mới xuất hiện) + toàn bộ sát thương +100%.</span></div>
</div><div class="sfc-hint">click để đọc truyền thuyết</div>
</div><div class="sfc-back">
<canvas class="sfc-glyph-sm-cv" data-sigil="leo"></canvas>
<div class="sfc-story">Từ rìa đại dương của Cự Giải, Sư Tử trỗi dậy. Nó hất nước khỏi bờm và há miệng gầm lên vang dội đến mức bầu trời nứt toác phía trên thế giới. Xuyên qua vết nứt đó, mặt trời rơi xuống lần đầu tiên. Mọi vật đang ngủ say đồng loạt cựa mình dưới ánh sáng đột ngột ấy. Sư Tử không tạo ra mặt trời. Nó chỉ gầm lên. Nhưng tiếng gầm ấy đủ vang để mở đường cho ánh sáng lọt qua.</div>
<div class="sfc-hint">click để quay lại</div>
</div></div></div>

<div class="sfc" onclick="this.classList.toggle('flipped')" style="--sc:#4D9B2A;--scl:rgba(77,155,42,0.12)">
<div class="sfc-inner"><div class="sfc-front">
<canvas class="sfc-glyph-cv" data-sigil="virgo"></canvas><div class="sfc-name">XỬ NỮ</div><div class="sfc-el">Thổ</div><div class="sfc-theme">CHUẨN KÍCH</div>
<div class="sfc-buffs">
<div class="sfc-row"><span class="sbt atk">ATK</span><b>Hộ Lâm</b> <span class="sbd">Mỗi đợt bắn tự động thứ 6 kích hoạt Chí Mạng: sát thương x4, gây Trọng Thương, trói + câm lặng 1s. Đạn phát sáng vàng. Khi có 5+ kẻ địch trên màn hình, mỗi 4s 1 nắm đấm gỗ bọc dây leo quét ngang màn hình (60% chiều rộng màn hình), gây 1000 + 10% EP + 15% HP đã mất của mỗi mục tiêu.</span></div>
<div class="sfc-row"><span class="sbt spec">SPEC</span><b>Kỹ Sư Mạch</b> <span class="sbd">Sát thương theo thời gian Tesla & Cuộn Tesla +50%; phá hủy 1 Cuộn Tesla giảm 3s hồi chiêu Skill G và tăng 10% tốc độ nạp năng lượng G. Kẻ địch mang bất kỳ hiệu ứng bất lợi nào (chậm, sát thương theo thời gian, Trọng Thương, Đoạt Hồn,...) nhận +50% sát thương từ mọi nguồn.</span></div>
</div><div class="sfc-hint">click để đọc truyền thuyết</div>
</div><div class="sfc-back">
<canvas class="sfc-glyph-sm-cv" data-sigil="virgo"></canvas>
<div class="sfc-story">Sau ánh sáng của Sư Tử, Xử Nữ tới, chân trần bước qua lớp tro còn ấm. Nơi lửa từng thiêu đốt, nàng quỳ xuống và ấn từng hạt giống vào lòng đất bằng những ngón tay, từng hạt một, suốt mười ngàn năm. Nàng không biết liệu có gì sẽ mọc lên không. Nàng vẫn cứ gieo trồng. Tới năm thứ mười ngàn, mầm xanh đầu tiên trồi lên xuyên qua lớp đất đen hướng về phía ánh sáng. Nàng chưa từng ngừng gieo trồng kể từ đó.</div>
<div class="sfc-hint">click để quay lại</div>
</div></div></div>

<div class="sfc" onclick="this.classList.toggle('flipped')" style="--sc:#378ADD;--scl:rgba(55,138,221,0.12)">
<div class="sfc-inner"><div class="sfc-front">
<canvas class="sfc-glyph-cv" data-sigil="libra"></canvas><div class="sfc-name">THIÊN BÌNH</div><div class="sfc-el">Phong</div><div class="sfc-theme">HUYẾT SẮC PHÁN QUYẾT</div>
<div class="sfc-buffs">
<div class="sfc-row"><span class="sbt spec">SPEC</span><b>Huyết Tiễn</b> <span class="sbd">Mỗi lần dùng Skill A bắn 3 mũi tên sau 0.5s chuẩn bị: 1 mũi tên lớn đánh dấu kẻ địch có EP cao nhất, 2 mũi còn lại đánh dấu kẻ địch ngẫu nhiên (ưu tiên khu vực đông địch). Mỗi mũi tên xuyên qua mọi kẻ địch (300 sát thương gốc) và nổ trên mục tiêu bị đánh dấu (400 gốc + 20% EP, tăng thêm tối đa +100% từ giáp của mục tiêu). Mọi kẻ địch trúng đòn nhận 2 lớp Trọng Thương. 2 mũi tên nhỏ gây ít hơn 40% sát thương nhưng bay nhanh hơn 20% so với mũi lớn, vốn cũng to hơn 15%.</span></div>
<div class="sfc-row"><span class="sbt atk">ATK</span><b>Tinh Xuyên</b> <span class="sbd">Cầu năng lượng Skill A xuyên qua mục tiêu khi va chạm và tiếp tục bay tới mép màn hình, gây sát thương cho mọi kẻ địch nó đi qua. Kích thước cầu +30%.</span></div>
</div><div class="sfc-hint">click để đọc truyền thuyết</div>
</div><div class="sfc-back">
<canvas class="sfc-glyph-sm-cv" data-sigil="libra"></canvas>
<div class="sfc-story">Khi khu vườn của Xử Nữ mọc hoang dại và tự bóp nghẹt chính mình, Thiên Bình giáng xuống. Nàng mang theo hai đĩa cân bằng đồng sáng bóng, đặt chúng giữa trung tâm vạn vật sáng tạo, và bắt đầu cân đo. Sự sống đối nghịch cái chết. Sung túc đối nghịch đói khát. Tăng trưởng đối nghịch hủy diệt. Với mỗi thứ nàng cắt tỉa, nàng trả lại điều gì đó. Thế giới không cảm ơn nàng. Sự cân bằng chưa bao giờ được cảm ơn. Nhưng nó vẫn giữ vững. Nó luôn giữ vững.</div>
<div class="sfc-hint">click để quay lại</div>
</div></div></div>

<div class="sfc" onclick="this.classList.toggle('flipped')" style="--sc:#7F77DD;--scl:rgba(127,119,221,0.12)">
<div class="sfc-inner"><div class="sfc-front">
<canvas class="sfc-glyph-cv" data-sigil="scorpio"></canvas><div class="sfc-name">BỌ CẠP</div><div class="sfc-el">Thủy</div><div class="sfc-theme">TỬ THẦN CHI ẤN</div>
<div class="sfc-buffs">
<div class="sfc-row"><span class="sbt heal">HEAL</span><b>Hoàn Sinh</b> <span class="sbd">Khi chọn: nhận ngay +5 mạng. Tỉ lệ thưởng mạng: +1 mạng mỗi 250,000 điểm (thay vì 500,000).</span></div>
<div class="sfc-row"><span class="sbt atk">ATK</span><b>Tử Ấn</b> <span class="sbd">HP 100%→21%: sát thương tăng tuyến tính +0%→+70%. HP ≤20%: +80% sát thương từ mọi nguồn. HP ≤5%: sét đánh kết liễu ngay lập tức. Vòng cung lưỡi kiếm Skill F xuyên qua Iron Body. Kẻ địch dưới 50% HP hiện vòng cảnh báo màu xanh cyan.</span></div>
</div><div class="sfc-hint">click để đọc truyền thuyết</div>
</div><div class="sfc-back">
<canvas class="sfc-glyph-sm-cv" data-sigil="scorpio"></canvas>
<div class="sfc-story">Bọ Cạp giáng xuống bóng tối bên dưới rễ cây, bên dưới đá tảng, vào tận Hư Không cổ xưa mà Dương Cưu từng chạy trốn khỏi lúc khởi thủy. Nó vẫn còn sống. Vẫn còn đói khát. Bọ Cạp không hủy diệt nó. Thay vào đó, nó cắm chiếc đuôi vào bóng tối và giữ cho nó mở ra như một cánh cửa. Xuyên qua cánh cửa đó, cái chết bước vào thế giới lần đầu tiên — và trong sự xuất hiện ấy, ban cho mọi sinh vật một lý do để sống.</div>
<div class="sfc-hint">click để quay lại</div>
</div></div></div>

<div class="sfc" onclick="this.classList.toggle('flipped')" style="--sc:#EF9F27;--scl:rgba(239,159,39,0.12)">
<div class="sfc-inner"><div class="sfc-front">
<canvas class="sfc-glyph-cv" data-sigil="sagittarius"></canvas><div class="sfc-name">NHÂN MÃ</div><div class="sfc-el">Hỏa</div><div class="sfc-theme">LƯỠI KIẾM LINH HỒN</div>
<div class="sfc-buffs">
<div class="sfc-row"><span class="sbt atk">ATK</span><b>Song Lưỡi</b> <span class="sbd">Đòn chém cung của Tinh Linh bắn 2 lưỡi kiếm (+60% mỗi lưỡi, lưỡi thứ 2 bắn trễ 15ms), cộng thêm 25% cơ hội có lưỡi thứ 3. Mỗi boomerang có 40% cơ hội thêm 2 boomerang phụ. Skill F giờ ném 2 boomerang từ người chơi thay vì chém cung. Lưỡi kiếm phụ có +20% bán kính. Mỗi phát bắn tự động có 15% cơ hội bắn ra 1 lưỡi kiếm cung (300 + 7% EP), giống của Tinh Linh.</span></div>
<div class="sfc-row"><span class="sbt atk">ATK</span><b>Cực Hàn</b> <span class="sbd">Boomerang và chém cung: 75% cơ hội làm chậm 30% trong 2s và hút về phía đạn. Kẻ địch miễn nhiễm khống chế: không bị hút (vẫn có 25% cơ hội bị hút, trừ Goliath — không bao giờ), nhưng vẫn bị chậm. Tốc độ bắn của Tinh Linh Hoài Niệm và Phōtokrystos +30%.</span></div>
</div><div class="sfc-hint">click để đọc truyền thuyết</div>

<div class="card"><h2 class="dsname" style="color:#ff8844">MARCHOSIAS <span class="dsclass" style="font-size:10px;color:#ff8844">TINH ANH</span></h2><div class="sub">Wave 2 • HP 2,112–4,092 • DR thân 45% • Né 5→10% • Tốc độ ~1.6 u/s</div>

<ul>
<li><span style="color:#a855f7;font-size:10px">PASSIVE</span> <b>Kết Giới Vòng Cung</b> — <span class="det-full">Kết giới xoay 90°, <span class="dmg">60% DR</span>, không đòn đánh đơn lẻ nào &gt; <span class="dmg">35% HP Kết giới</span>, miễn nhiễm buff. Bể HP độc lập = MaxHP của Marchosias. <span class="hg">Miễn nhiễm khống chế trong lúc Kết giới còn sống</span> — miễn nhiễm hút Death Star, chậm Tesla, chậm Dimensional Rift, và chậm Orb. Trong lúc hoạt động, Marchosias và Kết giới nhận thêm <span class="hg">+10% né</span> (né áp dụng cho cả đòn đánh vào thân lẫn Kết giới). Đòn xuyên (Spirit Arc Blade, Boomerang, Overload Laser) trúng Kết giới: sát thương vào thân <span class="hg">−30%</span>, Kết giới nhận thêm <span class="dmg">+15% sát thương</span>, đòn đánh tiếp tục xuyên qua. Mỗi lần trúng Kết giới: Kết giới tự hồi <span class="hgr">5% sát thương gây ra</span> (tối đa 1000 HP), thân Marchosias hồi <span class="hgr">10% sát thương gây ra</span> (tối đa 1000 HP, dư ra → <span class="hg">50% chuyển thành khiên</span>). Khi Kết giới bị phá hủy: Marchosias nhận <span class="hg">Iron Body chịu 5 đòn</span>, nhận <span class="hg">+20% DR</span>, hồi <span class="hgr">40% MaxHP</span> (dư ra → <span class="hg">50% khiên</span>), và nhận khiên = <span class="hg">15% MaxHP + 15% HP đã mất</span>. <b>+20% DR bị gỡ bỏ khi Kết giới hồi sinh.</b> Thời gian hồi sinh sau khi vỡ phụ thuộc vào chu kỳ kiếm: nếu cả 4 kiếm đã được dùng trước khi Kết giới vỡ → hoạt cảnh nổ tung, hồi sinh cố định <span class="hi">3s</span>; nếu không thì <span class="hi">4–5s</span> (giảm dần về 4s sau 3 phút). Tốc độ bám mục tiêu tăng dần tới <span class="hi">×1.67</span> sau 3 phút chơi. 2 bộ đếm số La Mã bên dưới Marchosias: <span style="color:#00ff88">xanh lá</span> = hàng đợi kiếm đang hoạt động, <span style="color:#ffaa00">vàng</span> (I→IV) = số kiếm đã dùng trong chu kỳ — sáng rực vàng ở IV để báo hiệu hồi sinh 3s ở lần vỡ tiếp theo.</span><span class="det-short">Kết giới xoay 90° miễn nhiễm khống chế với +10% né. Mỗi lần trúng: Kết giới và thân tự hồi (CAP 1000 HP). Khi vỡ: Iron Body 5 đòn + 20% DR + hồi 40% HP + khiên (15% MaxHP + 15% HP đã mất) (DR bị gỡ khi hồi sinh). Dùng đủ 4 kiếm → hồi sinh 3s (hoạt cảnh nổ); nếu không thì 4–5s.</span></li>

<div class="card"><h2 class="dsname" style="color:#cc55ff">LEVIATHAN <span class="dsclass" style="font-size:10px;color:#cc55ff">MA THẦN</span></h2><div class="sub">Wave 3 • HP 8,820–15,435 • Né 10→15% • CAP 1 • Tốc độ ~1.5 u/s</div>
<div class="ab" style="height:130px"><canvas id="cvLeviat" style="width:100%;height:100%"></canvas></div>
<ul>
<li><span style="color:#a855f7;font-size:10px">PASSIVE</span> <b>Bá Vương</b> — <span class="det-full"><span class="dmg">60% DR Base</span> (sau khi khiên AFO vỡ). Trúng đòn &gt;20% MaxHP → <span class="dmg">pháp trận 3s: sát thương bị giới hạn ở 10% MaxHP</span> (hồi chiêu 2s sau khi pháp trận kết thúc). Cũng tự kích hoạt ngay khoảnh khắc HP của Leviathan lần đầu xuống dưới <span class="hg">50%</span>, bất kể kích thước đòn đánh hay hồi chiêu. Đạn của chính nó phá hủy đạn tự động của người chơi, đạn Vệ Binh, và đạn của cả 2 linh hồn khi chạm — kể cả những viên đạn thường xuyên qua được.</span><span class="det-short">60% DR; đòn đánh >20% MaxHP hoặc HP xuống dưới 50% kích hoạt pháp trận giới hạn sát thương 3s. Đạn của nó phá đạn người chơi/Vệ Binh/linh hồn khi chạm.</span></li>
<li><span style="color:#a855f7;font-size:10px">PASSIVE</span> <b>Kết Giới Thành Lũy</b> — <span class="det-full">mỗi 1s, nhận 1 lớp khiên trị giá <span class="hg">0.5% MaxHP × số kẻ địch trên màn hình</span> (mỗi lớp CAP <span class="hg">15% MaxHP</span>), tối đa 2 lớp cộng dồn. Reset khi khiên cạn kiệt hoàn toàn để xây dựng lại từ đầu. Cũng cấp 1 lần <span class="hg">barrier 50% MaxHP</span> cộng <span class="hg">90% DR trong 1s</span> ngay khoảnh khắc khiên All for One vỡ.</span><span class="det-short">Mỗi 1s nhận 1 lớp khiên tăng theo số kẻ địch trên màn hình, tối đa 2 lớp (~30% MaxHP). Cũng cấp barrier 50% MaxHP + 90% DR trong 1s ngay khi khiên AFO vỡ.</span></li>
<li><span style="color:#a855f7;font-size:10px">PASSIVE</span> <b>All for One</b> — Khiên Iron Body cho tới khi đủ chỉ tiêu hạ gục (10–20). Cánh gập lại. Miễn nhiễm khống chế.</li>
<li><span style="color:#a855f7;font-size:10px">PASSIVE</span> <b>Thủ Lĩnh Bầy Đàn</b> — <span class="det-full">mọi kẻ địch nhận <span class="hr">Đố Kỵ</span>: +25% DR, +25% hồi máu nhận vào, +1% hồi Max HP/s. Áp dụng lại mỗi 2.5s để bắt kịp những kẻ địch sinh ra sau Leviathan.</span><span class="det-short">Cấp cho mọi kẻ địch +25% DR, +25% hồi máu nhận vào, và +1% hồi Max HP/s trong lúc Leviathan còn sống.</span></li>
<li><span style="color:var(--gold);font-size:10px">ĐÒN THƯỜNG</span> Mỗi 0.75s bắn 3 đạn vào mục tiêu gần nhất. HP đạn = 2% MaxHP của Leviathan.</li>
<li><span style="color:var(--cyan);font-size:10px">SKILL</span> <b>Perseverance</b> — <span class="det-full">cảnh báo đỏ + laser quét toàn bộ 360°. Bắn khi khiên AFO vỡ. Người chơi: <span class="hr">1 mạng</span>. Vệ Binh: <span class="hr">5% × số đòn khiên AFO đã nhận</span> EP/tick, CAP <span class="hr">50% EP</span> (đạt CAP ở 10 đòn khiên).</span><span class="det-short">Laser quét 360° khi AFO vỡ. Người chơi: 1 mạng. Vệ Binh: tối đa 50% EP.</span></li>
<li><span style="color:var(--cyan);font-size:10px">SKILL</span> @HP 1 <b>Last Rites</b> — <span class="det-full">9 trụ cánh khóa mục tiêu, tất cả bắn đồng loạt. Người chơi: <span class="hr">1 mạng</span>. Vệ Binh: <span class="hr">3% × (số đòn khiên AFO ÷ 2)</span> EP mỗi laser, CAP <span class="hr">55% EP</span> (đạt CAP ở 37 đòn khiên). Laser vẫn tồn tại sau khi chết.</span><span class="det-short">9 laser đồng loạt ở HP 1 vẫn tồn tại sau khi chết. Người chơi: 1 mạng. Vệ Binh: tối đa 55% EP.</span></li>
</ul></div>
<div class="card" style="border-color:rgba(245,158,11,0.3)">
<h2 class="dsname" style="color:#f59e0b">GOLIATH <span class="dsclass" style="font-size:9px;color:#eab308">DIGIFORM</span></h2>
<div style="display:flex;gap:6px;margin-bottom:8px;">
  <button onclick="showGoliathTab(1)" id="gTabBtn1" style="flex:1;padding:5px;font-family:'Rajdhani', 'Be Vietnam Pro', sans-serif;font-size:11px;font-weight:700;letter-spacing:1px;cursor:pointer;background:rgba(245,158,11,0.25);border:1.5px solid #f59e0b;border-radius:6px;color:#f59e0b;">① Alpha</button>
  <button onclick="showGoliathTab(2)" id="gTabBtn2" style="flex:1;padding:5px;font-family:'Rajdhani', 'Be Vietnam Pro', sans-serif;font-size:11px;font-weight:700;letter-spacing:1px;cursor:pointer;background:rgba(80,50,0,0.2);border:1.5px solid rgba(245,158,11,0.4);border-radius:6px;color:#c9891f;">② Chân Thân</button>
</div>
<div id="gGoliathPane1">
<div class="ab" style="height:190px"><canvas id="cvGoliathAlpha" style="width:100%;height:100%"></canvas></div>
<div class="sub" style="margin-top:6px">HP 1 · Né 0% · không bị chọn làm mục tiêu · Vô Địch</div>
<ul>
<li><span style="color:#ffd700;font-size:10px">PHASE</span> <b>Alpha</b> — <span class="det-full">xuất hiện gần đỉnh màn hình với <span class="hg">1 HP</span>, Vô Địch tuyệt đối và không bị chọn làm mục tiêu — không có ngoại lệ nào áp dụng trong giai đoạn này. <span class="hi">Circuit Link</span> kết nối nó với mọi kẻ địch hiện tại: tối đa <span class="hg">80% Max HP của chính kẻ địch đó</span> mỗi đòn bị chuyển hướng vào sổ Damage Pull của Goliath thay vì giết chúng ngay. <span class="hi">Corrupted Genesis</span> — khi 1 kẻ địch cấp Thượng Cấp trở lên đã liên kết chết, 1 viên đá màu bay vào 1 trong 3 khe của nó; lấp đầy cả 3 khe bằng đá khác màu nhau sẽ bắt đầu Transition.</span><span class="det-short">Quả cầu Vô Địch liên kết với cả wave, chuyển hướng tối đa 80% Max HP của kẻ địch vào Damage Pull của nó. Hấp thụ 3 viên đá từ những cái chết đã liên kết để biến hình.</span></li>
<li><span style="color:#ffd700;font-size:10px">PASSIVE</span> <b>Bãi Săn Mồi</b> — ngay khoảnh khắc Goliath xuất hiện, <span class="hr">ceil(1/3)</span> số kẻ địch hiện tại của wave bị tiêu thụ ngay lập tức, và mọi kẻ sống sót nhận <span class="hg">+15% Max HP</span>.</li>
<li><span style="color:#ffd700;font-size:10px">PHASE</span> <b>Transition</b> — <span class="det-full">chuỗi biến hình ~4s, 4 giai đoạn khi cả 3 khe đã được lấp đầy: thiên thạch hội tụ và hợp nhất thành khối nóng chảy (Summon), khối này phồng lên và sủi bọt (Fusion), nó nguội đi và kết tinh thành thân Chân Thân khi 3 viên đá lần lượt bùng cháy (Crystallize), rồi cả 2 cánh tay vươn ra và ổn định cùng 1 sóng xung kích cuối (Settle). Vẫn Vô Địch và không bị chọn làm mục tiêu suốt quá trình.</span><span class="det-short">Biến hình 4 giai đoạn, ~4s thành Chân Thân khi cả 3 khe đá đã được lấp đầy. Vẫn Vô Địch suốt quá trình.</span></li>
</ul>
</div>
<div id="gGoliathPane2" style="display:none">
<div class="ab" style="height:190px"><canvas id="cvGoliathTrue" style="width:100%;height:100%"></canvas></div>
<div class="sub" style="margin-top:6px">HP 65,000+ (tăng theo Damage Pull) · Né 35%→25% (+5% mỗi mốc HP) · CAP 1 · Tốc độ ~90 px/s (trôi dạt hình sin, không phải vận tốc cố định)</div>
<ul>
<li><span style="color:#a855f7;font-size:10px">PASSIVE</span> <b>Bá Vương</b> — <span class="det-full"><span class="hr">2s Iron Body tuyệt đối</span> ngay khi biến hình thành công thành Chân Thân (không ngoại lệ, kể cả sát thương xuyên/chuẩn), <span class="dmg">70% DR nền</span>, miễn nhiễm khống chế vĩnh viễn, <span class="hg">hồi 2.2% Max HP/s</span>. 1 đòn đánh vượt quá <span class="hg">10% Max HP</span> mở ra pháp trận 2s giới hạn sát thương tiếp theo ở <span class="hr">5% Max HP</span> mỗi đòn (hồi chiêu 1.5s sau đó). Chỉ có <span class="hi">đòn xuyên</span>, <span class="hi">sát thương chuẩn</span>, và <span class="hi">sát thương theo thời gian</span> mới đánh trúng Goliath ở giá trị đầy đủ — mọi đòn khác (sát thương %HP/%EP thông thường, kể cả bắn tự động cơ bản) bị <span class="hr">CAP cứng ở 1.5% Max HP</span> mỗi đòn, <span class="hg">+0.5% mỗi lớp debuff</span> hiện có trên Goliath (trọng thương, Đoạt Hồn, hiệu ứng chậm đang hoạt động, lớp Bỏng của Venom/Leo, dấu Yog-Sothoth, Dimensional Rift, hào quang Cuộn Tesla), CAP tổng <span class="hr">3% Max HP</span>, vẫn chịu ảnh hưởng của DR. <b>Shield Burst:</b> theo dõi TOÀN BỘ sát thương nhận vào (mọi loại) trong bất kỳ pháp trận trượt 1s nào — vượt quá <span class="hr">12% Max HP</span> cấp 1 <span class="hi">Barrier</span> mới (bể riêng biệt với Shield, không tính vào tổng Max HP+Shield mà đòn %EP dựa vào) trị giá 50% sát thương của pháp trận đó, cũng chuyển 100% Shield hiện tại thành Barrier, và hồi 75% lượng Shield đã chuyển dưới dạng HP. Hồi chiêu 0.5s giữa các lần kích hoạt.</span><span class="det-short">2s Iron Body khi vào Chân Thân. 70% DR, miễn nhiễm khống chế vĩnh viễn, hồi 2.2%/s. Đòn lớn (>10% MaxHP) kích hoạt pháp trận 2s giới hạn 5%. Chỉ xuyên/chuẩn/DoT đánh trúng đầy đủ — mọi thứ khác CAP 1.5% Max HP/đòn, +0.5% mỗi lớp debuff (tối đa 3%). Shield Burst: nhận >12% MaxHP trong 1s cấp Barrier (50% sát thương đó) + chuyển Shield thành Barrier + hồi 75% lượng đó (hồi chiêu 0.5s).</span></li>
<li><span style="color:#a855f7;font-size:10px">PASSIVE</span> <b>Bước Vỡ Vụn</b> — <span class="det-full">dịch chuyển khi có mối đe dọa tới gần trong <span class="hi">100px</span> (hoặc mỗi 2s bất kể thế nào, hồi chiêu 2s cho chính lần dịch chuyển), nhận <span class="hg">1 lớp Iron Body chịu 3 đòn</span> mỗi lần. Dịch chuyển là 1 cổng dịch chuyển pháp trận chậm 2 giai đoạn (đóng lại tại chỗ cũ trong 400ms, mở ra tại chỗ mới trong 400ms) chứ không phải nháy tức thời. Trong 1s sau khi tới nơi, nhận <span class="hg">+20% sát thương gây ra</span>, <span class="hg">+10% tốc độ bay</span>, và <span class="hg">+15% hiệu quả hồi máu/khiên</span> (cộng dồn với +35% riêng của Thaelis).</span><span class="det-short">Dịch chuyển tránh xa mối đe dọa hoặc mỗi 2s (hồi chiêu 2s), cấp 1 lớp Iron Body chịu 3 đòn. Cổng dịch chuyển chậm 2 giai đoạn. 1s sau dịch chuyển: +20% sát thương, +10% tốc độ, +15% hiệu quả hồi máu/khiên.</span></li>
<li><span style="color:#a855f7;font-size:10px">PASSIVE</span> <b>Ý Chí Bất Khuất</b> — <span class="det-full">kích hoạt đúng <span class="hi">1 lần duy nhất</span> mỗi con Goliath: đòn đánh đầu tiên có thể kết liễu Chân Thân sẽ bị vô hiệu hóa hoàn toàn thay vào đó. Trở nên Vô Địch hoàn toàn trong <span class="hr">3.5s</span> (cùng luật Iron Body tuyệt đối như pháp trận sau biến hình) và nhận ngay 1 <span class="hi">Barrier</span> trị giá <span class="hg">20% Max HP</span>. Trong <span class="hi">6s</span> tiếp theo, bắt đầu cùng lúc với 3.5s Vô Địch: <span class="hg">+40% hiệu quả hồi máu/khiên</span> (cộng dồn với mọi thứ khác), <span class="hg">+20% Max HP</span> (HP chuẩn sử dụng được, tự động hoàn tác khi pháp trận kết thúc), và <span class="hg">+15% tốc độ bay</span> — thân nhấp nháy rõ rệt suốt thời gian đó. Ngay khoảnh khắc 3.5s Vô Địch kết thúc, Goliath giải phóng 1 <span class="hi">sóng xung kích màu cam</span> giống hệt cơ chế Maou Haki (cùng tốc độ/bán kính, quét sạch mọi đạn của người chơi trên màn hình) — nhưng sóng này <span class="hi">không gây sát thương và không tốn mạng</span> của bất kỳ ai, báo hiệu bằng 1 tia lóe tung chiêu ngắn.</span><span class="det-short">1 lần duy nhất mỗi con Goliath: 1 đòn chí mạng bị vô hiệu hóa thay vào đó — Vô Địch hoàn toàn 3.5s + Barrier 20% MaxHP, sau đó 6s (bắt đầu cùng lúc với Vô Địch) gồm +40% hiệu quả hồi máu/khiên, +20% MaxHP, +15% tốc độ, thân nhấp nháy. Khi hết Vô Địch sẽ giải phóng 1 sóng xung kích cam kiểu Maou Haki (quét sạch đạn, không sát thương/mạng).</span></li>
<li><span style="color:#a855f7;font-size:10px">PASSIVE</span> <b>Chưởng Hộ Vệ</b> — <span class="det-full">đòn đánh tới từ Skill F, Skill D, hoặc tia laser tối thượng Photokrystos có <span class="hg">30% cơ hội</span> bị đỡ 1 phần, chỉ nhận <span class="hg">15% Max HP</span>; 70% thời gian còn lại sức mạnh nguồn gốc áp đảo bàn tay đỡ và đòn đánh trúng đầy đủ <span class="hr">40% Max HP</span> — mỗi đòn, không có CAP trọn đời. Luật này (như mọi luật riêng của Goliath) đè lên bất kỳ sigil nào lẽ ra có thể xuyên qua nó. Riêng biệt, TOÀN BỘ sát thương từ chính Photokrystos (đạn định hướng + boomerang) bị giảm <span class="hg">40%</span> — áp dụng trước CAP DR/Bá Vương, ảnh hưởng cả đòn thường có CAP lẫn boomerang sát thương chuẩn không CAP.</span><span class="det-short">30% cơ hội đỡ đòn Skill F/D/laser Photokrystos xuống còn 15% Max HP; nếu không thì 40% Max HP, mỗi đòn. Mọi sát thương Photokrystos khác (đạn/boomerang) -40%.</span></li>
<li><span style="color:#a855f7;font-size:10px">PASSIVE</span> <b>Bảo Hộ Ngưỡng</b> — <span class="det-full">bắt đầu Chân Thân với <span class="hg">35% né</span>, giảm dần tuyến tính về <span class="hg">25%</span> trong <span class="hi">15s</span> đầu, sau đó giữ nguyên ở đó cho tới hết trận (áp dụng cho mọi thứ trừ Skill F/D/laser chiêu cuối Photokrystos, vốn xuyên qua nhờ Chưởng Hộ Vệ). Mỗi lần vượt xuống dưới các mốc HP 75/50/25% làm 2 việc cùng lúc: <span class="hi">1 lần</span> bể khiên <span class="hg">+15% Max HP</span> (hồi máu vượt qua 1 mốc đã trả rồi sẽ khôi phục HP tới mốc đó), và <span class="hg">1 lần tăng +5% né trong 3s</span> mà — khác với khiên — có thể kích hoạt lại bất kỳ số lần nào (HP hồi lên trên 1 mốc rồi tụt xuống lại sẽ kích hoạt lại), dù nó không bao giờ cộng dồn quá 1 lớp +5% duy nhất dù có vượt qua bao nhiêu mốc cùng lúc.</span><span class="det-short">35% né khi vào Chân Thân, giảm về 25% trong 15s (không áp dụng với Skill F/D/laser Photokrystos). Mỗi mốc HP 75/50/25%: 1 lần khiên +15% MaxHP, cộng thêm 1 lần tăng né +5% trong 3s có thể lặp lại (không cộng dồn).</span></li><li><span style="color:#a855f7;font-size:10px">PASSIVE</span> <b>Giới Hạn Thi Triển</b> — <span class="det-full">trong lúc thi triển bất kỳ skill nào (của chính nó hoặc bản sao Joker), Goliath <span class="hr">làm chậm 35%</span>, không thể Bước Vỡ Vụn, nhận <span class="hg">+10% DR</span> suốt thời gian đó, và hồi <span class="hg">15% Max HP</span> 1 lần ngay khoảnh khắc bắt đầu thi triển.</span><span class="det-short">Thi triển bất kỳ skill nào: làm chậm 35%, không thể Bước Vỡ Vụn, +10% DR, hồi 15% MaxHP 1 lần lúc bắt đầu.</span></li>

            }else{
              // ── Transformed enemy ──
              const xcol=XCOLS[nxi],xsub=XSUBS[nxi];
              if(nxi===0){
                // Marchosias — GREEN hexagon, gear teeth, inner triangle, arc shield

                // 9 gear teeth

                for(let i=0;i<9;i++){const ta=(i/9)*Math.PI*2+t/2000;c.save();c.rotate(ta);c.beginPath();c.rect(r-2,-2,4,4);c.fill();c.restore();}
                c.globalAlpha=1;
                // Hexagon body (-PI/6 offset, rotating slowly)
                const hrot=t/2200;
                c.fillStyle='#1a1a2e';c.strokeStyle='#00cc66';c.lineWidth=2;
                c.beginPath();for(let i=0;i<6;i++){const a=(i/6)*Math.PI*2-Math.PI/6+hrot;i===0?c.moveTo(Math.cos(a)*r,Math.sin(a)*r):c.lineTo(Math.cos(a)*r,Math.sin(a)*r);}c.closePath();c.fill();c.stroke();
                // Inner triangle frame (lines from center to alternating vertices)
                c.strokeStyle='rgba(0,200,100,0.5)';c.lineWidth=1;
                for(let i=0;i<3;i++){const a=(i/3)*Math.PI*2-Math.PI/6+hrot;c.beginPath();c.moveTo(0,0);c.lineTo(Math.cos(a)*r,Math.sin(a)*r);c.stroke();}
                // Green core
                const cg=c.createRadialGradient(0,0,0,0,0,r*.38);
                cg.addColorStop(0,'#fff');cg.addColorStop(.4,'#00ff88');cg.addColorStop(1,'#006633');
                c.fillStyle=cg;c.beginPath();c.arc(0,0,r*.38,0,Math.PI*2);c.fill();
                // Arc shield: quarter-circle rotating
                const sa=t/1200;
                c.strokeStyle='rgba(0,255,136,0.85)';c.lineWidth=2.5;
                c.shadowColor='rgba(0,255,136,0.5)';c.shadowBlur=4;
                c.beginPath();c.arc(0,0,r*1.35,sa,sa+Math.PI*0.5);c.stroke();
                c.shadowBlur=0;
                c.restore();

              }else if(nxi===1){
                // Veilshroud — violet ribbons + armillary + core
                c.globalAlpha=.12;c.fillStyle='#8c14ff';
                c.beginPath();c.arc(ex,ey,r*2.2,0,Math.PI*2);c.fill();c.globalAlpha=1;
                c.save();c.translate(ex,ey);
                for(let i=0;i<3;i++){
                  c.save();c.rotate((i/3)*Math.PI*2+t/3000);
