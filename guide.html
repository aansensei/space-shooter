                  rg2.addColorStop(0,'rgba(140,20,255,0.55)');rg2.addColorStop(1,'transparent');
                  c.fillStyle=rg2;const wv=Math.sin(t/250+i)*16;
                  c.beginPath();c.moveTo(-r*.25,0);c.quadraticCurveTo(wv-r*.25,-r*1.1,0,-r*2);c.quadraticCurveTo(wv+r*.25,-r*1.1,r*.25,0);c.closePath();c.fill();c.restore();
                }
                c.strokeStyle='rgba(140,20,255,0.8)';c.lineWidth=1.5;
                c.beginPath();c.ellipse(0,0,r*1.05,r*.38,t/1000,0,Math.PI*2);c.stroke();
                c.fillStyle='#000';c.beginPath();c.arc(0,0,r*.38,0,Math.PI*2);c.fill();
                c.fillStyle='#8c14ff';c.save();c.rotate(t/1500);
                c.beginPath();c.ellipse(0,0,r*.1,r*.6,0,0,Math.PI*2);c.fill();c.restore();
                c.restore();

              }else if(nxi===2){
                // Thaelis — gold octagon + orbiting dots
                c.globalAlpha=.15+.08*Math.sin(t/400);c.fillStyle='#ffd700';
                c.beginPath();c.arc(ex,ey,r*1.8,0,Math.PI*2);c.fill();c.globalAlpha=1;
                c.save();c.translate(ex,ey);c.rotate(t/3000);
                c.fillStyle='#1a1a2e';c.strokeStyle='#FFD700';c.lineWidth=1.5;
                c.beginPath();for(let i=0;i<8;i++){const a=(i/8)*Math.PI*2;i===0?c.moveTo(Math.cos(a)*r,Math.sin(a)*r):c.lineTo(Math.cos(a)*r,Math.sin(a)*r);}c.closePath();c.fill();c.stroke();
                c.restore();
                const cg2=c.createRadialGradient(ex,ey,0,ex,ey,r*.3);
                cg2.addColorStop(0,'#fff');cg2.addColorStop(.5,'#FFD700');cg2.addColorStop(1,'#FFA500');
                c.fillStyle=cg2;c.beginPath();c.arc(ex,ey,r*.3,0,Math.PI*2);c.fill();
                c.fillStyle='#FFD700';
                for(let i=0;i<6;i++){const a=t/2000+(i/6)*Math.PI*2;c.beginPath();c.arc(ex+Math.cos(a)*(r+9),ey+Math.sin(a)*(r+9),2,0,Math.PI*2);c.fill();}

              }else{
                // Dargruel — PURPLE/indigo octagon boss
                const rb=r*1.15, rot=t/3500;
                // Purple aura
                c.globalAlpha=.15+.08*Math.sin(t/200);c.fillStyle='rgba(138,43,226,0.4)';
                c.shadowColor='#9900ff';c.shadowBlur=10;
                c.beginPath();c.arc(ex,ey,rb*2,0,Math.PI*2);c.fill();

                const og=c.createRadialGradient(0,0,0,0,0,rb);
                og.addColorStop(0,'#15002a');og.addColorStop(.55,'#2d004d');og.addColorStop(1,'#0d001a');
                c.fillStyle=og;c.strokeStyle='#6a0dad';c.lineWidth=2.5;
                c.beginPath();for(let i=0;i<8;i++){const a=(i/8)*Math.PI*2+Math.PI/8;i===0?c.moveTo(Math.cos(a)*rb,Math.sin(a)*rb):c.lineTo(Math.cos(a)*rb,Math.sin(a)*rb);}c.closePath();c.fill();c.stroke();
                // 4 diagonal veins
                c.strokeStyle='rgba(138,43,226,0.4)';c.lineWidth=1;
                for(let i=0;i<4;i++){const va=(i/4)*Math.PI*2;c.beginPath();c.moveTo(0,0);c.lineTo(Math.cos(va)*rb,Math.sin(va)*rb);c.stroke();}
                c.restore();
                // Inner counter-rotating octagon
                c.save();c.translate(ex,ey);c.rotate(-rot*2.5);
                c.strokeStyle='#8A2BE2';c.lineWidth=1.5;c.globalAlpha=0.8;
                c.beginPath();for(let i=0;i<8;i++){const a=(i/8)*Math.PI*2+Math.PI/8;i===0?c.moveTo(Math.cos(a)*rb*.75,Math.sin(a)*rb*.75):c.lineTo(Math.cos(a)*rb*.75,Math.sin(a)*rb*.75);}c.closePath();c.stroke();
                c.globalAlpha=1;c.restore();
                // Abyss Eye core
                const eg2=c.createRadialGradient(ex,ey,0,ex,ey,rb*.35);
                eg2.addColorStop(0,'#fff');eg2.addColorStop(.35,'#df88ff');eg2.addColorStop(1,'#4B0082');
                c.fillStyle=eg2;c.beginPath();c.arc(ex,ey,rb*.35,0,Math.PI*2);c.fill();
                // 4 directional triangles (rotating)
                c.save();c.translate(ex,ey);c.rotate(t/2000);
                c.fillStyle='rgba(223,136,255,0.7)';
                for(let i=0;i<4;i++){c.save();c.rotate((i/4)*Math.PI*2);c.beginPath();c.moveTo(0,rb*.55);c.lineTo(-rb*.12,rb*.38);c.lineTo(rb*.12,rb*.38);c.closePath();c.fill();c.restore();}
                c.restore();
                // 4 chain nodes at cardinal positions
                c.save();c.translate(ex,ey);
                for(let i=0;i<4;i++){
                  const ca=(i/4)*Math.PI*2,cnx=Math.cos(ca)*rb*1.15,cny=Math.sin(ca)*rb*1.15;
                  c.fillStyle='#0d001a';c.strokeStyle='#9900ff';c.lineWidth=1;

              // Entity name above entity

              c.fillText('spawned at apostle pos',w*.5,ey+4);

          drawNorm(performance.now());
        }

        // Thaelis
        const st = setup('cvThaelis');
        if (st) {
          const { c, w, h } = st;
          function drawThal(t) {
            c.clearRect(0, 0, w, h);
            const cx2 = w * 0.2, cy2 = h * 0.45, r = 18;
            // Halo
            c.fillStyle = `rgba(255,200,0,${0.12 + 0.08 * Math.sin(t / 400)})`;
            c.beginPath(); c.arc(cx2, cy2, r + 10, 0, Math.PI * 2); c.fill();
            // Octagon

            c.fillStyle = '#1a1a2e'; c.strokeStyle = '#FFD700'; c.lineWidth = 1.5;
            c.beginPath(); for (let i = 0; i < 8; i++) { const a = (i / 8) * Math.PI * 2; const px = Math.cos(a) * r, py = Math.sin(a) * r; i === 0 ? c.moveTo(px, py) : c.lineTo(px, py); } c.closePath(); c.fill(); c.stroke();
            c.restore();
            // Inner octagon

            c.strokeStyle = '#FFA500'; c.lineWidth = 1; c.globalAlpha = 0.55;
            c.beginPath(); for (let i = 0; i < 8; i++) { const a = (i / 8) * Math.PI * 2; const px = Math.cos(a) * r * 0.55, py = Math.sin(a) * r * 0.55; i === 0 ? c.moveTo(px, py) : c.lineTo(px, py); } c.closePath(); c.stroke();
            c.globalAlpha = 1; c.restore();
            // Core
            const cg = c.createRadialGradient(cx2, cy2, 0, cx2, cy2, r * 0.28);
            cg.addColorStop(0, '#fff'); cg.addColorStop(0.5, '#FFD700'); cg.addColorStop(1, '#FFA500');
            c.fillStyle = cg; c.beginPath(); c.arc(cx2, cy2, r * 0.28, 0, Math.PI * 2); c.fill();

            // Split projectile animation
            const sp = (t / 2000) % 1;
            if (sp < 0.4) { c.fillStyle = '#FFD700'; c.globalAlpha = 0.7; c.beginPath(); c.arc(cx2 + r + 20 + sp * 150, cy2 - 5, 5, 0, Math.PI * 2); c.fill(); c.globalAlpha = 1; }
            if (sp > 0.4 && sp < 0.9) {
              const sp2 = (sp - 0.4) / 0.5;
              c.fillStyle = '#ffaa00';[[-10, -15], [0, 0], [10, 15]].forEach(([dx, dy]) => { c.beginPath(); c.arc(cx2 + r + 80 + sp2 * 80 + dx, cy2 + dy * sp2, 3, 0, Math.PI * 2); c.fill(); });
            }
            // Embryo
            const emx = w * 0.7, emy = h * 0.5;
            const ep = Math.abs(Math.sin(t / 150)) * 3;
            c.fillStyle = 'rgba(138,43,226,0.15)'; c.beginPath(); c.ellipse(emx, emy, 8 + ep, 11 + ep, 0, 0, Math.PI * 2); c.fill();
            const emg = c.createRadialGradient(emx - 2, emy - 2, 0, emx, emy, 8 + ep);
            emg.addColorStop(0, '#df88ff'); emg.addColorStop(0.4, '#8A2BE2'); emg.addColorStop(1, '#4a0080');
            c.fillStyle = emg; c.beginPath(); c.ellipse(emx, emy, 6 + ep, 9 + ep, 0, 0, Math.PI * 2); c.fill();
            // Labels
            c.fillStyle = '#FFD70088'; c.font = '7px Share Tech Mono, monospace'; c.textAlign = 'center';
            c.fillText('splits into 3 homing', w * 0.42, h * 0.22);
            c.fillText('EMBRYO (90% DR)', emx, emy + 18);
            c.fillStyle = '#8A2BE255'; c.fillText('hatches @3s', emx, emy + 27);
            c.textAlign = 'left';
            activeAnimations.push(requestAnimationFrame(() => drawThal(performance.now())));
          }
          drawThal(performance.now());
        }

        // Veilshroud
        const sv2 = setup('cvVeil');
        if (sv2) {
          const { c, w, h } = sv2;
          // State cycle: 0=normal(2s) → 1=phantom(1.5s) → 2=lightning_warn(1.5s) → 3=strike(0.6s) → back
          const CYCLE = [2000, 1500, 1500, 600];
          const TOTAL = CYCLE.reduce((a, b) => a + b, 0);
          // Jagged bolt helper — matches game's _drawLightningBolt (random jitter every frame)
          function veilBolt(x1, y1, x2, y2, n, jit) {
            const pts = [[x1, y1]];
            for (let i = 1; i < n; i++) { const f = i / n; pts.push([x1 + (x2 - x1) * f + (Math.random() - 0.5) * jit, y1 + (y2 - y1) * f + (Math.random() - 0.5) * jit]); }
            pts.push([x2, y2]);
            c.beginPath(); pts.forEach(([px, py], i) => i ? c.lineTo(px, py) : c.moveTo(px, py)); c.stroke();
          }

          function drawVeil(t) {
            c.clearRect(0, 0, w, h);
            const cx2 = w * 0.22, cy2 = h * 0.5, r = 20;

            // Determine cycle phase
            const tMod = t % TOTAL;
            let phase = 0, phaseT = tMod;
            for (let pi = 0; pi < CYCLE.length; pi++) {
              if (phaseT < CYCLE[pi]) { phase = pi; phaseT = phaseT / CYCLE[pi]; break; }
              phaseT -= CYCLE[pi];
            }

            // phantom lerp (0=normal violet, 1=phantom cyan)
            let phantomLerp = 0;
            if (phase === 0) phantomLerp = 0;
            else if (phase === 1) phantomLerp = Math.min(1, phaseT / 0.25);
            else if (phase === 2) phantomLerp = Math.max(0, 1 - phaseT / 0.3);
            else phantomLerp = 0;

            const cR = Math.round(140 + (0 - 140) * phantomLerp);
            const cG = Math.round(20 + (230 - 20) * phantomLerp);
            const cB = Math.round(255 + (200 - 255) * phantomLerp);
            const mc = `rgb(${cR},${cG},${cB})`;
            const baseAlpha = 1 - phantomLerp * 0.5;

            c.save();
            c.translate(cx2, cy2);
            c.globalAlpha = baseAlpha;

            // Glitch jitter in phantom
            if (phase === 1 && Math.random() < 0.3) {
              c.translate((Math.random() - 0.5) * 10 * phantomLerp, (Math.random() - 0.5) * 7 * phantomLerp);
            }

            // 1. Aura
            const aG = c.createRadialGradient(0, 0, r * 0.4, 0, 0, r * 3.0);
            aG.addColorStop(0, `rgba(${cR},${cG},${cB},0.16)`);
            aG.addColorStop(1, 'transparent');
            c.fillStyle = aG; c.beginPath(); c.arc(0, 0, r * 3.0, 0, Math.PI * 2); c.fill();

            // 2. Void ribbons (5 petals)
            const numR = 5;
            for (let i = 0; i < numR; i++) {
              c.save();
              const rotSpd = t / (3000 - phantomLerp * 1400) * (i % 2 === 0 ? 1 : -1);
              c.rotate((i / numR) * Math.PI * 2 + rotSpd);
              const rLen = r * 2.5 + Math.sin(t / 400 + i) * 16;
              const rWid = r * 0.35;
              const wave = Math.sin(t / 250 + i) * 28;
              const rg = c.createLinearGradient(0, 0, 0, -rLen);
              rg.addColorStop(0, `rgba(${cR},${cG},${cB},${0.5 - phantomLerp * 0.22})`);
              rg.addColorStop(0.7, `rgba(${Math.round(cR / 2)},${Math.round(cG / 2)},${Math.round(cB / 2)},0.12)`);
              rg.addColorStop(1, 'transparent');
              c.fillStyle = rg;
              c.beginPath();
              c.moveTo(-rWid / 2, 0);
              c.quadraticCurveTo(wave - rWid, -rLen * 0.5, 0, -rLen);
              c.quadraticCurveTo(wave + rWid, -rLen * 0.5, rWid / 2, 0);
              c.closePath(); c.fill();
              c.restore();
            }

            // 3. Armillary rings
            c.strokeStyle = `rgba(${cR},${cG},${cB},0.8)`; c.lineWidth = 1.8;
            c.beginPath(); c.ellipse(0, 0, r * 1.05, r * 0.38, t / 1000, 0, Math.PI * 2); c.stroke();
            c.strokeStyle = `rgba(255,255,255,${0.3 + phantomLerp * 0.4})`; c.lineWidth = 1;
            c.setLineDash([8, 12]);
            c.beginPath(); c.ellipse(0, 0, r * 1.22, r * 0.46, -t / 800 + Math.PI / 4, 0, Math.PI * 2); c.stroke();
            c.setLineDash([]);

            // 4. Armor shards
            const shOff = phantomLerp * 32;
            const shAlpha = 1 - phantomLerp * 0.82;
            c.fillStyle = `rgba(10,5,20,${shAlpha})`;
            c.strokeStyle = `rgba(${cR},${cG},${cB},${0.8 + phantomLerp * 0.2})`; c.lineWidth = 1.4;
            const shards = [
              [[0, -r * 1.5 - shOff], [r * 0.46, -r * 0.55 - shOff * 0.5], [0, -r * 0.36], [-r * 0.46, -r * 0.55 - shOff * 0.5]],
              [[0, r * 1.3 + shOff], [r * 0.36, r * 0.46 + shOff * 0.5], [0, r * 0.26], [-r * 0.36, r * 0.46 + shOff * 0.5]],
              [[-r * 1.2 - shOff, 0], [-r * 0.46, -r * 0.26], [-r * 0.26, 0], [-r * 0.46, r * 0.26]],
              [[r * 1.2 + shOff, 0], [r * 0.46, -r * 0.26], [r * 0.26, 0], [r * 0.46, r * 0.26]],
            ];
            shards.forEach(pts => {
              c.beginPath(); c.moveTo(pts[0][0], pts[0][1]);
              for (let p = 1; p < pts.length; p++) c.lineTo(pts[p][0], pts[p][1]);
              c.closePath();
              if (phantomLerp < 0.88) c.fill();
              c.stroke();
            });

            // 5. Singularity core
            const coreR = r * 0.36 + phantomLerp * r * 0.18;
            const accR2 = coreR * 1.5 + Math.sin(t / 100) * 2;
            const accGrad = c.createRadialGradient(0, 0, coreR * 0.7, 0, 0, accR2);
            accGrad.addColorStop(0, '#ffffff'); accGrad.addColorStop(0.4, mc); accGrad.addColorStop(1, 'transparent');
            c.fillStyle = accGrad; c.beginPath(); c.arc(0, 0, accR2, 0, Math.PI * 2); c.fill();
            c.fillStyle = '#000'; c.beginPath(); c.arc(0, 0, coreR, 0, Math.PI * 2); c.fill();
            // iris
            c.fillStyle = phantomLerp > 0.5 ? '#ffffff' : mc;
            c.save(); c.rotate(t / 1500);
            c.beginPath(); c.ellipse(0, 0, coreR * 0.12, coreR * 0.72, 0, 0, Math.PI * 2); c.fill();
            c.restore();

            c.restore(); // end entity

            // ── PHASE LABELS (right side) ──
            c.fillStyle = '#22cc55'; c.font = 'bold 8px Orbitron,sans-serif'; c.textAlign = 'left';
            if (phase === 0) {
              c.fillText('NORMAL STANCE', w * 0.48, h * 0.12);
              c.fillStyle = '#8899bb'; c.font = '7px Share Tech Mono,monospace';
              c.fillText('15% DR • firing 2-bullet volley', w * 0.48, h * 0.12 + 12);
              // bullets flying
              const bprog = (t / 600) % 1;
              const bAngle = -0.25 + Math.sin(t / 800) * 0.15;
              for (let bi = 0; bi < 2; bi++) {
                const ba = bAngle + (bi - 0.5) * 0.2;
                const bx = cx2 + Math.cos(ba) * (r + 10 + bprog * 80);
                const by = cy2 + Math.sin(ba) * (r + 10 + bprog * 80);
                c.fillStyle = `rgba(170,0,255,${1 - bprog})`;
                c.beginPath(); c.arc(bx, by, 3, 0, Math.PI * 2); c.fill();
              }
              // State hint
              c.fillStyle = 'rgba(0,229,204,0.55)'; c.font = '7px Share Tech Mono,monospace';
              c.textAlign = 'center';
              c.fillText('PHANTOM check every 0.45s (40%)', w * 0.5, h * 0.9);
            } else if (phase === 1) {
              c.fillStyle = '#00e5cc'; c.font = 'bold 8px Orbitron,sans-serif'; c.textAlign = 'left';
              c.fillText('PHANTOM SHIFT', w * 0.48, h * 0.12);
              c.fillStyle = '#8899bb'; c.font = '7px Share Tech Mono,monospace';
              c.fillText('99% DR • frozen • 1.5s', w * 0.48, h * 0.12 + 12);
              // pulsing cyan ring
              const pR2 = r * 1.7 + Math.sin(t / 150) * 6;
              c.strokeStyle = `rgba(0,229,204,${0.3 + phantomLerp * 0.5})`; c.lineWidth = 2;
              c.setLineDash([6, 8]);
              c.beginPath(); c.arc(cx2, cy2, pR2, 0, Math.PI * 2); c.stroke();
              c.setLineDash([]);
              c.fillStyle = 'rgba(0,229,204,0.5)'; c.textAlign = 'center'; c.font = '7px Share Tech Mono,monospace';
              c.fillText('on hit: 40% instant dodge → Phantom', w * 0.5, h * 0.9);
            } else if (phase === 2) {
              // Lightning countdown animation
              const tx = w * 0.72, ty = h * 0.55;
              const circR = 32;
              c.fillStyle = '#ff2244'; c.font = 'bold 8px Orbitron,sans-serif'; c.textAlign = 'left';
              c.fillText('VOID STRIKE', w * 0.48, h * 0.12);
              c.fillStyle = '#8899bb'; c.font = '7px Share Tech Mono,monospace';
              c.fillText('targeting random sentinel/player', w * 0.48, h * 0.12 + 12);
              // Target circle
              c.strokeStyle = `rgba(255,30,30,0.75)`; c.lineWidth = 2;
              c.setLineDash([7, 5]);
              c.beginPath(); c.arc(tx, ty, circR, 0, Math.PI * 2); c.stroke(); c.setLineDash([]);
              // expanding fill from center
              if (phaseT > 0.04) {
                const fG = c.createRadialGradient(tx, ty, 0, tx, ty, circR * phaseT);
                fG.addColorStop(0, `rgba(255,30,30,${0.32 * phaseT})`); fG.addColorStop(1, 'rgba(255,0,0,0)');
                c.fillStyle = fG; c.beginPath(); c.arc(tx, ty, circR * phaseT, 0, Math.PI * 2); c.fill();
              }
              // crosshairs
              c.strokeStyle = 'rgba(255,80,80,0.65)'; c.lineWidth = 1;
              c.beginPath(); c.moveTo(tx - circR * 1.3, ty); c.lineTo(tx + circR * 1.3, ty);
              c.moveTo(tx, ty - circR * 1.3); c.lineTo(tx, ty + circR * 1.3); c.stroke();
              c.fillStyle = 'rgba(255,100,100,0.9)';
              c.beginPath(); c.arc(tx, ty, 4, 0, Math.PI * 2); c.fill();
              c.fillStyle = 'rgba(255,100,100,0.7)'; c.font = '7px Share Tech Mono,monospace'; c.textAlign = 'center';
              c.fillText('TARGET', tx, ty - circR - 5);
              c.fillText(`${((1 - phaseT) * 1.5).toFixed(1)}s`, tx, ty + circR + 12);
            } else {
              // Strike — matches game's _drawVeilshroudEffects lightning rendering
              const tx = w * 0.72, ty = h * 0.55;
              const prog = 1 - phaseT; // 1→0 as strike fades (matches game lt.life/maxLife)
              // Shockwave ring at target: expands from r*1.0 → r*1.3 as prog→0
              c.globalAlpha = prog * 0.5;
              c.strokeStyle = '#ff2233'; c.lineWidth = 3 + prog * 5;
              c.beginPath(); c.arc(tx, ty, 32 * (1.3 - prog * 0.3), 0, Math.PI * 2); c.stroke();
              // Inner white bolt (dynamic jagged, flickers each frame)
              c.globalAlpha = prog;
              c.strokeStyle = '#ffffff'; c.lineWidth = 3 * prog;
              veilBolt(tx, 0, tx, ty, 5, 28);
              // Outer red bolt
              c.strokeStyle = `rgba(255,30,50,${prog * 0.65})`; c.lineWidth = 6 * prog;
              veilBolt(tx, 0, tx, ty, 4, 35);
              c.globalAlpha = 1;
              c.fillStyle = '#ff2244'; c.font = 'bold 8px Orbitron,sans-serif'; c.textAlign = 'left';
              c.fillText('VOID STRIKE', w * 0.48, h * 0.12);
              c.fillStyle = '#8899bb'; c.font = '7px Share Tech Mono,monospace';
              c.fillText('1 life (player) • 15% EP (sentinels)', w * 0.48, h * 0.12 + 12);
            }

            activeAnimations.push(requestAnimationFrame(() => drawVeil(performance.now())));
          }
          drawVeil(performance.now());
        }

        // Aegis Core
        const sa = setup('cvAegis');
        if (sa) {
          const { c, w, h } = sa;
          // pulse state
          let aegPulses = [], aegLastPulse = 0;
          function drawAeg(t) {
            c.clearRect(0, 0, w, h);
            const cx2 = w * 0.22, cy2 = h * 0.5, r = 17;
            const auraR = Math.min(w * 0.48, h * 0.46);

            // 1. Zone background
            const zg = c.createRadialGradient(cx2, cy2, r, cx2, cy2, auraR);
            zg.addColorStop(0, 'rgba(255,0,0,0.02)'); zg.addColorStop(0.7, 'rgba(200,0,0,0.04)'); zg.addColorStop(1, 'rgba(220,0,0,0.16)');
            c.fillStyle = zg; c.beginPath(); c.arc(cx2, cy2, auraR, 0, Math.PI * 2); c.fill();

            // 2. Limit boundary ring (red)
            c.strokeStyle = 'rgba(255,40,40,0.85)'; c.lineWidth = 2.5;
            c.beginPath(); c.arc(cx2, cy2, auraR, 0, Math.PI * 2); c.stroke();
            // Gold dashed inner
            c.save(); c.translate(cx2, cy2); c.rotate(t / 5000);
            c.strokeStyle = 'rgba(255,215,0,0.6)'; c.lineWidth = 1.5; c.setLineDash([10, 8, 3, 8]);
            c.beginPath(); c.arc(0, 0, auraR - 5, 0, Math.PI * 2); c.stroke(); c.setLineDash([]); c.restore();
            // 4 bracket locks
            c.save(); c.translate(cx2, cy2); c.rotate(-t / 8000);
            c.strokeStyle = 'rgba(255,255,255,0.85)'; c.lineWidth = 3;
            for (let i = 0; i < 4; i++) { c.beginPath(); c.arc(0, 0, auraR, i * Math.PI / 2 - 0.08, i * Math.PI / 2 + 0.08); c.stroke(); }
            c.restore();

            // 3. Pulse waves (gold → red)
            if (t - aegLastPulse > 1500) { aegPulses.push({ st: t, dur: 1400, sr: r * 1.2, er: auraR }); aegLastPulse = t; }
            for (let pi = aegPulses.length - 1; pi >= 0; pi--) {
              const p = aegPulses[pi]; const tp = (t - p.st) / p.dur;
              if (tp >= 1) { aegPulses.splice(pi, 1); continue; }
              const et = 1 - Math.pow(1 - tp, 2.5); const cr = p.sr + et * (p.er - p.sr); const al = (1 - tp) * 0.75;
              const gCol = Math.floor(215 * (1 - tp));
              c.strokeStyle = `rgba(255,${gCol},0,${al})`; c.lineWidth = 4 * (1 - tp) + 1;
              c.beginPath(); c.arc(cx2, cy2, cr, 0, Math.PI * 2); c.stroke();
              c.save(); c.translate(cx2, cy2); c.rotate(tp * Math.PI * 0.5);
              c.strokeStyle = `rgba(255,255,255,${al * 0.7})`; c.lineWidth = 1; c.setLineDash([5 + tp * 10, 8]);
              c.beginPath(); c.arc(0, 0, cr * 0.94, 0, Math.PI * 2); c.stroke(); c.setLineDash([]); c.restore();
            }

            // 4. Custos shield (gold)
            const shieldR = r * 1.65;
            const sp = 0.8 + 0.2 * Math.sin(t / 150);
            c.strokeStyle = `rgba(255,215,0,${sp})`; c.lineWidth = 2.5;
            c.fillStyle = 'rgba(255,215,0,0.07)';
            c.beginPath(); c.arc(cx2, cy2, shieldR, 0, Math.PI * 2); c.fill(); c.stroke();
            c.save(); c.translate(cx2, cy2); c.rotate(t / 3000);
            c.strokeStyle = 'rgba(255,255,255,0.6)'; c.lineWidth = 0.8;
            c.beginPath();
            for (let i = 0; i < 12; i++) { const a = (i / 12) * Math.PI * 2, na = ((i + 3) / 12) * Math.PI * 2; c.moveTo(Math.cos(a) * shieldR, Math.sin(a) * shieldR); c.lineTo(Math.cos(na) * shieldR, Math.sin(na) * shieldR); }
            c.stroke(); c.restore();

            // 5. Armillary rings
            c.save(); c.translate(cx2, cy2);
            c.strokeStyle = 'rgba(200,200,220,0.8)'; c.lineWidth = 2;
            c.save(); c.rotate(t / 1500); c.scale(1, 0.3 + 0.1 * Math.sin(t / 1000));
            c.beginPath(); c.arc(0, 0, r * 1.35, 0, Math.PI * 2); c.stroke(); c.restore();
            c.save(); c.rotate(-t / 1800 + Math.PI / 4); c.scale(0.35 + 0.15 * Math.sin(t / 1200), 1);
            c.strokeStyle = 'rgba(255,100,100,0.7)';
            c.beginPath(); c.arc(0, 0, r * 1.45, 0, Math.PI * 2); c.stroke(); c.restore();
            c.restore();

            // 6. Shell body
            c.save(); c.translate(cx2, cy2);
            const sg = c.createRadialGradient(0, 0, r * 0.4, 0, 0, r);
            sg.addColorStop(0, '#e0e0e0'); sg.addColorStop(0.5, '#7a7a7a'); sg.addColorStop(0.85, '#2b2b2b'); sg.addColorStop(1, '#050505');
            c.fillStyle = sg; c.strokeStyle = '#444'; c.lineWidth = 1.5;
            c.beginPath(); c.arc(0, 0, r, 0, Math.PI * 2); c.fill(); c.stroke();
            c.rotate(-t / 4000); c.strokeStyle = 'rgba(0,0,0,0.7)'; c.lineWidth = 1;
            for (let i = 0; i < 8; i++) { const a = (i / 8) * Math.PI * 2; c.beginPath(); c.moveTo(Math.cos(a) * r * 0.3, Math.sin(a) * r * 0.3); c.lineTo(Math.cos(a) * r * 0.98, Math.sin(a) * r * 0.98); c.stroke(); }
            c.restore();

            // 7. Mechanical iris
            c.save(); c.translate(cx2, cy2);
            const iR = r * 0.45;
            c.fillStyle = '#050000'; c.beginPath(); c.arc(0, 0, iR, 0, Math.PI * 2); c.fill();
            const cb = 0.85 + 0.2 * Math.abs(Math.sin(t / 750));
            const cg2 = c.createRadialGradient(0, 0, 0, 0, 0, iR * cb);
            cg2.addColorStop(0, '#fff'); cg2.addColorStop(0.2, '#ffdd44'); cg2.addColorStop(0.5, '#ff2200'); cg2.addColorStop(1, 'transparent');
            c.fillStyle = cg2; c.beginPath(); c.arc(0, 0, iR * cb, 0, Math.PI * 2); c.fill();
            c.rotate(t / 2000); c.fillStyle = '#111'; c.strokeStyle = '#ff8888'; c.lineWidth = 0.8;
            for (let i = 0; i < 6; i++) { c.save(); c.rotate((i / 6) * Math.PI * 2); c.beginPath(); c.moveTo(iR * 0.4, 0); c.lineTo(iR, -iR * 0.4); c.lineTo(iR, iR * 0.4); c.closePath(); c.fill(); c.stroke(); c.restore(); }
            c.fillStyle = `rgba(255,255,255,${0.8 + 0.2 * Math.sin(t / 100)})`;
            c.beginPath(); c.arc(0, 0, r * 0.12, 0, Math.PI * 2); c.fill();
            c.restore();

            // ── LUMEN NOVA ──
            const novaPhase = (t % 5000) / 5000;
            const novaTargets = [[w * 0.6, h * 0.75], [w * 0.45, h * 0.25], [w * 0.75, h * 0.35], [w * 0.85, h * 0.7]];
            if (novaPhase < 0.3) {
              const wA = novaPhase / 0.3;
              novaTargets.forEach(([tx, ty], ti) => {
                c.strokeStyle = `rgba(255,0,0,${wA * 0.1})`; c.lineWidth = 16;
                c.beginPath(); c.moveTo(cx2, cy2); c.lineTo(tx, ty); c.stroke();
                c.strokeStyle = `rgba(255,100,100,${wA * 0.75})`; c.lineWidth = 1.2;
                c.setLineDash([8, 8]); c.beginPath(); c.moveTo(cx2, cy2); c.lineTo(tx, ty); c.stroke(); c.setLineDash([]);
                c.fillStyle = `rgba(255,80,80,${wA * 0.8})`; c.beginPath(); c.arc(tx, ty, 4, 0, Math.PI * 2); c.fill();
                c.fillStyle = `rgba(255,100,100,${wA * 0.6})`; c.font = '6px Share Tech Mono,monospace'; c.textAlign = 'center';
                c.fillText(ti === 0 ? 'PLAYER' : 'SENTINEL', tx, ty - 7); c.textAlign = 'left';
              });
            } else if (novaPhase < 0.45) {
              const fA = 1 - (novaPhase - 0.3) / 0.15;
              novaTargets.forEach(([tx, ty]) => {
                c.strokeStyle = `rgba(255,30,30,${fA * 0.5})`; c.lineWidth = 25 * fA;
                c.beginPath(); c.moveTo(cx2, cy2); c.lineTo(tx, ty); c.stroke();
                c.strokeStyle = `rgba(255,255,255,${fA * 0.9})`; c.lineWidth = 4 * fA;
                c.beginPath(); c.moveTo(cx2, cy2); c.lineTo(tx, ty); c.stroke();
              });
            }

            // Labels
            c.fillStyle = '#ff8844'; c.font = 'bold 8px Orbitron,sans-serif'; c.textAlign = 'left';
            c.fillText('CUSTOS AETERNUS', w * 0.5, h * 0.1);
            c.fillStyle = '#8899bb'; c.font = '7px Share Tech Mono,monospace';
            c.fillText('1st hit = Iron Body', w * 0.5, h * 0.1 + 12);
            c.fillStyle = '#ff8844'; c.font = 'bold 8px Orbitron,sans-serif';
            c.fillText('SUPPORT AURA', w * 0.5, h * 0.1 + 28);
            c.fillStyle = '#8899bb'; c.font = '7px Share Tech Mono,monospace';
            c.fillText('Heal 2.5%/s • Shield 40% HP', w * 0.5, h * 0.1 + 40);
            c.fillStyle = '#ff8844'; c.font = 'bold 8px Orbitron,sans-serif';
            c.fillText('LUMEN NOVA (5s)', w * 0.5, h * 0.1 + 56);
            c.fillStyle = '#8899bb'; c.font = '7px Share Tech Mono,monospace';
            c.fillText('Targets + fires lasers', w * 0.5, h * 0.1 + 68);
            activeAnimations.push(requestAnimationFrame(() => drawAeg(performance.now())));
          }
          drawAeg(performance.now());
        }

        // Marchosias
        const sm = setup('cvMarcho');
        if (sm) {
          const { c, w, h } = sm;
          function drawMar(t) {
            c.clearRect(0, 0, w, h);
            const cx2 = w * 0.22, cy2 = h * 0.45, r = 20;
            // Aura
            c.fillStyle = `rgba(0,255,120,${0.08 + 0.04 * Math.sin(t / 350)})`;
            c.beginPath(); c.arc(cx2, cy2, r + 10, 0, Math.PI * 2); c.fill();
            // Hexagon
            c.fillStyle = '#1a1a2e'; c.strokeStyle = '#00cc66'; c.lineWidth = 2;
            c.beginPath();
            for (let i = 0; i < 6; i++) { const a = (i / 6) * Math.PI * 2 - Math.PI / 6; const px = cx2 + Math.cos(a) * r, py = cy2 + Math.sin(a) * r; i === 0 ? c.moveTo(px, py) : c.lineTo(px, py); }
            c.closePath(); c.fill(); c.stroke();
            // Inner triangles
            c.strokeStyle = 'rgba(0,200,100,0.5)'; c.lineWidth = 1;
            for (let i = 0; i < 3; i++) { const a = (i / 3) * Math.PI * 2 - Math.PI / 6; c.beginPath(); c.moveTo(cx2, cy2); c.lineTo(cx2 + Math.cos(a) * r, cy2 + Math.sin(a) * r); c.stroke(); }
            // Gear teeth
            c.save(); c.translate(cx2, cy2); c.rotate(t / 2500);
            c.strokeStyle = 'rgba(0,180,80,0.6)'; c.lineWidth = 1.5;
            for (let i = 0; i < 9; i++) { const a = (i / 9) * Math.PI * 2; c.beginPath(); c.moveTo(Math.cos(a) * r * 0.88, Math.sin(a) * r * 0.88); c.lineTo(Math.cos(a) * r * 0.98, Math.sin(a) * r * 0.98); c.stroke(); }
            c.restore();
            // Core
            const cg = c.createRadialGradient(cx2, cy2, 0, cx2, cy2, r * 0.32);
            cg.addColorStop(0, '#fff'); cg.addColorStop(0.4, '#00ff88'); cg.addColorStop(1, '#006633');
            c.fillStyle = cg; c.beginPath(); c.arc(cx2, cy2, r * 0.32, 0, Math.PI * 2); c.fill();
            // Arc shield rotating
            const shA = Math.atan2(0, 1) + t / 2000;
            c.strokeStyle = 'rgba(0,255,136,0.3)'; c.lineWidth = 12;
            c.beginPath(); c.arc(cx2, cy2, r + 14, shA - Math.PI / 4, shA + Math.PI / 4); c.stroke();
            c.strokeStyle = 'rgba(160,255,200,0.7)'; c.lineWidth = 5;
            c.beginPath(); c.arc(cx2, cy2, r + 14, shA - Math.PI / 4, shA + Math.PI / 4); c.stroke();
            c.strokeStyle = 'rgba(255,255,255,0.4)'; c.lineWidth = 1.5;
            c.beginPath(); c.arc(cx2, cy2, r + 10, shA - Math.PI / 4, shA + Math.PI / 4); c.stroke();

            // ── SWORD ANIMATION: warning beam → orange arc blade fires ──
            const swordCycle = 3500;
            const sp = (t % swordCycle) / swordCycle;
            const swordOriginX = cx2, swordOriginY = cy2;
            const swordTargetAngle = Math.PI * 0.35; // aim toward bottom-right
            if (sp < 0.35) {
              // Warning beam phase: orange dashed line from Mar to target
              const warnAlpha = 0.4 + 0.5 * Math.sin(t / 80);
              const warnLen = w * 0.55;
              c.save(); c.translate(swordOriginX, swordOriginY); c.rotate(swordTargetAngle);
              // Wide warning fill
              c.fillStyle = `rgba(255,180,0,${warnAlpha * 0.15})`;
              c.fillRect(0, -20, warnLen, 40);
              // Edge lines
              c.strokeStyle = `rgba(255,150,0,${warnAlpha * 0.7})`; c.lineWidth = 1.2;
              c.beginPath(); c.moveTo(0, -20); c.lineTo(warnLen, -20); c.stroke();
              c.beginPath(); c.moveTo(0, 20); c.lineTo(warnLen, 20); c.stroke();
              // Center dashed
              c.setLineDash([10, 7]); c.strokeStyle = `rgba(255,220,80,${warnAlpha * 0.6})`; c.lineWidth = 1;
              c.beginPath(); c.moveTo(0, 0); c.lineTo(warnLen, 0); c.stroke(); c.setLineDash([]);
              c.restore();
            }
            if (sp >= 0.35 && sp < 0.75) {
              // Blade arc flying out from Marchosias
              const flyT = (sp - 0.35) / 0.4;
              const flyDist = flyT * w * 0.55;
              const bx2 = swordOriginX + Math.cos(swordTargetAngle) * flyDist;
              const by2 = swordOriginY + Math.sin(swordTargetAngle) * flyDist;
              const bAngle = swordTargetAngle;
              const bSa = bAngle - Math.PI / 2, bEa = bAngle + Math.PI / 2;
              const bR = 28;
              const bFade = flyT < 0.15 ? flyT / 0.15 : (flyT > 0.75 ? (1 - flyT) / 0.25 : 1);
              // Outer orange-red glow
              c.strokeStyle = `rgba(255,80,0,${bFade * 0.3})`; c.lineWidth = 16;
              c.beginPath(); c.arc(bx2, by2, bR, bSa, bEa); c.stroke();
              // Main orange arc
              c.strokeStyle = `rgba(255,140,30,${bFade * 0.9})`; c.lineWidth = 5;
              c.beginPath(); c.arc(bx2, by2, bR, bSa, bEa); c.stroke();
              // Bright inner
              c.strokeStyle = `rgba(255,230,180,${bFade * 0.6})`; c.lineWidth = 2;
              c.beginPath(); c.arc(bx2, by2, bR - 3, bSa, bEa); c.stroke();
              // Energy slashes
              c.strokeStyle = `rgba(255,200,100,${bFade * (0.4 + 0.4 * Math.sin(t / 60))})`; c.lineWidth = 1;
              for (let i = 0; i < 3; i++) {
                const slA = bSa + (bEa - bSa) * ((i + 1) / 4);
                c.beginPath();
                c.moveTo(bx2 + Math.cos(slA) * (bR - 10), by2 + Math.sin(slA) * (bR - 10));
                c.lineTo(bx2 + Math.cos(slA) * (bR + 10), by2 + Math.sin(slA) * (bR + 10));
                c.stroke();
              }
            }
            // Roman numeral counter
            const swordCount = Math.floor((t / 4000) % 4) + 1;
            const romans = ['I', 'II', 'III', 'IV'];
            c.fillStyle = '#00ff88'; c.font = 'bold 10px serif'; c.textAlign = 'center';
            c.fillText(romans[swordCount - 1], cx2, cy2 + r + 20);

            // Minion triangle
            const mx = w * 0.82, my = h * 0.75;
            c.fillStyle = '#0d1f17'; c.strokeStyle = `rgba(0,200,80,${0.6 + 0.4 * Math.sin(t / 200)})`;
            c.lineWidth = 1.2;
            c.beginPath(); c.moveTo(mx, my - 8); c.lineTo(mx + 7, my + 4); c.lineTo(mx - 7, my + 4); c.closePath(); c.fill(); c.stroke();
            const mg = c.createRadialGradient(mx, my, 0, mx, my, 3.5);
            mg.addColorStop(0, '#fff'); mg.addColorStop(0.5, '#00ff88'); mg.addColorStop(1, 'rgba(0,100,50,0.4)');
            c.fillStyle = mg; c.beginPath(); c.arc(mx, my, 3.5, 0, Math.PI * 2); c.fill();
            // Labels
            c.fillStyle = '#ff880088'; c.font = '7px Share Tech Mono, monospace'; c.textAlign = 'center';
            c.fillText('MINION', mx, my + 16);
            c.textAlign = 'left';
            c.fillStyle = '#8899bb'; c.font = '7px Share Tech Mono, monospace';
            c.fillText('Shield hit 20% → queue Sword', w * 0.5, h * 0.55);
            c.fillText('HP 1% → all Swords fire at once', w * 0.5, h * 0.55 + 13);
            c.fillText('Swords are INDESTRUCTIBLE', w * 0.5, h * 0.55 + 26);
            activeAnimations.push(requestAnimationFrame(() => drawMar(performance.now())));
          }
          drawMar(performance.now());
        }

        // ── EGREGOR — Elite ──
        const sEg = setup('cvEgregor');
        if (sEg) {
          const { c, w, h } = sEg;
          const egCx = w * 0.28, egCy = h * 0.5;
          const egSc = Math.min(w, h) * 0.28 / 110;
          const egBase = 110 * egSc;
          const NUM_TENT_G = 10, NUM_SEG_G = 12;
          const egTents = [];
          for (let i = 0; i < NUM_TENT_G; i++) {
            egTents.push({
              baseAngle: (i / NUM_TENT_G) * Math.PI * 2,
              length: (150 + (i % 5) * 16) * egSc,
              phase: (i * 2.39996) % (Math.PI * 2),
              speedMult: 0.8 + (i % 3) * 0.3,
            });
          }
          // Calm 0-4s → rage 4-9s cycle — this idle loop is left exactly as-is
          // and keeps running by default; playWidget('egregor') below takes
          // over the canvas for one real-effects run, then hands back here.
          let egPlaying = false;
          function drawEg(t) {
            if (egPlaying) { activeAnimations.push(requestAnimationFrame(() => drawEg(performance.now()))); return; }
            c.clearRect(0, 0, w, h);
            c.fillStyle = 'rgba(2,2,10,0.92)'; c.fillRect(0, 0, w, h);
            const cp = (t % 9000) / 9000;
            const rageF = cp < 0.5 ? (cp > 0.44 ? (cp - 0.44) / 0.06 : 0) : (cp > 0.94 ? (1 - (cp - 0.94) / 0.06) : 1);
            const isR = rageF > 0.5;
            const tentC = isR ? '#880011' : '#004455';
            const strkC = isR ? '#ff3300' : '#00ffaa';
            const glwC  = isR ? '#ff3300' : '#00ffaa';

            c.save(); c.translate(egCx, egCy);

            // Aura
            const aRad = (110 * 1.8 + Math.sin(t / 300) * 20) * egSc;
            const aG = c.createRadialGradient(0, 0, 110 * 0.5 * egSc, 0, 0, aRad);
            aG.addColorStop(0, isR ? 'rgba(255,0,0,0.4)' : 'rgba(0,100,150,0.4)');
            aG.addColorStop(1, 'transparent');
            c.fillStyle = aG; c.beginPath(); c.arc(0, 0, aRad, 0, Math.PI * 2); c.fill();

            // Tentacles (chain sim)
            c.lineCap = 'round';
            for (const tent of egTents) {
              let cx2 = Math.cos(tent.baseAngle) * 110 * 0.4 * egSc;
              let cy2 = Math.sin(tent.baseAngle) * 110 * 0.4 * egSc;
              let cAngle = tent.baseAngle;
              const sLen = tent.length / NUM_SEG_G;
              const pts = [{ x: cx2, y: cy2, a: cAngle }];
              const ws = isR ? 150 : 350;
              for (let i = 0; i < NUM_SEG_G; i++) {

          const trueEnemy = {

              c.lineWidth = 0.4;
              c.beginPath(); c.moveTo(-p.size * 0.8, 0); c.lineTo(p.size * 0.8, 0); c.stroke();

            c.globalAlpha = 1;

            c.save(); c.translate(cx2, cy2); c.rotate(t / 8000);

            c.strokeStyle = `rgba(255,34,68,${0.8 + 0.2 * ringPulse})`; c.lineWidth = 1.2;
            for (let pass = 0; pass < 2; pass++) {
              c.save(); c.rotate(pass * Math.PI / 4);
              c.beginPath();
              for (let i = 0; i < 4; i++) {
                const a = (i / 4) * Math.PI * 2 - Math.PI / 4;
                i === 0 ? c.moveTo(Math.cos(a) * 30, Math.sin(a) * 30) : c.lineTo(Math.cos(a) * 30, Math.sin(a) * 30);
              }
              c.closePath();
              if (pass === 0) c.fill(); else { c.globalAlpha = 0.5; c.fill(); c.globalAlpha = 1; }
              c.stroke(); c.restore();
            }
            c.restore();

            // ── Center question mark ──
            c.save(); c.translate(cx2, cy2);

      // ── SKILL TAB CANVASES — real drawXxx() from js/render/*.js, click-to-play ──

        // ── THUNDER ORBS (Skill A) — real drawSkillA() + real drawEnemy() apostle target ──

            skillAOrbs = [];
            for (let i = 0; i < 20; i++) {
              skillAOrbs.push({ x: cx, y: cy, size: 8, isDefensive: i < 3, radius: 60, angle: (Math.PI * 2 / 20) * i, target: null });

                orb.y = cy + Math.sin(orb.angle) * orb.radius;

            spiritBullets.length = 0; bladeArcProjectiles.length = 0; particles.length = 0; explosions.length = 0;
            player.x = cx; player.y = cy;
            target.hp = target.maxHp;
            gameElapsedTime = 0;
            demoSpirit = { x: cx + 40, y: cy, isPhotokrystos: false, isFinishing: false, duration: 35000, spawnGameTime: 0 };

      // 16.67 guess) so phaseTimer/gameElapsedTime always match the real
      // performance.now() clock that drawSpirit()'s title-flash (lastSkillS)
      // reads internally — a fixed-dt accumulator drifts from that whenever
      // a frame is skipped/throttled.
      let lastT = performance.now();
      function tick() {
        const nowT = performance.now();
        const dt = nowT - lastT; lastT = nowT;
        if (_widgetPauseGuard(btn, nowT)) { activeAnimations.push(requestAnimationFrame(tick)); return; }
        gameElapsedTime += dt;
        phaseTimer += dt;
        if (window.AudioMgr) window.AudioMgr.tickPhotokrystosIdle();

        ctx = c; canvas = { width: w, height: h };
        c.clearRect(0, 0, w, h);
        c.fillStyle = 'rgba(0,5,10,0.7)'; c.fillRect(0, 0, w, h);
        _miniStars(c, w, h, performance.now(), 40);

        playerAngle += dt * 0.0005;
        player.x = w * 0.5 + Math.cos(playerAngle) * 60;
        player.y = h * 0.88 + Math.sin(playerAngle) * 10;

        for (const e of enemies) { if (!e.alive && e._deathT > 0) e._deathT -= dt; }

        if (phaseTimer >= PK_PHASES[phaseIdx].dur) {
          phaseTimer = 0;
          phaseIdx++;
          if (phaseIdx >= PK_PHASES.length) { finish(); return; }
          const next = PK_PHASES[phaseIdx].id;

          if (next === 'summon-flash') {
            summonEff.phase = 'flash'; summonEff.timer = 0;
            if (window.AudioMgr) window.AudioMgr.playSfx('photokrystos-summon-flash');
          }
          if (next === 'idle') {
            summonEff = null;
            spirit = {
              x: player.x, y: player.y - 90, isPhotokrystos: true, duration: 40000,
              spawnGameTime: gameElapsedTime, _combatStartTime: gameElapsedTime,
              _dntState: null, _dntTimer: 0, _dntAngle: 0, _dntSpiritRot: 0,
              _btmStarted: false, _btmPhase: null, _btmTimer: 0, _btmLightnings: [],
            };
            spirits = [spirit];
            lastSkillS = performance.now();
            if (window.AudioMgr) window.AudioMgr.startPhotokrystosIdle();
          }
          if (next === 'dnt-aim') {
            let best = null, bestDist = Infinity;
            for (const e of enemies) { if (!e.alive) continue; const d = Math.hypot(e.x - spirit.x, e.y - spirit.y); if (d < bestDist) { bestDist = d; best = e; } }
            dntTarget = best; dntKilled = false;
            spirit._dntState = 'aiming'; spirit._dntTimer = 0;
            if (dntTarget) spirit._dntAngle = Math.atan2(dntTarget.y - spirit.y, dntTarget.x - spirit.x);
            // Vine Bind companion trigger (mirrors skills.js): root nearest-boundary + nearest-player enemy
            let vbBound = null, vbBoundD = Infinity, vbPlayer = null, vbPlayerD = Infinity;
            for (const e of enemies) {
              if (!e.alive) continue;
              const dB = Math.abs(h - e.y); if (dB < vbBoundD) { vbBoundD = dB; vbBound = e; }
              const dP = Math.hypot(e.x - player.x, e.y - player.y); if (dP < vbPlayerD) { vbPlayerD = dP; vbPlayer = e; }
            }
            const vbTargets = new Set([vbBound, vbPlayer].filter(Boolean));
            if (vbTargets.size) {
              const vbNow = performance.now();
              for (const ve of vbTargets) ve._vineStart = vbNow;
              if (window.AudioMgr) window.AudioMgr.playSfx('photokrystos-vine-bind');
            }
          }
          if (next === 'dnt-fire') {
            spirit._dntState = 'firing'; spirit._dntTimer = 0; spirit._dntBaseAngle = spirit._dntAngle;
            if (window.AudioMgr) window.AudioMgr.playSfx('photokrystos-dnt-laser');
          }
          if (next === 'idle2') { spirit._dntState = null; spirit._dntTimer = 0; }
          if (next === 'boomerang') {
            photoBrangs.length = 0;
            photoBrangs.push(
              { x: spirit.x, y: spirit.y, rotation: 0, t: 0, dur: 1700, dirA: -0.6 },
              { x: spirit.x, y: spirit.y, rotation: 0, t: 0, dur: 1700, dirA: 0.6 }
            );
            brangHitDone = false;
            if (window.AudioMgr) window.AudioMgr.playSfx('photokrystos-boomerang-throw');
          }
          if (next === 'idle3') { photoBrangs.length = 0; }
          if (next === 'btm-warm') {
            spirit._btmStarted = true; spirit._btmPhase = 'warming'; spirit._btmTimer = 0;
            if (window.AudioMgr) { window.AudioMgr.playSfx('photokrystos-btm-warming'); window.AudioMgr.stopPhotokrystosIdle(); }
          }
          if (next === 'btm-fire') {
            spirit._btmPhase = 'firing'; spirit._btmTimer = 0; spirit._btmTickTimer = 0;
            if (window.AudioMgr) window.AudioMgr.playSfx('photokrystos-btm-firing');
          }
          if (next === 'btm-release') {
            spirit._btmPhase = 'releasing'; spirit._btmTimer = 0;
            bossShockwaves.push({ x: spirit.x, y: spirit.y, radius: 0, maxRadius: Math.hypot(w, h) * 0.85, speed: 22, _isBTMWave: true });
            if (window.AudioMgr) window.AudioMgr.playSfx('photokrystos-btm-shockwave');
            for (const e of enemies) if (e.alive) killFakeEnemy(e);
          }
        }

        const pid = PK_PHASES[phaseIdx].id;
        if (pid === 'summon-converge' || pid === 'summon-flash') summonEff.timer += dt;
        if (pid === 'dnt-aim') {
          spirit._dntTimer += dt;
          if (dntTarget && dntTarget.alive) spirit._dntAngle = Math.atan2(dntTarget.y - spirit.y, dntTarget.x - spirit.x);
        }
        if (pid === 'dnt-fire') {
          spirit._dntTimer += dt;
          const sweepProg = Math.min(1, spirit._dntTimer / 2000);
          spirit._dntAngle = spirit._dntBaseAngle + (sweepProg - 0.5) * 2 * 0.35;
          if (!dntKilled && spirit._dntTimer > 1600 && dntTarget && dntTarget.alive) { dntKilled = true; killFakeEnemy(dntTarget); }
        }
        if (pid === 'boomerang') {
          for (const b of photoBrangs) {
            b.t += dt;
            const p = Math.min(1, b.t / b.dur);
            const outP = p < 0.5 ? p * 2 : (1 - p) * 2;
            const dist = 190 * outP;
            const a = -Math.PI / 2 + b.dirA + Math.sin(p * Math.PI) * 0.9;
            b.x = spirit.x + Math.cos(a) * dist;
            b.y = spirit.y + Math.sin(a) * dist - 40 * Math.sin(p * Math.PI);
            b.rotation += 0.35 * (dt / 16.67);
            if (!brangHitDone && p > 0.48 && p < 0.55) {
              brangHitDone = true;
              if (window.AudioMgr) window.AudioMgr.playSfx('photokrystos-boomerang-hit');
              const t2 = enemies.find(e => e.alive);
              if (t2) killFakeEnemy(t2);
            }
          }
        }
        if (pid === 'btm-warm') {
          spirit._btmTimer += dt;
          spirit.x += (w / 2 - spirit.x) * 0.08;
          spirit.y += (h * 0.35 - spirit.y) * 0.08;
        }
        if (pid === 'btm-fire') {
          spirit._btmTimer += dt; spirit._btmTickTimer += dt;
          if (spirit._btmTickTimer >= 100) {
            spirit._btmTickTimer = 0;
            spirit._btmLightnings = enemies.filter(e => e.alive).map(e => ({ x: e.x, y: e.y }));
          }
          if (spirit._btmTimer > 1500 && spirit._btmTimer < 1600) { const t2 = enemies.find(e => e.alive); if (t2) killFakeEnemy(t2); }
        }
        if (pid === 'btm-release') {
          spirit._btmTimer += dt;
          for (const w2 of bossShockwaves) w2.radius += w2.speed * (dt / 16.67);
        }

        // Draw order: fake enemies → vine binds → summon fx → spirit → boomerangs → shockwaves → player
        for (const e of enemies) {
          if (e.alive) { drawEnemy(e); }
          else if (e._deathT > 0) {
            const ft = e._deathT / 500;
            c.save(); c.globalAlpha = ft; c.fillStyle = '#ffffff';
            c.beginPath(); c.arc(e.x, e.y, e.size / 2 + (1 - ft) * 20, 0, Math.PI * 2); c.fill(); c.restore();
          }
        }
        _drawVineBinds();
        if (summonEff) drawPrimevalSummonEffect(summonEff);
        if (spirit) drawSpirit(spirit);
        photoBrangs.forEach(drawPhotoBrang);
        drawBossShockwaves();
        drawPlayer();

        activeAnimations.push(requestAnimationFrame(tick));
      }

      function finish() {
        if (window.AudioMgr) window.AudioMgr.stopPhotokrystosIdle();
        spirits = []; enemies.length = 0; photoBrangs.length = 0; bossShockwaves.length = 0;
        btn.dataset.running = 'false'; btn.dataset.paused = 'false'; delete btn.dataset._pauseAnchorAt; btn.textContent = '▶ Play';
        drawPhotoIdle();
      }

      tick();
    }

  </script>

</body>
