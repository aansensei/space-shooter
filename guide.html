<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pisces: Space Journey — General Guide</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;500;600;700&family=Share+Tech+Mono&family=Cinzel:wght@400;700;900&display=swap');

    :root {
      --bg: #03030f;
      --panel: rgba(8, 12, 28, 0.96);
      --card: rgba(12, 18, 40, 0.85);
      --glow: rgba(0, 200, 255, 0.25);
      --cyan: #00e5ff;
      --purple: #a855f7;
      --magenta: #ff00ff;
      --gold: #ffd700;
      --red: #ff4444;
      --green: #22c55e;
      --blue: #3b82f6;
      --txt: #e8edf5;
      --dim: #8899bb
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box
    }

    body {
      background: var(--bg);
      color: var(--txt);
      font-family: 'Rajdhani', sans-serif;
      overflow: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column
    }

    #guideBtn {
      display: none
    }

    #guideOverlay {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    #guideModal {
      width: 100%;
      height: 100%;
      background: var(--panel);
      border: none;
      border-radius: 0;
      overflow: hidden;
      display: flex;
      flex-direction: column
    }

    .guide-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 22px;
      border-bottom: 1px solid rgba(0, 200, 255, 0.12);
      background: linear-gradient(180deg, rgba(0, 40, 80, 0.3), transparent);
      flex-shrink: 0
    }

    .guide-header h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: 18px;
      font-weight: 900;
      letter-spacing: 3px;
      background: linear-gradient(135deg, #00e5ff, #a855f7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent
    }

    .guide-header .sub {
      font-family: 'Share Tech Mono', monospace;
      font-size: 10px;
      color: var(--dim);
      margin-top: 1px
    }

    #closeBtn {
      display: none
    }

    .tab-nav {
      display: flex;
      gap: 0;
      padding: 0 14px;
      border-bottom: 1px solid rgba(0, 200, 255, 0.08);
      overflow-x: auto;
      flex-shrink: 0;
      scrollbar-width: none
    }

    .tab-nav::-webkit-scrollbar {
      display: none
    }

    .tab-btn {
      padding: 9px 14px;
      font-family: 'Rajdhani', sans-serif;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--dim);
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      cursor: pointer;
      white-space: nowrap;
      transition: all .25s
    }

    .tab-btn:hover {
      color: var(--cyan)
    }

    .tab-btn.active {
      color: var(--cyan);
      border-bottom-color: var(--cyan);
      text-shadow: 0 0 12px rgba(0, 229, 255, 0.5)
    }

    .guide-body {
      flex: 1;
      overflow-y: auto;
      padding: 18px 22px 30px;
      scroll-behavior: smooth
    }

    .guide-body::-webkit-scrollbar {
      width: 5px
    }

    .guide-body::-webkit-scrollbar-track {
      background: transparent
    }

    .guide-body::-webkit-scrollbar-thumb {
      background: rgba(0, 200, 255, 0.2);
      border-radius: 4px
    }

    .tab-content {
      display: none
    }

    .tab-content.active {
      display: block;
      animation: fadeIn .3s ease
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px)
      }

      to {
        opacity: 1;
        transform: translateY(0)
      }
    }

    .card {
      background: var(--card);
      border: 1px solid rgba(0, 200, 255, 0.1);
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 14px;
      transition: border-color .3s
    }

    .card:hover {
      border-color: rgba(0, 200, 255, 0.25)
    }

    .card h2 {
      font-family: 'Orbitron', sans-serif;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 2px;
      margin-bottom: 3px
    }

    .card .sub {
      font-family: 'Share Tech Mono', monospace;
      font-size: 10px;
      color: var(--dim);
      margin-bottom: 10px
    }

    .card p,
    .card li {
      font-size: 13.5px;
      line-height: 1.6
    }

    .card ul {
      list-style: none;
      padding: 0
    }

    .card li::before {
      content: '▸';
      color: var(--cyan);
      margin-right: 7px;
      font-weight: bold
    }

    .card li {
      margin-bottom: 5px
    }

    .hi {
      color: var(--cyan);
      font-weight: 600
    }

    .hp {
      color: var(--purple);
      font-weight: 600
    }

    .hg {
      color: var(--gold);
      font-weight: 600
    }

    .hr {
      color: var(--red);
      font-weight: 600
    }

    .hgr {
      color: var(--green);
      font-weight: 600
    }

    .dmg {
      color: #ff8844;
      font-weight: 600
    }

    .key {
      display: inline-block;
      padding: 1px 7px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 4px;
      font-family: 'Share Tech Mono', monospace;
      font-size: 11px;
      color: #fff;
      vertical-align: middle
    }

    .cd {
      display: inline-block;
      padding: 1px 6px;
      background: rgba(255, 100, 0, 0.12);
      border: 1px solid rgba(255, 100, 0, 0.3);
      border-radius: 4px;
      font-family: 'Share Tech Mono', monospace;
      font-size: 10px;
      color: #ff8844;
      margin-left: 4px
    }

    .ab {
      width: 100%;
      height: 150px;
      background: rgba(0, 5, 15, 0.6);
      border: 1px solid rgba(0, 200, 255, 0.08);
      border-radius: 10px;
      margin: 10px 0;
      overflow: hidden
    }

    .ab svg {
      width: 100%;
      height: 100%
    }

    .controls-table {
      width: 100%;
      border-collapse: collapse;
      margin: 6px 0
    }

    .controls-table th,
    .controls-table td {
      padding: 6px 10px;
      text-align: left;
      font-size: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04)
    }

    .controls-table th {
      font-family: 'Orbitron', sans-serif;
      font-size: 9px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--dim)
    }

    @keyframes spin {
      to {
        transform: rotate(360deg)
      }
    }

    @keyframes spinR {
      to {
        transform: rotate(-360deg)
      }
    }

    .dsname {
      font-family: 'Cinzel', 'Palatino Linotype', serif;
      letter-spacing: 2px;
    }

    .dsclass {
      font-family: 'Cinzel', serif;
      font-size: 9px;
      letter-spacing: 3px;
      opacity: 0.75;
    }

    /* Scroll-reveal */
    .card {
      opacity: 0;
      transform: translateY(18px);
      transition: opacity .45s ease, transform .45s ease, border-color .3s
    }

    .card.visible {
      opacity: 1;
      transform: translateY(0)
    }
  </style>
</head>

        <button class="tab-btn" data-tab="rules">Combat</button>

    </div>

        // Marchosias
        const sm = setup('cvMarcho');

            c.closePath(); c.fill(); c.stroke();
            // Inner triangles
            c.strokeStyle = 'rgba(0,200,100,0.5)'; c.lineWidth = 1;
            for (let i = 0; i < 3; i++) { const a = (i / 3) * Math.PI * 2 - Math.PI / 6; c.beginPath(); c.moveTo(cx2, cy2); c.lineTo(cx2 + Math.cos(a) * r, cy2 + Math.sin(a) * r); c.stroke(); }
            // Gear teeth

            for (let i = 0; i < 9; i++) { const a = (i / 9) * Math.PI * 2; c.beginPath(); c.moveTo(Math.cos(a) * r * 0.88, Math.sin(a) * r * 0.88); c.lineTo(Math.cos(a) * r * 0.98, Math.sin(a) * r * 0.98); c.stroke(); }

            c.fillStyle = cg; c.beginPath(); c.arc(cx2, cy2, r * 0.32, 0, Math.PI * 2); c.fill();
            // Arc shield rotating

          function drawLev(t) {

            // 0.00-0.25: AFO shield active (wings folded)
            // 0.25-0.32: shield shatters, wings open
            // 0.32-0.52: Perseverance (charge + 360° sweep)
            // 0.52-0.56: brief pause, body glows red (HP→1)

            // 0.76-0.90: All 9 lasers fire simultaneously
            // 0.90-1.00: lasers fade out, reset

            const isShatter = bp >= 0.25 && bp < 0.32;
            const isPers = bp >= 0.32 && bp < 0.52;
            const isDying = bp >= 0.52 && bp < 0.56;
            const isLRAim = bp >= 0.56 && bp < 0.76;
            const isLRFire = bp >= 0.76 && bp < 0.90;
            const isLRFade = bp >= 0.90;

            let wingPhase = 0; // 0=folded, 1=open
            if (isAFO) wingPhase = 0;
            else if (isShatter) wingPhase = (bp - 0.25) / 0.07;
            else if (isPers || isDying) wingPhase = 1;
            else wingPhase = 1; // open during Last Rites

                if (ti === 0) {
                  // Player ship
                  c.fillStyle = '#1a2a45';
                  c.beginPath(); c.moveTo(tx, ty - 6); c.lineTo(tx + 5, ty); c.lineTo(tx + 4, ty + 3); c.lineTo(tx - 4, ty + 3); c.lineTo(tx - 5, ty); c.closePath(); c.fill();
                  c.fillStyle = '#00e5ff'; c.beginPath(); c.arc(tx, ty, 1.5, 0, Math.PI * 2); c.fill();
                } else {
                  // Sentinel dot
                  c.fillStyle = '#888'; c.beginPath(); c.arc(tx, ty, 4, 0, Math.PI * 2); c.fill();
                  c.strokeStyle = '#00FFFF55'; c.lineWidth = 0.8; c.beginPath(); c.arc(tx, ty, 4, 0, Math.PI * 2); c.stroke();
                }
                c.globalAlpha = 1;
              });
            }

            // ── WINGS (always drawn, phase controls fold/open) ──
            // During Last Rites aiming: each wing rotates independently to its target
            c.save(); c.translate(cx2, cy2);
            const baseWingRot = -t / 9000; // slow counter-clockwise orbit
            for (let i = 0; i < NUM_W; i++) {
              const orbitAngle = (i / NUM_W) * Math.PI * 2 + baseWingRot;

              let drawAngle = orbitAngle;
              // During Last Rites aiming, wings rotate from orbit position to target
              if (isLRAim) {
                const aimP = (bp - 0.56) / 0.20;
                const ease = aimP < 0.5 ? 4 * aimP * aimP * aimP : 1 - Math.pow(-2 * aimP + 2, 3) / 2;
                const [tx, ty] = lrTargets[i];
                const targetA = Math.atan2(ty - cy2, tx - cx2);
                let diff = targetA - orbitAngle;
                while (diff > Math.PI) diff -= Math.PI * 2;
                while (diff < -Math.PI) diff += Math.PI * 2;
                drawAngle = orbitAngle + diff * ease;
              } else if (isLRFire || isLRFade) {
                // Locked on target
                const [tx, ty] = lrTargets[i];
                drawAngle = Math.atan2(ty - cy2, tx - cx2);
              }

              c.save(); c.rotate(drawAngle);
              const wl = r * 1.0, ww = r * 0.26, hw = ww / 2;
              const closedD = r * 0.45, openD = r * 0.90;
              const wd = closedD + (openD - closedD) * wingPhase + Math.sin(t / 700 + i) * r * 0.04;
              c.translate(wd, 0); // wing extends outward along its angle
              // Trapezoid wing plate (pointing outward)
              const wg = c.createLinearGradient(0, 0, wl, 0);
              wg.addColorStop(0, '#00e5ff'); wg.addColorStop(0.15, '#2d3748'); wg.addColorStop(0.8, '#1a1c29'); wg.addColorStop(1, '#0f172a');
              c.fillStyle = wg;
              c.beginPath();
              c.moveTo(0, -hw * 0.4); c.lineTo(0, hw * 0.4);
              c.lineTo(wl, hw * 0.7); c.lineTo(wl, -hw * 0.7);
              c.closePath(); c.fill();
              // Inner panel
              c.fillStyle = '#374151';
              c.beginPath();
              c.moveTo(wl * 0.15, -hw * 0.2); c.lineTo(wl * 0.15, hw * 0.2);
              c.lineTo(wl * 0.85, hw * 0.6); c.lineTo(wl * 0.85, -hw * 0.6);
              c.closePath(); c.fill();
              c.restore();
            }
            c.restore();

            // ── Last Rites: warning beams during aiming ──
            if (isLRAim) {
              const aimP = (bp - 0.56) / 0.20;
              for (let i = 0; i < NUM_W; i++) {
                const [tx, ty] = lrTargets[i];
                const orbitAngle = (i / NUM_W) * Math.PI * 2 + baseWingRot;
                const targetA = Math.atan2(ty - cy2, tx - cx2);
                let diff = targetA - orbitAngle;
                while (diff > Math.PI) diff -= Math.PI * 2;
                while (diff < -Math.PI) diff += Math.PI * 2;
                const ease = aimP < 0.5 ? 4 * aimP * aimP * aimP : 1 - Math.pow(-2 * aimP + 2, 3) / 2;
                const curA = orbitAngle + diff * ease;
                // Dashed orange warning line
                c.strokeStyle = `rgba(255,100,0,${aimP * 0.55 * (0.5 + 0.5 * Math.sin(t / 80 + i))})`;
                c.lineWidth = 2; c.setLineDash([10, 7]);
                const endX = cx2 + Math.cos(curA) * laserLen;
                const endY = cy2 + Math.sin(curA) * laserLen;
                c.beginPath(); c.moveTo(cx2, cy2); c.lineTo(endX, endY); c.stroke();
                c.setLineDash([]);
              }
            }

            // ── Last Rites: all 9 lasers fire ──
            if (isLRFire || isLRFade) {
              const fireP = isLRFire ? (bp - 0.76) / 0.14 : 1;
              const fadeMul = isLRFade ? Math.max(0, 1 - (bp - 0.90) / 0.10) : 1;
              const alpha = fadeMul;
              for (let i = 0; i < NUM_W; i++) {
                const [tx, ty] = lrTargets[i];
                const la = Math.atan2(ty - cy2, tx - cx2);
                const endX = cx2 + Math.cos(la) * laserLen;
                const endY = cy2 + Math.sin(la) * laserLen;
                c.globalAlpha = alpha;
                // Wide outer glow
                c.strokeStyle = 'rgba(255,80,0,0.25)'; c.lineWidth = 28;
                c.beginPath(); c.moveTo(cx2, cy2); c.lineTo(endX, endY); c.stroke();
                // Core
                c.strokeStyle = '#ff4444'; c.lineWidth = 5;
                c.beginPath(); c.moveTo(cx2, cy2); c.lineTo(endX, endY); c.stroke();
                // White center
                c.strokeStyle = '#ffffff'; c.lineWidth = 1.5;
                c.beginPath(); c.moveTo(cx2, cy2); c.lineTo(endX, endY); c.stroke();
              }
              c.globalAlpha = 1;
              // Flash text
              if (isLRFire && fireP < 0.3) {
                c.fillStyle = `rgba(255,100,0,${(0.3 - fireP) * 3})`; c.font = 'bold 11px Orbitron, sans-serif'; c.textAlign = 'center';
                c.fillText('LAST RITES', cx2, cy2 - r - 30); c.textAlign = 'left';
              }
            }

            // ── ENERGY VORTEX (only when shield broken, not during Last Rites fire) ──
            if (!isAFO && !isLRFire && !isLRFade) {
              c.save(); c.translate(cx2, cy2); c.rotate(t / 400);
              for (let i = 0; i < 8; i++) {
                const sa = (i / 8) * Math.PI * 2;
                c.strokeStyle = i % 2 === 0 ? 'rgba(0,229,255,0.7)' : 'rgba(157,0,255,0.7)';
                c.lineWidth = 2.5; c.beginPath(); c.arc(0, 0, r * 0.40, sa, sa + Math.PI / 8); c.stroke();
              }
              c.restore();
            }

            // ── CORE ──
            const beat = 0.9 + 0.15 * Math.sin(t / 500);
            const coreR = r * 0.30 * beat;
            const coreG = c.createRadialGradient(cx2, cy2, 0, cx2, cy2, coreR);
            if (isDying) {
              // Dying glow: red-orange
              coreG.addColorStop(0, '#ffaa00'); coreG.addColorStop(0.6, '#ff4400'); coreG.addColorStop(1, '#880000');
            } else {
              coreG.addColorStop(0, '#020205'); coreG.addColorStop(0.6, '#2a0066'); coreG.addColorStop(1, '#00e5ff');
            }
            c.fillStyle = coreG; c.beginPath(); c.arc(cx2, cy2, coreR, 0, Math.PI * 2); c.fill();
            // Eye
            const eyeTarget = isLRAim || isLRFire ? lrTargets[0] : [w * 0.7, h * 0.8];
            const eA = Math.atan2(eyeTarget[1] - cy2, eyeTarget[0] - cx2);
            const eOff = coreR * 0.3, eR = coreR * 0.35;
            const ex2 = cx2 + Math.cos(eA) * eOff, ey2 = cy2 + Math.sin(eA) * eOff;
            c.fillStyle = '#e8e8ff'; c.beginPath(); c.arc(ex2, ey2, eR, 0, Math.PI * 2); c.fill();
            c.fillStyle = '#00e5ff'; c.beginPath(); c.arc(ex2, ey2, eR * 0.6, 0, Math.PI * 2); c.fill();
            c.fillStyle = '#000'; c.beginPath(); c.arc(ex2, ey2, eR * 0.28, 0, Math.PI * 2); c.fill();

            // ── AFO SHIELD (phase 1 only) ──
            if (isAFO) {
              const sR = r * 1.5;
              const pulse = 0.85 + 0.15 * Math.sin(t / 1500);
              c.fillStyle = `rgba(0,229,255,${0.06 * pulse})`;
              c.beginPath(); c.arc(cx2, cy2, sR, 0, Math.PI * 2); c.fill();
              c.save(); c.translate(cx2, cy2); c.rotate(t / 15000);
              c.strokeStyle = `rgba(0,229,255,${0.65 * pulse})`; c.lineWidth = 2;
              c.beginPath(); c.arc(0, 0, sR, 0, Math.PI * 2); c.stroke(); c.restore();
              c.save(); c.translate(cx2, cy2); c.rotate(-t / 10000);
              c.setLineDash([8, 6]); c.strokeStyle = `rgba(255,255,255,${0.35 * pulse})`; c.lineWidth = 1;
              c.beginPath(); c.arc(0, 0, sR * 0.94, 0, Math.PI * 2); c.stroke(); c.setLineDash([]); c.restore();
              // Kill counter
              const fakeKills = Math.min(7, Math.floor((bp / 0.25) * 7));
              c.fillStyle = '#00e5ff'; c.font = 'bold 10px monospace'; c.textAlign = 'center';
              c.fillText(fakeKills + '/7 kills', cx2, cy2 + sR + 14);
              c.font = '8px monospace'; c.fillStyle = '#ffffff88';
              c.fillText('IRON BODY', cx2, cy2 + sR + 25); c.textAlign = 'left';
            }

            // ── PERSEVERANCE (after shield break) ──
            if (isPers) {
              const persT = (bp - 0.32) / 0.20;
              if (persT < 0.35) {
                // Charge warning
                const chgP = persT / 0.35;
                c.save(); c.translate(cx2, cy2);
                c.strokeStyle = `rgba(255,0,0,${chgP * 0.35})`; c.lineWidth = 3 + chgP * 6;
                c.beginPath(); c.arc(0, 0, r * (0.6 + chgP * 1.2), 0, Math.PI * 2); c.stroke();
                c.save(); c.rotate(t / 300); c.globalAlpha = chgP * 0.5; c.setLineDash([8, 6]);
                c.strokeStyle = '#ff0000'; c.lineWidth = 2; c.beginPath(); c.arc(0, 0, r * 0.8, 0, Math.PI * 2); c.stroke();
                c.restore(); c.setLineDash([]); c.globalAlpha = 1;
                c.restore();
              } else {
                // 360° sweep
                const sweepP = (persT - 0.35) / 0.65;
                const sweepA = sweepP * Math.PI * 2;
                c.save(); c.translate(cx2, cy2); c.rotate(sweepA - Math.PI / 2);
                c.strokeStyle = 'rgba(255,0,0,0.12)'; c.lineWidth = 35;
                c.beginPath(); c.moveTo(0, 0); c.lineTo(laserLen, 0); c.stroke();
                c.strokeStyle = 'rgba(255,30,0,0.85)'; c.lineWidth = 7;
                c.beginPath(); c.moveTo(0, 0); c.lineTo(laserLen, 0); c.stroke();
                c.strokeStyle = 'rgba(255,255,255,0.65)'; c.lineWidth = 1.5;
                c.beginPath(); c.moveTo(0, 0); c.lineTo(laserLen, 0); c.stroke();
                c.restore();
              }
            }

            // ── DYING GLOW (HP→1) ──
            if (isDying) {
              const dyeP = (bp - 0.52) / 0.04;
              const glow = c.createRadialGradient(cx2, cy2, 0, cx2, cy2, r * 1.8);
              glow.addColorStop(0, `rgba(255,100,0,${0.4 * dyeP})`); glow.addColorStop(1, 'transparent');
              c.fillStyle = glow; c.beginPath(); c.arc(cx2, cy2, r * 1.8, 0, Math.PI * 2); c.fill();
              c.fillStyle = `rgba(255,50,0,${dyeP * 0.6})`; c.font = 'bold 10px Orbitron, sans-serif'; c.textAlign = 'center';
              c.fillText('HP → 1', cx2, cy2 + r + 22); c.textAlign = 'left';
            }

            // ── Right side labels ──
            c.fillStyle = '#cc55ff'; c.font = 'bold 7px Orbitron, sans-serif';
            c.fillText('HERD LEADER', w * 0.58, h * 0.15);
            c.fillStyle = '#8899bb'; c.font = '6px Share Tech Mono, monospace';
            c.fillText('+25% DR, +25% heals (all enemies)', w * 0.58, h * 0.15 + 11);
            c.fillStyle = '#cc55ff'; c.font = 'bold 7px Orbitron, sans-serif';
            c.fillText('PERSEVERANCE', w * 0.58, h * 0.15 + 26);
            c.fillStyle = '#8899bb'; c.font = '6px Share Tech Mono, monospace';
            c.fillText('360° red laser sweep', w * 0.58, h * 0.15 + 37);
            c.fillStyle = '#cc55ff'; c.font = 'bold 7px Orbitron, sans-serif';
            c.fillText('LAST RITES @HP=1', w * 0.58, h * 0.15 + 52);
            c.fillStyle = '#8899bb'; c.font = '6px Share Tech Mono, monospace';
            c.fillText('9 wings lock targets (ease rotation)', w * 0.58, h * 0.15 + 63);
            c.fillText('All fire simultaneously', w * 0.58, h * 0.15 + 74);
            c.fillText('Lasers persist after death', w * 0.58, h * 0.15 + 85);

            activeAnimations.push(requestAnimationFrame(() => drawLev(performance.now())));
          }
          drawLev(performance.now());
        }

        // ── KANADE — Administrator ──
        const sk = setup('cvKanade');
        if (sk) {
          const { c, w, h } = sk;
          // Pre-generate cherry petals
          const petals = Array.from({ length: 60 }, (_, i) => ({
            x: Math.random() * w, y: Math.random() * h,
            vx: (Math.random() - 0.5) * 0.6,
            vy: 0.4 + Math.random() * 0.8,
            rot: Math.random() * Math.PI * 2,
            rotV: (Math.random() - 0.5) * 0.06,
            size: 3 + Math.random() * 5,
            alpha: 0.4 + Math.random() * 0.6,
            hue: 340 + Math.floor(Math.random() * 30),
          }));
          let lastT = 0;
          function drawKanade(t) {
            const dt = Math.min(t - lastT, 32); lastT = t;
            c.clearRect(0, 0, w, h);
            c.fillStyle = 'rgba(5,0,12,0.85)'; c.fillRect(0, 0, w, h);

            const cx2 = w / 2, cy2 = h / 2;

            // ── Update + draw cherry blossoms ──
            petals.forEach(p => {
              p.x += p.vx * dt * 0.06;
              p.y += p.vy * dt * 0.06;
              p.rot += p.rotV * dt * 0.06;
              if (p.y > h + 10) { p.y = -10; p.x = Math.random() * w; }
              if (p.x < -10) p.x = w + 5;
              if (p.x > w + 10) p.x = -5;
              // Petal shape: small ellipse rotated
              c.save();
              c.translate(p.x, p.y); c.rotate(p.rot);
              c.globalAlpha = p.alpha * (0.6 + 0.4 * Math.sin(t / 600 + p.x));
              c.fillStyle = `hsl(${p.hue},80%,78%)`;
              c.beginPath();
              c.ellipse(0, 0, p.size, p.size * 0.45, 0, 0, Math.PI * 2);
              c.fill();
              // Petal vein
              c.strokeStyle = `hsla(${p.hue},60%,90%,0.4)`;
              c.lineWidth = 0.4;
              c.beginPath(); c.moveTo(-p.size * 0.8, 0); c.lineTo(p.size * 0.8, 0); c.stroke();
              c.restore();
            });
            c.globalAlpha = 1;

            // ── Mystery circle ──
            const ringPulse = 0.5 + 0.5 * Math.sin(t / 600);
            c.strokeStyle = `rgba(255,34,68,${0.3 + 0.2 * ringPulse})`; c.lineWidth = 1;
            c.beginPath(); c.arc(cx2, cy2, 52, 0, Math.PI * 2); c.stroke();
            c.strokeStyle = `rgba(200,0,50,${0.15 * ringPulse})`; c.lineWidth = 3;
            c.beginPath(); c.arc(cx2, cy2, 52, 0, Math.PI * 2); c.stroke();

            // ── 6-pointed red star ──
            c.save(); c.translate(cx2, cy2); c.rotate(t / 8000);
            c.fillStyle = `rgba(180,0,40,${0.55 + 0.2 * ringPulse})`;
            c.strokeStyle = `rgba(255,34,68,${0.8 + 0.2 * ringPulse})`; c.lineWidth = 1.2;
            for (let pass = 0; pass < 2; pass++) {
              c.save(); c.rotate(pass * Math.PI / 3);
              c.beginPath();
              for (let i = 0; i < 3; i++) {
                const a = (i / 3) * Math.PI * 2 - Math.PI / 2;
                i === 0 ? c.moveTo(Math.cos(a) * 30, Math.sin(a) * 30) : c.lineTo(Math.cos(a) * 30, Math.sin(a) * 30);
              }
              c.closePath();
              if (pass === 0) c.fill(); else { c.globalAlpha = 0.5; c.fill(); c.globalAlpha = 1; }
              c.stroke(); c.restore();
            }
            c.restore();

            // ── Center question mark ──
            c.save(); c.translate(cx2, cy2);
            c.fillStyle = `rgba(255,220,230,${0.7 + 0.3 * Math.sin(t / 400)})`;
            c.font = 'bold 22px Cinzel, serif'; c.textAlign = 'center'; c.textBaseline = 'middle';
            c.fillText('?', 0, 1);
            c.restore();

            // ── Label ──
            c.fillStyle = 'rgba(255,34,68,0.5)'; c.font = '7px Share Tech Mono, monospace'; c.textAlign = 'center';
            c.fillText('— ADMINISTRATOR CLASS — UNDEFINED —', cx2, h - 8);

            activeAnimations.push(requestAnimationFrame(() => drawKanade(performance.now())));
          }
          drawKanade(performance.now());
        }
      }

      // ── SKILL TAB CANVASES ── (abbreviated for key ones)
      if (tab === 'skills') {
        // Yog-Sothoth
        const ss = setup('cvShift');
        if (ss) {
          const { c, w, h } = ss;
          function drawShift(t) {
            c.clearRect(0, 0, w, h);
            c.fillStyle = 'rgba(2,0,10,0.8)'; c.fillRect(0, 0, w, h);
            const cx2 = w / 2, cy2 = h * 0.52;

            // Domain expand/hold cycle (4s expand, 4s full, 2s close)
            const cycle = 10000, cp = (t % cycle) / cycle;
            const domR = cp < 0.4 ? 80 * (cp / 0.4) : cp < 0.8 ? 80 : 80 * (1 - (cp - 0.8) / 0.2);

            // Space-time distortion: concentric ripple rings
            for (let i = 0; i < 4; i++) {
              const rp = ((t / 1800 + i * 0.25) % 1);
              const rR = 8 + rp * domR;
              if (rR > domR) continue;
              c.strokeStyle = `rgba(160,0,255,${0.4 * (1 - rp)})`;
              c.lineWidth = 1.5 * (1 - rp);
              c.beginPath(); c.arc(cx2, cy2, rR, 0, Math.PI * 2); c.stroke();
            }

            // Domain fill (dark purple sphere)
            if (domR > 5) {
              const dg = c.createRadialGradient(cx2, cy2, 0, cx2, cy2, domR);
              dg.addColorStop(0, 'rgba(25,0,55,0.85)'); dg.addColorStop(0.6, 'rgba(20,0,45,0.65)'); dg.addColorStop(1, 'rgba(0,0,0,0)');
              c.fillStyle = dg; c.beginPath(); c.arc(cx2, cy2, domR, 0, Math.PI * 2); c.fill();
            }

            // Hex grid inside domain — phase shifted
            if (domR > 30) {
              c.save();
              c.beginPath(); c.arc(cx2, cy2, domR * 0.95, 0, Math.PI * 2); c.clip();
              c.strokeStyle = '#6600cc'; c.lineWidth = 0.4; c.globalAlpha = 0.2;
              const hs = 12, offset = (t / 80) % (hs * 1.73);
              for (let row = -4; row < 5; row++) for (let col = -5; col < 6; col++) {
                const hx = cx2 + col * hs * 1.73 + (row % 2) * hs * 0.87 + offset, hy = cy2 + row * hs * 1.5;
                c.beginPath();
                for (let i = 0; i < 6; i++) { const a = (i / 6) * Math.PI * 2 - Math.PI / 6; i === 0 ? c.moveTo(hx + Math.cos(a) * hs * 0.55, hy + Math.sin(a) * hs * 0.55) : c.lineTo(hx + Math.cos(a) * hs * 0.55, hy + Math.sin(a) * hs * 0.55); }
                c.closePath(); c.stroke();
              }
              c.globalAlpha = 1; c.restore();
            }

            // Slow-time effect: floating "0.15×" numbers drifting upward
            for (let i = 0; i < 5; i++) {
              const drift = ((t / 2000 + i * 0.2) % 1);
              const nx = cx2 + (i - 2) * 18, ny = cy2 + 30 - drift * 80;
              if (Math.hypot(nx - cx2, ny - cy2) > domR * 0.85) continue;
              c.globalAlpha = (1 - drift) * 0.5;
              c.fillStyle = '#aa44ff'; c.font = '6px Share Tech Mono, monospace'; c.textAlign = 'center';
              c.fillText('×0.15', nx, ny);
            }
            c.globalAlpha = 1;

            // Outer domain edge — bright ring
            if (domR > 5) {
              c.strokeStyle = `rgba(180,0,255,${0.7 + 0.3 * Math.sin(t / 400)})`; c.lineWidth = 2;
              c.beginPath(); c.arc(cx2, cy2, domR, 0, Math.PI * 2); c.stroke();
              // Dashed outer
              c.save(); c.translate(cx2, cy2); c.rotate(t / 3000);
              c.setLineDash([8, 14]); c.strokeStyle = 'rgba(200,80,255,0.3)'; c.lineWidth = 1.2;
              c.beginPath(); c.arc(0, 0, domR + 6, 0, Math.PI * 2); c.stroke();
              c.setLineDash([]); c.restore();
            }

            // Spiral energy arms
            c.save(); c.translate(cx2, cy2); c.rotate(t / 1200);
            for (let arm = 0; arm < 4; arm++) {
              const aBase = (arm / 4) * Math.PI * 2;
              c.beginPath();
              for (let s = 0; s <= 20; s++) {
                const st = s / 20, r2 = st * domR * 0.85, a2 = aBase + st * 1.8;
                s === 0 ? c.moveTo(Math.cos(a2) * r2, Math.sin(a2) * r2) : c.lineTo(Math.cos(a2) * r2, Math.sin(a2) * r2);
              }
              c.strokeStyle = `rgba(200,0,255,${0.15 + 0.1 * Math.sin(t / 500 + arm)})`;
              c.lineWidth = 0.8; c.stroke();
            }
            c.restore();

            // Player ship + Iron Body aura
            c.save(); c.translate(cx2, cy2);
            const ibPulse = 0.5 + 0.5 * Math.sin(t / 300);
            c.strokeStyle = `rgba(180,80,255,${0.6 * ibPulse})`; c.lineWidth = 2.5;
            c.beginPath(); c.arc(0, 0, 20, 0, Math.PI * 2); c.stroke();
            c.fillStyle = '#1a2a45'; c.beginPath(); c.moveTo(0, -12); c.lineTo(10, 2); c.lineTo(8, 6); c.lineTo(-8, 6); c.lineTo(-10, 2); c.closePath(); c.fill();
            c.strokeStyle = '#cc88ff'; c.lineWidth = 1; c.beginPath(); c.moveTo(0, -12); c.lineTo(10, 2); c.lineTo(8, 6); c.lineTo(-8, 6); c.lineTo(-10, 2); c.closePath(); c.stroke();
            c.restore();

            // Teleport portals (left + right)
            const portalDist = Math.min(domR * 0.75, 65);
            [[cx2 - portalDist, cy2, -1], [cx2 + portalDist, cy2, 1]].forEach(([px, py, dir]) => {
              const pp = 0.6 + 0.4 * Math.sin(t / 500 + dir);
              c.save(); c.translate(px, py); c.rotate(dir * t / 1500);

              // Expanding rings
              for (let rg = 0; rg < 3; rg++) {
                const rPhase = ((t / (500 - chg * 200) + rg / 3) % 1);
                const ringR = 10 + rPhase * (20 + chg * 50);
                c.strokeStyle = `rgba(0,${Math.floor(255 * (1 - chg * 0.7))},255,${(1 - rPhase) * 0.3 * chg})`;
                c.lineWidth = 1.5 * (1 - rPhase);
                c.beginPath(); c.arc(shipX, shipY, ringR, 0, Math.PI * 2); c.stroke();
              }
              // Charge meter bar
              const barW = 50, barH = 6;
              const barX = shipX - barW / 2, barY = shipY + 22;
              c.fillStyle = '#222'; c.fillRect(barX, barY, barW, barH);
              const grad = c.createLinearGradient(barX, barY, barX + barW, barY);
              grad.addColorStop(0, 'cyan'); grad.addColorStop(0.7, 'lime'); grad.addColorStop(1, 'red');
              c.fillStyle = grad; c.fillRect(barX, barY, barW * chg, barH);
              c.strokeStyle = '#fff'; c.lineWidth = 0.8; c.strokeRect(barX, barY, barW, barH);
              // Text
              if (chg > 0.6) {
                c.fillStyle = `rgba(255,100,50,${(chg - 0.6) * 2.5})`; c.font = 'bold 10px Orbitron, sans-serif'; c.textAlign = 'center';
                c.fillText('OVERLOAD', shipX, shipY - 35);
                c.textAlign = 'left';
              }
            }

            if (isLasering) {
              // Laser active: wide cyan-white beam shooting upward
              const laserT = (phase - 0.4) / 0.5;
              const wobble = Math.sin(t / 28) * 8;
              const beamW = 50 + wobble;
              const bx = shipX - beamW / 2;

              // Outer glow
              const glow = c.createLinearGradient(bx - 15, 0, bx + beamW + 15, 0);
              glow.addColorStop(0, 'rgba(0,255,255,0)'); glow.addColorStop(0.5, 'rgba(0,200,255,0.15)'); glow.addColorStop(1, 'rgba(0,255,255,0)');
              c.fillStyle = glow; c.fillRect(bx - 15, 0, beamW + 30, shipY);

              // Main beam gradient
              const grad = c.createLinearGradient(bx, 0, bx + beamW, 0);
              grad.addColorStop(0, 'rgba(0,255,255,0)'); grad.addColorStop(0.1, 'rgba(0,220,255,0.45)');
              grad.addColorStop(0.5, 'rgba(255,255,255,0.85)'); grad.addColorStop(0.9, 'rgba(0,220,255,0.45)');
              grad.addColorStop(1, 'rgba(0,255,255,0)');
              c.fillStyle = grad; c.fillRect(bx, 0, beamW, shipY);

              // Bright core line
              c.fillStyle = 'rgba(255,255,255,0.55)';
              c.fillRect(shipX - 3, 0, 6, shipY);

              // Particles rising along beam
              for (let i = 0; i < 8; i++) {
                const py = ((t / 6 + i * 100) % (shipY * 1.2));
                const px = shipX + (Math.random() - 0.5) * beamW * 0.6;
                c.fillStyle = `rgba(${150 + Math.floor(Math.random() * 105)},255,255,0.6)`;
                c.beginPath(); c.arc(px, shipY - py, 1 + Math.random() * 2.5, 0, Math.PI * 2); c.fill();
              }

              // Clone afterimages — same beam shape as main, 4 clones + 1 main = 5 total
              const cloneOffsets = [-70, -35, 35, 70];
              cloneOffsets.forEach((off, ci) => {
                const cx2 = shipX + off;
                const cAlpha = ci === 1 || ci === 2 ? 0.55 : 0.35;
                const cWobble = Math.sin(t / 28 + ci * 0.8) * 6;
                const cBeamW = (40 + cWobble) * (ci === 1 || ci === 2 ? 0.8 : 0.6);
                const cbx = cx2 - cBeamW / 2;
                // Outer glow same shape
                const cGlowG = c.createLinearGradient(cbx - 8, 0, cbx + cBeamW + 8, 0);
                cGlowG.addColorStop(0, 'rgba(0,255,255,0)'); cGlowG.addColorStop(0.5, `rgba(0,200,255,${0.1 * cAlpha})`); cGlowG.addColorStop(1, 'rgba(0,255,255,0)');
                c.globalAlpha = cAlpha; c.fillStyle = cGlowG; c.fillRect(cbx - 8, 0, cBeamW + 16, shipY);
                // Main beam gradient same as center
                const cBG = c.createLinearGradient(cbx, 0, cbx + cBeamW, 0);
                cBG.addColorStop(0, 'rgba(0,255,255,0)'); cBG.addColorStop(0.1, `rgba(0,220,255,${0.4 * cAlpha})`);
                cBG.addColorStop(0.5, `rgba(255,255,255,${0.7 * cAlpha})`); cBG.addColorStop(0.9, `rgba(0,220,255,${0.4 * cAlpha})`);
                cBG.addColorStop(1, 'rgba(0,255,255,0)');
                c.fillStyle = cBG; c.fillRect(cbx, 0, cBeamW, shipY);
                // Bright core
                c.fillStyle = `rgba(255,255,255,${0.4 * cAlpha})`; c.fillRect(cx2 - 2, 0, 4, shipY);
                c.globalAlpha = 1;
                // Ghost ship
                c.globalAlpha = cAlpha * 0.7;
                c.fillStyle = '#1a2a45';
                c.beginPath(); c.moveTo(cx2, shipY - 12); c.lineTo(cx2 + 8, shipY); c.lineTo(cx2 + 6, shipY + 4); c.lineTo(cx2 - 6, shipY + 4); c.lineTo(cx2 - 8, shipY); c.closePath(); c.fill();
                c.strokeStyle = '#38bdf8'; c.lineWidth = 0.6;
                c.beginPath(); c.moveTo(cx2, shipY - 12); c.lineTo(cx2 + 8, shipY); c.lineTo(cx2 + 6, shipY + 4); c.lineTo(cx2 - 6, shipY + 4); c.lineTo(cx2 - 8, shipY); c.closePath(); c.stroke();
                c.globalAlpha = 1;
              });

              // Title flash at start
              if (laserT < 0.2) {
                const textA = (0.2 - laserT) * 5;
                c.fillStyle = `rgba(255,255,255,${textA * 0.9})`; c.font = 'bold 11px Orbitron, sans-serif'; c.textAlign = 'center';
                c.fillText('EXECUTION', shipX, h * 0.25);
                c.fillStyle = `rgba(255,220,100,${textA * 0.7})`; c.font = 'italic 8px monospace';
                c.fillText('— Khai Triển —', shipX, h * 0.25 + 14);
                c.textAlign = 'left';
              }
            }

            // Ship body (always drawn)
            c.save(); c.translate(shipX, shipY);
            c.fillStyle = '#1a2a45'; c.beginPath(); c.moveTo(0, -14); c.lineTo(10, -2); c.lineTo(8, 4); c.lineTo(-8, 4); c.lineTo(-10, -2); c.closePath(); c.fill();
            c.strokeStyle = '#38bdf8'; c.lineWidth = 0.8; c.beginPath(); c.moveTo(0, -14); c.lineTo(10, -2); c.lineTo(8, 4); c.lineTo(-8, 4); c.lineTo(-10, -2); c.closePath(); c.stroke();
            c.restore();

            // Right side info
            c.fillStyle = '#00e5ff'; c.font = 'bold 9px Orbitron, sans-serif';
            c.fillText('OVERLOAD LASER', w * 0.55, h * 0.2);
            c.fillStyle = '#8899bb'; c.font = '7px Share Tech Mono, monospace';
            c.fillText('Hold Space 3s → 12s beam', w * 0.55, h * 0.2 + 14);
            c.fillText('10 + 26% Max HP / 175ms tick', w * 0.55, h * 0.2 + 27);
            c.fillText('Pulls enemies toward beam', w * 0.55, h * 0.2 + 40);
            c.fillText('5 ships fire parallel beams', w * 0.55, h * 0.2 + 53);
            c.fillStyle = '#ff8800'; c.font = 'bold 9px Orbitron, sans-serif';
            c.fillText('CHARGED SHOT', w * 0.55, h * 0.6);
            c.fillStyle = '#8899bb'; c.font = '7px Share Tech Mono, monospace';
            c.fillText('Tap+hold Space (up to 1s)', w * 0.55, h * 0.6 + 14);
            c.fillText('Damage scales to 10× (12% HP)', w * 0.55, h * 0.6 + 27);

            activeAnimations.push(requestAnimationFrame(() => drawLaz(performance.now())));
          }
          drawLaz(performance.now());
        }

        // ── ANNIHILATION SWEEP (Skill F) ──
        const skf = setup('cvSkillF');
        if (skf) {
          const { c, w, h } = skf;
          function drawSkF(t) {
            c.clearRect(0, 0, w, h);
            const shipX = w * 0.15, shipY = h * 0.85;
            const radius = Math.max(w, h) * 1.2;

            // Full animation cycle: 1.5s charge → 1.5s sweep → 1s pause
            const cycle = 4000;
            const phase = (t % cycle) / cycle;
            const isCharging = phase < 0.375;
            const isSweeping = phase >= 0.375 && phase < 0.75;

            if (isCharging) {
              const p = phase / 0.375; // 0→1
              c.save(); c.translate(shipX, shipY);
              // Half-plane glow (charging upward)
              c.fillStyle = `rgba(0,255,255,${0.04 + p * 0.1})`;
              c.beginPath(); c.moveTo(0, 0); c.arc(0, 0, 120, -Math.PI, 0); c.closePath(); c.fill();
              // Expanding rings
              for (let i = 2; i >= 1; i--) {
                c.fillStyle = `rgba(0,255,255,${(0.03 + p * 0.06) / i})`;
                c.beginPath(); c.arc(0, 0, 20 * i * p, 0, Math.PI * 2); c.fill();
              }
              // Radiating lines
              for (let i = 0; i < 8; i++) {
                const a = (i / 8) * Math.PI - Math.PI / 2;
                c.strokeStyle = `rgba(100,255,255,${p * 0.4})`; c.lineWidth = 1;
                c.beginPath(); c.moveTo(0, 0);
                c.lineTo(Math.cos(a) * 100 * p, Math.sin(a) * 100 * p); c.stroke();
              }
              c.restore();

              // Target locks on "enemies"
              const fakeEnemies = [[w * 0.4, h * 0.3], [w * 0.65, h * 0.25], [w * 0.8, h * 0.45]];
              fakeEnemies.forEach(([ex, ey]) => {
                const er = 12;
                const pulse = 0.55 + 0.45 * Math.sin(t / 100 + ex * 0.08);
                const lockIn = Math.min(p * 2, 1);
                c.globalAlpha = lockIn;
                // Scan fill
                c.fillStyle = `rgba(0,255,200,${0.06 * pulse})`;
                c.beginPath(); c.arc(ex, ey, er * 1.4, 0, Math.PI * 2); c.fill();
                // Rotating dashed ring
                c.save(); c.translate(ex, ey); c.rotate(-t / 350);
                c.strokeStyle = `rgba(0,220,255,${0.6 * pulse})`; c.lineWidth = 1.2; c.setLineDash([5, 5]);
                c.beginPath(); c.arc(0, 0, er + 6, 0, Math.PI * 2); c.stroke(); c.setLineDash([]); c.restore();
                // Inner ring
                c.strokeStyle = 'rgba(0,255,220,0.8)'; c.lineWidth = 1.5;
                c.beginPath(); c.arc(ex, ey, er, 0, Math.PI * 2); c.stroke();
                // Corner brackets
                [[-1, -1], [1, -1], [1, 1], [-1, 1]].forEach(([dx, dy]) => {
                  const bx2 = ex + dx * (er + 3), by2 = ey + dy * (er + 3);
                  c.strokeStyle = `rgba(100,255,240,${0.8 * pulse})`; c.lineWidth = 1.5;
                  c.beginPath(); c.moveTo(bx2, by2 - dy * 5); c.lineTo(bx2, by2); c.lineTo(bx2 - dx * 5, by2); c.stroke();
                });
                // TARGET text
                if (p > 0.6) {
                  c.fillStyle = `rgba(0,255,220,${(p - 0.6) * 2.5 * pulse})`;
                  c.font = 'bold 7px monospace'; c.textAlign = 'center';
                  c.fillText('TARGET', ex, ey - er - 6); c.textAlign = 'left';
                }
                // Dashed line from ship
                if (p > 0.4) {
                  c.strokeStyle = `rgba(0,200,255,${(p - 0.4) * 0.6 * pulse})`; c.lineWidth = 0.6;
                  c.setLineDash([5, 8]); c.beginPath(); c.moveTo(shipX, shipY); c.lineTo(ex, ey); c.stroke(); c.setLineDash([]);
                }
                c.globalAlpha = 1;
                // Enemy body
                c.fillStyle = '#330808'; c.beginPath(); c.arc(ex, ey, 8, 0, Math.PI * 2); c.fill();
              });

              // Title flash
              if (p > 0.2 && p < 0.8) {
                const tA = p < 0.5 ? (p - 0.2) * 3.33 : (0.8 - p) * 3.33;
                c.fillStyle = `rgba(255,255,255,${tA * 0.8})`; c.font = 'bold 12px Orbitron, sans-serif'; c.textAlign = 'center';
                c.fillText('ANNIHILATION', shipX + 30, h * 0.2);
                c.fillStyle = `rgba(170,255,255,${tA * 0.7})`; c.font = 'italic 8px monospace';
                c.fillText('— Thiên Ý Trảm —', shipX + 30, h * 0.2 + 14);
                c.textAlign = 'left';
              }
            }

            if (isSweeping) {
              const sp = (phase - 0.375) / 0.375; // 0→1
              const currentAngle = -Math.PI + Math.PI * sp;

              // Matrix rain in swept area
              c.save();
              c.beginPath(); c.moveTo(shipX, shipY);
              c.arc(shipX, shipY, radius, -Math.PI, currentAngle); c.closePath(); c.clip();
              // Matrix columns
              const colW = 14;
              const cols = Math.ceil(w / colW) + 1;
              c.font = '9px monospace'; c.textAlign = 'center';
              for (let col = 0; col < cols; col++) {
                const cx2 = col * colW;
                for (let d = 0; d < 3; d++) {
                  const charT = ((t / (110 + col * 5) + d * 0.3 + col * 0.1) % 1);
                  const cy2 = charT * h;
                  const ch = String.fromCharCode(0x30A0 + ((Math.floor(t / 90) + col * 3 + d * 7) % 96));
                  c.fillStyle = d === 0 ? `rgba(200,255,220,${0.7})` : `rgba(0,220,80,${0.35 + 0.2 * Math.sin(charT * Math.PI)})`;
                  c.fillText(ch, cx2, cy2);
                }
              }
              // Hex grid overlay
              c.strokeStyle = 'rgba(0,200,100,0.1)'; c.lineWidth = 0.6;
              const hR = 22;
              const hW = hR * Math.sqrt(3);
              for (let row = -1; row < Math.ceil(h / (hR * 1.5)) + 1; row++) {
                for (let col2 = -1; col2 < Math.ceil(w / hW) + 1; col2++) {
                  const hx = col2 * hW + (row % 2 === 0 ? 0 : hW * 0.5);
                  const hy = row * hR * 1.5;
                  c.beginPath();
                  for (let i = 0; i < 6; i++) {
                    const a = (i / 6) * Math.PI * 2 - Math.PI / 6;
                    i === 0 ? c.moveTo(hx + Math.cos(a) * hR, hy + Math.sin(a) * hR) : c.lineTo(hx + Math.cos(a) * hR, hy + Math.sin(a) * hR);
                  } c.closePath(); c.stroke();
                }
              }
              // Scan line
              c.fillStyle = 'rgba(0,255,120,0.06)'; c.fillRect(0, (t / 3) % h, w, 3);
              c.restore();

              // Sweep blade
              c.save(); c.translate(shipX, shipY); c.rotate(currentAngle);
              // Wide glow cone
              c.fillStyle = 'rgba(0,255,255,0.1)';
              c.beginPath(); c.moveTo(0, 0); c.lineTo(radius, -40); c.lineTo(radius, 40); c.closePath(); c.fill();
              // Cyan flanks
              c.fillStyle = 'rgba(0,255,255,0.5)';
              c.beginPath(); c.moveTo(0, 0); c.lineTo(radius, -25); c.lineTo(radius, 25); c.closePath(); c.fill();
              // White core blade
              c.fillStyle = 'white';
              c.beginPath(); c.moveTo(0, 0); c.lineTo(radius, -7); c.lineTo(radius, 7); c.closePath(); c.fill();
              // Jitter streak
              c.strokeStyle = 'rgba(255,255,255,0.7)'; c.lineWidth = 1;
              c.beginPath(); c.moveTo(0, 0); c.lineTo(radius, (Math.sin(t / 20)) * 10); c.stroke();
              // Sparks on blade edge
              for (let i = 0; i < 5; i++) {
                const dist = 30 + Math.random() * (w - 50);
                const off = (Math.random() - 0.5) * 18;
                c.fillStyle = `rgba(180,255,255,${0.4 + Math.random() * 0.5})`;
                c.beginPath(); c.arc(dist, off, 1 + Math.random() * 1.5, 0, Math.PI * 2); c.fill();
              }
              c.restore();

              // Enemies destroyed on contact
              const fakeEnemies2 = [[w * 0.4, h * 0.3], [w * 0.65, h * 0.25], [w * 0.8, h * 0.45]];
              fakeEnemies2.forEach(([ex, ey]) => {
                const enemyAngle = Math.atan2(ey - shipY, ex - shipX);
                if (enemyAngle < currentAngle) {
                  // Already swept — show explosion remnant
                  const fade = Math.max(0, 1 - (currentAngle - enemyAngle) * 2);
                  c.globalAlpha = fade;
                  c.fillStyle = '#00ffaa'; c.beginPath(); c.arc(ex, ey, 12 * (1 + (1 - fade) * 0.8), 0, Math.PI * 2); c.fill();
                  c.globalAlpha = 1;
                } else {
                  c.fillStyle = '#330808'; c.beginPath(); c.arc(ex, ey, 8, 0, Math.PI * 2); c.fill();
                }
              });
            }

            // Ship (always visible)
            c.save(); c.translate(shipX, shipY);
            c.fillStyle = '#1a2a45'; c.beginPath(); c.moveTo(0, -12); c.lineTo(9, 0); c.lineTo(7, 4); c.lineTo(-7, 4); c.lineTo(-9, 0); c.closePath(); c.fill();
            c.strokeStyle = '#38bdf8'; c.lineWidth = 0.7; c.beginPath(); c.moveTo(0, -12); c.lineTo(9, 0); c.lineTo(7, 4); c.lineTo(-7, 4); c.lineTo(-9, 0); c.closePath(); c.stroke();
            c.restore();

            activeAnimations.push(requestAnimationFrame(() => drawSkF(performance.now())));
          }
          drawSkF(performance.now());
        }
      }
    }
  </script>
