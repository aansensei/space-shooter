<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Pisces: Space Journey</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Roboto:wght@400;500&family=Courier+New&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">

    <style>
        body {
            margin: 0;
            background: #000;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            -webkit-user-select: none;
            user-select: none;
        }



        /* --- LỚP PHỦ EASTER EGG BẢO VỆ TOÀN MÀN HÌNH --- */
        #easter-egg-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 99999;
            background: #000;
        }

        #star-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        #ui-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: all;
            background: rgba(10, 25, 47, 0.4);
            backdrop-filter: blur(4px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            transition: background 1s ease, backdrop-filter 1s ease;
        }

        #lock-screen {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            max-height: 100dvh;
            overflow-y: auto;
            box-sizing: border-box;
        }

        #start-hyperjump-btn {
            padding: 15px 40px;
            border-radius: 30px;
            border: none;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            color: #fff;
            font-size: 1.2rem;
            font-family: inherit;
            background: linear-gradient(45deg, #00e5ff, #007bff);
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.4);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        #start-hyperjump-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 25px rgba(0, 229, 255, 0.7);
        }

        #loading-screen {
            background: transparent;
            display: none;
            flex-direction: column;
            align-items: center;
        }

        .progress-container {
            width: 300px;
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid #00e5ff;
            border-radius: 10px;
            margin-top: 25px;
            overflow: hidden;
            position: relative;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: #00e5ff;
            box-shadow: 0 0 15px #00e5ff;
            transition: width 3.5s cubic-bezier(0.55, 0.085, 0.68, 0.53);
        }

        /* --- HIỆU ỨNG LÓA SÁNG KHI ĐẾN NƠI --- */
        #white-flash {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #ffffff;
            opacity: 0;
            z-index: 9999999;
            pointer-events: none;
            transition: opacity 0.1s;
        }

        /* --- CLICK TO START --- */
        #click-to-start {
            position: fixed;
            inset: 0;
            z-index: 999999;
            background: rgba(0, 0, 0, 0.88);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: opacity 0.6s ease;
        }

        #click-to-start span {
            color: rgba(255, 255, 255, 0.7);
            font-size: 1rem;
            letter-spacing: 5px;
            text-transform: uppercase;
            font-family: 'Courier New', monospace;
            animation: cts-blink 2s ease-in-out infinite;
        }

        @keyframes cts-blink {

            0%,
            100% {
                opacity: 0.7;
            }

            50% {
                opacity: 0.15;
            }
        }

        /* --- MUTE BUTTON --- */
        #mute-btn {
            position: fixed;
            top: 16px;
            left: 16px;
            z-index: 9999999;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.22);
            background: rgba(255, 255, 255, 0.10);
            backdrop-filter: blur(18px) saturate(180%);
            -webkit-backdrop-filter: blur(18px) saturate(180%);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.15);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0.65;
            outline: none;
            transition: opacity 0.2s, transform 0.15s, background 0.2s;
        }

        #mute-btn:hover {
            opacity: 0.95;
            background: rgba(255, 255, 255, 0.20);
            transform: scale(1.08);
        }

        #mute-btn:active {
            transform: scale(0.93);
        }

        #mute-btn svg {
            width: 20px;
            height: 20px;
            pointer-events: none;
        }
    </style>

    <script>
        // ── BẢO VỆ CODE ──────────────────────────────────────────
        (function () {
            document.addEventListener('contextmenu', e => e.preventDefault());
            document.addEventListener('selectstart', e => e.preventDefault());
            document.addEventListener('keydown', e => {
                const ctrl = e.ctrlKey || e.metaKey;
                const shift = e.shiftKey;
                if (e.key === 'F12') { e.preventDefault(); return; }
                if (ctrl && e.key.toLowerCase() === 'u') { e.preventDefault(); return; }
                if (ctrl && shift && e.key === 'I') { e.preventDefault(); return; }
                if (ctrl && shift && e.key === 'J') { e.preventDefault(); return; }
                if (ctrl && shift && e.key === 'C') { e.preventDefault(); return; }
                if (ctrl && e.key.toLowerCase() === 's') { e.preventDefault(); return; }
            });
            const threshold = 160;
            setInterval(() => {
                if (window.outerWidth - window.innerWidth > threshold ||
                    window.outerHeight - window.innerHeight > threshold) {
                    document.body.innerHTML = '';
                    window.location.reload();
                }
            }, 1000);
        })();
    </script>
</head>

<body>
    <!-- Audio -->
    <audio id="snd-title" src="audio/soundtrack1.mp3" loop preload="auto"></audio>
    <audio id="snd-hyperjump" src="audio/hyperjump.mp3" preload="auto"></audio>
    <audio id="snd-ingame" src="audio/ingame.mp3" loop preload="auto"></audio>

            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" />

    <!-- Click-to-start (che toàn màn hình, click để unlock audio) -->

    <div id="white-flash"></div>

    <canvas id="gameCanvas"></canvas>

    </div>

    <button id="startBtn" style="display: none;">Start</button>

    <div id="easter-egg-overlay">
        <canvas id="star-canvas"></canvas>
        <div id="ui-wrapper">
            <div id="lock-screen">
                <h1
                    style="color:#00e5ff; font-size:clamp(1.6rem,5vw,3.5rem); text-shadow:0 0 25px rgba(0,229,255,0.8); margin-bottom:20px; font-family:'Playfair Display',serif; letter-spacing:3px;">
                    Pisces: Space Journey
                </h1>

                <!-- Platform picker -->
                <div style="display:flex; gap:20px; justify-content:center; margin-bottom:28px;">
                    <button id="btn-pc" onclick="selectPlatform('pc')" class="pf-btn pf-active">
                        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="2" y="3" width="20" height="14" rx="2" />
                            <line x1="8" y1="21" x2="16" y2="21" />
                            <line x1="12" y1="17" x2="12" y2="21" />
                        </svg>
                        <span>PC</span>
                    </button>
                    <button id="btn-mobile" onclick="selectPlatform('mobile')" class="pf-btn">
                        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="5" y="2" width="14" height="20" rx="2" />
                            <circle cx="12" cy="18" r="1" />
                        </svg>
                        <span>Mobile</span>
                    </button>
                </div>

                <button id="start-hyperjump-btn">Initiate Hyperjump</button>
            </div>
            <div id="loading-screen">
                <h1
                    style="color: #fff; letter-spacing: 3px; text-shadow: 0 0 15px #fff; font-family: 'Playfair Display', serif;">
                    SYSTEM LOADING
                </h1>
                <p style="color: #fff; font-family: 'Roboto', sans-serif; margin-bottom: 0;">Initiating hyperdrive
                    jump...</p>
                <div class="progress-container">
                    <div id="progress-bar" class="progress-bar"></div>
                </div>
            </div>
        </div>

    <script>
        // ── AUDIO SYSTEM ──────────────────────────────────────────
        const sndTitle = document.getElementById('snd-title');
        const sndHyperjump = document.getElementById('snd-hyperjump');
        const sndIngame = document.getElementById('snd-ingame');

        sndTitle.volume = 0.50;
        sndHyperjump.volume = 0.80;
        sndIngame.volume = 0.50;

        let _muted = false;
        let _activeTrack = null; // track đang chạy hiện tại

        function audioPlay(track) {
            if (_muted) return;
            [sndTitle, sndHyperjump, sndIngame].forEach(t => {
                if (t !== track) { t.pause(); t.currentTime = 0; }
            });
            track.currentTime = 0;
            track.play().catch(() => { });
            _activeTrack = track;
        }

        function audioStop() {
            [sndTitle, sndHyperjump, sndIngame].forEach(t => { t.pause(); t.currentTime = 0; });
            _activeTrack = null;
        }

        // Mute toggle — tắt/bật ngay lập tức
        document.getElementById('mute-btn').addEventListener('click', () => {
            _muted = !_muted;
            document.getElementById('ico-on').style.display = _muted ? 'none' : 'block';
            document.getElementById('ico-off').style.display = _muted ? 'block' : 'none';
            if (_muted) {
                [sndTitle, sndHyperjump, sndIngame].forEach(t => t.pause());
            } else if (_activeTrack) {
                _activeTrack.play().catch(() => { });
            }
        });

        // Click-to-start: user interaction đầu tiên → play title soundtrack
        document.getElementById('click-to-start').addEventListener('click', function () {
            this.style.opacity = '0';
            const self = this;
            setTimeout(() => { self.style.display = 'none'; }, 600);
            audioPlay(sndTitle); // play ngay trong click event → browser cho phép
        }, { once: true });
    </script>

    <script>
        // ── STAR FIELD + HYPERJUMP (GIỮ NGUYÊN CODE GỐC) ────────
        (() => {
            const starCanvas = document.getElementById('star-canvas');
            const ctx = starCanvas.getContext('2d');

            let width = window.innerWidth;
            let height = window.innerHeight;
            starCanvas.width = width;
            starCanvas.height = height;

            const stars = [];
            const numStars = 7000;
            let speed = 0.8;
            let isWarping = false;
            let isSimulationRunning = true;
            let warpStartTime = 0;

            const constellations = [
                {
                    points: [
                        { x: -0.2, y: -0.2 }, { x: -0.15, y: -0.25 }, { x: -0.1, y: -0.15 }, { x: -0.18, y: -0.1 },
                        { x: -0.08, y: -0.05 }, { x: 0, y: 0 }, { x: 0.1, y: 0.05 },
                        { x: 0.18, y: 0.02 }, { x: 0.25, y: 0.05 }, { x: 0.28, y: 0.15 }, { x: 0.15, y: 0.12 }
                    ],
                    links: [[0, 1], [1, 2], [2, 3], [3, 0], [3, 4], [4, 5], [5, 6], [6, 7], [7, 8], [8, 9], [9, 10], [10, 7]]
                },
                {
                    points: [{ x: 0.25, y: -0.3 }, { x: 0.3, y: -0.35 }, { x: 0.4, y: -0.38 }, { x: 0.45, y: -0.32 }],
                    links: [[0, 1], [1, 2], [2, 3]]
                },
                {
                    points: [
                        { x: -0.4, y: 0.2 }, { x: -0.35, y: 0.25 }, { x: -0.3, y: 0.35 },
                        { x: -0.2, y: 0.38 }, { x: -0.15, y: 0.3 }, { x: -0.18, y: 0.25 }
                    ],
                    links: [[0, 1], [1, 2], [2, 3], [3, 4], [4, 5]]
                }
            ];

            constellations.forEach(c => {
                c.points.forEach(p => {
                    p.twinkleOffset = Math.random() * Math.PI * 2;
                    p.twinkleSpeed = 0.001 + Math.random() * 0.002;
                    p.size = 1.5 + Math.random() * 1.5;
                });
            });

            for (let i = 0; i < numStars; i++) {
                let isDistant = Math.random() < 0.25;
                let colorType = Math.random();
                let r = 255, g = 255, b = 255;
                if (isDistant) {
                    if (colorType < 0.33) { r = 150; g = 220; b = 255; }
                    else if (colorType < 0.66) { r = 255; g = 180; b = 220; }
                    else { r = 220; g = 150; b = 255; }
                }
                stars.push({
                    x: (Math.random() - 0.5) * width * 2, y: (Math.random() - 0.5) * height * 2,
                    z: Math.random() * width, r, g, b,
                    speedMod: isDistant ? (0.1 + Math.random() * 0.2) : (1 + Math.random() * 0.5),
                    sizeMod: isDistant ? (Math.random() * 2 + 1.5) : (Math.random() * 1.2 + 0.5)
                });
            }

            function drawStars() {
                if (!isSimulationRunning) return;
                const cx = width / 2, cy = height / 2;
                if (isWarping) {
                    let progress = Math.min((Date.now() - warpStartTime) / 3500, 1);
                    speed = 0.8 + Math.pow(progress, 4) * 200;
                    ctx.fillStyle = 'rgba(0,0,0,0.3)';
                } else {
                    speed = 0.8;
                    ctx.fillStyle = '#000000';
                }
                ctx.fillRect(0, 0, width, height);

                let ca = isWarping ? Math.max(0, 1 - (Date.now() - warpStartTime) / 1500) : 0.7;
                if (ca > 0) {
                    constellations.forEach(c => {
                        ctx.strokeStyle = `rgba(0,229,255,${ca * 0.3})`;
                        ctx.lineWidth = 1;
                        ctx.beginPath();
                        c.links.forEach(link => {
                            let p1 = c.points[link[0]], p2 = c.points[link[1]];
                            ctx.moveTo(cx + p1.x * width, cy + p1.y * width);
                            ctx.lineTo(cx + p2.x * width, cy + p2.y * width);
                        });
                        ctx.stroke();
                        c.points.forEach(p => {
                            let tw = Math.sin(Date.now() * p.twinkleSpeed + p.twinkleOffset);
                            let sa = ca * (0.4 + 0.6 * tw);
                            ctx.fillStyle = `rgba(200,255,255,${sa})`;
                            ctx.beginPath(); ctx.arc(cx + p.x * width, cy + p.y * width, p.size + tw * 0.5, 0, Math.PI * 2); ctx.fill();
                            ctx.fillStyle = `rgba(0,229,255,${sa * 0.4})`;
                            ctx.beginPath(); ctx.arc(cx + p.x * width, cy + p.y * width, p.size * 3, 0, Math.PI * 2); ctx.fill();
                        });
                    });
                }

                for (let i = 0; i < numStars; i++) {
                    let s = stars[i], spd = speed * s.speedMod;
                    s.z -= spd;
                    if (s.z <= 0) { s.x = (Math.random() - 0.5) * width * 2; s.y = (Math.random() - 0.5) * height * 2; s.z = width; }
                    let px = cx + (s.x / s.z) * width, py = cy + (s.y / s.z) * width;
                    let radius = Math.max(1, Math.min(8, (width / s.z) * s.sizeMod));
                    let alpha = Math.max(0.1, Math.min(1, 1.5 - (s.z / width)));
                    if (isWarping) {
                        let pz = s.z + spd, ppx = cx + (s.x / pz) * width, ppy = cy + (s.y / pz) * width;
                        ctx.lineWidth = radius;
                        ctx.strokeStyle = `rgba(${s.r},${s.g},${s.b},${alpha})`;
                        ctx.beginPath(); ctx.moveTo(ppx, ppy); ctx.lineTo(px, py); ctx.stroke();
                    } else {
                        ctx.fillStyle = `rgba(${s.r},${s.g},${s.b},${alpha})`;
                        ctx.beginPath(); ctx.arc(px, py, radius, 0, Math.PI * 2); ctx.fill();
                    }
                }
                requestAnimationFrame(drawStars);
            }
            drawStars();

            window.addEventListener('resize', () => {
                width = window.innerWidth; height = window.innerHeight;
                starCanvas.width = width; starCanvas.height = height;
            });

            const lockScreen = document.getElementById('lock-screen');
            const loadingScreen = document.getElementById('loading-screen');
            const uiWrapper = document.getElementById('ui-wrapper');
            const easterEggOverlay = document.getElementById('easter-egg-overlay');
            const progressBar = document.getElementById('progress-bar');
            const realStartBtn = document.getElementById('startBtn');
            const whiteFlash = document.getElementById('white-flash');

            document.getElementById('start-hyperjump-btn').addEventListener('click', () => {
                lockScreen.style.display = 'none';
                uiWrapper.style.backdropFilter = 'none';
                uiWrapper.style.background = 'transparent';
                loadingScreen.style.display = 'flex';
                isWarping = true;
                warpStartTime = Date.now();

                // Audio: soundtrack1 tiếp tục ở 50%, hyperjump sound chồng lên
                sndTitle.volume = 0.25; // giảm 50% so với bình thường (0.50 → 0.25)
                sndHyperjump.play().catch(() => { });

                setTimeout(() => { progressBar.style.width = '100%'; }, 50);
                setTimeout(() => {
                    whiteFlash.style.transition = 'opacity 1s ease-in';
                    whiteFlash.style.opacity = '1';
                }, 2500);
                setTimeout(() => {
                    isSimulationRunning = false;
                    easterEggOverlay.style.display = 'none';
                    if (realStartBtn) { realStartBtn.style.display = 'none'; realStartBtn.click(); }
                    if (typeof _initMobileControls === 'function') _initMobileControls();

                    // Audio: ingame BGM
                    audioPlay(sndIngame);

                    setTimeout(() => {
                        whiteFlash.style.transition = 'opacity 1.5s ease-out';
                        whiteFlash.style.opacity = '0';
                    }, 100);
                }, 3500);
            });
        })();
    </script>

    <script src="js/entities.js"></script>
    <script src="js/skills.js"></script>
    <script src="js/render.js"></script>
    <script src="js/input.js"></script>
    <script src="js/main.js"></script>

    <!-- ══ MOBILE UI (injected after game scripts load) ══════════════ -->
    <div id="mc" style="display:none; position:fixed; inset:0; pointer-events:all; z-index:300;"></div>

    <style>
        /* Platform picker buttons */
        .pf-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            padding: 14px 24px;
            border-radius: 12px;
            cursor: pointer;
            font-family: 'Roboto', sans-serif;
            font-size: 12px;
            letter-spacing: 1px;
            background: rgba(0, 229, 255, 0.06);
            border: 1.5px solid rgba(0, 229, 255, 0.3);
            color: rgba(0, 229, 255, 0.5);
            transition: all 0.2s;
        }

        .pf-btn:hover {
            background: rgba(0, 229, 255, 0.12);
            border-color: rgba(0, 229, 255, 0.6);
            color: #00e5ff;
        }

        .pf-active {
            background: rgba(0, 229, 255, 0.15) !important;
            border-color: #00e5ff !important;
            color: #00e5ff !important;
            box-shadow: 0 0 16px rgba(0, 229, 255, 0.3);
        }

        .pf-btn svg {
            opacity: 0.7;
        }

        .pf-active svg {
            opacity: 1;
        }

        /* Mobile buttons */
        .mb {
            position: fixed;
            pointer-events: all;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        /* Skill buttons */
        .mb-sk {
            width: 58px;
            height: 58px;
            background: rgba(15, 15, 35, 0.7);
            border: 2px solid rgba(255, 255, 255, 0.2);
            font-family: 'Roboto Mono', monospace;
            font-size: 13px;
            font-weight: 700;
            color: #fff;
            cursor: pointer;
            /* required for iOS touch on non-button elements */
            -webkit-tap-highlight-color: transparent;
        }

        .mb-sk.cd {
            opacity: 0.4;
        }

        .mb-sk canvas {
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        /* Arrow buttons */
        .mb-ar {
            width: 72px;
            height: 72px;
            background: rgba(255, 255, 255, 0.07);
            border: 2px solid rgba(255, 255, 255, 0.2);
        }

        .mb-ar svg {
            width: 30px;
            height: 30px;
            pointer-events: none;
        }

        .mb-ar.held {
            background: rgba(255, 255, 255, 0.25);
        }

        .mb-sk.held {
            transform: scale(0.9);
        }
    </style>

    <script>
        (function () {
            let _plat = 'pc';
            window._platform = 'pc'; // exposed for render.js

            window.selectPlatform = function (p) {
                _plat = p;
                window._platform = p; // keep render.js in sync
                document.getElementById('btn-pc').classList.toggle('pf-active', p === 'pc');
                document.getElementById('btn-mobile').classList.toggle('pf-active', p === 'mobile');
            };

            // ── MOBILE CONTROLS INIT ──────────────────────────────────
            window._initMobileControls = function () {
                if (_plat !== 'mobile') return;
                // Canvas must not intercept touches — buttons need to receive them
                const cv = document.getElementById('gameCanvas');
                if (cv) cv.style.pointerEvents = 'none';
                const mc = document.getElementById('mc');
                mc.style.display = 'block';
                mc.innerHTML = _buildMobileHTML();
                _startCooldownLoop();
            };

            function _buildMobileHTML() {
                // Wrappers for hold-based buttons (YOG, CHARGE, arrows)
                // Use ontouchstart/end directly — modern mobile handles multi-touch fine
                return `
                <div class="mb mb-sk" id="mb-yog" style="bottom:180px;left:10px;"
                    ontouchstart="event.preventDefault();_mbDown('mb-yog')" ontouchend="_mbUp('mb-yog')"
                    onmousedown="_mbDown('mb-yog')" onmouseup="_mbUp('mb-yog')">
                    <canvas width="58" height="58" id="mb-yog-cv"></canvas>
                    <span style="position:relative;z-index:2;color:#ffcc00;font-size:11px;font-weight:800;">YOG</span>
                </div>
                <button class="mb mb-sk" id="mb-a" style="bottom:180px;left:78px;"
                    ontouchstart="event.preventDefault();_hap();activateSkillA()" onmousedown="activateSkillA()">
                    <canvas width="58" height="58" id="mb-a-cv"></canvas>
                    <span style="position:relative;z-index:2;">A</span>
                </div>
                <button class="mb mb-sk" id="mb-s" style="bottom:112px;left:10px;"
                    ontouchstart="event.preventDefault();_hap();activateSkillS()" onmousedown="activateSkillS()">
                    <canvas width="58" height="58" id="mb-s-cv"></canvas>
                    <span style="position:relative;z-index:2;color:#00e5ff;">S</span>
                </div>
                <button class="mb mb-sk" id="mb-d" style="bottom:112px;left:78px;"
                    ontouchstart="event.preventDefault();_hap();activateSkillD()" onmousedown="activateSkillD()">
                    <canvas width="58" height="58" id="mb-d-cv"></canvas>
                    <span style="position:relative;z-index:2;color:#bb88ff;">D</span>
                </div>
                <button class="mb mb-sk" id="mb-f" style="bottom:44px;left:10px;"
                    ontouchstart="event.preventDefault();_hap();activateSkillF()" onmousedown="activateSkillF()">
                    <canvas width="58" height="58" id="mb-f-cv"></canvas>
                    <span style="position:relative;z-index:2;color:#ff6666;">F</span>
                </div>
                <button class="mb mb-sk" id="mb-g" style="bottom:44px;left:78px;"
                    ontouchstart="event.preventDefault();_hap();activateSkillG()" onmousedown="activateSkillG()">
                    <canvas width="58" height="58" id="mb-g-cv"></canvas>
                    <span id="mb-g-lbl" style="position:relative;z-index:2;color:#00ffcc;">G</span>
                </div>
                <div class="mb mb-sk" id="mb-ch" style="bottom:256px;left:10px;"
                    ontouchstart="event.preventDefault();_mbDown('mb-ch')" ontouchend="_mbUp('mb-ch')"
                    onmousedown="_mbDown('mb-ch')" onmouseup="_mbUp('mb-ch')">
                    <canvas width="58" height="58" id="mb-ch-cv"></canvas>
                    <span style="position:relative;z-index:2;color:#00e5ff;font-size:9px;font-weight:800;">CHARGE</span>
                </div>
                <button class="mb mb-ar" style="position:fixed;bottom:28px;right:90px;"
                    ontouchstart="event.preventDefault();_mbDown('mb-left')" ontouchend="_mbUp('mb-left')"
                    onmousedown="_mbDown('mb-left')" onmouseup="_mbUp('mb-left')">
                    <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
                </button>
                <button class="mb mb-ar" style="position:fixed;bottom:28px;right:10px;"
                    ontouchstart="event.preventDefault();_mbDown('mb-right')" ontouchend="_mbUp('mb-right')"
                    onmousedown="_mbDown('mb-right')" onmouseup="_mbUp('mb-right')">
                    <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
                </button>
            `;
            }

            // ── HOLD BUTTON ACTIONS ───────────────────────────────────
            // Micro haptic — 15ms, barely perceptible
            window._hap = function () { try { navigator.vibrate && navigator.vibrate(15); } catch (e) { } }

            window._mbDown = function (id) {
                _hap();
                try {
                    if (id === 'mb-yog') {
                        if (!skillShiftActive && performance.now() - lastSkillShift >= skillShiftCooldown) {
                            skillShiftActive = true; skillShiftChargeStart = performance.now();
                        }
                    } else if (id === 'mb-ch') {
                        if (!charging && !laserActive && !skillShiftActive) {
                            charging = true; chargeStartTime = performance.now();
                        }
                    } else if (id === 'mb-left') {
                        if (skillShiftActive) executeShiftTeleport('left');
                        else keys.left = true;
                    } else if (id === 'mb-right') {
                        if (skillShiftActive) executeShiftTeleport('right');
                        else keys.right = true;
                    }
                } catch (e) { }
            };
            window._mbUp = function (id) {
                try {
                    if (id === 'mb-yog') {
                        if (typeof cancelSkillShift === 'function') cancelSkillShift();
                    } else if (id === 'mb-ch') {
                        if (charging && !laserActive) {
                            const dur = performance.now() - chargeStartTime;
                            if (dur < overloadChargeTime) {
                                const m = 1 + ((Math.min(dur, maxChargeTime) / maxChargeTime) * (maxMultiplier - 1));
                                fireChargedBullet(Math.min(m, maxMultiplier));
                            }
                            charging = false;
                        }
                    } else if (id === 'mb-left') { keys.left = false; }
                    else if (id === 'mb-right') { keys.right = false; }
                } catch (e) { }
            };

            // ── COOLDOWN RING PAINTER ────────────────────────────────
            const CIRC = 2 * Math.PI * 26; // r=26 on 58×58 canvas
            function _paintRing(cvId, frac, color) {
                const cv = document.getElementById(cvId);
                if (!cv) return;
                const ctx = cv.getContext('2d');
                ctx.clearRect(0, 0, 58, 58);
                if (frac >= 1) return; // ready — no ring needed
                // background arc
                ctx.strokeStyle = 'rgba(255,255,255,0.08)';
                ctx.lineWidth = 4; ctx.lineCap = 'round';
                ctx.beginPath(); ctx.arc(29, 29, 26, 0, Math.PI * 2); ctx.stroke();
                // cooldown arc (how much is remaining)
                ctx.strokeStyle = color;
                ctx.beginPath();
                ctx.arc(29, 29, 26, -Math.PI / 2, -Math.PI / 2 + (1 - frac) * Math.PI * 2);
                ctx.stroke();
            }

            function _ready(last, cd) { return Math.min(1, (performance.now() - last) / cd); }
            function _readyEnd(end, cd) { if (!end || end <= 0) return 1; return Math.min(1, Math.max(0, (performance.now() - (end - cd)) / cd)); }

            function _startCooldownLoop() {
                function loop() {
                    if (_plat !== 'mobile') return;
                    try {
                        const now = performance.now();
                        // YOG
                        const yr = _ready(lastSkillShift, skillShiftCooldown);
                        _paintRing('mb-yog-cv', yr, '#ffcc00');
                        document.getElementById('mb-yog')?.classList.toggle('cd', yr < 1);
                        // A
                        const ar = _ready(lastSkillA, skillACooldown);
                        _paintRing('mb-a-cv', ar, '#8888ff');
                        document.getElementById('mb-a')?.classList.toggle('cd', ar < 1);
                        // S
                        const sr = _ready(lastSkillS, skillSCooldown);
                        _paintRing('mb-s-cv', sr, '#00e5ff');
                        document.getElementById('mb-s')?.classList.toggle('cd', sr < 1);
                        // D
                        const dr = _ready(lastSkillD, skillDCooldown);
                        _paintRing('mb-d-cv', dr, '#bb88ff');
                        document.getElementById('mb-d')?.classList.toggle('cd', dr < 1);
                        // F
                        const fr = _ready(lastSkillF, skillFCooldown);
                        _paintRing('mb-f-cv', fr, '#ff6666');
                        document.getElementById('mb-f')?.classList.toggle('cd', fr < 1);
                        // G — charge based 0-100
                        const gc = typeof skillGCharge !== 'undefined' ? skillGCharge : 0;
                        const gr = (typeof skillGActive !== 'undefined' && skillGActive) ? 1 : gc / 100;
                        _paintRing('mb-g-cv', gr, '#00ffcc');
                        const gEl = document.getElementById('mb-g');
                        if (gEl) {
                            gEl.classList.toggle('cd', gr < 1);
                            gEl.querySelector('span').textContent = (gr < 1 && !skillGActive) ? Math.floor(gr * 100) + '%' : 'G';
                        }
                        // CHARGE / laser
                        const cr = _readyEnd(laserCooldownEnd, laserCooldownDuration);
                        _paintRing('mb-ch-cv', cr, '#00e5ff');
                        document.getElementById('mb-ch')?.classList.toggle('cd', cr < 1);
                    } catch (e) { }
                    requestAnimationFrame(loop);
                }
                requestAnimationFrame(loop);
            }

            // ── MULTI-TOUCH: handled via direct ontouchstart on each button ──
        })();
    </script>
</body>

</html>
