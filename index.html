<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Pisces: Space Journey</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Roboto:wght@400;500&family=Courier+New&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">

    <style>
        body {
            margin: 0;
            background: #000;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            height: 100vh;
            height: 100dvh;
            width: 100vw;
            -webkit-user-select: none;
            user-select: none;
            touch-action: none;
        }

        /* Canvas fills screen fully on mobile */
        #gameCanvas {
            display: block;
            width: 100vw !important;
            height: 100dvh !important;
            touch-action: none;
        }

        /* Prevent double-tap zoom globally */
        * {
            touch-action: manipulation;
        }

        #mobile-controls * {
            touch-action: none;
        }

        .marrow,
        .msb {
            touch-action: none !important;
        }

        /* --- LỚP PHỦ EASTER EGG BẢO VỆ TOÀN MÀN HÌNH --- */
        #easter-egg-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 99999;
            background: #000;
        }

        #star-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        #ui-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: all;
            background: rgba(10, 25, 47, 0.4);
            backdrop-filter: blur(4px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            transition: background 1s ease, backdrop-filter 1s ease;
        }

        #lock-screen {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        #start-hyperjump-btn {
            padding: 15px 40px;
            border-radius: 30px;
            border: none;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            color: #fff;
            font-size: 1.2rem;
            font-family: inherit;
            background: linear-gradient(45deg, #00e5ff, #007bff);
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.4);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        #start-hyperjump-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 25px rgba(0, 229, 255, 0.7);
        }

        #loading-screen {
            background: transparent;
            display: none;
            flex-direction: column;
            align-items: center;
        }

        .progress-container {
            width: 300px;
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid #00e5ff;
            border-radius: 10px;
            margin-top: 25px;
            overflow: hidden;
            position: relative;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: #00e5ff;
            box-shadow: 0 0 15px #00e5ff;
            transition: width 3.5s cubic-bezier(0.55, 0.085, 0.68, 0.53);
        }

        /* --- HIỆU ỨNG LÓA SÁNG KHI ĐẾN NƠI --- */
        #white-flash {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #ffffff;
            opacity: 0;
            z-index: 9999999;
            pointer-events: none;
            transition: opacity 0.1s;
        }

        /* --- CLICK TO START --- */
        #click-to-start {
            position: fixed;
            inset: 0;
            z-index: 999999;
            background: rgba(0, 0, 0, 0.88);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: opacity 0.6s ease;
        }

        #click-to-start span {
            color: rgba(255, 255, 255, 0.7);
            font-size: 1rem;
            letter-spacing: 5px;
            text-transform: uppercase;
            font-family: 'Courier New', monospace;
            animation: cts-blink 2s ease-in-out infinite;
        }

        @keyframes cts-blink {

            0%,
            100% {
                opacity: 0.7;
            }

            50% {
                opacity: 0.15;
            }
        }

        /* --- MUTE BUTTON --- */
        #mute-btn {
            position: fixed;
            top: 16px;
            left: 16px;
            z-index: 9999999;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.22);
            background: rgba(255, 255, 255, 0.10);
            backdrop-filter: blur(18px) saturate(180%);
            -webkit-backdrop-filter: blur(18px) saturate(180%);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.15);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0.65;
            outline: none;
            transition: opacity 0.2s, transform 0.15s, background 0.2s;
        }

        #mute-btn:hover {
            opacity: 0.95;
            background: rgba(255, 255, 255, 0.20);
            transform: scale(1.08);
        }

        #mute-btn:active {
            transform: scale(0.93);
        }

        #mute-btn svg {
            width: 20px;
            height: 20px;
            pointer-events: none;
        }
    </style>

    <script>
        // ── BẢO VỆ CODE ──────────────────────────────────────────
        (function () {
            document.addEventListener('contextmenu', e => e.preventDefault());
            document.addEventListener('selectstart', e => e.preventDefault());
            document.addEventListener('keydown', e => {
                const ctrl = e.ctrlKey || e.metaKey;
                const shift = e.shiftKey;
                if (e.key === 'F12') { e.preventDefault(); return; }
                if (ctrl && e.key.toLowerCase() === 'u') { e.preventDefault(); return; }
                if (ctrl && shift && e.key === 'I') { e.preventDefault(); return; }
                if (ctrl && shift && e.key === 'J') { e.preventDefault(); return; }
                if (ctrl && shift && e.key === 'C') { e.preventDefault(); return; }
                if (ctrl && e.key.toLowerCase() === 's') { e.preventDefault(); return; }
            });
            const threshold = 160;
            setInterval(() => {
                if (window.outerWidth - window.innerWidth > threshold ||
                    window.outerHeight - window.innerHeight > threshold) {
                    document.body.innerHTML = '';
                    window.location.reload();
                }
            }, 1000);
        })();
    </script>
</head>

    <script>
        // ── PLATFORM SELECTION ────────────────────────────────────
        let _platform = 'pc';
        function selectPlatform(p) {
            _platform = p;
            document.getElementById('btn-pc').classList.toggle('active', p === 'pc');
            document.getElementById('btn-mobile').classList.toggle('active', p === 'mobile');
        }

        // ── MOBILE INPUT HANDLERS ──────────────────────────────────
        function mobileKey(dir, down) {
            if (typeof keys !== 'undefined') keys[dir] = down;
        }

        function mobileSpace(down) {
            if (typeof gameState === 'undefined' || gameState !== 'playing') return;
            if (down) {
                if (!charging && !laserActive && !skillShiftActive) {
                    charging = true;
                    chargeStartTime = performance.now();
                }
            } else {
                if (charging && !laserActive) {
                    let dur = performance.now() - chargeStartTime;
                    if (dur < overloadChargeTime) {
                        let mult = 1 + ((Math.min(dur, maxChargeTime) / maxChargeTime) * (maxMultiplier - 1));
                        fireChargedBullet(Math.min(mult, maxMultiplier));
                    }
                    charging = false;
                }
            }
        }

        function mobileShift(down) {
            if (typeof gameState === 'undefined' || gameState !== 'playing') return;
            if (down) {
                if (!skillShiftActive && performance.now() - lastSkillShift >= skillShiftCooldown) {
                    skillShiftActive = true;
                    skillShiftChargeStart = performance.now();
                }
            } else {
                if (typeof cancelSkillShift === 'function') cancelSkillShift();
            }
        }

        // ── GLOBAL MULTI-TOUCH TRACKER ────────────────────────────
        // Tracks ALL simultaneous touches → allows YOG + move at same time
        function _setupGlobalTouch() {
            const mc = document.getElementById('mobile-controls');
            if (!mc) return;

            // Map touch identifier → which button it's on
            const _touchMap = new Map();

            function _elId(el) {
                if (!el) return null;
                // Walk up to find a button with an id
                let cur = el;
                while (cur && cur !== mc) {
                    if (cur.id) return cur.id;
                    if (cur.dataset && cur.dataset.action) return cur.dataset.action;
                    cur = cur.parentElement;
                }
                return null;
            }

            function _activate(id, on) {
                if (!id) return;
                if (id === 'mbtn-left') { mobileKey('left', on); document.getElementById('mbtn-left')?.classList.toggle('pressed', on); }
                else if (id === 'mbtn-right') { mobileKey('right', on); document.getElementById('mbtn-right')?.classList.toggle('pressed', on); }
                else if (id === 'mbtn-shift') { mobileShift(on); document.getElementById('mbtn-shift')?.classList.toggle('msb-press', on); }
                else if (id === 'mbtn-charge') { mobileSpace(on); document.getElementById('mbtn-charge')?.classList.toggle('msb-press', on); }
            }

            mc.addEventListener('touchstart', e => {
                e.preventDefault();
                for (const t of e.changedTouches) {
                    const el = document.elementFromPoint(t.clientX, t.clientY);
                    const id = _elId(el);
                    if (id) {
                        _touchMap.set(t.identifier, id);
                        _activate(id, true);
                    }
                }
            }, { passive: false });

            mc.addEventListener('touchend', e => {
                e.preventDefault();
                for (const t of e.changedTouches) {
                    const id = _touchMap.get(t.identifier);
                    if (id) {
                        _activate(id, false);
                        _touchMap.delete(t.identifier);
                    }
                }
            }, { passive: false });

            mc.addEventListener('touchcancel', e => {
                for (const t of e.changedTouches) {
                    const id = _touchMap.get(t.identifier);
                    if (id) { _activate(id, false); _touchMap.delete(t.identifier); }
                }
            }, { passive: false });

            // touchmove: if finger slides from one button to another, update
            mc.addEventListener('touchmove', e => {
                e.preventDefault();
                for (const t of e.changedTouches) {
                    const oldId = _touchMap.get(t.identifier);
                    const el = document.elementFromPoint(t.clientX, t.clientY);
                    const newId = _elId(el);
                    if (newId !== oldId) {
                        if (oldId) _activate(oldId, false);
                        if (newId) { _touchMap.set(t.identifier, newId); _activate(newId, true); }
                        else _touchMap.delete(t.identifier);
                    }
                }
            }, { passive: false });
        }

        // ── COOLDOWN RING UPDATER ─────────────────────────────────
        // circumference of r=29 circle = 2*π*29 ≈ 182
        const CD_CIRC = 182;

        function _mcdSet(id, pct) {
            // pct 0=full cooldown (ring full), 1=ready (ring empty/hidden)
            const el = document.getElementById(id);
            if (!el) return;
            const offset = CD_CIRC * (1 - pct); // how much is NOT covered
            el.style.strokeDashoffset = CD_CIRC - offset; // visible arc = ready portion
            // Actually: show cooldown as a draining ring
            // offset=0 → full ring visible (ready), offset=182 → no ring (full CD)
            el.style.strokeDashoffset = CD_CIRC * pct; // pct=1 ready, pct=0 on CD
        }

        function _mobileUpdateCooldowns() {
            if (_platform !== 'mobile') return;
            const now = performance.now();

            // Helper: ratio 0→1 where 1=ready
            function ready(last, cd) {
                const elapsed = now - last;
                return Math.min(1, elapsed / cd);
            }
            function readyEnd(endTime, cd) {
                if (endTime <= 0) return 1;
                return Math.min(1, Math.max(0, (now - (endTime - cd)) / cd));
            }

            // YOG/Shift
            const shiftR = ready(lastSkillShift, skillShiftCooldown);
            _mcdSet('mcd-shift', shiftR);
            const mbShift = document.getElementById('mbtn-shift');
            if (mbShift) mbShift.classList.toggle('on-cd', shiftR < 1);

            // A
            const aR = ready(lastSkillA, skillACooldown);
            _mcdSet('mcd-a', aR);
            const mbA = document.getElementById('mbtn-a');
            if (mbA) mbA.classList.toggle('on-cd', aR < 1);

            // S
            const sR = ready(lastSkillS, skillSCooldown);
            _mcdSet('mcd-s', sR);
            const mbS = document.getElementById('mbtn-s');
            if (mbS) mbS.classList.toggle('on-cd', sR < 1);

            // D
            const dR = ready(lastSkillD, skillDCooldown);
            _mcdSet('mcd-d', dR);
            const mbD = document.getElementById('mbtn-d');
            if (mbD) mbD.classList.toggle('on-cd', dR < 1);

            // F
            const fR = ready(lastSkillF, skillFCooldown);
            _mcdSet('mcd-f', fR);
            const mbF = document.getElementById('mbtn-f');
            if (mbF) mbF.classList.toggle('on-cd', fR < 1);

            // G (charge-based: 0→100)
            const gCharge = typeof skillGCharge !== 'undefined' ? skillGCharge : 0;
            const gActive = typeof skillGActive !== 'undefined' && skillGActive;
            const gR = gActive ? 1 : Math.min(1, gCharge / 100);
            _mcdSet('mcd-g', gR);
            const mbG = document.getElementById('mbtn-g');
            if (mbG) {
                mbG.classList.toggle('on-cd', gR < 1);
                const gSpan = mbG.querySelector('span');
                if (gSpan) gSpan.textContent = (!gActive && gR < 1) ? Math.floor(gR * 100) + '%' : 'G';
            }

            // CHARGE/laser
            const chargeR = readyEnd(laserCooldownEnd, laserCooldownDuration);
            _mcdSet('mcd-charge', chargeR);
            const mbCharge = document.getElementById('mbtn-charge');
            if (mbCharge) mbCharge.classList.toggle('on-cd', chargeR < 1);

            requestAnimationFrame(_mobileUpdateCooldowns);
        }

        // Show mobile controls + start cooldown loop when game starts
        function _initMobileControls() {
            if (_platform === 'mobile') {
                document.getElementById('mobile-controls').style.display = 'block';
                _setupGlobalTouch();
                requestAnimationFrame(_mobileUpdateCooldowns);
            }
        }

        // ── AUDIO SYSTEM ──────────────────────────────────────────
        const sndTitle = document.getElementById('snd-title');
        const sndHyperjump = document.getElementById('snd-hyperjump');
        const sndIngame = document.getElementById('snd-ingame');

        sndTitle.volume = 0.50;
        sndHyperjump.volume = 0.80;
        sndIngame.volume = 0.50;

        let _muted = false;
        let _activeTrack = null; // track đang chạy hiện tại

        function audioPlay(track) {
            if (_muted) return;
            [sndTitle, sndHyperjump, sndIngame].forEach(t => {
                if (t !== track) { t.pause(); t.currentTime = 0; }
            });
            track.currentTime = 0;
            track.play().catch(() => { });
            _activeTrack = track;
        }

        function audioStop() {
            [sndTitle, sndHyperjump, sndIngame].forEach(t => { t.pause(); t.currentTime = 0; });
            _activeTrack = null;
        }

        // Mute toggle — tắt/bật ngay lập tức
        document.getElementById('mute-btn').addEventListener('click', () => {
            _muted = !_muted;
            document.getElementById('ico-on').style.display = _muted ? 'none' : 'block';
            document.getElementById('ico-off').style.display = _muted ? 'block' : 'none';
            if (_muted) {
                [sndTitle, sndHyperjump, sndIngame].forEach(t => t.pause());
            } else if (_activeTrack) {
                _activeTrack.play().catch(() => { });
            }
        });

        // Click-to-start: user interaction đầu tiên → play title soundtrack
        document.getElementById('click-to-start').addEventListener('click', function () {
            this.style.opacity = '0';
            const self = this;
            setTimeout(() => { self.style.display = 'none'; }, 600);
            audioPlay(sndTitle); // play ngay trong click event → browser cho phép
        }, { once: true });
    </script>

    <script>
        // ── STAR FIELD + HYPERJUMP (GIỮ NGUYÊN CODE GỐC) ────────
        (() => {
            const starCanvas = document.getElementById('star-canvas');
            const ctx = starCanvas.getContext('2d');

            let width = window.innerWidth;
            let height = window.innerHeight;
            starCanvas.width = width;
            starCanvas.height = height;

            const stars = [];
            const numStars = 7000;
            let speed = 0.8;
            let isWarping = false;
            let isSimulationRunning = true;
            let warpStartTime = 0;

            const constellations = [
                {
                    points: [
                        { x: -0.2, y: -0.2 }, { x: -0.15, y: -0.25 }, { x: -0.1, y: -0.15 }, { x: -0.18, y: -0.1 },
                        { x: -0.08, y: -0.05 }, { x: 0, y: 0 }, { x: 0.1, y: 0.05 },
                        { x: 0.18, y: 0.02 }, { x: 0.25, y: 0.05 }, { x: 0.28, y: 0.15 }, { x: 0.15, y: 0.12 }
                    ],
                    links: [[0, 1], [1, 2], [2, 3], [3, 0], [3, 4], [4, 5], [5, 6], [6, 7], [7, 8], [8, 9], [9, 10], [10, 7]]
                },
                {
                    points: [{ x: 0.25, y: -0.3 }, { x: 0.3, y: -0.35 }, { x: 0.4, y: -0.38 }, { x: 0.45, y: -0.32 }],
                    links: [[0, 1], [1, 2], [2, 3]]
                },
                {
                    points: [
                        { x: -0.4, y: 0.2 }, { x: -0.35, y: 0.25 }, { x: -0.3, y: 0.35 },
                        { x: -0.2, y: 0.38 }, { x: -0.15, y: 0.3 }, { x: -0.18, y: 0.25 }
                    ],
                    links: [[0, 1], [1, 2], [2, 3], [3, 4], [4, 5]]
                }
            ];

            constellations.forEach(c => {
                c.points.forEach(p => {
                    p.twinkleOffset = Math.random() * Math.PI * 2;
                    p.twinkleSpeed = 0.001 + Math.random() * 0.002;
                    p.size = 1.5 + Math.random() * 1.5;
                });
            });

            for (let i = 0; i < numStars; i++) {
                let isDistant = Math.random() < 0.25;
                let colorType = Math.random();
                let r = 255, g = 255, b = 255;
                if (isDistant) {
                    if (colorType < 0.33) { r = 150; g = 220; b = 255; }
                    else if (colorType < 0.66) { r = 255; g = 180; b = 220; }
                    else { r = 220; g = 150; b = 255; }
                }
                stars.push({
                    x: (Math.random() - 0.5) * width * 2, y: (Math.random() - 0.5) * height * 2,
                    z: Math.random() * width, r, g, b,
                    speedMod: isDistant ? (0.1 + Math.random() * 0.2) : (1 + Math.random() * 0.5),
                    sizeMod: isDistant ? (Math.random() * 2 + 1.5) : (Math.random() * 1.2 + 0.5)
                });
            }

            function drawStars() {
                if (!isSimulationRunning) return;
                const cx = width / 2, cy = height / 2;
                if (isWarping) {
                    let progress = Math.min((Date.now() - warpStartTime) / 3500, 1);
                    speed = 0.8 + Math.pow(progress, 4) * 200;
                    ctx.fillStyle = 'rgba(0,0,0,0.3)';
                } else {
                    speed = 0.8;
                    ctx.fillStyle = '#000000';
                }
                ctx.fillRect(0, 0, width, height);

                let ca = isWarping ? Math.max(0, 1 - (Date.now() - warpStartTime) / 1500) : 0.7;
                if (ca > 0) {
                    constellations.forEach(c => {
                        ctx.strokeStyle = `rgba(0,229,255,${ca * 0.3})`;
                        ctx.lineWidth = 1;
                        ctx.beginPath();
                        c.links.forEach(link => {
                            let p1 = c.points[link[0]], p2 = c.points[link[1]];
                            ctx.moveTo(cx + p1.x * width, cy + p1.y * width);
                            ctx.lineTo(cx + p2.x * width, cy + p2.y * width);
                        });
                        ctx.stroke();
                        c.points.forEach(p => {
                            let tw = Math.sin(Date.now() * p.twinkleSpeed + p.twinkleOffset);
                            let sa = ca * (0.4 + 0.6 * tw);
                            ctx.fillStyle = `rgba(200,255,255,${sa})`;
                            ctx.beginPath(); ctx.arc(cx + p.x * width, cy + p.y * width, p.size + tw * 0.5, 0, Math.PI * 2); ctx.fill();
                            ctx.fillStyle = `rgba(0,229,255,${sa * 0.4})`;
                            ctx.beginPath(); ctx.arc(cx + p.x * width, cy + p.y * width, p.size * 3, 0, Math.PI * 2); ctx.fill();
                        });
                    });
                }

                for (let i = 0; i < numStars; i++) {
                    let s = stars[i], spd = speed * s.speedMod;
                    s.z -= spd;
                    if (s.z <= 0) { s.x = (Math.random() - 0.5) * width * 2; s.y = (Math.random() - 0.5) * height * 2; s.z = width; }
                    let px = cx + (s.x / s.z) * width, py = cy + (s.y / s.z) * width;
                    let radius = Math.max(1, Math.min(8, (width / s.z) * s.sizeMod));
                    let alpha = Math.max(0.1, Math.min(1, 1.5 - (s.z / width)));
                    if (isWarping) {
                        let pz = s.z + spd, ppx = cx + (s.x / pz) * width, ppy = cy + (s.y / pz) * width;
                        ctx.lineWidth = radius;
                        ctx.strokeStyle = `rgba(${s.r},${s.g},${s.b},${alpha})`;
                        ctx.beginPath(); ctx.moveTo(ppx, ppy); ctx.lineTo(px, py); ctx.stroke();
                    } else {
                        ctx.fillStyle = `rgba(${s.r},${s.g},${s.b},${alpha})`;
                        ctx.beginPath(); ctx.arc(px, py, radius, 0, Math.PI * 2); ctx.fill();
                    }
                }
                requestAnimationFrame(drawStars);
            }
            drawStars();

            window.addEventListener('resize', () => {
                width = window.innerWidth; height = window.innerHeight;
                starCanvas.width = width; starCanvas.height = height;
            });

            const lockScreen = document.getElementById('lock-screen');
            const loadingScreen = document.getElementById('loading-screen');
            const uiWrapper = document.getElementById('ui-wrapper');
            const easterEggOverlay = document.getElementById('easter-egg-overlay');
            const progressBar = document.getElementById('progress-bar');
            const realStartBtn = document.getElementById('startBtn');
            const whiteFlash = document.getElementById('white-flash');

            document.getElementById('start-hyperjump-btn').addEventListener('click', () => {
                lockScreen.style.display = 'none';
                uiWrapper.style.backdropFilter = 'none';
                uiWrapper.style.background = 'transparent';
                loadingScreen.style.display = 'flex';
                isWarping = true;
                warpStartTime = Date.now();

                // Audio: hyperjump sound
                audioPlay(sndHyperjump);

                setTimeout(() => { progressBar.style.width = '100%'; }, 50);
                setTimeout(() => {
                    whiteFlash.style.transition = 'opacity 1s ease-in';
                    whiteFlash.style.opacity = '1';
                }, 2500);
                setTimeout(() => {
                    isSimulationRunning = false;
                    easterEggOverlay.style.display = 'none';
                    if (realStartBtn) { realStartBtn.style.display = 'none'; realStartBtn.click(); }
                    _initMobileControls();

                    // Audio: ingame BGM
                    audioPlay(sndIngame);

                    setTimeout(() => {
                        whiteFlash.style.transition = 'opacity 1.5s ease-out';
                        whiteFlash.style.opacity = '0';
                    }, 100);
                }, 3500);
            });
        })();
    </script>

    <script src="js/entities.js"></script>
    <script src="js/skills.js"></script>
    <script src="js/render.js"></script>
